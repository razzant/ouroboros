    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        with:
          interpreter: shipped
          install-project: 'false'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the pinned browser engines
        if: matrix.lane == 'browser'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
        run: python -I -S scripts/ci_browser_install.py --pinned-node chromium webkit
      - name: Run the selected failures on the exact parent; preserve test outcomes
        shell: bash
        env:
          SUBJECT: ${{ matrix.sha }}
          CASES: ${{ toJSON(matrix.cases) }}
          LANE: ${{ matrix.lane }}
          OUROBOROS_PREFLIGHT_REQUIRE_NODE: '1'
          OUROBOROS_PREFLIGHT_REQUIRE_PLUGINS: '1'
          OUROBOROS_PREFLIGHT_TEST_WORKERS: '4'
          EVIDENCE: ${{ runner.temp }}/pair-evidence
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          env = os.environ.copy()
          subject = env['SUBJECT']
          observed = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          if observed != subject:
              raise SystemExit(f'wrong tested SHA {observed}; expected {subject}')
          subprocess.run(['git','diff','--exit-code'],check=True)
          evidence = Path(env['EVIDENCE']); evidence.mkdir(exist_ok=True)
          cases = json.loads(env['CASES']); lane = env['LANE']
          import sqlite3, tempfile
          from ouroboros import store
          with tempfile.TemporaryDirectory(dir=env['RUNNER_TEMP']) as temp:
              db=Path(temp)/'mode.sqlite'; db.touch()
              journal=store._journal_mode(db,store.TIER_ENFORCED)
          groups={'parallel':['-m','not exclusive','-n','4','--dist','loadgroup','--max-worker-restart=0','--timeout=300'],
                  'serial':['-m','exclusive','--timeout=300']}
          launcher=[]
          if lane == 'browser':
              env.update(OUROBOROS_RUN_UI_SMOKE='1',OUROBOROS_EXPECT_BROWSER_ENGINES='chromium,webkit',
                         PLAYWRIGHT_BROWSERS_PATH=str(Path(env['RUNNER_TEMP'])/'ui-browsers'),
                         PLAYWRIGHT_NODEJS_PATH=str(Path.cwd()/'node-standalone/bin/node'))
              groups={'host':['-m','ui_browser','--timeout=900']}
              launcher=['xvfb-run','-a']
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          (evidence/'subject.json').write_text(json.dumps({'controller':env['GITHUB_SHA'],'tested_sha':subject,'tree':tree,
              'runner':env.get('RUNNER_OS'),'lane':lane,'nodes':cases,'python':sys.version,'sqlite':sqlite3.sqlite_version,
              'journal':journal,'controls':groups}))
          env['GITHUB_SHA'] = subject
          if journal.upper() != 'WAL':
              raise SystemExit('journal does not match the original run')
          exits={}
          print('TESTED_SHA',subject,'TREE',tree,'CASE_COUNT',len(cases),'SQLITE',sqlite3.sqlite_version,'JOURNAL',journal,flush=True)
          for name, controls in groups.items():
              path=evidence/name; path.mkdir()
              argv=[*launcher,sys.executable,'-I','-S','scripts/safe_test.py','--timeout','1500','--',sys.executable,'-m',
                    'pytest',*controls,'-q','--tb=short',f'--ci-evidence-dir={path}',*cases]
              exits[name]=subprocess.run(argv,env=env).returncode
              (evidence/'exit.json').write_text(json.dumps(exits))
          sys.exit(0 if all(rc in (0,5) for rc in exits.values()) else 1)
          PY
      - name: Retain only projected results and subject binding
        if: '!cancelled()'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post3913-tail-${{ matrix.label }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pair-evidence/
          retention-days: 7
          if-no-files-found: warn
