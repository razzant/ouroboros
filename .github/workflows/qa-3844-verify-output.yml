# Temporary QA lane for https://github.com/razzant/ouroboros/issues/3844 —
# focused Linux/Windows qualification of the verification-output retention fix
# (a cut failing check keeps its whole masked output in the task materials, linked
# from the short result, readable without a rerun).
#
# This file is the ONLY addition of the qa/verify-output-3844 commit; the `lock`
# job enforces that (exactly one parent, exactly this one added file) and records
# the run's commits and trees. The workflow is read-only (permissions: contents:
# read; the verify job adds actions: read only for download-artifact), holds no
# secret, and runs no network command beyond the standard public tooling install
# of the pinned actions and the locked `uv sync`.
#
# Borrowed interfaces, all pinned in this repo:
#   - actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
#     with fetch-depth: 0 (HEAD^ and HEAD^^ must resolve) and
#     persist-credentials: false — ci.yml:126, post-merge.yml:62.
#   - ./.github/actions/setup-python-env — locked composite action
#     (.github/actions/setup-python-env/action.yml), itself pinning
#     actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 and
#     astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0.
#     With no inputs it takes profile=test, install-project=true,
#     interpreter=setup-python (3.10): `uv sync --locked --extra browser --group dev`.
#   - scripts/safe_test.py --temp-parent <runner temp> --evidence-dir ...
#     --timeout SECONDS -- <command> — the isolated wrapper used by the
#     sqlite-floor lane (ci.yml:362); the `--` is stripped into the REMAINDER
#     command (safe_test.py:96). Here it wraps one pytest pass over the named
#     modules; its evidence lands in <evidence-dir>/run-*/result.json
#     (ouroboros/test_evidence.py:101, ouroboros/safe_test_supervisor.py:254).
#     The wrapped interpreter is passed as an absolute path ($PY, resolved from
#     sys.executable before the boundary scrubs the environment), as
#     claudexor-platform-gate.yml:261 does.
#   - actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 and
#     actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
#     (ci.yml:561/227).
#   - size_ratchet lane: `OURO_SIZE_RATCHET_BASE_REF=<base> pytest -o addopts=""
#     -m size_ratchet tests/` against the actual product base (the QA commit's
#     parent's first parent, HEAD^^) — ci.yml:294/296/516/518 and
#     tests/test_smoke.py:451-476. `-o addopts=""` clears pyproject's default
#     markexpr (pyproject.toml:122), which excludes size_ratchet.
#
# The six focused modules carry no lane marks — only parametrize and the
# test-declared `skipif(os.name != "posix")` cases in
# tests/test_process_signal_observability.py — so the pyproject default markexpr
# does not exclude them and the focused run needs no -m. Skip counts are never
# hardcoded: both check scripts re-derive the declared POSIX-only skip count from
# the source at the QA commit with the same regex, and fail loudly if the pattern
# no longer matches.
#
# Windows path-translation guard: run steps use `shell: bash` with
# MSYS_NO_PATHCONV=1 (workflow env below); scratch paths are built once from
# $RUNNER_TEMP inside bash, and `${{ runner.temp }}` appears only in `with:`
# blocks (evaluated by the runner, never through the shell); PYTHONUTF8=1 keeps
# non-ASCII test ids readable under Windows' default code page.
#
# Evidence uploaded: only the per-OS JUnit report and safe_test's result.json —
# never credentials, .git runtime state, runner or installed logs, or environment
# contents. All test data is synthetic (the fixtures use a synthetic Settings
# secret and a synthetic token shape).

name: QA #3844 verify-output (focused)

on:
  push:
    branches:
      - qa/verify-output-3844

permissions:
  contents: read

concurrency:
  group: qa-3844-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  # Git Bash must not re-translate already Windows-native paths (D:\...) into
  # POSIX form when spawning native tools; a no-op on Linux runners.
  MSYS_NO_PATHCONV: "1"

jobs:
  # Fails fast, before any test runner is spent, unless the QA commit is exactly
  # one workflow addition atop the final reviewed product commit.
  lock:
    name: lock the QA shape
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      qa_commit: ${{ steps.lock.outputs.qa_commit }}
      product_commit: ${{ steps.lock.outputs.product_commit }}
      product_tree: ${{ steps.lock.outputs.product_tree }}
      ratchet_base: ${{ steps.lock.outputs.ratchet_base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # HEAD^ and HEAD^^ must resolve
          persist-credentials: false
      - name: Require one parent and exactly the added workflow file; record the run's commits
        id: lock
        run: |
          set -euo pipefail
          QA_FILE=.github/workflows/qa-3844-verify-output.yml
          parents=$(git rev-list --parents -n 1 HEAD | wc -w | tr -d ' ')
          if [ "$parents" -ne 2 ]; then
            echo "::error::the QA commit must have exactly one parent (found $((parents - 1)))"
            exit 1
          fi
          added=$(git diff --name-only HEAD^..HEAD)
          status=$(git diff --name-status HEAD^..HEAD | cut -f1)
          if [ "$added" != "$QA_FILE" ] || [ "$status" != "A" ]; then
            echo "::error::the QA commit must add exactly $QA_FILE (diff: $status $added)"
            exit 1
          fi
          git cat-file -e 'HEAD^^^{commit}'  # the product base must be present (fetch-depth: 0)
          qa_commit=$(git rev-parse HEAD)
          product_commit=$(git rev-parse HEAD^)
          product_tree=$(git rev-parse 'HEAD^^{tree}')
          ratchet_base=$(git rev-parse HEAD^^)
          {
            echo "qa_commit=$qa_commit"
            echo "product_commit=$product_commit"
            echo "product_tree=$product_tree"
            echo "ratchet_base=$ratchet_base"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## QA #3844 run record"
            echo "- QA commit (this run): $qa_commit"
            echo "- product commit (HEAD^, the reviewed product commit): $product_commit"
            echo "- product tree (HEAD^^{tree}): $product_tree"
            echo "- size-ratchet base (HEAD^^, the product commit's first parent): $ratchet_base"
            echo "- the commit adds exactly: $status $added"
          } >> "$GITHUB_STEP_SUMMARY"

  focused:
    name: focused (${{ matrix.os }})
    needs: lock
    if: ${{ !cancelled() && needs.lock.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash  # Git Bash on Windows, as the repo's other legs use
    env:
      PYTHONUTF8: "1"  # Windows runners default to cp1252; test ids can be non-ASCII
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # the Linux leg's size lane reads HEAD^^
          persist-credentials: false
      # Test temp on the runner's work disk, as the repo's CI legs do; TEMP/TMP
      # keep pytest's own basetemp there too.
      - name: Put Windows test temp on the work disk
        if: ${{ runner.os == 'Windows' }}
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-python-env
        id: setup_python
      # The #3844 modules, named explicitly, through the safe_test boundary:
      # runner-owned scratch under $RUNNER_TEMP, a deadline for the whole
      # process tree, a persistent evidence record, and one JUnit file per OS.
      # No -m on the command line: pyproject's default markexpr applies and none
      # of the six modules carries an excluded lane mark. $PY is the absolute
      # venv interpreter, resolved before the boundary scrubs the environment.
      - name: Run the focused #3844 modules under safe_test
        id: focused
        timeout-minutes: 45
        if: ${{ !cancelled() && steps.setup_python.outcome == 'success' }}
        run: |
          set -euo pipefail
          PY="$(python -c 'import pathlib, sys; print(pathlib.Path(sys.executable).as_posix(), end="")')"
          QA_DIR="$RUNNER_TEMP/qa-3844"
          mkdir -p "$QA_DIR"
          "$PY" -I -S scripts/safe_test.py \
            --temp-parent "$RUNNER_TEMP" \
            --evidence-dir "$QA_DIR/evidence" \
            --timeout 2400 \
            -- "$PY" -m pytest \
              tests/test_tool_output_source_retention.py \
              tests/test_diagnostic_mask_walk.py \
              tests/test_verification_check_facts.py \
              tests/test_verify_artifact_lifecycle.py \
              tests/test_process_signal_observability.py \
              tests/test_docs_sync.py \
              --junitxml="$QA_DIR/junit-$RUNNER_OS.xml" \
              -q --tb=short
      # Proof for THIS leg: the JUnit shows the intended tests really ran and
      # passed, and that the only skips are the test-declared OS ones — the
      # count is re-derived from the source at this commit, never hardcoded,
      # and a vanished pattern fails loudly (declared > 0) instead of matching 0.
      - name: Check the JUnit of this leg
        if: ${{ !cancelled() && steps.focused.outcome == 'success' }}
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/qa-3844/junit-$RUNNER_OS.xml" "$RUNNER_OS" <<'PY'
          import pathlib, re, sys
          import xml.etree.ElementTree as ET
          path, runner_os = sys.argv[1], sys.argv[2]
          tests = skipped = failures = errors = 0
          for suite in ET.parse(path).getroot().iter("testsuite"):
              for tc in suite.iter("testcase"):
                  tests += 1
                  if tc.find("skipped") is not None:
                      skipped += 1
                  elif tc.find("failure") is not None:
                      failures += 1
                  elif tc.find("error") is not None:
                      errors += 1
          declared = 0
          if runner_os == "Windows":
              src = pathlib.Path("tests/test_process_signal_observability.py").read_text(encoding="utf-8")
              declared = len(re.findall(r'skipif\(os\.name != "posix"', src))
              assert declared > 0, "the declared-skip scan found no marker; re-derive the guard, do not assume zero"
          # The composed-mask module is part of this lane, so its own cases must appear here whole; the count is
          # re-derived from the source at this commit, never hardcoded, and a vanished focus fails loudly.
          focus_src = pathlib.Path("tests/test_diagnostic_mask_walk.py").read_text(encoding="utf-8")
          focus_declared = len(re.findall(r"^def test_", focus_src, re.M))
          focus_ran = sum(1 for suite in ET.parse(path).getroot().iter("testsuite")
                          for tc in suite.iter("testcase")
                          if "test_diagnostic_mask_walk" in (tc.get("classname") or ""))
          print(f"{runner_os}: {tests} collected, {skipped} skipped, {failures} failed, {errors} errors; "
                f"test-declared POSIX-only skips at this commit: {declared}; "
                f"composed-mask cases: {focus_ran} of {focus_declared} declared")
          assert tests > 0, "the focused modules must run on this leg"
          assert focus_declared > 0, "the declared-focus scan found no test; re-derive this list, do not assume zero"
          assert focus_ran == focus_declared, f"the composed-mask module must run whole ({focus_declared}), got {focus_ran}"
          assert failures == 0 and errors == 0, "the focused modules must pass on this leg"
          assert skipped == declared, f"skips must be exactly the test-declared OS skips ({declared}), got {skipped}"
          PY
      # The size-ratchet lane alone, against the actual product base (HEAD^^).
      # OS-independent (it reads git and the live tree); one leg is enough.
      # The book-budget tests skip here by their own rule (a push to a branch
      # other than ouroboros is not "one change" — tests/test_reference_book_budgets.py:37-40,94-95).
      - name: Run the size-ratchet lane against the product base (Linux leg)
        timeout-minutes: 20
        if: ${{ !cancelled() && needs.lock.result == 'success' && runner.os == 'Linux' && steps.setup_python.outcome == 'success' }}
        env:
          OURO_SIZE_RATCHET_BASE_REF: ${{ needs.lock.outputs.ratchet_base }}
        run: |
          set -euo pipefail
          PY="$(python -c 'import pathlib, sys; print(pathlib.Path(sys.executable).as_posix(), end="")')"
          "$PY" -m pytest -o addopts="" -m size_ratchet tests/ -q --tb=short
      # Named machine evidence only: the JUnit report and safe_test's result
      # record. Never credentials, .git, runner or installed logs. The `with:`
      # paths use runner.temp (runner-side expansion — no shell translation);
      # the run steps above built the same files under $RUNNER_TEMP in bash.
      - name: Upload the named machine evidence
        if: ${{ always() && steps.setup_python.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-3844-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qa-3844/junit-${{ runner.os }}.xml
            ${{ runner.temp }}/qa-3844/evidence/run-*/result.json
          retention-days: 30
          if-no-files-found: error

  verify:
    name: verify both OS legs ran the intended tests, including the #3844 witness
    needs: [lock, focused]
    if: ${{ needs.lock.result == 'success' && needs.focused.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # download-artifact's REST read of this run's artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qa-3844-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-proof
      - name: Reconcile the two OS legs and publish the run record
        env:
          QA_COMMIT: ${{ needs.lock.outputs.qa_commit }}
          PRODUCT_COMMIT: ${{ needs.lock.outputs.product_commit }}
          PRODUCT_TREE: ${{ needs.lock.outputs.product_tree }}
          RATCHET_BASE: ${{ needs.lock.outputs.ratchet_base }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/qa-proof" <<'PY'
          import json, pathlib, re, sys
          import xml.etree.ElementTree as ET
          root = pathlib.Path(sys.argv[1])
          # The #3844 witnesses, matched by name prefix so parametrize ids may
          # change: the same-attempt one (registry receipt + runs-once counter +
          # masked tail sentinel) and the failing-check one (whole masked output
          # and exit code kept). A demonstrable run of these on BOTH legs is
          # required — an equal nonzero test count is not enough.
          WITNESSES = [
              "test_a_cut_check_output_is_readable_whole_from_the_same_run",
              "test_a_failing_command_keeps_its_complete_output_and_exit_fact",
          ]
          legs = {}
          for xml in sorted(root.rglob("junit-*.xml")):
              os_name = xml.name.removeprefix("junit-").removesuffix(".xml")
              names, passed, skipped, failed = set(), set(), set(), 0
              for suite in ET.parse(xml).getroot().iter("testsuite"):
                  for tc in suite.iter("testcase"):
                      name = tc.get("name", "")
                      names.add(name)
                      if tc.find("skipped") is not None:
                          skipped.add(name)
                      elif tc.find("failure") is not None or tc.find("error") is not None:
                          failed += 1
                      else:
                          passed.add(name)
              results = sorted(xml.parent.glob("evidence/run-*/result.json"))
              legs[os_name] = {"names": names, "passed": passed, "skipped": skipped,
                               "failed": failed, "results": results}
          for os_name, leg in legs.items():
              print(f"{os_name}: {len(leg['names'])} collected, {len(leg['skipped'])} skipped, "
                    f"{leg['failed']} failed, {len(leg['results'])} result.json")
          assert set(legs) == {"Linux", "Windows"}, f"both OS legs must report, got {sorted(legs)}"
          for os_name, leg in legs.items():
              assert leg["failed"] == 0, f"{os_name}: {leg['failed']} test(s) failed or errored"
              assert leg["results"], f"{os_name}: safe_test's result.json evidence is missing"
              for r in leg["results"]:
                  json.loads(r.read_text(encoding="utf-8"))  # the named machine evidence parses
          # The skip expectation comes from the source at the QA commit, not from a constant.
          src = pathlib.Path("tests/test_process_signal_observability.py").read_text(encoding="utf-8")
          declared = len(re.findall(r'skipif\(os\.name != "posix"', src))
          assert declared > 0, "the declared-skip scan found no marker; re-derive the guard, do not assume zero"
          assert legs["Linux"]["names"] == legs["Windows"]["names"], "both legs must collect the identical intended set"
          assert not legs["Linux"]["skipped"], "no declared skip applies on Linux"
          assert len(legs["Windows"]["skipped"]) == declared, (
              f"Windows must skip exactly the {declared} declared POSIX-only tests, "
              f"got {len(legs['Windows']['skipped'])}")
          assert legs["Linux"]["passed"] == legs["Linux"]["names"]
          assert legs["Windows"]["passed"] == legs["Windows"]["names"] - legs["Windows"]["skipped"]
          for w in WITNESSES:
              for os_name, leg in legs.items():
                  hits = sorted(n for n in leg["passed"] if n.startswith(w))
                  assert hits, f"{os_name}: the #3844 witness {w} did not run and pass on this leg"
                  print(f"{os_name}: witness passed as {hits}")
          print(f"OK: identical {len(legs['Linux']['names'])} collected tests on Linux and Windows; "
                f"Windows skipped only the {declared} test-declared POSIX-only cases; "
                f"both #3844 witnesses ran and passed on both legs")
          PY
          {
            echo "## QA #3844 verification record"
            echo "- QA commit (this run): $QA_COMMIT"
            echo "- product commit (single parent, HEAD^): $PRODUCT_COMMIT"
            echo "- product tree: $PRODUCT_TREE"
            echo "- size-ratchet base (the product commit's first parent, HEAD^^): $RATCHET_BASE"
            echo "- added file, enforced by the lock job: .github/workflows/qa-3844-verify-output.yml"
            echo "- evidence: per-OS JUnit + safe_test result.json only; identical collected set on both legs; both #3844 witnesses passed on Linux and Windows"
          } >> "$GITHUB_STEP_SUMMARY"
