# TEMPORARY qualification workflow. It exists with this content ON THE VERIFICATION BRANCH ONLY, in the place of the default branch's
# .github/workflows/desktop-window.yml: that file already has a workflow_dispatch, so GitHub recognises it, and a dispatch with an explicit
# --ref runs THIS version. Nothing here is committed to the default branch, and no production, release or CI code changes.
#
#   gh workflow run desktop-window.yml --ref qualification/windows-packaging-acceptance -f verified_ref_sha=<the 40-hex head you reviewed>
#
# The ONLY trigger is workflow_dispatch: no push, no tags, no schedule, no pull_request. Every job refuses any ref or commit but the verified
# ones. contents: read, no secrets, no publication. Two INDEPENDENT legs, each on its own disposable GitHub-hosted runner and profile:
#   accept/visible    a CLEAN profile without system Git: the script itself drives the real installer wizard, only through UIA InvokePattern
#                     in its own process tree; frames of the wizard and of the app's first-run wizard of the installed Ouroboros.exe
#   accept/migration  the published 7.12.0 ZIP creates a profile and a chat (system Git, which it needs) -> the new package through the same
#                     ordinary wizard, whose Finish opens the app -> Update + handoff -> cold start by the Start shortcut -> uninstall -> ZIP reopen
# The already-observed old-ZIP-in-Explorer job is dropped here; its reviewed scripts stay in explorer-qa/ and its result stays on the public
# branch. Each leg builds its own package from the same candidate commit; the digests are recorded per job (the two builds' bytes differ).
# Setup is packed from the built ZIP's EXTRACTED payload (the candidate's packer refuses a raw PyInstaller dist, whose Hidden entries Setup
# would silently leave out), so the installer carries exactly the ZIP's files, as the release packs it.
# Binaries (ZIPs, installer, installed files) never leave a runner: only allowlisted JSON facts and bounded PNG frames are uploaded (7 days).
# Where UIA lacks the pattern a step needs, the leg records an exact skip: no synthetic click, no pass. One exception (acceptance.py): the
# old release's own model-source list in the migration leg gets #4220's owner- and foreground-checked click if UIA cannot choose it.
# The opt-in smoke_installer input runs, in the visible leg only and BEFORE its acceptance step, the candidate's own
# scripts/smoke_windows_setup.ps1 once (with -Compiler, no signing arguments: this build is unsigned) over the freshly packed Setup.
name: TEMPORARY qualification - Windows packaging acceptance (not a release)

on:
  workflow_dispatch:
    inputs:
      verified_ref_sha:
        description: Head SHA of the verification branch you reviewed. Every job refuses to run on any other commit.
        required: true
        type: string
      compiler_only:
        description: Check the pinned compiler and compile the product installer script against inert files; no install or app launch.
        required: false
        type: boolean
        default: false
      smoke_installer:
        description: Once, in the visible leg before its acceptance run - the candidate's own installer smoke (with -Compiler). Default false leaves both legs exactly as reviewed.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-packaging-acceptance
  cancel-in-progress: false

jobs:
  compiler:
    if: ${{ inputs.compiler_only && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qualification/windows-packaging-acceptance' && github.sha == inputs.verified_ref_sha }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: kit
          sparse-checkout: qa-kit
          persist-credentials: false
      - id: candidate
        shell: pwsh
        run: |
          $sha = (Get-Content -Raw 'kit/qa-kit/candidate.json' | ConvertFrom-Json).candidate_sha
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw 'Missing candidate pin' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha=$sha"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: product
          persist-credentials: false
      - name: Stage the compiler, then compile the real installer script with inert files
        shell: pwsh
        working-directory: product
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'compiler probe'
          if (Test-Path -LiteralPath $dest) { throw 'Compiler probe requires a new directory' }
          try { .\scripts\download_inno_setup.ps1 -Destination $dest }
          finally {
            foreach ($name in 'ISCC.exe','ISCmplr.dll') {
              $p = Join-Path $dest $name
              if (Test-Path -LiteralPath $p -PathType Leaf) {
                $v = (Get-Item -LiteralPath $p).VersionInfo
                [pscustomobject]@{name=$name; file=$v.FileVersion; product=$v.ProductVersion; fixedFile="$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)"; fixedProduct="$($v.ProductMajorPart).$($v.ProductMinorPart).$($v.ProductBuildPart).$($v.ProductPrivatePart)"; sha256=(Get-FileHash -LiteralPath $p).Hash} | ConvertTo-Json -Compress | Write-Host
              } else { Write-Host "$name missing in the selected destination" }
            }
          }
          $app = Join-Path $env:RUNNER_TEMP 'inert payload'
          $out = Join-Path $env:RUNNER_TEMP 'compiler output'
          New-Item -ItemType Directory -Path "$app\bin","$app\_internal\python-standalone" | Out-Null
          Set-Content "$app\_internal\VERSION" '1.2.3'
          foreach ($p in 'Ouroboros.exe','_internal\python-standalone\python.exe','bin\fixture.txt') { Set-Content (Join-Path $app $p) 'inert compiler fixture, not executable' }
          .\scripts\pack_windows_setup.ps1 -PayloadRoot $app -OutputDir $out -Compiler "$dest\ISCC.exe"
          if (-not (Test-Path "$out\Ouroboros-Setup-1.2.3-windows-x64.exe" -PathType Leaf)) { throw 'Missing compiler output' }
          Write-Host 'Compiled; this check neither installs nor uploads the output.'
  accept:
    name: ${{ matrix.mode }} leg (own runner, own profile)
    if: ${{ !inputs.compiler_only && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/qualification/windows-packaging-acceptance' && github.sha == inputs.verified_ref_sha }}
    runs-on: windows-2025
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        mode: [visible, migration]
    env:
      OUROBOROS_QA_DISPOSABLE: '1'  # the workflow author's conscious confirmation that a GitHub-hosted runner is disposable; no code sets it
      QA_MIRROR_URL: C:/ouroboros-qa/mirror.git
    steps:
      - name: Check out the kit only, from the verified ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: qa-src
          persist-credentials: false
          sparse-checkout: qa-kit

      - name: Base Python
        id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Resolve the reviewed candidate (candidate.json), stage the kit, park its checkout
        id: pointer
        shell: pwsh
        run: |
          & "${{ steps.py.outputs.python-path }}" -I -B "qa-src/qa-kit/vendor/windows_update_4220_e21fee6/prepare_build.py" pointer `
            --pointer-file "qa-src/qa-kit/candidate.json" --stage-from "qa-src/qa-kit" --stage-to "$env:RUNNER_TEMP/qa-harness" `
            --park-checkout qa-src --park-to "$env:RUNNER_TEMP/qa-src" --evidence "$env:RUNNER_TEMP/qa-evidence"
          exit $LASTEXITCODE

      - name: Isolated checkout of the reviewed candidate (no remote)
        shell: pwsh
        run: |
          & "${{ steps.py.outputs.python-path }}" -I -B "$env:RUNNER_TEMP/qa-harness/vendor/windows_update_4220_e21fee6/prepare_build.py" checkout `
            --candidate "${{ steps.pointer.outputs.candidate_sha }}" --evidence "$env:RUNNER_TEMP/qa-evidence"
          exit $LASTEXITCODE

      # Numbered projection, inside this disposable stand only. The reviewed SHA stays the candidate; a LOCAL carrier commit on top
      # of it differs only in VERSION, so the candidate's own, unchanged release guard accepts it. No tag, no push, no remote, no guard bypass:
      # if the guard still refuses the carrier, the leg stops here.
      - name: Project the release number onto the reviewed candidate (local carrier, VERSION only)
        id: project
        shell: pwsh
        run: |
          & "${{ steps.py.outputs.python-path }}" -I -B "$env:RUNNER_TEMP/qa-harness/projection.py" project `
            --repo . --reviewed "${{ steps.pointer.outputs.candidate_sha }}" --evidence "$env:RUNNER_TEMP/qa-evidence"
          exit $LASTEXITCODE

      - name: Locked build environment
        id: build_env
        uses: ./.github/actions/setup-python-env
        with:
          profile: build

      # The unchanged #4220 helper. It creates the ONE local annotated test tag v<release> in THIS fixture checkout (no push remote; the managed
      # remote is the local mirror). Not a project tag, never pushed, never published.
      - name: Bind the build to the carrier (release guard, local QA test tag, local mirror)
        id: binding
        shell: pwsh
        run: |
          & "${{ steps.py.outputs.python-path }}" -I -B "$env:RUNNER_TEMP/qa-harness/vendor/windows_update_4220_e21fee6/prepare_build.py" bind `
            --candidate "${{ steps.project.outputs.carrier_sha }}" --mirror-url "$env:QA_MIRROR_URL" --evidence "$env:RUNNER_TEMP/qa-evidence"
          exit $LASTEXITCODE

      - name: Download python-standalone
        id: dl_py
        shell: pwsh
        run: .\scripts\download_python_standalone.ps1

      - name: Build the ZIP with the candidate's build_windows.ps1
        id: build_zip
        shell: pwsh
        env:
          OUROBOROS_RELEASE_TAG: ${{ steps.binding.outputs.release_tag }}
          OUROBOROS_MANAGED_SOURCE_BRANCH: ouroboros
        run: .\build_windows.ps1

      - name: Check that the package names the carrier and the mirror and carries the bundled Git
        shell: pwsh
        run: |
          & "${{ steps.py.outputs.python-path }}" -I -B "$env:RUNNER_TEMP/qa-harness/vendor/windows_update_4220_e21fee6/prepare_build.py" verify-package `
            --candidate "${{ steps.project.outputs.carrier_sha }}" --mirror-url "$env:QA_MIRROR_URL" --evidence "$env:RUNNER_TEMP/qa-evidence"
          exit $LASTEXITCODE

      - name: Stage the pinned Inno Setup (the author's own script, digest-checked)
        id: inno
        shell: pwsh
        run: .\scripts\download_inno_setup.ps1 -Destination "$env:RUNNER_TEMP\inno"

      # The published old release the former user comes from, as it is; run.py checks its digest before anything reads it.
      - name: Download the published 7.12.0 ZIP
        id: dl_old
        if: ${{ matrix.mode == 'migration' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/old-release" | Out-Null
          curl.exe --fail --location --silent --show-error --max-time 900 --output "$env:RUNNER_TEMP/old-release/Ouroboros-7.12.0-windows-x64.zip" `
            https://github.com/razzant/ouroboros/releases/download/v7.12.0/Ouroboros-7.12.0-windows-x64.zip
          exit $LASTEXITCODE

      # A stopped environment or build (downloads, network, packages) is not a product verdict: unconfirmed.
      - name: Record a structured result if the environment or the build stopped
        if: ${{ failure() && (steps.build_env.outcome == 'failure' || steps.dl_py.outcome == 'failure' || steps.build_zip.outcome == 'failure' || steps.inno.outcome == 'failure' || steps.dl_old.outcome == 'failure') }}
        shell: pwsh
        run: |
          $phase = if ("${{ steps.build_env.outcome }}" -eq "failure") { "setup_python_env" }
                   elseif ("${{ steps.dl_py.outcome }}" -eq "failure") { "download_python_standalone" }
                   elseif ("${{ steps.build_zip.outcome }}" -eq "failure") { "build_windows_zip" }
                   elseif ("${{ steps.dl_old.outcome }}" -eq "failure") { "download_old_release" }
                   else { "stage_inno_setup" }
          & "${{ steps.py.outputs.python-path }}" -I -B "$env:RUNNER_TEMP/qa-harness/run.py" record-stop --evidence "$env:RUNNER_TEMP/qa-evidence" `
            --phase $phase --code "${phase}_failed"

      # Opt-in (inputs.smoke_installer), the visible leg only, and BEFORE its acceptance run: the candidate's own end-to-end installer
      # smoke. The smoke itself refuses a profile that already holds any Ouroboros state, so it must be first; it seeds its own synthetic
      # %USERPROFILE%\Ouroboros and cleans up only the exact files it created. A failure here stops this job before the acceptance step,
      # and the leg's own clean-profile guard is the second net. No signing arguments: this QA build is unsigned, so the smoke's signature
      # checks are skipped by its own design, and with -Compiler its step 4b exercises the update transition between two fixture Setups.
      - name: Pack the Setup once for the smoke (from the extracted ZIP payload)
        id: packsmoke
        if: ${{ matrix.mode == 'visible' && inputs.smoke_installer }}
        shell: pwsh
        run: |
          & "${{ steps.py.outputs.python-path }}" -I -B "$env:RUNNER_TEMP/qa-harness/run.py" pack `
            --evidence "$env:RUNNER_TEMP/qa-smoke-pack" --candidate-root "$env:GITHUB_WORKSPACE" --compiler "$env:RUNNER_TEMP\inno\ISCC.exe"
          exit $LASTEXITCODE

      - name: The candidate's own installer smoke, once (its own guard gates it to a disposable runner)
        id: smoke
        if: ${{ matrix.mode == 'visible' && inputs.smoke_installer }}
        shell: pwsh
        run: |
          $facts = Get-Content -Raw "$env:RUNNER_TEMP/qa-smoke-pack/installer-facts.json" | ConvertFrom-Json
          $setup = "$env:RUNNER_TEMP/installer-out/$($facts.installer.name)"
          $zip = "$env:GITHUB_WORKSPACE/dist/$($facts.zip.name)"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "the Setup run.py pack named is not in installer-out" }
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "the built ZIP run.py pack named is not in dist" }
          pwsh -NoProfile -NonInteractive -File .\scripts\smoke_windows_setup.ps1 `
            -Installer "$setup" -Archive "$zip" -Compiler "$env:RUNNER_TEMP\inno\ISCC.exe"
          exit $LASTEXITCODE

      # Creates its venv (comtypes only), runs preflight (nothing is installed or launched if it fails), packs the installer with the author's
      # packer from the built ZIP's extracted payload - or takes the Setup the smoke route already packed, same payload, same packer - runs the
      # leg, and selects what may leave the runner. -UninstallRunnerGit is the separate, conscious opt-in to #4220's verified uninstall of
      # THIS hosted runner's Git, used by the visible leg only; the migration keeps it, as the former user did.
      - name: Acceptance (${{ matrix.mode }})
        id: acceptance
        shell: pwsh
        run: |
          $smokeInstaller = ''
          if ('${{ inputs.smoke_installer }}' -eq 'true' -and '${{ matrix.mode }}' -eq 'visible') {
            $facts = Get-Content -Raw "$env:RUNNER_TEMP/qa-smoke-pack/installer-facts.json" | ConvertFrom-Json
            $smokeInstaller = "$env:RUNNER_TEMP/installer-out/$($facts.installer.name)"
          }
          & "$env:RUNNER_TEMP/qa-harness/Invoke-Acceptance.ps1" -Mode "${{ matrix.mode }}" -WorkRoot "$env:RUNNER_TEMP/qa-run" `
            -CandidateRoot "$env:GITHUB_WORKSPACE" -Installer "$smokeInstaller" -Compiler "$env:RUNNER_TEMP\inno\ISCC.exe" -FactsDir "$env:RUNNER_TEMP/qa-evidence" `
            -OldZip "$env:RUNNER_TEMP/old-release/Ouroboros-7.12.0-windows-x64.zip" -UninstallRunnerGit `
            -Python "${{ steps.py.outputs.python-path }}"
          exit $LASTEXITCODE

      # A job that left no run result still leaves one structured, truthful record and its build facts.
      - name: Facts of a run that stopped early
        if: ${{ always() }}
        shell: pwsh
        run: |
          $publish = "$env:RUNNER_TEMP/qa-run/publish"
          New-Item -ItemType Directory -Force -Path $publish | Out-Null
          foreach ($name in 'result.json', 'projection.json', 'build-binding.json', 'package.json') {
            if ((Test-Path "$env:RUNNER_TEMP/qa-evidence/$name") -and -not (Test-Path "$publish/$name")) { Copy-Item "$env:RUNNER_TEMP/qa-evidence/$name" "$publish/$name" }
          }
          $kit = "$env:RUNNER_TEMP/qa-harness"
          if (-not (Test-Path "$kit/run.py")) { $kit = "$env:GITHUB_WORKSPACE/qa-src/qa-kit" }
          $py = "${{ steps.py.outputs.python-path }}"
          if ("${{ job.status }}" -ne "success") {
            # the acceptance run, or the opt-in installer smoke that ran before it: either may have installed and launched things
            $entered = (@('failure', 'cancelled') -contains "${{ steps.acceptance.outcome }}") -or
                       (@('failure', 'cancelled') -contains "${{ steps.smoke.outcome }}")
            if ($py -and (Test-Path "$kit/run.py")) {
              $flag = @(); if ($entered) { $flag = @('--run-may-have-started') }
              & $py -I -B "$kit/run.py" record-stop --evidence $publish @flag
            } elseif (-not (Test-Path "$publish/result.json")) {  # no Python or no kit (checkout or setup stopped): fixed text only
              $state = if ($entered) { '"unknown"' } else { 'false' }
              Set-Content -LiteralPath "$publish/result.json" -Encoding utf8 -Value ('{"schema":5,"verdict":"unconfirmed","phase":"job","code":"stopped_without_tools",' +
                '"facts":{"acceptance_run_started":' + $state + '},"declared":{"screenshots_collected":' + $state + '}}')
            }
          }

      - name: Summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $kit = "$env:RUNNER_TEMP/qa-harness"
          if (-not (Test-Path "$kit/run.py")) { $kit = "$env:GITHUB_WORKSPACE/qa-src/qa-kit" }
          $py = "${{ steps.py.outputs.python-path }}"
          if ($py -and (Test-Path "$kit/run.py") -and (Test-Path "$env:RUNNER_TEMP/qa-run/publish/result.json")) {
            & $py -I -B "$kit/run.py" summary --evidence "$env:RUNNER_TEMP/qa-run/publish" >> $env:GITHUB_STEP_SUMMARY
          }

      # Only what Invoke-Acceptance.ps1 and the step above selected: allowlisted JSON facts and bounded PNG frames. Never logs, private/, the
      # installer, the ZIP, the installed files or the profile.
      - name: Upload allowlisted synthetic facts and frames
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-packaging-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-run/publish
          if-no-files-found: warn
          retention-days: 7

      - name: Check compiler selection with inert inputs on native PowerShell
        if: ${{ !cancelled() && matrix.mode == 'visible' && steps.build_env.outcome == 'success' }}
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m pytest -q -o addopts= --noconftest tests/test_windows_signing_powershell.py -k 'inno_setup_verifies or setup_verifies_pinned_pair'
          exit $LASTEXITCODE
