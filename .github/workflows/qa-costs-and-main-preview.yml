name: Temporary Costs and Main QA

on:
  push:
    branches: ['qa/costs-and-main-preview']

permissions:
  contents: read

jobs:
  focused-qa:
    if: ${{ github.repository == 'razzant/ouroboros' && github.ref == 'refs/heads/qa/costs-and-main-preview' && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 175
    env:
      GIT_TERMINAL_PROMPT: '0'
      UV_NO_PROGRESS: '1'
      OUROBOROS_RUN_UI_SMOKE: '1'
      OUROBOROS_EXPECT_BROWSER_ENGINES: chromium,webkit
    steps:
      - name: Prepare runner-local paths
        id: paths
        timeout-minutes: 1
        run: |
          mkdir "$RUNNER_TEMP/costs-main-raw" "$RUNNER_TEMP/costs-main-evidence"
          printf 'QA_RAW=%s\nQA_OUTPUT=%s\nQA_PRODUCT=%s\nQA_UI=%s\nQA_PYTHON=%s\nQA_NODE=%s\nPLAYWRIGHT_BROWSERS_PATH=%s\n' \
            "$RUNNER_TEMP/costs-main-raw" "$RUNNER_TEMP/costs-main-evidence" \
            "$RUNNER_TEMP/qa-product" "$RUNNER_TEMP/qa-product-ui" "$RUNNER_TEMP/qa-venv/bin/python" \
            "$RUNNER_TEMP/qa-node/bin/node" "$RUNNER_TEMP/costs-main-browsers" >> "$GITHUB_ENV"
          printf 'evidence=%s\n' "$RUNNER_TEMP/costs-main-evidence" >> "$GITHUB_OUTPUT"
      - name: Check out the exact temporary runner commit
        id: checkout
        timeout-minutes: 4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Bind the clean product tree and its fixed public base
        id: product
        timeout-minutes: 5
        run: bash qa/main_preview/run.sh stage > "$QA_RAW/product-setup.log" 2>&1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        timeout-minutes: 4
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        timeout-minutes: 5
        with:
          version: '0.12.1'
          enable-cache: false
      - name: Prepare the locked dependency-only environment from the product
        id: deps
        timeout-minutes: 12
        run: |
          cd "$QA_PRODUCT"
          export PYTHON_STANDALONE_DEST="$RUNNER_TEMP/qa-python" PYTHON_STANDALONE_INTERPRETER_ONLY=1
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/qa-venv"
          {
            bash scripts/download_python_standalone.sh
            uv sync --locked --extra browser --group dev --no-install-project --python "$PYTHON_STANDALONE_DEST/bin/python3"
          } > "$QA_RAW/dependencies.log" 2>&1
      - name: Stage the repository-pinned Node
        id: node_setup
        timeout-minutes: 5
        run: |
          cd "$QA_PRODUCT"
          "$QA_PYTHON" -I -S scripts/download_node_standalone.py --destination "$RUNNER_TEMP/qa-node" > "$QA_RAW/node-setup.log" 2>&1
          printf 'PLAYWRIGHT_NODEJS_PATH=%s\n' "$QA_NODE" >> "$GITHUB_ENV"
          printf '%s\n' "${QA_NODE%/*}" >> "$GITHUB_PATH"
      - name: Install Chromium and WebKit once
        id: browsers
        if: ${{ !cancelled() && steps.node_setup.outcome == 'success' }}
        timeout-minutes: 22
        run: |
          cd "$QA_PRODUCT"
          "$QA_PYTHON" -I -S scripts/ci_browser_install.py --attempt-seconds 300 chromium webkit > "$QA_RAW/browser-setup.log" 2>&1

      - name: Check Costs, Evolution, selected Main A and Project Find
        id: product_ui
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 28
        run: bash qa/main_preview/run.sh product-ui
      - name: Check Share and the packaged comparison template
        id: share_design
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        timeout-minutes: 22
        run: bash qa/main_preview/run.sh share-design
      - name: Check changed and adjacent Python test homes
        id: python
        if: ${{ !cancelled() && steps.node_setup.outcome == 'success' }}
        timeout-minutes: 23
        run: bash qa/main_preview/run.sh python
      - name: Check changed Node test homes
        id: node
        if: ${{ !cancelled() && steps.node_setup.outcome == 'success' }}
        timeout-minutes: 6
        run: bash qa/main_preview/run.sh node
      - name: Check floor, structural contracts, size against the fixed base and context gate
        id: structure
        if: ${{ !cancelled() && steps.node_setup.outcome == 'success' }}
        timeout-minutes: 28
        run: bash qa/main_preview/run.sh structure
      - name: Project only bounded receipts and named synthetic evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.paths.outcome == 'success' }}
        timeout-minutes: 2
        env:
          QA_PRODUCT_STAGE: ${{ steps.product.outcome }}
          QA_DEPS_SETUP: ${{ steps.deps.outcome }}
          QA_NODE_SETUP: ${{ steps.node_setup.outcome }}
          QA_BROWSER_SETUP: ${{ steps.browsers.outcome }}
          QA_PRODUCT_UI: ${{ steps.product_ui.outcome }}
          QA_SHARE_DESIGN: ${{ steps.share_design.outcome }}
          QA_PYTHON_STEP: ${{ steps.python.outcome }}
          QA_NODE_STEP: ${{ steps.node.outcome }}
          QA_STRUCTURE_STEP: ${{ steps.structure.outcome }}
        run: python3 -I -S qa/main_preview/receipt.py summarize
      - name: Upload focused product receipts and synthetic captures
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.paths.outcome == 'success' }}
        timeout-minutes: 4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: costs-main-product-qa-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.evidence }}/summary.json
            ${{ steps.paths.outputs.evidence }}/frames/
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
