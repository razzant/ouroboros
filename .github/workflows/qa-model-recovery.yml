      - name: Save machine-readable test outcomes without test output
        id: outcomes
        if: ${{ !cancelled() && steps.subject.outcome == 'success' }}
        env:
          SUBJECT_OUTCOME: ${{ steps.subject.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          BASE_OUTCOME: ${{ steps.base_control.outcome }}
          STRUCTURE_OUTCOME: ${{ steps.structure.outcome }}
          SIZE_OUTCOME: ${{ steps.size.outcome }}
          BROWSERS_OUTCOME: ${{ steps.browsers.outcome }}
          UI_OUTCOME: ${{ steps.ui.outcome }}
          LOCAL_SERVER_OUTCOME: ${{ steps.local_server.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          names = ('subject', 'python', 'node', 'replay', 'focused', 'base', 'structure', 'size', 'browsers', 'ui', 'local_server')
          reports = ('focused', 'base', 'structure', 'size', 'ui', 'local_server')
          needs = {'python': ('subject',), 'node': ('python',), 'replay': ('python',), 'focused': ('python',),
                   'base': ('python',), 'structure': ('python',), 'size': ('python',), 'browsers': ('python',),
                   'ui': ('browsers',), 'local_server': ('python',)}
          out = {name: {'step_outcome': os.environ.get(f'{name.upper()}_OUTCOME') or 'unknown'} for name in names}
          for name in names:
              # A step that never ran says why; that is not a missing report and never counts as a pass.
              if out[name]['step_outcome'] in ('skipped', 'unknown'):
                  out[name]['not_run_because'] = [d for d in needs.get(name, ()) if out[d]['step_outcome'] != 'success']
          for name in reports:
              report = root / (name + '.xml')
              if not report.is_file():
                  out[name]['report'] = 'not_run' if out[name]['step_outcome'] in ('skipped', 'unknown') else 'absent'
                  continue
              try:
                  cases = list(ET.parse(report).iter('testcase'))
              except (OSError, ET.ParseError):
                  out[name]['report'] = 'unreadable'
                  continue
              out[name]['cases'] = [{'name': c.get('classname', '') + '::' + c.get('name', ''),
                  'outcome': next((k for k in ('error', 'failure', 'skipped') if c.find(k) is not None), 'passed')}
                  for c in cases]
          if (root / 'p01' / 'cells.tsv').is_file():
              out['replay']['report'] = 'present'
          else:
              out['replay']['report'] = 'not_run' if out['replay']['step_outcome'] in ('skipped', 'unknown') else 'absent'
          (root / 'p01' / 'checks.json').write_text(json.dumps(out), encoding='utf-8')
          print({k: (v['step_outcome'], len(v['cases']) if 'cases' in v else v.get('report', '')) for k, v in out.items()})
          PY
