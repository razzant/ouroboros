        env:
          PRODUCT: ${{ steps.subject.outputs.product }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          extras=(
            tests/test_primary_view_return.py tests/test_presence_round_recovery.py tests/test_wrapup_real_send_parity.py
            tests/test_nano_physical_output.py tests/test_processing_call_tiers.py tests/test_response_limit_consumers.py
            tests/test_response_limit_refresh.py tests/test_batch4_upstream_integration.py tests/test_vision_model_wait.py
            tests/test_vision_child_deadline.py tests/test_pause_model_receiver.py tests/test_subagent_history_attempt_facts.py
            tests/test_terminal_duty_open_sets.py tests/test_live_delivery_owner.py tests/test_live_deferred_custody.py
          )
          duplicates=$(printf '%s\n' "${extras[@]}" | sort | uniq -d)
          if [[ -n "$duplicates" ]]; then echo "::error::Duplicate extra test modules: $duplicates"; exit 1; fi
          args=()
          for extra in "${extras[@]}"; do
            if [[ ! -f "$extra" ]]; then echo "::error::Extra test module is absent from the pinned product: $extra"; exit 1; fi
            args+=(--extra-test "$extra")
          done
          python scripts/run_tests.py --selected --base "$BASE" --keep-going "${args[@]}" \
            --test-reason 'Indirect routing, terminal controls and wrap-up consumers' \
            --evidence-dir "$RUNNER_TEMP/ci-selected"
      - name: Check and name the second set of receipts
        id: selection_check
        if: ${{ !cancelled() && steps.subject.outcome == 'success' }}
        env:
          CONTEXT_OUTCOME: ${{ steps.context_gate.outcome }}
          SELECTED_OUTCOME: ${{ steps.selected.outcome }}
        run: |
          printf 'context %s\nselected %s\n' "$CONTEXT_OUTCOME" "$SELECTED_OUTCOME" > "$RUNNER_TEMP/p01/selection-status.txt"
          test "$CONTEXT_OUTCOME" = success && test "$SELECTED_OUTCOME" = success || exit 1
          test -s "$RUNNER_TEMP/ci-context/verdict.json"
          test -s "$RUNNER_TEMP/ci-selected/selection.json"
          python - "$RUNNER_TEMP/ci-selected/selection.json" "$RUNNER_TEMP/p01/selection-reach.txt" <<'PY'
          import ast, json, sys
          from pathlib import Path
          record = json.load(open(sys.argv[1], encoding='utf-8'))
          files, reasons = set(record['files']), {}
          for path, why in record['reasons']:
              reasons.setdefault(path, []).append(why)
          lines = ['tier %s base %s modules %d/%d' % (record['tier'], record['base'][:12], len(files), record['available'])]
          problems = []
          if record['tier'] != 'selected':
              problems.append('tier is %r, not selected: %s' % (record['tier'], [r for r in record['reasons'] if 'direct import' not in r[1]][:5]))
          # Each moved shared helper and the two modules that import it: the selector must name the helper as the reason.
          reach = {'tests._forced_model_binding_fixtures': ('tests/test_forced_model_binding.py', 'tests/test_native_fallback_binding_acceptance.py'),
                   'tests._main_fit_fixtures': ('tests/test_loop_compaction.py', 'tests/test_output_exhaustion_recovery.py'),
                   'tests._worker_loss_fixtures': ('tests/test_output_exhaustion_recovery.py', 'tests/test_stream_timeout_recovery.py')}
          for helper, readers in reach.items():
              for reader in readers:
                  via = [w for w in reasons.get(reader, []) if w.startswith('direct import: ') and helper in w[len('direct import: '):].split(', ')]
                  lines.append('%s <- %s: %s' % (helper, reader, via[0] if via else 'NOT SELECTED THROUGH THE HELPER'))
                  if not via:
                      problems.append('%s is not selected through %s' % (reader, helper))
          # Independent of the selector: every test module that imports a moved helper or an old owner of one must be selected.
          moved = set(reach) | {'tests.test_loop_compaction', 'tests.test_forced_model_binding', 'tests.test_stream_timeout_recovery'}
          def imported(path):
              names = set()
              for node in ast.walk(ast.parse(path.read_text(encoding='utf-8'))):
                  if isinstance(node, ast.Import):
                      names.update(a.name for a in node.names)
                  elif isinstance(node, ast.ImportFrom) and node.module and not node.level:
                      names.add(node.module)
                      names.update(node.module + '.' + a.name for a in node.names)
              return names
          readers = sorted(p.as_posix() for p in Path('tests').glob('test_*.py') if imported(p) & moved)
          lines.append('%d test modules import a moved helper or an old owner of one; selected: %d' % (len(readers), len(set(readers) & files)))
          lines.extend('  ' + r + ('' if r in files else '  NOT SELECTED') for r in readers)
          problems.extend('%s imports a moved helper or its old owner but is not selected' % r for r in readers if r not in files)
          Path(sys.argv[2]).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          assert not problems, problems
          PY
      - name: Save selection and context-gate receipts
        id: upload_selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.subject.outcome == 'success' }}
        with:
          name: model-recovery-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p01/subject.txt
            ${{ runner.temp }}/p01/selection-status.txt
            ${{ runner.temp }}/p01/selection-reach.txt
            ${{ runner.temp }}/ci-context/verdict.json
            ${{ runner.temp }}/ci-selected/selection.json
          if-no-files-found: error
          retention-days: 7
      - name: Require every stage to succeed
        id: gate
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: |
            subject=${{ steps.subject.outcome }}
            python=${{ steps.python.outcome }}
            node=${{ steps.node.outcome }}
            replay=${{ steps.replay.outcome }}
            focused=${{ steps.focused.outcome }}
            base_control=${{ steps.base_control.outcome }}
            structure=${{ steps.structure.outcome }}
            size=${{ steps.size.outcome }}
            browsers=${{ steps.browsers.outcome }}
            ui=${{ steps.ui.outcome }}
            local_server=${{ steps.local_server.outcome }}
            outcomes_file=${{ steps.outcomes.outcome }}
            upload_focused=${{ steps.upload_focused.outcome }}
            context_gate=${{ steps.context_gate.outcome }}
            selected=${{ steps.selected.outcome }}
            selection_check=${{ steps.selection_check.outcome }}
            upload_selection=${{ steps.upload_selection.outcome }}
        run: |
          # Raw outcomes stay visible; a skipped or missing stage is a failure here, never a pass.
          bad=0
          printf '| stage | raw outcome |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
          while IFS='=' read -r stage outcome; do
            [[ -n "$stage" ]] || continue
            printf '%-18s %s\n' "$stage" "$outcome"
            printf '| %s | %s |\n' "$stage" "$outcome" >> "$GITHUB_STEP_SUMMARY"
            [[ "$outcome" == success ]] || bad=1
          done <<< "$OUTCOMES"
          if [[ "$bad" != 0 ]]; then
            echo '::error::At least one required stage did not succeed (failed, skipped or unknown). A skipped stage is not a pass.'
            exit 1
          fi
