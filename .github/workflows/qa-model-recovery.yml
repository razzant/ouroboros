name: Model recovery qualification (synthetic Linux QA)
on:
  push:
    branches: ['qa/model-recovery-p01-20261120']
permissions:
  contents: read
jobs:
  qualify:
    if: github.repository == 'razzant/ouroboros'
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # GitHub-hosted maximum; the per-step ceilings below still apply
    env:
      BASE: 'c96d2b272b4130c57b862a7dd72be3ad700a58ab' # exact public product parent
      PRODUCT_TREE: 'e3bf61c55dfdd703c46899c4d248b8c77b8421cf' # exact product tree, without the diagnostic files
      PYTHONDONTWRITEBYTECODE: '1'
      OUROBOROS_PREFLIGHT_REQUIRE_PLUGINS: '1'
      OUROBOROS_PREFLIGHT_REQUIRE_NODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Separate the three diagnostic files from the pinned product
        id: subject
        run: |
          set -euo pipefail
          # A binding failure prints what was expected and what was found, so it is not mistaken for another failure.
          require_equal() {
            if [[ "$2" != "$3" ]]; then
              echo "::error::Subject binding mismatch: $1"
              printf 'expected:\n%s\nactual:\n%s\n' "$3" "$2"
              exit 1
            fi
          }
          if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ && "$PRODUCT_TREE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Subject binding mismatch: BASE and PRODUCT_TREE must be 40 lowercase hex characters"
            exit 1
          fi
          require_equal 'checked-out HEAD is the pushed commit' "$(git rev-parse HEAD)" "$GITHUB_SHA"
          product=$(git rev-parse --verify --quiet 'HEAD^1') || { echo '::error::Subject binding mismatch: the pushed commit has no parent'; exit 1; }
          require_equal 'pushed commit has exactly one parent, the product' "$(git rev-list --parents -n 1 HEAD)" "$GITHUB_SHA $product"
          require_equal 'product has exactly one parent, the base' "$(git rev-list --parents -n 1 "$product")" "$product $BASE"
          require_equal 'product tree is the pinned tree' "$(git rev-parse "$product^{tree}")" "$PRODUCT_TREE"
          # The emitted cases arrive as one committed public-fixture carrier; no other repository is read.
          carrier=.github/qa/claudexor-emitted-cases.json
          witness=.github/qa/test_claudexor_emitted_witness.py
          workflow=.github/workflows/qa-model-recovery.yml
          expected=$(printf 'A\t%s\nA\t%s\nA\t%s' "$carrier" "$witness" "$workflow")
          require_equal 'file status between product and pushed commit' "$(git diff --name-status --no-renames "$product" HEAD)" "$expected"
          for path in "$carrier" "$witness" "$workflow"; do
            require_equal "object mode of $path" "$(git ls-tree --format='%(objectmode) %(objecttype)' HEAD -- "$path")" '100644 blob'
          done
          mkdir -p "$RUNNER_TEMP/p01/images" "$RUNNER_TEMP/p01-input"
          git show "HEAD:$carrier" > "$RUNNER_TEMP/p01-input/claudexor-emitted-cases.json"
          git show "HEAD:$witness" > "$RUNNER_TEMP/p01-input/test_claudexor_emitted_witness.py"
          git checkout --detach "$product"
          require_equal 'checked-out product tree' "$(git rev-parse 'HEAD^{tree}')" "$PRODUCT_TREE"
          require_equal 'checked-out product is clean' "$(git status --porcelain --untracked-files=all)" ''
          printf 'product=%s\n' "$product" >> "$GITHUB_OUTPUT"
          printf 'diagnostic %s\nproduct %s\ntree %s\nbase %s\n' "$GITHUB_SHA" "$product" "$PRODUCT_TREE" "$BASE" | tee "$RUNNER_TEMP/p01/subject.txt"
      - name: Install the repository's locked test dependencies
        id: python
        if: ${{ !cancelled() && steps.subject.outcome == 'success' }}
        uses: ./.github/actions/setup-python-env
        with:
          interpreter: shipped
          install-project: 'false'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: node
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        with:
          node-version: '24.22.3'
      - name: Replay 26 cells against the real product consumer (mock HTTP only)
        id: replay
        timeout-minutes: 32
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        env:
          PRODUCT: ${{ steps.subject.outputs.product }}
        run: |
          set -euo pipefail
          runner_py=$(python -c 'import sys; print(sys.executable)')
          [[ "$runner_py" == /* && -x "$runner_py" ]]
          git worktree add --detach "$RUNNER_TEMP/p01-replay" "$PRODUCT"
          cd "$RUNNER_TEMP/p01-replay"
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
          witness=tests/test_claudexor_emitted_witness.py
          [[ ! -e "$witness" && ! -L "$witness" ]]
          install -m 0644 "$RUNNER_TEMP/p01-input/${witness##*/}" "$witness"
          test "$(git status --porcelain --untracked-files=all)" = "?? $witness"
          "$runner_py" -I -S scripts/safe_test.py --timeout 1780 --evidence-dir "$RUNNER_TEMP/source-replay" -- \
            "$runner_py" "$witness" "$RUNNER_TEMP/p01-input/claudexor-emitted-cases.json" \
            "$RUNNER_TEMP/p01/cells.tsv" "$RUNNER_TEMP/p01/producer.json"
      - name: Focused consumer paths (mock transports only)
        id: focused
        timeout-minutes: 45
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          set -euo pipefail
          homes=(
            tests/test_subscription_main_wait.py tests/test_provider_wall_rail_contract.py
