            tests/test_claudexor_model_transport.py tests/test_llm_claudexor.py tests/test_provider_failure_reporting.py
            tests/test_safety_rate_limit.py tests/test_safety_second_check.py tests/test_benchmark_provenance_v6810.py
            tests/test_output_exhaustion.py tests/test_completion_selection.py tests/test_commit_review_processing.py
            tests/test_finalize_marker_nudge.py
            tests/test_delivery_forced_finalization.py tests/test_helper_owner_words_flow.py tests/test_working_checkpoint.py tests/test_wrapup_real_send_parity.py
            tests/test_stream_timeout_recovery.py tests/test_unknown_fallback_first.py tests/test_transport_repeat_owner_stop.py
            tests/test_transport_unknown_continuation.py tests/test_local_context_evidence.py
            tests/test_local_input_measurement.py tests/test_model_concurrency.py tests/test_local_gigachat_send_deadlines.py
            tests/test_capability_probe_accounting_v664.py
            tests/test_context_minimum_view_unfit.py tests/test_required_development_book.py
            tests/test_model_substitution_rail.py tests/test_rail_cause_coverage.py tests/test_send_clock.py
            tests/test_processing_claudexor.py tests/test_transport_death_retry.py tests/test_provider_terminal_notice.py
            tests/test_openai_responses.py tests/test_transport_b_stream_deadlines.py tests/test_record_contract.py
            tests/test_monitoring_examples.py tests/test_finish_reason_facts.py tests/test_llm_provider_golden.py
            tests/test_live_fit_refused.py tests/test_live_contracts.py tests/test_live_host_fit_evidence.py
            tests/test_live_preparation_fit_refusal.py tests/test_live_serving_capacity.py
            tests/test_forced_model_binding.py tests/test_route_switch_facts.py tests/test_abandoned_model_operation.py
            tests/test_openai_chat_dispatch.py tests/test_transcript_provider_shapes.py
            tests/test_observability_outcomes_v2.py tests/test_usage_response_contracts.py
            tests/test_context_physical_exposure.py tests/test_message_cache_boundary.py
