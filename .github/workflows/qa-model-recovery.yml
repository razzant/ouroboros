      - name: Same local-cap test on the public base, with explicit choices as controls
        id: base_control
        timeout-minutes: 20
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          set -euo pipefail
          runner_py=$(python -c 'import sys; print(sys.executable)')
          [[ "$runner_py" == /* && -x "$runner_py" ]]
          git worktree add --detach "$RUNNER_TEMP/p01-base" "$BASE"
          cd "$RUNNER_TEMP/p01-base"
          test "$(git rev-parse HEAD)" = "$BASE"
          cp "$GITHUB_WORKSPACE/tests/test_model_concurrency.py" tests/test_model_concurrency.py
          node=test_a_saved_shipped_three_reads_blank_once_and_the_next_save_ends_it
