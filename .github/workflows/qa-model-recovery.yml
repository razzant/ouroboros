            -o addopts= -q --tb=short "tests/test_model_concurrency.py::$node" --junitxml="$RUNNER_TEMP/base.xml" || rc=$?
          test "$rc" = 1
          "$runner_py" - "$RUNNER_TEMP/base.xml" "$node" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse(sys.argv[1]).iter('testcase'))
