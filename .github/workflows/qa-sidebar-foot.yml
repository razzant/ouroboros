name: Sidebar foot qualification
'on':
  push:
    branches: [qa/sidebar-foot-v1]

permissions:
  contents: read

jobs:
  sidebar-foot:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: '5af288030309005328cf9f385758f76cbea25bde'
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          interpreter: shipped
          install-project: 'false'

      - name: Prove the exact product tree
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          printf 'Product commit: %s\nProduct tree: %s\n' "$commit" "$tree"
          test "$commit" = '5af288030309005328cf9f385758f76cbea25bde'
          test "$tree" = '10acff93be0580cae408a7fab86b23795b5fbe5b'
          git diff --quiet
          git diff --cached --quiet
          test ! -e .github/workflows/qa-sidebar-foot.yml

      - name: Install the pinned Node, Chromium and WebKit
        timeout-minutes: 70
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
        run: python -I -S scripts/ci_browser_install.py --pinned-node chromium webkit

      - name: Verify the sidebar widths and its low-window scrolling
        timeout-minutes: 10
        env:
          OUROBOROS_RUN_UI_SMOKE: '1'
          OUROBOROS_EXPECT_BROWSER_ENGINES: chromium,webkit
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
          PLAYWRIGHT_NODEJS_PATH: ${{ github.workspace }}/node-standalone/bin/node
        run: |
          set -euo pipefail
          node=tests/test_sidebar_short_window_browser.py
          test_wheel="$node"::test_a_column_too_short_for_both_bars_scrolls_them_with_the_list
          result=0
          for cohort in first confirm; do
            if [ "$cohort" = first ]; then
              set -- "$node"::test_the_two_cards_keep_every_name_whole_and_turn_wide_at_475 "$test_wheel"
              count=10
            else
              set -- "$test_wheel"
              count=6
            fi
            junit="$RUNNER_TEMP/sidebar-wheel-$cohort.xml"
            if python -I -S scripts/safe_test.py --evidence-dir "$RUNNER_TEMP/sidebar-wheel-$cohort" \
                -- python -m pytest -o addopts= -q --tb=short -m ui_browser --junitxml="$junit" "$@"; then
              python - "$junit" "$count" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          cases=list(ET.parse(sys.argv[1]).getroot().iter('testcase'))
          assert len(cases)==int(sys.argv[2]),len(cases)
          assert not any(c.find(tag) is not None for c in cases for tag in ('skipped','failure','error'))
          for engine in ('chromium','webkit'):
              assert any(f'{engine}-landscape-phone' in c.get('name','') for c in cases), engine
          print(f'{len(cases)} cases without skips; both engines covered 844x390.')
          PY
            else
              result=1
            fi
          done
          exit "$result"
