# QA-ONLY replacement of ci.yml for ONE temporary verification branch W. NOT a product
# workflow: never merge it into ouroboros/main. A manual dispatch on W runs the final Node
# security qualification of an exact product commit C against base B.
#
#   W  the commit holding this file (github.sha): only the workflow.
#   C  candidate_sha: the product commit checked out and tested; its own .github/actions run.
#   B  base_sha: the base passed to `scripts/run_tests.py --selected --base`.
#
# One manual Linux job: no tag/push/schedule trigger, no provider, build, release, browser opt-in or
# second battery; no repository secret. The battery step runs the literal CLI once, with no retry:
#   .venv/bin/python scripts/run_tests.py --selected --base B --full-tests \
#     --test-reason 'Final Node security qualification' --keep-going --evidence-dir <QA>/battery/selected
# and exits with that CLI's exit. A later, separately named step checks the evidence records (the final
# selection.json with both passes' inventories, safe_test's result, raw streams and source record, B as an
# ancestor of C, the tracked state of C after setup, before the CLI and after it) and can turn the job red by
# itself (RED, or INCOMPLETE when needed diagnostics stay outside the artifact); nothing turns a red CLI green.
# The default suite excludes the opt-in lanes (integration, browser, ui_browser, ui_browser_docker,
# portable_detail, skill_smoke, size_ratchet); this run covers none of them.
#
# The artifact holds what the run_logged phases and the record steps wrote. The output of the checkout
# and of C's setup-python-env composite (uv sync, lock export check) stays in GitHub's run log only,
# and the upload's own outcome only on the run page.
#
# Time: GitHub-hosted jobs stop at 360 minutes (GitHub's ceiling, not a qualification budget). The
# battery step gets 330 of them so the evidence steps still run; a battery that needs longer on one
# ubuntu-latest runner ends RED/incomplete with partial evidence, never green.
#
# A second, separate job, windows-npm-route-witness at the end of this file, runs only the native Windows npm
# route witness on the same C and B; it shares nothing else with the Linux job and is described where defined.

name: CI

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'C: exact 40-hex product commit to test (must be fetchable from this repository)'
        required: true
        type: string
      base_sha:
        description: 'B: exact 40-hex base commit for run_tests.py --selected --base'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: node-qa-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  # Qualification facts, not inputs: C must pin exactly this Node and its Brotli must be at least this.
  EXPECTED_NODE: '24.22.3'
  MIN_BROTLI: '1.2.1'

jobs:
  node-security-qualification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      # As in ci.yml's test jobs: this job provisions the plugins and a Node, so the gate's
      # real-spawn tests must run instead of skipping.
      OUROBOROS_PREFLIGHT_REQUIRE_PLUGINS: "1"
      OUROBOROS_PREFLIGHT_REQUIRE_NODE: "1"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      # scripts/safe_test.py's temp parent on Linux (ouroboros/test_environment.default_temp_parent).
      SAFE_TEST_TEMP_PARENT: /tmp
    steps:
      # Before checkout: the evidence root exists even when an input is rejected.
      - name: Bind W, C and B
        id: bind
        run: |
          QA="$RUNNER_TEMP/qa-evidence"
          mkdir -p "$QA/binding" "$QA/source" "$QA/runtime" "$QA/phases" "$QA/battery" "$QA/teardown"
          echo "QA=$QA" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/qa-lib.sh" <<'LIB'
          # run_logged PREFIX CMD...: CMD's stdout/stderr go to the log AND, in full, to PREFIX.stdout.log /
          # PREFIX.stderr.log; argv, start, end and exit are recorded. Returns CMD's exit (125: capture could
          # not start, CMD not run). A record it cannot write is named in PREFIX.capture-problems or the log.
          run_logged() {
            local prefix=$1; shift
            local pipes rc=0 t_out t_err
            printf '%q ' "$@" > "$prefix.argv.txt" && echo >> "$prefix.argv.txt" || qa_note "$prefix" "argv not recorded"
            pipes=$(mktemp -d "$RUNNER_TEMP/qa-pipes.XXXXXX") || { qa_note "$prefix" "no capture directory"; return 125; }
            mkfifo "$pipes/out" "$pipes/err" || { qa_note "$prefix" "no capture pipes"; return 125; }
            date -u +%Y-%m-%dT%H:%M:%SZ > "$prefix.started" || qa_note "$prefix" "start not recorded"
            tee "$prefix.stdout.log" < "$pipes/out" & t_out=$!
            tee "$prefix.stderr.log" < "$pipes/err" >&2 & t_err=$!
            "$@" > "$pipes/out" 2> "$pipes/err" || rc=$?
            wait "$t_out" || qa_note "$prefix" "stdout capture exited $?"
            wait "$t_err" || qa_note "$prefix" "stderr capture exited $?"
            echo "$rc" > "$prefix.exit" || qa_note "$prefix" "exit $rc not recorded"
            date -u +%Y-%m-%dT%H:%M:%SZ > "$prefix.ended" || qa_note "$prefix" "end not recorded"
            rm -rf "$pipes" || qa_note "$prefix" "capture pipes not removed"
            return "$rc"
          }
          qa_note() { echo "$2" >> "$1.capture-problems" || echo "::error title=Evidence not recorded::$1: $2" >&2; }
          # qa_source_is_c FILE: records HEAD and `git status` (ignored files excluded) in FILE; fails unless HEAD is C
          # and the index and worktree hold C exactly: no tracked change, no non-ignored untracked file. Resets nothing.
          qa_source_is_c() {
            { echo "HEAD $(git rev-parse HEAD)"; git status --porcelain=v1 --untracked-files=all; } > "$1" \
              || { echo "::error title=Source state unknown::$1 not recorded"; return 1; }
            if [[ "$(head -n 1 "$1")" != "HEAD $CANDIDATE_SHA" || $(wc -l < "$1") -ne 1 ]]; then
              echo "::error title=Source drift::the checkout no longer holds exactly C; see $1"; cat "$1"; return 1
            fi
          }
          sha256() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          LIB
          python3 -I - "$QA/binding/binding.json" <<'PY'
          import json, os, sys, time
          keys = ("GITHUB_REPOSITORY", "GITHUB_SHA", "GITHUB_REF", "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA",
                  "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_ACTOR", "RUNNER_OS", "RUNNER_ARCH", "ImageOS",
                  "ImageVersion", "EXPECTED_NODE", "MIN_BROTLI")
          record = {key: os.environ.get(key, "") for key in keys}
          record.update({"workflow_commit_W": os.environ.get("GITHUB_SHA", ""),
                         "tested_product_commit_C": os.environ.get("CANDIDATE_SHA", ""),
                         "base_B": os.environ.get("BASE_SHA", ""),
                         "note": "W holds only this QA workflow; C is the product under test.",
                         "bound_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())})
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(record, stream, indent=2)
              stream.write("\n")
          PY
          for name in CANDIDATE_SHA BASE_SHA; do
            value=${!name}
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=Invalid input::$name must be exactly 40 lowercase hex characters"
              echo "rejected: $name is not a 40-hex SHA" >> "$QA/binding/rejected.txt"
              exit 2
            fi
          done
          if [[ "$CANDIDATE_SHA" == "$GITHUB_SHA" ]]; then
            echo "::warning title=W equals C::the tested commit is the workflow commit itself"
          fi
          echo "W (workflow) $GITHUB_SHA; C (tested) $CANDIDATE_SHA; B (base) $BASE_SHA"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0  # B and the selection's diff need the history
          persist-credentials: false

      - name: Prove the checkout is C and record its source
        id: source
        run: |
          source "$RUNNER_TEMP/qa-lib.sh"
          S="$QA/source"
          head=$(git rev-parse HEAD)
          echo "$head" > "$S/head.txt"
          if [[ "$head" != "$CANDIDATE_SHA" ]]; then
            echo "::error title=Wrong checkout::HEAD is $head, not C $CANDIDATE_SHA"; exit 1
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::error title=Base missing::B $BASE_SHA is not in the fetched history"; exit 1
          fi
          git rev-parse "HEAD^{tree}" > "$S/tree.txt"
          git log -1 --format=fuller HEAD > "$S/commit-C.txt"
          git log -1 --format=fuller "$BASE_SHA" > "$S/commit-B.txt"
          git merge-base "$BASE_SHA" HEAD > "$S/merge-base.txt" || echo "none" > "$S/merge-base.txt"
          if git merge-base --is-ancestor "$BASE_SHA" HEAD; then echo yes > "$S/base-is-ancestor.txt"
          else echo no > "$S/base-is-ancestor.txt"; echo "::error title=B not an ancestor::B $BASE_SHA is not an ancestor of C"; exit 1; fi
          git diff --name-status "$BASE_SHA" HEAD > "$S/changed-B-to-C.txt"
          git status --porcelain=v1 --untracked-files=all > "$S/status-before.txt"
          if [[ -s "$S/status-before.txt" ]]; then echo "::warning title=Dirty checkout::see source/status-before.txt"; fi
          sha256 ouroboros/claudexor_runtime_pin.json uv.lock requirements-runtime.lock pyproject.toml \
            scripts/run_tests.py scripts/safe_test.py scripts/download_node_standalone.py \
            .github/actions/setup-python-env/action.yml > "$S/sha256.txt"
          python3 -I - ouroboros/claudexor_runtime_pin.json "$S/node-pin.json" <<'PY'
          import json, os, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))["release"]
          pinned = release["node_version"]
          record = {"node_version": pinned, "linux-x64": release["node_artifacts"].get("linux-x64")}
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              json.dump(record, stream, indent=2)
              stream.write("\n")
          if pinned != os.environ["EXPECTED_NODE"]:
              print(f"::error title=Unexpected Node pin::C pins Node {pinned}, not {os.environ['EXPECTED_NODE']}")
              sys.exit(1)
          PY

      # C's own action: shipped python-build-standalone, uv 0.12.1, `uv sync --locked` of the browser
      # extra and dev group WITHOUT installing the project, then the runtime lock export comparison.
      # Its output is in the run log only; the next step records the resulting environment.
      - uses: ./.github/actions/setup-python-env
        id: setup_python
        with:
          interpreter: shipped
          install-project: 'false'

      - name: Record the locked non-editable Python
        id: python_runtime
        run: |
          source "$RUNNER_TEMP/qa-lib.sh"
          qa_source_is_c "$QA/source/state-after-setup.txt"
          R="$QA/runtime"
          PY=.venv/bin/python
          test -x "$PY"
          {
            echo "lexical: $PY"
            echo "resolved: $(readlink -f "$PY")"
            echo "OUROBOROS_CI_INTERPRETER: ${OUROBOROS_CI_INTERPRETER:-}"
            "$PY" -c 'import sqlite3, sys; print("python", sys.version.replace("\n", " ")); print("sqlite", sqlite3.sqlite_version)'
            uv --version
          } > "$R/python.txt"
          sha256 "$(readlink -f "$PY")" > "$R/python-binary.sha256"
          uv pip freeze --python "$PY" > "$R/pip-freeze.txt"
          if grep -E '^-e |ouroboros @ file:' "$R/pip-freeze.txt"; then
            echo "::error title=Project installed::the environment installs the checkout; expected locked dependencies only"; exit 1
          fi
          # Under -I the working directory is not importable: only an installed project would be found.
          if ! "$PY" -I -c 'import importlib.util, sys; sys.exit(importlib.util.find_spec("ouroboros") is not None)'; then
            echo "::error title=Project installed::ouroboros is importable outside the checkout"; exit 1
          fi
          cat "$R/python.txt"

      - name: Prepare and assert the candidate's pinned Node
        id: node
        run: |
          source "$RUNNER_TEMP/qa-lib.sh"
          R="$QA/runtime"
          NODE_ROOT="$RUNNER_TEMP/node-standalone"
          NODE="$NODE_ROOT/bin/node"
          # C's script: pinned URL, exact size and SHA-256 before anything runs, then `node --version`.
          run_logged "$QA/phases/node-prepare" .venv/bin/python scripts/download_node_standalone.py --destination "$NODE_ROOT"
          test -x "$NODE"
          sha256 "$NODE" > "$R/node-binary.sha256"
          env -u NODE_OPTIONS "$NODE" -p 'JSON.stringify({execPath: process.execPath, platform: process.platform, arch: process.arch, release: process.release, versions: process.versions}, null, 2)' > "$R/node-process.json"
          actual=$(env -u NODE_OPTIONS "$NODE" -p 'process.versions.node')
          brotli=$(env -u NODE_OPTIONS "$NODE" -p 'process.versions.brotli')
          echo "node $actual, brotli $brotli ($NODE)" | tee "$R/node.txt"
          python3 -I - "$QA/phases/node-prepare.stdout.log" "$R/node-binary.sha256" "$QA/source/node-pin.json" "$actual" "$brotli" <<'PY'
          import json, os, re, sys
          log, binary, pin, actual, brotli = sys.argv[1:6]
          def version(text):
              parts = re.findall(r"\d+", text)[:3]
              if len(parts) < 3:
                  raise SystemExit(f"::error title=Unparseable version::{text!r}")
              return tuple(int(part) for part in parts)
          problems = []
          if actual != os.environ["EXPECTED_NODE"]:
              problems.append(f"the prepared binary runs Node {actual}, not {os.environ['EXPECTED_NODE']}")
          if version(brotli) < version(os.environ["MIN_BROTLI"]):
              problems.append(f"Brotli {brotli} is older than {os.environ['MIN_BROTLI']}")
          lines = [line for line in open(log, encoding="utf-8").read().splitlines() if line.strip()]
          report = json.loads(lines[-1]) if lines else {}
          measured = open(binary, encoding="utf-8").read().split()[0]
          if report.get("binary_sha256") != measured:
              problems.append(f"binary hash {measured} differs from the script's report {report.get('binary_sha256')}")
          expected_archive = (json.load(open(pin, encoding="utf-8")).get("linux-x64") or {}).get("sha256")
          if report.get("archive_sha256") != expected_archive:
              problems.append(f"archive {report.get('archive_sha256')} is not the pin's {expected_archive}")
          for problem in problems:
              print(f"::error title=Node qualification::{problem}")
          sys.exit(1 if problems else 0)
          PY
          echo "$NODE_ROOT/bin" >> "$GITHUB_PATH"  # first on PATH for every later step

      # The last step before the CLI: it also proves the checkout still holds exactly C.
      - name: Prove PATH selects the prepared Node and the source is still C
        id: path_node
        if: steps.node.outcome == 'success'
        run: |
          source "$RUNNER_TEMP/qa-lib.sh"
          qa_source_is_c "$QA/source/state-before-cli.txt"
          mkdir -p "$QA/battery/selected" "$QA/battery/safe-test"
          found=$(command -v node) || found=""
          version=$(node -p process.versions.node 2>&1) || version="node -p failed: $version"
          echo "node on PATH: ${found:-none} ($version)" | tee "$QA/runtime/path-node.txt"
          if [[ "$found" != "$RUNNER_TEMP/node-standalone/bin/node" ]]; then
            echo "::error title=Node selection::PATH resolves node to $found, not the prepared binary"; exit 1
          fi

      # The literal CLI, once; this step's exit is its exit. OUROBOROS_TEST_EVIDENCE_ROOT is safe_test's
      # documented output-location key: it only moves the run-* evidence directory into this job's tree.
      - name: Run the complete battery (literal run_tests.py CLI)
        id: battery
        if: steps.path_node.outcome == 'success'
        timeout-minutes: 330
        env:
          OUROBOROS_TEST_EVIDENCE_ROOT: ${{ runner.temp }}/qa-evidence/battery/safe-test
        run: |
          source "$RUNNER_TEMP/qa-lib.sh"
          run_logged "$QA/battery/cli" .venv/bin/python scripts/run_tests.py --selected --base "$BASE_SHA" --full-tests --test-reason 'Final Node security qualification' --keep-going --evidence-dir "$QA/battery/selected"

      # Diagnostics: a failed command is named in teardown/problems.txt; a record that cannot be
      # written fails this step.
      - name: Record teardown state
        id: teardown
        if: always()
        run: |
          T="$QA/teardown"
          mkdir -p "$T"
          note() { echo "$*" >> "$T/problems.txt"; }
          date -u +%Y-%m-%dT%H:%M:%SZ > "$T/at.txt"
          git rev-parse HEAD > "$T/head-after.txt" || note "git rev-parse HEAD exited $?"
          git status --porcelain=v1 --untracked-files=all > "$T/status-after.txt" || note "git status exited $?"
          ps -eo pid,ppid,pgid,etime,stat,args > "$T/processes.txt" 2>&1 || note "ps exited $?"
          df -h > "$T/disk.txt" 2>&1 || note "df exited $?"
          if command -v free >/dev/null; then free -m > "$T/memory.txt" 2>&1 || note "free exited $?"; else note "free not available"; fi
          : > "$T/retained-scratch.txt"
          for root in "$SAFE_TEST_TEMP_PARENT"/ob-*.noindex; do
            [[ -e "$root" ]] || continue
            size=$(du -sk "$root" | cut -f1) || size="unknown"
            { echo "== $root ${size:-unknown} KiB"; cat "$root/OUROBOROS_RETAINED.txt" 2>/dev/null || echo "(no readable retention marker)"; } >> "$T/retained-scratch.txt"
          done
          if [[ -s "$T/status-after.txt" ]]; then echo "::warning title=Checkout changed::see teardown/status-after.txt"; fi

      # A record that is missing, partial or unreadable counts against green; so does safe_test's own
      # result (launch, containment, evidence or source gaps), which it reports beside the command's exit.
      # GREEN needs no problem and nothing incomplete; INCOMPLETE (red too) only names what is missing.
      - name: Check the evidence and write the verdict
        id: verdict
        if: always()
        env:
          OUTCOMES: >-
            bind=${{ steps.bind.outcome }} source=${{ steps.source.outcome }}
            setup_python=${{ steps.setup_python.outcome }} python_runtime=${{ steps.python_runtime.outcome }}
            node=${{ steps.node.outcome }} path_node=${{ steps.path_node.outcome }}
            battery=${{ steps.battery.outcome }} teardown=${{ steps.teardown.outcome }}
        run: |
          if [[ -d "$QA/battery/selected" && -f tests/ci_evidence.py ]]; then
            dirs=()
            for pass in "$QA"/battery/selected/*/; do
              if [[ -d "$pass" ]]; then dirs+=(--evidence-dir "$pass"); fi
            done
            if (( ${#dirs[@]} )); then
              python3 -I -S tests/ci_evidence.py annotate "${dirs[@]}" --limit 10 || true  # names failed tests; decides nothing
            fi
          fi
          python3 -I - "$QA" <<'PY'
          import hashlib, json, os, pathlib, re, shlex, sys
          from collections import Counter
          qa_text = sys.argv[1]
          qa = pathlib.Path(qa_text)
          outcomes = dict(pair.split("=", 1) for pair in os.environ["OUTCOMES"].split())
          candidate, base = os.environ.get("CANDIDATE_SHA", ""), os.environ.get("BASE_SHA", "")
          # problems: RED. incomplete: nothing failed, but material the qualification needs is not in this artifact.
          problems, incomplete, warnings, evidence = [], [], [], {}
          EMPTY_SHA256 = hashlib.sha256(b"").hexdigest()

          def strings(value):
              return isinstance(value, list) and all(isinstance(item, str) for item in value)

          def integer(value):
              return isinstance(value, int) and not isinstance(value, bool)

          def same(value, want):
              """Equal and of the same JSON type: 1 is not True, False is not 0."""
              return type(value) is type(want) and value == want

          def digest(path):
              value = hashlib.sha256()
              with open(path, "rb") as stream:
                  for block in iter(lambda: stream.read(1 << 20), b""):
                      value.update(block)
              return value.hexdigest()

          def load(path):
              try:
                  return json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None

          def regular(path):
              try:
                  return pathlib.Path(path).is_file() and not pathlib.Path(path).is_symlink()
              except OSError:
                  return False

          def state(rel):
              path = qa / rel
              try:
                  size = path.stat().st_size
              except FileNotFoundError:
                  return "missing"
              except OSError as exc:
                  return f"unreadable ({exc.strerror})"
              if not path.is_file():
                  return "not a regular file"
              return "present" if size else "empty"

          def read(rel):
              try:
                  return (qa / rel).read_text(encoding="utf-8")
              except (OSError, ValueError):
                  return None

          def raw_inventory(label):
              """(result, problem) of a pass's inventory JSONL as C's ouroboros/preflight_inventory.read_inventory
              computes them (its contract mirrored, the module is not imported): what selection.json must hold."""
              rel = f"battery/selected/inventory-{label}.jsonl"
              try:
                  rows = [json.loads(line) for line in (qa / rel).read_text(encoding="utf-8").splitlines()]
                  collections = [row["ids"] for row in rows if row["event"] == "collection"]
                  reports = [row for row in rows if row["event"] == "report"]
                  result = {"expected": collections[0] if collections else [],
                            "executed": [r["nodeid"] for r in reports if r["when"] == "teardown"],
                            "skipped": [r["nodeid"] for r in reports if r["outcome"] == "skipped"],
                            "failed": [r["nodeid"] for r in reports if r["outcome"] == "failed"],
                            "exitcode": rows[-1].get("exitcode") if rows else None}
                  if not all(strings(result[key]) for key in ("expected", "executed", "skipped", "failed")):
                      raise ValueError("invalid node inventory")
              except (OSError, ValueError, KeyError, TypeError, AttributeError) as exc:
                  return None, f"{rel}: test inventory unavailable: {exc}"
              expected = result["expected"]
              if any(collection != expected for collection in collections):
                  return result, f"{rel}: worker collections disagree"
              if len(set(expected)) != len(expected) or Counter(result["executed"]) != Counter(expected):
                  return result, f"{rel}: expected and executed test ids differ (missing or duplicate execution)"
              if result["exitcode"] not in (0, 5) or result["failed"]:
                  return result, f"{rel}: test session did not finish green"
              return result, ""

          def selection_problems(record):
              """The final record scripts/run_tests.py --selected writes: TestSelection.record() plus inventory,
              outcomes, node and outcome. Each pass's inventory is read_inventory's; it is recounted from its JSONL
              and matched with the pass's tests/ci_evidence.py results.json."""
              found = []
              for key, want in (("tier", "full"), ("base", base), ("full_tests", True), ("node", "success"),
                                ("outcome", "success"), ("outcomes", {"parallel": "success", "serial": "success"})):
                  if not same(record.get(key, "<absent>"), want):
                      found.append(f"selection {key} is {record.get(key, '<absent>')!r}, not {want!r}")
              if record.get("deferred_full", False) is not False:
                  found.append("selection deferred the full scope")
              inventory = record.get("inventory")
              if not isinstance(inventory, dict) or set(inventory) != {"parallel", "serial"}:
                  names = sorted(inventory) if isinstance(inventory, dict) else inventory
                  return found + [f"selection inventory names {names!r}, not the passes parallel and serial"]
              total = 0
              for label in ("parallel", "serial"):
                  row = inventory[label]
                  if not (isinstance(row, dict) and integer(row.get("exitcode"))
                          and all(strings(row.get(key)) for key in ("expected", "executed", "skipped", "failed"))):
                      found.append(f"selection inventory {label}: missing or malformed fields")
                      continue
                  expected, executed, code_ = row["expected"], row["executed"], row["exitcode"]
                  total += len(expected)
                  if len(set(expected)) != len(expected) or sorted(executed) != sorted(expected):
                      found.append(f"inventory {label}: {len(expected)} expected, {len(executed)} executed, "
                                   "not every expected test exactly once")
                  if row["failed"] or code_ not in (0, 5):
                      found.append(f"inventory {label}: session exit {code_}, {len(row['failed'])} failed")
                  raw, raw_problem = raw_inventory(label)
                  if raw_problem:
                      found.append(raw_problem)
                  differ = [key for key in ("expected", "executed", "skipped", "failed", "exitcode")
                            if raw is not None and not same(raw[key], row[key])]
                  if differ:
                      found.append(f"inventory {label}: selection.json's {differ} are not what "
                                   f"battery/selected/inventory-{label}.jsonl records")
                  results = load(qa / f"battery/selected/{label}/results.json")
                  if not isinstance(results, dict) or not same(results.get("session_exit_code"), code_):
                      found.append(f"battery/selected/{label}/results.json missing, partial or not session exit {code_}")
              if not total:
                  found.append("selection inventory: neither pass expected a test")
              return found

          for step, outcome in outcomes.items():
              if outcome != "success":
                  problems.append(f"step {step}: {outcome or 'unknown'}")
          # What each step writes when it succeeds (True: may be empty).
          required = [("bind", "binding/binding.json", False)]
          required += [("source", f"source/{name}", False) for name in (
              "head.txt", "tree.txt", "commit-C.txt", "commit-B.txt", "merge-base.txt", "base-is-ancestor.txt",
              "sha256.txt", "node-pin.json")]
          required += [("source", "source/changed-B-to-C.txt", True), ("source", "source/status-before.txt", True)]
          required += [("python_runtime", f"runtime/{name}", False) for name in ("python.txt", "python-binary.sha256", "pip-freeze.txt")]
          required += [("python_runtime", "source/state-after-setup.txt", False), ("path_node", "source/state-before-cli.txt", False)]
          required += [("node", f"phases/node-prepare.{name}", False) for name in ("argv.txt", "started", "exit", "ended", "stdout.log")]
          required += [("node", "phases/node-prepare.stderr.log", True)]
          required += [("node", f"runtime/{name}", False) for name in ("node-binary.sha256", "node-process.json", "node.txt")]
          required += [("path_node", "runtime/path-node.txt", False)]
          required += [("battery", f"battery/cli.{name}", False) for name in ("argv.txt", "started", "exit", "ended", "stdout.log", "stderr.log")]
          required += [("battery", "battery/selected/selection.json", False)]
          required += [("teardown", f"teardown/{name}", False) for name in ("at.txt", "head-after.txt", "processes.txt", "disk.txt")]
          required += [("teardown", "teardown/status-after.txt", True), ("teardown", "teardown/retained-scratch.txt", True)]
          for step, rel, may_be_empty in required:
              evidence[rel] = found = state(rel)
              if outcomes.get(step) == "success" and found != "present" and not (may_be_empty and found == "empty"):
                  problems.append(f"{rel}: {found} although step {step} succeeded")
          for rel in ("phases/node-prepare.capture-problems", "battery/cli.capture-problems"):
              if state(rel) != "missing":
                  problems.append(f"{rel}: {(read(rel) or 'unreadable').strip()}")

          try:
              binding = json.loads(read("binding/binding.json") or "")
          except ValueError:
              binding = None
          if not isinstance(binding, dict):
              problems.append("binding/binding.json missing, partial or unreadable")
              binding = {}
          elif (binding.get("tested_product_commit_C"), binding.get("base_B")) != (candidate, base):
              problems.append("binding/binding.json does not name this run's C and B")
          head = (read("source/head.txt") or "").strip()
          if head and head != candidate:
              problems.append(f"source/head.txt names {head}, not C")
          ancestry = [(read(f"source/{name}") or "").strip() for name in ("base-is-ancestor.txt", "merge-base.txt")]
          if any(ancestry) and ancestry != ["yes", base]:
              problems.append(f"source: B is not an ancestor of C (base-is-ancestor {ancestry[0]!r}, merge-base {ancestry[1]!r})")
          for rel in ("source/state-after-setup.txt", "source/state-before-cli.txt"):
              text = read(rel)
              if text is not None and text.splitlines() != [f"HEAD {candidate}"]:
                  problems.append(f"{rel}: the checkout did not hold exactly C: {text.strip()[:500]!r}")
          if outcomes.get("node") == "success" and (read("phases/node-prepare.exit") or "").strip() != "0":
              problems.append("phases/node-prepare.exit does not record 0 although step node succeeded")

          ran = any(state(f"battery/cli.{name}") != "missing" for name in ("argv.txt", "started", "exit", "stdout.log"))
          exit_text = (read("battery/cli.exit") or "").strip()
          code = int(exit_text) if re.fullmatch(r"-?\d+", exit_text) else None
          if not ran:
              run_tests = "not run"
          elif code is None:
              run_tests = "ran; no exit recorded (killed, timed out or record lost)"
              problems.append("battery: " + run_tests)
          else:
              run_tests = f"exit {code}"
              if code:
                  problems.append(f"battery: run_tests.py exit {code}")
          selection, lane, safe, held = {}, [], {"lines": [], "evidence_dir": None, "result": None}, {}
          if ran:
              expected_argv = [".venv/bin/python", "scripts/run_tests.py", "--selected", "--base", base, "--full-tests",
                               "--test-reason", "Final Node security qualification", "--keep-going", "--evidence-dir",
                               f"{qa_text}/battery/selected"]
              try:
                  argv = shlex.split(read("battery/cli.argv.txt") or "")
              except ValueError:
                  argv = None
              if argv != expected_argv:
                  problems.append(f"battery/cli.argv.txt does not record the literal CLI: {argv!r}")
              found = state("battery/selected/selection.json")
              selection = load(qa / "battery/selected/selection.json") if found == "present" else None
              if not isinstance(selection, dict):
                  problems.append("battery/selected/selection.json: " + ("partial or unreadable" if found == "present" else found))
                  selection = {}
              else:
                  problems += selection_problems(selection)
              lane = re.findall(r"^=== node: .*$", read("battery/cli.stdout.log") or "", re.M)
              expected = f"=== node: {os.environ['RUNNER_TEMP']}/node-standalone/bin/node v{os.environ['EXPECTED_NODE']}"
              if expected not in lane or any("not the reviewed Node" in line or "NOT_RUN" in line for line in lane):
                  problems.append(f"Node lane did not announce {expected!r} alone: {lane!r}")
              # safe_test: the outer supervisor's evidence directory is the first SAFE_TEST_EVIDENCE line;
              # its result.json is written twice, the final write adding retention_reason and kept.
              safe["lines"] = re.findall(r"^SAFE_TEST_[A-Z_]+ .*$", read("battery/cli.stderr.log") or "", re.M)
              pointers = [line.split(" ", 1)[1] for line in safe["lines"] if line.startswith("SAFE_TEST_EVIDENCE ")]
              if not pointers:
                  problems.append("safe_test: no SAFE_TEST_EVIDENCE line in battery/cli.stderr.log; its evidence directory is unknown")
              else:
                  run_dir = pathlib.Path(pointers[0])
                  safe["evidence_dir"] = str(run_dir)
                  try:
                      inside = run_dir.resolve().parent == (qa / "battery" / "safe-test").resolve()
                  except OSError:
                      inside = False
                  if not inside:
                      problems.append(f"safe_test evidence {run_dir} is not a folder of battery/safe-test, so it is not uploaded")
                  try:
                      result = json.loads((run_dir / "result.json").read_text(encoding="utf-8"))
                  except FileNotFoundError:
                      result = None
                      problems.append(f"safe_test result.json missing in {run_dir}")
                  except (OSError, ValueError) as exc:
                      result = None
                      problems.append(f"safe_test result.json partial or unreadable: {exc}")
                  if result is not None and not isinstance(result, dict):
                      problems.append("safe_test result.json is not an object")
                  elif isinstance(result, dict):
                      # ouroboros/safe_test_supervisor.py's final write: every field, with its type. Its first write
                      # (cleanup "pending", no retention_reason/kept/containment_tokens) means the final one never landed.
                      final = {"command": list, "returncode": int, "execution": str, "containment_error": str,
                               "launch_error": str, "source_gap": str, "scratch": str, "stopped": str,
                               "interrupt_escalation": str, "evidence_fallback": str, "evidence_error": str,
                               "cleanup": dict, "retention_reason": str, "kept": list, "containment_tokens": list}
                      safe["result"] = {key: result.get(key, "<absent>") for key in final if key != "command"}
                      wrong = [key for key, kind in final.items() if not isinstance(result.get(key), kind)
                               or (kind is int and not integer(result[key])) or (key == "command" and not strings(result[key]))]
                      cleanup = result.get("cleanup") if isinstance(result.get("cleanup"), dict) else {}
                      if wrong or not (strings(cleanup.get("released")) and strings(cleanup.get("retained"))):
                          problems.append(f"safe_test result.json is not the supervisor's final record: absent or mistyped "
                                          f"{wrong}, cleanup {result.get('cleanup', '<absent>')!r}")
                      if result.get("execution") != "executed":
                          problems.append(f"safe_test execution {result.get('execution', '<absent>')!r}")
                      if code is not None and result.get("returncode") != code:
                          problems.append(f"safe_test returncode {result.get('returncode', '<absent>')!r} is not run_tests.py exit {code}")
                      for key in ("launch_error", "containment_error", "evidence_error", "source_gap", "stopped",
                                  "interrupt_escalation", "evidence_fallback"):
                          if result.get(key):
                              problems.append(f"safe_test {key}: {result[key]}")
                      # The command safe_test ran is this CLI: run_tests.py re-executes itself as
                      # [python, -c, bootstrap, <checkout>/scripts/run_tests.py, *its arguments].
                      command = result.get("command") if strings(result.get("command")) else []
                      if len(command) < 4 or not command[3].endswith("/scripts/run_tests.py") or command[4:] != expected_argv[2:]:
                          problems.append(f"safe_test ran {command!r}, not this run_tests.py CLI")
                      # The producer's own record: one command-* folder (FileOutput) with both raw streams (empty
                      # allowed) and its result.json, agreeing with the final record and held in full by the outer capture.
                      folders = sorted(path for path in run_dir.glob("command-*") if path.is_dir()) if inside else []
                      if len(folders) != 1:
                          problems.append(f"safe_test command record: {len(folders)} command-* folders in {run_dir}, not one")
                      else:
                          folder = folders[0]
                          inner = load(folder / "result.json")
                          inner = inner if isinstance(inner, dict) else {}
                          rc = inner.get("returncode")
                          mapped = (rc if rc >= 0 else 128 - rc) if integer(rc) else rc
                          if inner.get("command") != result.get("command") or inner.get("evidence_errors") != [] or any(
                                  inner.get(key) != result.get(key)
                                  for key in ("stopped", "interrupt_escalation", "containment_error", "launch_error")):
                              problems.append(f"{folder.name}/result.json missing, partial or not the final record's command, "
                                              f"errors and evidence_errors []: {inner!r}"[:800])
                          elif not integer(rc):
                              problems.append(f"{folder.name}/result.json returncode {rc!r} is not an integer")
                          elif not result.get("stopped") and mapped != result.get("returncode"):
                              problems.append(f"{folder.name}/result.json returncode {rc!r} does not give safe_test's {result.get('returncode')!r}")
                          for stream in ("stdout", "stderr"):
                              raw = folder / f"{stream}.bin"
                              if not regular(raw):
                                  problems.append(f"safe_test raw stream {folder.name}/{stream}.bin missing or not a regular file")
                                  continue
                              try:
                                  contained = raw.read_bytes() in (qa / f"battery/cli.{stream}.log").read_bytes()
                              except OSError as exc:
                                  contained = False
                                  problems.append(f"safe_test raw {stream} not compared: {exc}")
                              else:
                                  if not contained:
                                      problems.append(f"battery/cli.{stream}.log does not hold {folder.name}/{stream}.bin in full")
                      # Its source record: the tree it ran was C's, with no tracked change, at the CLI's start.
                      record = load(run_dir / "source" / "source.json") if inside else None
                      record = record if isinstance(record, dict) else {}
                      index = record.get("index") if isinstance(record.get("index"), dict) else {}
                      base_tree = record.get("base") if isinstance(record.get("base"), dict) else {}
                      tree = (read("source/tree.txt") or "").strip()
                      seen = (record.get("head"), record.get("source_snapshot"), record.get("diff_sha256"), index.get("tree"),
                              base_tree.get("tree"), record.get("untracked"))
                      if seen != (candidate, "complete", EMPTY_SHA256, tree, tree, []):
                          problems.append(f"safe_test source/source.json does not record exactly C (head, complete snapshot, "
                                          f"empty diff, index and base tree {tree}, no untracked input): {seen!r}")
                      # The bytes it names, with the hash it stored for each (ouroboros/test_evidence.py _source_record):
                      # its index entries, its diff and any pack. A "repository" base names the runner's Git store,
                      # which goes with the runner; its tree is C's own (checked above), so C is that source.
                      named = [(index.get("entries"), index.get("sha256")), ("candidate.diff", record.get("diff_sha256"))]
                      named += [(part.get("path"), part.get("sha256")) for part in (base_tree, index.get("pack"))
                                if isinstance(part, dict) and "path" in part]
                      for name, want in named if record else []:
                          path = run_dir / "source" / name if isinstance(name, str) and name and "/" not in name else None
                          if not (path and regular(path) and isinstance(want, str) and digest(path) == want):
                              problems.append(f"safe_test source record names {name!r} (sha256 {want!r}): missing, "
                                              "not a regular file or not those bytes")
                      # Retention: what safe_test left in its scratch, which is not uploaded: its kept folders, a root its
                      # cleanup still names as retained (with retention_reason, or undeclared command data), or a reason
                      # with no path. Debug retention is ordinary and only listed. Anything else is evidence outside this
                      # artifact: no failure (containment is containment_error's), but not a complete qualification.
                      reason = result.get("retention_reason") if isinstance(result.get("retention_reason"), str) else ""
                      for entry in result.get("kept") if isinstance(result.get("kept"), list) else []:
                          path = entry.get("path") if isinstance(entry, dict) else None
                          reasons = entry.get("reasons") if isinstance(entry, dict) else None
                          if not isinstance(path, str) or not strings(reasons):
                              problems.append(f"safe_test kept entry malformed: {entry!r}")
                              continue
                          held.setdefault(path, []).extend(reasons)
                      for path in cleanup.get("retained") if strings(cleanup.get("retained")) else []:
                          if not any(path == other or other.startswith(path + "/") or path.startswith(other + "/") for other in held):
                              held[path] = [reason] if reason else []
                      if reason and not held:
                          held["(no path recorded)"] = [reason]
                      for path, reasons in held.items():
                          if reasons and all(item == "debug retention" for item in reasons):
                              warnings.append(f"safe_test debug retention (ordinary, listed only): {path}")
                          elif not pathlib.Path(path).is_relative_to(qa):
                              incomplete.append(f"safe_test retained {path} outside the artifact: "
                                                f"{'; '.join(reasons) or 'no reason recorded (undeclared command data)'}")
          # Roots teardown found under the safe_test temp parent; one safe_test already named is not repeated.
          for block in re.split(r"^== ", read("teardown/retained-scratch.txt") or "", flags=re.M)[1:]:
              header, _, marker = block.partition("\n")
              root = header.rsplit(" ", 2)[0]
              first = (marker.strip().splitlines() or [""])[0]
              if first == "debug retention":
                  warnings.append(f"retained scratch root (debug retention, listed only): {root}")
              elif not any(path == root or path.startswith(root + "/") for path in held):
                  incomplete.append(f"scratch root {root} retained outside the artifact: {first}")
          teardown_notes = (read("teardown/problems.txt") or "").strip()
          for line in filter(None, teardown_notes.splitlines()):
              warnings.append(f"teardown diagnostics incomplete: {line}")
          after = (read("teardown/head-after.txt") or "").strip()
          if after and head and after != head:
              problems.append(f"checkout HEAD changed during the run: {after}")
          status_after = read("teardown/status-after.txt")
          if ran and ("git status" in teardown_notes or status_after is None):
              incomplete.append("the checkout's tracked state after the run is unknown (teardown/status-after.txt)")
          elif status_after:
              changed = [line for line in status_after.splitlines() if line and not line.startswith("?? ")]
              new_files = [line for line in status_after.splitlines() if line.startswith("?? ")]
              if changed:
                  problems.append(f"tracked source changed during the run: {changed[:20]}")
              if new_files:
                  warnings.append(f"non-ignored untracked files appeared during the run (tracked source unchanged): {new_files[:20]}")
          if read("source/status-before.txt"):
              warnings.append("checkout was not clean right after checkout (source/status-before.txt); "
                              "the after-setup check decides")

          # Manifest of every file but itself and the verdict; a file that cannot be listed or hashed is named.
          entries, unhashed = [], []
          files = []
          for folder, subfolders, names in os.walk(qa, onerror=lambda exc: unhashed.append(f"{exc.filename}: {exc.strerror}")):
              files += [pathlib.Path(folder, name) for name in names]
          for path in sorted(files):
              rel = path.relative_to(qa).as_posix()
              if rel in ("MANIFEST.sha256", "verdict.json"):
                  continue
              try:
                  entries.append(f"{digest(path)}  ./{rel}")
              except OSError as exc:
                  unhashed.append(f"./{rel}: {exc.strerror or exc}")
          for item in unhashed:
              problems.append(f"manifest: not hashed {item}")

          verdict = {
              "verdict": "RED" if problems else "INCOMPLETE" if incomplete else "GREEN",
              "workflow_commit_W": binding.get("workflow_commit_W"),
              "tested_product_commit_C": binding.get("tested_product_commit_C"),
              "base_B": binding.get("base_B"),
              "steps": outcomes, "run_tests": run_tests,
              "selection": {**{key: selection.get(key) for key in ("tier", "outcome", "outcomes", "node", "base", "full_tests",
                                                                   "deferred_full", "rule")},
                            "tests": {label: {key: len(row.get(key) or []) if isinstance(row, dict) else None
                                              for key in ("expected", "executed", "skipped", "failed")}
                                      for label, row in (selection.get("inventory") or {}).items()}
                                     if isinstance(selection.get("inventory"), dict) else None},
              "node_lane": lane, "safe_test": safe, "evidence": evidence,
              "problems": problems, "incomplete": incomplete, "warnings": warnings,
              "not_in_this_artifact": ["output of the checkout and of setup-python-env (uv sync, lock export check): GitHub run log",
                                       "outcome of the evidence upload and the job conclusion: GitHub run page",
                                       "retained safe_test scratch: listed (teardown/retained-scratch.txt, safe_test kept), "
                                       "not archived; anything but debug retention makes the verdict INCOMPLETE"],
              "scope": "default suite only; opt-in lanes not run; one ubuntu-latest runner; not a release or installer check",
          }
          (qa / "verdict.json").write_text(json.dumps(verdict, indent=2) + "\n", encoding="utf-8")
          entries.append(f"{digest(qa / 'verdict.json')}  ./verdict.json")
          lines = entries + [f"# NOT HASHED {item}" for item in unhashed]
          (qa / "MANIFEST.sha256").write_text("\n".join(lines) + "\n", encoding="utf-8")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write(f"## Node security qualification: {verdict['verdict']}\n\n"
                               f"- W (workflow commit): `{verdict['workflow_commit_W']}`\n"
                               f"- C (tested product): `{verdict['tested_product_commit_C']}`\n"
                               f"- B (base): `{verdict['base_B']}`\n- run_tests.py: {run_tests}\n")
                  for problem in problems:
                      stream.write(f"- problem: {problem}\n")
                  for item in incomplete:
                      stream.write(f"- incomplete: {item}\n")
                  for warning in warnings:
                      stream.write(f"- warning: {warning}\n")
          print(json.dumps(verdict, indent=2))
          sys.exit(0 if verdict["verdict"] == "GREEN" else 1)
          PY

      # Logs and proofs only: no checkout, venv, Python or Node trees, no credentials.
      - name: Upload the evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-qa-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # QA-ONLY second job, independent of the Linux job above: no `needs`, its own runner and artifact; the same
  # dispatch inputs C and B. It runs one portable witness, npm_route_witness.py (sha256 in WITNESS_SHA256,
  # embedded below and checked before use; it is not a file of C, so W still differs from C only in this
  # workflow): which Node runs the npm that the skill installer starts. It imports the product unmodified from a
  # tree and drives isolated_deps._install_node_package/_install_actions with offline local tarballs, the
  # official npm.cmd of an old Node install and the local node_modules\.bin\npm.cmd, on real native Windows.
  #   B  base_sha as a detached worktree: every case must record an observation (exit 0), defects included;
  #   C  this checkout, with --require candidate: every observation must match the corrected candidate.
  # Node archives: the win32-x64 entries of C's pin (new, EXPECTED_NODE) and of B's pin (old, OLD_NODE), fetched
  # from the URLs in those pins and checked against the pin's archive name, size and sha256 (fetch and run).
  # Each tree runs in one scripts/safe_test.py command of C. Its step exits with safe_test's exit; the full
  # stdout/stderr, the exit, the report JSON and safe_test's evidence are uploaded even on failure.
  # Recorded, not hidden: npm refuses the product's `npm rebuild` of a file: spec. C passes that row only when the
  # product's rebuild is exactly npm's retained SemVer refusal (product_rebuild: known_refusal) or succeeded; any
  # other rebuild error is red. The separate replay with a SemVer spec proves the route, not a product rebuild.
  # Pinned and no-pin cases stay separate rows. Not covered: the product's Windows battery, npx, global-prefix npm.
  windows-npm-route-witness:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      # The host's own older Node: B's pin must name exactly this version.
      OLD_NODE: '24.16.0'
      WITNESS_SHA256: da7e9e22c1949cbd76fb87381b057935c073eb2b59e22a6da2e179e6dc18b975
    steps:
      # Before checkout: the evidence root exists even when an input is rejected.
      - name: Check the inputs and write the witness
        id: wbind
        run: |
          # One spelling of the runner's temp for every later step: D:/a/_temp (no backslash for sha256sum to escape).
          WIN_TEMP=$(cygpath -m "$RUNNER_TEMP")
          QA="$WIN_TEMP/qa-windows"
          mkdir -p "$QA/binding" "$QA/pins" "$QA/witness" "$QA/safe-test/base" "$QA/safe-test/candidate" "$QA/witness-source"
          echo "WIN_TEMP=$WIN_TEMP" >> "$GITHUB_ENV"
          echo "QA=$QA" >> "$GITHUB_ENV"
          for name in CANDIDATE_SHA BASE_SHA; do
            value=${!name}
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=Invalid input::$name must be exactly 40 lowercase hex characters"
              echo "rejected: $name is not a 40-hex SHA" >> "$QA/binding/rejected.txt"
              exit 2
            fi
          done
          WIT="$QA/witness-source/npm_route_witness.py"
          cat > "$WIT" <<'NPM_ROUTE_WITNESS_PY'
          """Portable real-npm witness: which Node runs the npm that Ouroboros's skill installer starts.

          Real executables only: two OFFICIAL Node archives, each checked byte for byte against the ``node_artifacts`` entry of
          a reviewed pin file for this host (``release.node_artifacts[<host key>]``: size and sha256), the newer as the pin's
          Node and the older as the host's own Node install. On Windows the host install's launcher is the official ``npm.cmd``
          (it runs the ``node.exe`` beside it, PATH's only when there is none); on POSIX the official ``bin/npm`` link. The
          product code runs unmodified from TREE; the witness only makes the pin govern this host with a chosen generation
          (``node_runtime.pinned_node_wait`` and ``platform_layer.resolve_bundled_node``), as the product's own tests do.

          Per host launcher and per pin case (Node-only generation, complete generation with npm, no pin) it runs, through
          ``isolated_deps``:
            install    ``_install_node_package`` of an offline local tarball whose postinstall records ``npm_node_execpath``
                       (the Node npm itself runs on, set by npm) and its own ``process.execPath``/``process.version``;
            repeat     the same install again: an installed version goes through ``npm rebuild`` with the same command. npm
                       accepts only SemVer specs there and an offline named install is impossible without a registry, so the
                       product's rebuild of the ``file:`` spec is recorded as npm refuses it, and that exact recorded command is
                       replayed once with the SemVer spec ``probe-pkg@1.0.0`` (``rebuild_replay``) to run the postinstall;
            local_npm  (official host) installs an npm package built offline from the OLDER archive's npm tree, as an install
                       spec ``npm@<version>`` would, so ``node/node_modules/.bin`` holds npm's own generated launchers
                       (``npm.cmd``/``npm``/``npm.ps1`` from cmd-shim on Windows, a link on POSIX);
            ready_version  ``_install_actions`` with ``bins: [npm]`` and the bare readiness check ``npm --version``; the
                       product's ``_run`` discards stdout, so the identical argv/env/cwd is replayed once to read the version;
            ready_node ``_install_actions`` with the check ``npm run witness``: the script records which Node npm ran on.
          An ``opaque`` host launcher (a script naming the older Node by absolute path, no npm CLI beside it) checks that an
          automatically found launcher whose Node cannot be shown is refused rather than run. POSIX only: a labelled SYNTHETIC
          stand-in of the npm.cmd rule (``standin``), for bounded offline checks of the shared logic away from Windows.

          Nothing is fetched by ``run``; nothing leaves SCRATCH but OUT. npm runs with ``offline=true`` (the product's own
          ``npm_config_userconfig``). Exit status: 0 when every case ran and recorded (a refusal or failure IS a recorded
          observation); with ``--require candidate`` also 1 when an observation differs from the corrected candidate's
          expectation. ``fetch`` downloads one archive named by a pin file and verifies it (for a CI job; needs network).

          Usage:
            python -I npm_route_witness.py fetch --pin PIN_JSON --dest DIR
            python -I npm_route_witness.py run --tree TREE --scratch SCRATCH --new-archive A --new-pin PIN_JSON
                                              --old-archive B --old-pin PIN_JSON --out OUT_JSON [--label L] [--require candidate]
            python -I npm_route_witness.py compare BASE_JSON CANDIDATE_JSON
          """
          from __future__ import annotations

          import argparse
          import hashlib
          import io
          import json
          import os
          import pathlib
          import platform
          import shutil
          import subprocess
          import sys
          import tarfile
          import time
          import urllib.request
          import zipfile

          IS_WINDOWS = os.name == "nt"
          TIMEOUT = 300
          PIN_CASES = ("pin_node_only", "pin_complete", "no_pin")
          # npm's refusal of a non-SemVer `npm rebuild` spec, as retained from a real npm 11.19.1 run: these two lines, exit 1.
          NPM_REBUILD_REFUSAL = "npm error `npm rebuild` only supports SemVer version/range specifiers"
          NPM_LOG_POINTER = "npm error A complete log of this run can be found in: "


          def host_key() -> str:
              system = {"win32": "win32", "darwin": "darwin"}.get(sys.platform, "linux" if sys.platform.startswith("linux") else "")
              machine = platform.machine().lower()
              arch = {"amd64": "x64", "x86_64": "x64", "arm64": "arm64", "aarch64": "arm64"}.get(machine, machine)
              return f"{system}-{arch}"


          def pin_artifact(pin_path: pathlib.Path) -> tuple[str, dict]:
              release = json.loads(pin_path.read_text(encoding="utf-8"))["release"]
              key = host_key()
              if key not in release["node_artifacts"]:
                  raise SystemExit(f"the pin {pin_path} has no Node archive for {key}")
              return release["node_version"], release["node_artifacts"][key]


          def verify_archive(archive: pathlib.Path, artifact: dict) -> str:
              name = artifact["archive_url"].rsplit("/", 1)[-1]
              if archive.name != name:
                  raise SystemExit(f"{archive} is not the pin's archive {name}")
              if archive.stat().st_size != int(artifact["size_bytes"]):
                  raise SystemExit(f"{archive}: size {archive.stat().st_size} != pin {artifact['size_bytes']}")
              digest = hashlib.sha256()
              with archive.open("rb") as handle:
                  for block in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(block)
              if digest.hexdigest() != artifact["sha256"]:
                  raise SystemExit(f"{archive}: sha256 {digest.hexdigest()} != pin {artifact['sha256']}")
              return digest.hexdigest()


          def fetch(pin: pathlib.Path, dest: pathlib.Path) -> pathlib.Path:
              _version, artifact = pin_artifact(pin)
              dest.mkdir(parents=True, exist_ok=True)
              target = dest / artifact["archive_url"].rsplit("/", 1)[-1]
              partial = target.with_name(target.name + ".part")
              with urllib.request.urlopen(artifact["archive_url"], timeout=600) as response, partial.open("wb") as out:
                  shutil.copyfileobj(response, out)
              partial.replace(target)
              verify_archive(target, artifact)
              return target


          def extract(archive: pathlib.Path, artifact: dict, dest: pathlib.Path) -> pathlib.Path:
              """The archive's Node, npm launchers and npm tree only, under ``dest``; returns the archive's root directory."""
              prefix = artifact["executable"].split("/", 1)[0] + "/"
              if archive.suffix == ".zip":
                  keep = {prefix + "node.exe", prefix + "npm.cmd", prefix + "npm"}
                  with zipfile.ZipFile(archive) as bundle:
                      for info in bundle.infolist():
                          name = info.filename
                          if ".." in name.split("/") or not (name in keep or name.startswith(prefix + "node_modules/npm/")):
                              continue
                          bundle.extract(info, dest)
              else:
                  keep = {prefix + "bin/node", prefix + "bin/npm"}
                  with tarfile.open(archive) as bundle:
                      members = [m for m in bundle.getmembers()
                                 if m.name in keep or m.name.startswith(prefix + "lib/node_modules/npm/")]
                      bundle.extractall(dest, members=members, filter="data")
              return dest / prefix.rstrip("/")


          def node_in(root: pathlib.Path) -> pathlib.Path:
              return root / ("node.exe" if IS_WINDOWS else "bin/node")


          def npm_tree_in(root: pathlib.Path) -> pathlib.Path:
              return root / ("node_modules/npm" if IS_WINDOWS else "lib/node_modules/npm")


          def copy_node(source: pathlib.Path, root: pathlib.Path) -> pathlib.Path:
              target = node_in(root)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              target.chmod(0o755)
              return target


          def node_facts(node: pathlib.Path) -> dict:
              started = time.monotonic()
              ran = subprocess.run([str(node), "-p", "JSON.stringify([process.version, process.versions.brotli])"],
                                   capture_output=True, text=True, timeout=60)
              version, brotli = json.loads(ran.stdout) if ran.returncode == 0 else ("", "")
              return {"path": str(node), "version": version, "brotli": brotli, "seconds": round(time.monotonic() - started, 2)}


          PROBE_JS = (b"require('fs').writeFileSync(require('path').join(process.cwd(), 'probe.json'), JSON.stringify({"
                      b"npm_node_execpath: process.env.npm_node_execpath || '', script_execPath: process.execPath,"
                      b" script_version: process.version}))\n")


          def package_tarball(dest: pathlib.Path) -> pathlib.Path:
              files = {"package/package.json": json.dumps({"name": "probe-pkg", "version": "1.0.0",
                                                           "scripts": {"postinstall": "node probe.js"}}).encode(),
                       "package/probe.js": PROBE_JS}
              buffer = io.BytesIO()
              with tarfile.open(fileobj=buffer, mode="w:gz") as tgz:
                  for name, data in files.items():
                      info = tarfile.TarInfo(name)
                      info.size, info.mode = len(data), 0o644
                      tgz.addfile(info, io.BytesIO(data))
              dest.write_bytes(buffer.getvalue())
              return dest


          def npm_package_tarball(npm_tree: pathlib.Path, dest: pathlib.Path) -> tuple[pathlib.Path, str]:
              """An offline ``npm-<version>.tgz`` of an official npm tree (its dependencies are bundled in it)."""
              version = json.loads((npm_tree / "package.json").read_text(encoding="utf-8"))["version"]
              target = dest / f"npm-{version}.tgz"
              with tarfile.open(target, "w:gz") as tgz:
                  tgz.add(npm_tree, arcname="package")
              return target, version


          def write_launchers(layout: pathlib.Path, old_root: pathlib.Path) -> dict:
              hosts = {"official": old_root if IS_WINDOWS else old_root / "bin"}
              opaque = layout / "host-opaque"
              opaque.mkdir(parents=True)
              old_node, old_cli = node_in(old_root), npm_tree_in(old_root) / "bin" / "npm-cli.js"
              if IS_WINDOWS:
                  (opaque / "npm.cmd").write_text(f'@"{old_node}" "{old_cli}" %*\r\n', encoding="utf-8")
              else:
                  (opaque / "npm").write_text(f'#!/bin/sh\nexec "{old_node}" "{old_cli}" "$@"\n', encoding="utf-8")
                  (opaque / "npm").chmod(0o755)
              hosts["opaque"] = opaque
              if not IS_WINDOWS:  # SYNTHETIC: the npm.cmd rule as a POSIX script, for offline checks away from Windows
                  standin = layout / "host-standin"
                  standin.mkdir()
                  shutil.copy2(old_node, standin / "node")  # beside the launcher and on PATH, as node.exe is beside npm.cmd
                  shutil.copytree(npm_tree_in(old_root), standin / "node_modules" / "npm", symlinks=True)
                  (standin / "npm").write_text('#!/bin/sh\n# SYNTHETIC stand-in of npm.cmd: the node beside it, else PATH\'s\n'
                                               'd=$(dirname "$0")\nif [ -x "$d/node" ]; then n="$d/node"; else n=node; fi\n'
                                               'exec "$n" "$d/node_modules/npm/bin/npm-cli.js" "$@"\n', encoding="utf-8")
                  (standin / "npm").chmod(0o755)
                  hosts["standin"] = standin
              return hosts


          def system_path() -> list[str]:
              if IS_WINDOWS:
                  root = os.environ.get("SystemRoot") or os.environ.get("SYSTEMROOT") or r"C:\Windows"
                  return [os.path.join(root, "System32"), root, os.path.join(root, "System32", "Wbem")]
              return ["/usr/bin", "/bin"]


          def run(args) -> int:
              tree, scratch, out = pathlib.Path(args.tree).resolve(), pathlib.Path(args.scratch).resolve(), pathlib.Path(args.out)
              new_version, new_artifact = pin_artifact(pathlib.Path(args.new_pin))
              old_version, old_artifact = pin_artifact(pathlib.Path(args.old_pin))
              archives = {"new": {"version": new_version, "sha256": verify_archive(pathlib.Path(args.new_archive), new_artifact)},
                          "old": {"version": old_version, "sha256": verify_archive(pathlib.Path(args.old_archive), old_artifact)}}
              if scratch.exists() and any(scratch.iterdir()):
                  raise SystemExit(f"scratch {scratch} must be new or empty")
              layout = scratch / "layout"
              new_root = extract(pathlib.Path(args.new_archive), new_artifact, scratch / "archive-new")
              old_root = extract(pathlib.Path(args.old_archive), old_artifact, scratch / "archive-old")
              gens = {"pin_node_only": scratch / "gen-only" / "node-standalone",
                      "pin_complete": scratch / "gen-full" / "node-standalone"}
              pins = {name: copy_node(node_in(new_root), root) for name, root in gens.items()}
              shutil.copytree(npm_tree_in(new_root), npm_tree_in(gens["pin_complete"]), symlinks=True)
              hosts = write_launchers(layout, old_root)
              old_node = node_in(old_root)
              probe_tgz = package_tarball(layout / "probe-pkg-1.0.0.tgz")
              npm_tgz, local_npm_version = npm_package_tarball(npm_tree_in(old_root), layout)
              probe_spec, npm_spec = f"probe-pkg@file:{probe_tgz.as_posix()}", f"npm@file:{npm_tgz.as_posix()}"
              pin_npm_version = json.loads((npm_tree_in(new_root) / "package.json").read_text(encoding="utf-8"))["version"]

              # A fresh copy's first execution can outlast the product's 10 s health probe (a first-launch scan on macOS, an
              # antivirus scan on Windows) and be recorded as broken: each copy runs once here first, its time recorded.
              warmup = {name: node_facts(node) for name, node in [*pins.items(), ("old", node_in(old_root))]}
              sys.path.insert(0, str(tree))
              from ouroboros import node_runtime, platform_layer  # noqa: E402
              from ouroboros.marketplace import isolated_deps  # noqa: E402

              platform_layer.bootstrap_process_path = lambda *a, **k: []  # the witness owns the host PATH exactly
              product_run = isolated_deps._run
              calls: list = []

              def recording_run(cmd, **kwargs):
                  calls.append({"argv": [str(part) for part in cmd], "cwd": str(kwargs.get("cwd")), "env": dict(kwargs["env"])})
                  result = product_run(cmd, **kwargs)
                  calls[-1]["returncode"] = result.get("returncode")
                  calls[-1]["stderr_tail"] = (result.get("stderr_tail") or "")[-1500:]
                  return result

              isolated_deps._run = recording_run

              def who(path: str, pin_node) -> str:
                  if not path:
                      return ""
                  resolved = pathlib.Path(path).resolve()
                  if pin_node is not None and resolved == pin_node.resolve():
                      return "pin"
                  olds = {old_node.resolve(), *(((hosts["standin"] / "node").resolve(),) if "standin" in hosts else ())}
                  return "old" if resolved in olds else str(resolved)

              rows = []
              for host_name, host_dir in hosts.items():
                  for pin_name in PIN_CASES:
                      pin_node = pins.get(pin_name)
                      # The opaque launcher's own Node install stays on PATH after it, as a real shim's would.
                      extra = [str(old_node.parent)] if host_name == "opaque" else []
                      os.environ["PATH"] = os.pathsep.join([str(host_dir), *extra, *system_path()])
                      node_runtime.pinned_node_wait = (lambda p=pin_node: (True, str(p)) if p else (False, ""))
                      platform_layer.resolve_bundled_node = (lambda p=pin_node: str(p) if p else None)
                      getattr(node_runtime, "_NODE_HEALTH_MEMO", {}).clear()
                      env_root = layout / "envs" / f"{host_name}-{pin_name}" / ".ouroboros_env"
                      env_root.mkdir(parents=True)
                      (env_root / "npmrc").write_text("offline=true\naudit=false\nfund=false\nupdate-notifier=false\n",
                                                      encoding="utf-8")
                      probe = env_root / "node" / "node_modules" / "probe-pkg" / "probe.json"
                      # A named spec, as an install spec names its package: the installer reads the installed version by name.
                      steps = [("install", lambda: isolated_deps._install_node_package(
                                   probe_spec, env_root, TIMEOUT, allow_install_scripts=True)),
                               ("repeat", lambda: isolated_deps._install_node_package(
                                   probe_spec, env_root, TIMEOUT, allow_install_scripts=True))]
                      if host_name == "official":
                          witness = env_root / "witness"
                          steps += [("local_npm", lambda: isolated_deps._install_node_package(npm_spec, env_root, TIMEOUT)),
                                    ("ready_version", lambda: isolated_deps._install_actions(
                                        {"kind": "npm", "bins": ["npm"], "check": {"argv": ["npm", "--version"]}},
                                        env_root, env_root / "cache", TIMEOUT, [])),
                                    ("ready_node", lambda: isolated_deps._install_actions(
                                        {"kind": "npm", "check": {"argv": ["npm", "run", "witness"], "cwd": "witness"}},
                                        env_root, env_root / "cache", TIMEOUT, []))]
                      for step, action in steps:
                          row = {"host": host_name, "pin": pin_name, "step": step}
                          if step == "repeat":
                              probe.unlink(missing_ok=True)
                          if step == "ready_node":
                              witness.mkdir(exist_ok=True)
                              (witness / "package.json").write_text(json.dumps(
                                  {"name": "witness", "version": "1.0.0", "private": True,
                                   "scripts": {"witness": "node probe.js"}}), encoding="utf-8")
                              (witness / "probe.js").write_bytes(PROBE_JS)
                              (witness / "probe.json").unlink(missing_ok=True)
                          del calls[:]
                          try:
                              action()
                          except Exception as exc:  # recorded, never hidden
                              row["error"] = f"{type(exc).__name__}: {exc}"
                          row["calls"] = [{key: value for key, value in call.items() if key != "env"} for call in calls]
                          if step == "repeat" and len(calls) == 2:
                              argv = [*calls[1]["argv"][:-1], "probe-pkg@1.0.0"]
                              replay = subprocess.run(argv, cwd=calls[1]["cwd"], env=calls[1]["env"], capture_output=True,
                                                      text=True, timeout=TIMEOUT)
                              row["rebuild_replay"] = {"argv": argv, "returncode": replay.returncode,
                                                       "stderr_tail": replay.stderr[-1500:]}
                          if step == "repeat":
                              row["product_rebuild"] = rebuild_outcome(row)  # apart from the replay, which proves only the route
                          if step == "ready_version" and calls:
                              replay = subprocess.run(calls[-1]["argv"], cwd=calls[-1]["cwd"], env=calls[-1]["env"],
                                                      capture_output=True, text=True, timeout=TIMEOUT)
                              row["replayed_stdout"] = replay.stdout.strip()
                          found = (witness / "probe.json") if step == "ready_node" else probe
                          if step in {"install", "repeat", "ready_node"} and found.exists():
                              row["probe"] = json.loads(found.read_text(encoding="utf-8"))
                              row["npm_node_is"] = who(row["probe"]["npm_node_execpath"], pin_node)
                              row["script_node_is"] = who(row["probe"]["script_execPath"], pin_node)
                          row["started_as"] = [who(call["argv"][0], pin_node) for call in calls]  # pin, old, or a launcher
                          rows.append(row)
                          print(json.dumps(row), flush=True)

              expectation_failures = [failure for row in rows for failure in candidate_expectations(
                  row, pins, local_npm_version)] if args.require == "candidate" else []
              report = {"label": args.label, "tree": str(tree), "host_key": host_key(), "python": sys.version,
                        "archives": archives, "warmup": warmup, "new_node": node_facts(pins["pin_node_only"]), "old_node": node_facts(old_node),
                        "local_npm_version": local_npm_version, "pin_npm_version": pin_npm_version,
                        "local_npm_discriminates": local_npm_version != pin_npm_version,
                        "synthetic_hosts": ["standin"] if "standin" in hosts else [],
                        "rows": rows, "expectation_failures": expectation_failures}
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
              for failure in expectation_failures:
                  print("EXPECTATION FAILED:", failure, flush=True)
              return 1 if expectation_failures else 0


          def rebuild_outcome(row: dict) -> str:
              """The product's own second call of ``repeat``: ``succeeded``; ``known_refusal`` when npm refused only the
              non-SemVer spec exactly as recorded (exit 1, stderr the refusal and npm's log pointer only, and the product's
              RuntimeError naming that refusal); anything else, any other error included, is ``unexpected``."""
              calls, error = row.get("calls") or [], row.get("error", "")
              if len(calls) != 2 or "rebuild" not in calls[1]["argv"] or calls[0].get("returncode") != 0:
                  return "unexpected"
              if calls[1].get("returncode") == 0 and not error:
                  return "succeeded"
              lines = [line.strip() for line in (calls[1].get("stderr_tail") or "").splitlines() if line.strip()]
              first, *rest = error.splitlines() or [""]
              known = (calls[1].get("returncode") == 1 and NPM_REBUILD_REFUSAL in lines
                       and all(line == NPM_REBUILD_REFUSAL or line.startswith(NPM_LOG_POINTER) for line in lines)
                       and first.startswith("RuntimeError: npm rebuild ") and first.endswith(" failed: " + NPM_REBUILD_REFUSAL)
                       and all(line.strip().startswith(NPM_LOG_POINTER) for line in rest if line.strip()))
              return "known_refusal" if known else "unexpected"


          def candidate_expectations(row: dict, pins: dict, local_npm_version: str) -> list:
              """What the corrected candidate must show; each mismatch is one message."""
              host, pin, step = row["host"], row["pin"], row["step"]
              where = f"{host}/{pin}/{step}"
              failures = []

              def want(condition: bool, text: str) -> None:
                  if not condition:
                      failures.append(f"{where}: {text}; observed {json.dumps({k: row.get(k) for k in row if k != 'calls'})}")

              pin_node = pins.get(pin)
              refused = host == "opaque" and pin == "pin_node_only"
              if refused:
                  want("NpmLauncherRefused" in row.get("error", "") and not row["calls"], "refused before any spawn")
                  return failures
              calls = row["calls"]
              if step == "repeat":
                  want(len(calls) == 2 and "rebuild" in calls[1]["argv"], "install, then rebuild")
                  prefixes = [call["argv"][:call["argv"].index(verb)] for call, verb in zip(calls, ("install", "rebuild"))
                              if verb in call["argv"]]
                  want(len(prefixes) == 2 and prefixes[0] == prefixes[1], "one npm command for both")
                  want(rebuild_outcome(row) in {"succeeded", "known_refusal"},
                       "the product's rebuild succeeded or npm refused only its non-SemVer spec, as recorded")
                  want(row.get("rebuild_replay", {}).get("returncode") == 0, "the separate SemVer replay ran (route only)")
              else:
                  want("error" not in row, "no error")
              if pin_node is not None and calls:
                  want(all(call["argv"][0] == str(pin_node) for call in calls), "every npm process starts on the pin's Node")
                  if pin == "pin_complete" and step in {"install", "repeat"}:
                      managed = npm_tree_in(pin_node.parent if IS_WINDOWS else pin_node.parent.parent) / "bin" / "npm-cli.js"
                      want(all(call["argv"][1] == str(managed) for call in calls), "the pin's own npm CLI")
                  if step in {"ready_version", "ready_node"}:
                      want(calls[0]["argv"][1].replace("\\", "/").endswith("node/node_modules/npm/bin/npm-cli.js"),
                           "the locally installed npm's own CLI")
              if step in {"install", "repeat", "ready_node"}:
                  expected = "pin" if pin_node is not None else "old"
                  want(row.get("npm_node_is") == expected, f"npm ran on the {expected} Node")
                  if pin_node is not None:
                      want(row.get("script_node_is") == "pin", "the package script ran on the pin's Node")
              if step == "ready_version":
                  want(row.get("replayed_stdout") == local_npm_version, "npm --version is the locally installed version")
              if step == "local_npm" and pin_node is not None:
                  want(bool(calls) and calls[0]["returncode"] == 0, "the npm package installed")
              return failures


          def compare(base: pathlib.Path, candidate: pathlib.Path) -> int:
              reports = [json.loads(path.read_text(encoding="utf-8")) for path in (base, candidate)]
              keyed = [{(r["host"], r["pin"], r["step"]): r for r in report["rows"]} for report in reports]
              print(f"{'host/pin/step':42} {'base':28} candidate")
              for key in keyed[1]:
                  cells = []
                  for table in keyed:
                      row = table.get(key, {})
                      if key[2] == "repeat" and "NpmLauncherRefused" not in row.get("error", ""):
                          cells.append(f"rebuild:{rebuild_outcome(row)} replay:{row.get('rebuild_replay', {}).get('returncode')}"
                                       f" npm:{row.get('npm_node_is', '-')}")
                          continue
                      cells.append(row.get("error", "")[:26] or "npm:" + str(row.get("npm_node_is", "-"))
                                   + (f" v={row['replayed_stdout']}" if "replayed_stdout" in row else ""))
                  print(f"{'/'.join(key):42} {cells[0]:28} {cells[1]}")
              return 0


          def main() -> int:
              parser = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
              commands = parser.add_subparsers(dest="command", required=True)
              fetching = commands.add_parser("fetch")
              fetching.add_argument("--pin", required=True)
              fetching.add_argument("--dest", required=True)
              running = commands.add_parser("run")
              for name in ("--tree", "--scratch", "--new-archive", "--new-pin", "--old-archive", "--old-pin", "--out"):
                  running.add_argument(name, required=True)
              running.add_argument("--label", default="")
              running.add_argument("--require", choices=["candidate"], default=None)
              comparing = commands.add_parser("compare")
              comparing.add_argument("base")
              comparing.add_argument("candidate")
              args = parser.parse_args()
              if args.command == "fetch":
                  print(fetch(pathlib.Path(args.pin), pathlib.Path(args.dest)))
                  return 0
              if args.command == "compare":
                  return compare(pathlib.Path(args.base), pathlib.Path(args.candidate))
              return run(args)


          if __name__ == "__main__":
              sys.exit(main())
          NPM_ROUTE_WITNESS_PY
          actual=$(sha256sum < "$WIT" | cut -d ' ' -f 1)
          echo "$actual  npm_route_witness.py" > "$QA/witness-source/sha256.txt"
          if [[ "$actual" != "$WITNESS_SHA256" ]]; then
            echo "::error title=Witness bytes::the written witness hashes to $actual, not $WITNESS_SHA256"; exit 1
          fi
          echo "WIT=$WIT" >> "$GITHUB_ENV"
          echo "W (workflow) $GITHUB_SHA; C (candidate) $CANDIDATE_SHA; B (base) $BASE_SHA; witness $actual"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0  # B's tree and pin come from the history
          persist-credentials: false

      - name: Prove the checkout is C, B its ancestor, and lay out B's tree and both pins
        id: wsource
        run: |
          S="$QA/binding"
          head=$(git rev-parse HEAD)
          if [[ "$head" != "$CANDIDATE_SHA" ]]; then echo "::error title=Wrong checkout::HEAD is $head, not C"; exit 1; fi
          if ! git cat-file -e "$BASE_SHA^{commit}"; then echo "::error title=Base missing::B is not in the history"; exit 1; fi
          if ! git merge-base --is-ancestor "$BASE_SHA" HEAD; then echo "::error title=B not an ancestor::B is not an ancestor of C"; exit 1; fi
          { echo "C $head tree $(git rev-parse 'HEAD^{tree}')"; echo "B $BASE_SHA tree $(git rev-parse "$BASE_SHA^{tree}")"; } > "$S/trees.txt"
          git show "$CANDIDATE_SHA:ouroboros/claudexor_runtime_pin.json" > "$QA/pins/new-pin.json"
          git show "$BASE_SHA:ouroboros/claudexor_runtime_pin.json" > "$QA/pins/old-pin.json"
          sha256sum "$QA/pins/new-pin.json" "$QA/pins/old-pin.json" > "$QA/pins/sha256.txt"
          git worktree add --detach "$WIN_TEMP/base-tree" "$BASE_SHA"
          base_head=$(git -C "$WIN_TEMP/base-tree" rev-parse HEAD)
          git -C "$WIN_TEMP/base-tree" status --porcelain=v1 --untracked-files=all > "$S/base-tree-status.txt"
          if [[ "$base_head" != "$BASE_SHA" || -s "$S/base-tree-status.txt" ]]; then
            echo "::error title=Base tree::the worktree is not exactly B; see binding/base-tree-status.txt"; exit 1
          fi
          git status --porcelain=v1 --untracked-files=all > "$S/c-status-before-setup.txt"
          cat "$S/trees.txt"

      # C's own action, as the Linux job: the shipped interpreter and a locked dependency-only environment.
      - uses: ./.github/actions/setup-python-env
        id: wsetup_python
        with:
          interpreter: shipped
          install-project: 'false'

      - name: Record the Python, C's state and the pinned archives
        id: wprepare
        run: |
          S="$QA/binding"
          PY="$(cygpath -m "$GITHUB_WORKSPACE")/.venv/Scripts/python.exe"
          test -x "$PY"
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -I -c 'import sys; print("python", sys.version.replace("\n", " "), sys.executable)' > "$S/python.txt"
          uv pip freeze --python "$PY" > "$S/pip-freeze.txt"
          if grep -E '^-e |ouroboros @ file:' "$S/pip-freeze.txt"; then
            echo "::error title=Project installed::expected locked dependencies only"; exit 1
          fi
          git status --porcelain=v1 --untracked-files=no > "$S/c-tracked-before-witness.txt"
          if [[ -s "$S/c-tracked-before-witness.txt" ]]; then
            echo "::error title=Source drift::C has a tracked change before the witness"; cat "$S/c-tracked-before-witness.txt"; exit 1
          fi
          "$PY" -I - "$QA/pins/new-pin.json" "$QA/pins/old-pin.json" "$S/binding.json" "$WIN_TEMP/node-archives" <<'PY'
          import json, os, sys
          new_pin, old_pin, out, archives = sys.argv[1:5]
          record = {key: os.environ.get(key, "") for key in (
              "GITHUB_REPOSITORY", "GITHUB_SHA", "GITHUB_REF", "GITHUB_WORKFLOW_REF", "GITHUB_RUN_ID",
              "GITHUB_RUN_ATTEMPT", "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion",
              "CANDIDATE_SHA", "BASE_SHA", "EXPECTED_NODE", "OLD_NODE", "WITNESS_SHA256")}
          problems, names = [], {}
          for label, path, want in (("new", new_pin, os.environ["EXPECTED_NODE"]), ("old", old_pin, os.environ["OLD_NODE"])):
              release = json.load(open(path, encoding="utf-8"))["release"]
              artifact = release["node_artifacts"].get("win32-x64") or {}
              record[f"{label}_pin"] = {"node_version": release["node_version"], "win32-x64": artifact}
              if release["node_version"] != want:
                  problems.append(f"the {label} pin names Node {release['node_version']}, not {want}")
              if not artifact.get("archive_url"):
                  problems.append(f"the {label} pin has no win32-x64 archive")
              names[label] = artifact.get("archive_url", "").rsplit("/", 1)[-1]
          with open(out, "w", encoding="utf-8") as stream:
              json.dump(record, stream, indent=2)
              stream.write("\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for label in ("new", "old"):
                  stream.write(f"{label.upper()}_ARCHIVE={archives}/{names[label]}\n")
          for problem in problems:
              print(f"::error title=Node pin::{problem}")
          sys.exit(1 if problems else 0)
          PY

      # Network: the URL in each pin; the witness refuses an archive whose name, size or sha256 differs.
      - name: Fetch both pinned Node archives
        id: wfetch
        timeout-minutes: 15
        run: |
          for label in new old; do
            rc=0
            "$PY" -I "$WIT" fetch --pin "$QA/pins/$label-pin.json" --dest "$WIN_TEMP/node-archives" \
              > "$QA/witness/fetch-$label.stdout.log" 2> "$QA/witness/fetch-$label.stderr.log" || rc=$?
            echo "$rc" > "$QA/witness/fetch-$label.exit"
            cat "$QA/witness/fetch-$label.stdout.log"; cat "$QA/witness/fetch-$label.stderr.log" >&2
            if (( rc != 0 )); then echo "::error title=Node archive::fetch of the $label pin's archive exited $rc"; exit "$rc"; fi
          done
          sha256sum "$NEW_ARCHIVE" "$OLD_ARCHIVE" > "$QA/witness/archives.sha256"

      # Every case must record an observation; B's refusals and old-Node runs are its expected defects.
      - name: Witness on B (official base tree)
        id: witness_base
        timeout-minutes: 40
        run: |
          rc=0
          "$PY" -I -S scripts/safe_test.py --temp-parent "$WIN_TEMP" --evidence-dir "$QA/safe-test/base" --timeout 1800 -- \
            "$PY" -I "$WIT" run --tree "$WIN_TEMP/base-tree" --scratch "$WIN_TEMP/w-base" \
            --new-archive "$NEW_ARCHIVE" --new-pin "$QA/pins/new-pin.json" \
            --old-archive "$OLD_ARCHIVE" --old-pin "$QA/pins/old-pin.json" \
            --out "$QA/witness/npm-witness-base.json" --label "base windows" \
            > "$QA/witness/base.stdout.log" 2> "$QA/witness/base.stderr.log" || rc=$?
          echo "$rc" > "$QA/witness/base.exit"
          cat "$QA/witness/base.stdout.log"; cat "$QA/witness/base.stderr.log" >&2
          echo "B witness exit $rc"
          exit "$rc"

      # Runs even after a red B: its own exit decides this step.
      - name: Witness on C (candidate, --require candidate)
        id: witness_candidate
        if: ${{ !cancelled() && steps.wfetch.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          rc=0
          "$PY" -I -S scripts/safe_test.py --temp-parent "$WIN_TEMP" --evidence-dir "$QA/safe-test/candidate" --timeout 1800 -- \
            "$PY" -I "$WIT" run --tree "$(cygpath -m "$GITHUB_WORKSPACE")" --scratch "$WIN_TEMP/w-candidate" \
            --new-archive "$NEW_ARCHIVE" --new-pin "$QA/pins/new-pin.json" \
            --old-archive "$OLD_ARCHIVE" --old-pin "$QA/pins/old-pin.json" \
            --out "$QA/witness/npm-witness-candidate.json" --label "candidate windows" --require candidate \
            > "$QA/witness/candidate.stdout.log" 2> "$QA/witness/candidate.stderr.log" || rc=$?
          echo "$rc" > "$QA/witness/candidate.exit"
          cat "$QA/witness/candidate.stdout.log"; cat "$QA/witness/candidate.stderr.log" >&2
          echo "C witness exit $rc"
          exit "$rc"

      # A side-by-side table for the reader; it decides nothing.
      - name: Compare the B and C reports
        id: wcompare
        if: ${{ !cancelled() && steps.wfetch.outcome == 'success' }}
        run: |
          W="$QA/witness"
          if [[ ! -f "$W/npm-witness-base.json" || ! -f "$W/npm-witness-candidate.json" ]]; then
            echo "::error title=Not compared::a witness report is missing"; exit 1
          fi
          "$PY" -I "$WIT" compare "$W/npm-witness-base.json" "$W/npm-witness-candidate.json" > "$W/compare.txt"
          cat "$W/compare.txt"

      - name: Record C's state after the witness
        id: wteardown
        if: always()
        run: |
          S="$QA/binding"
          git rev-parse HEAD > "$S/c-head-after.txt"
          git status --porcelain=v1 --untracked-files=all > "$S/c-status-after.txt"
          if grep -v '^??' "$S/c-status-after.txt"; then
            echo "::error title=Source drift::C has a tracked change after the witness"; exit 1
          fi

      # Logs, reports, the witness bytes and safe_test's evidence only: no checkout, venv, Node or archives.
      - name: Upload the Windows witness evidence
        id: wupload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-qa-windows-npm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-windows/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
