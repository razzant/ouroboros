# QA-ONLY replacement of ci.yml for ONE temporary diagnostic branch W2 (equipment node-diag-02). NOT a product workflow: never merge it
# into ouroboros/main. It is not a qualification and runs no battery: it pairs the base B and the corrected candidate C
# on the nine test modules that held the 28 failures of the one full Linux run 43768940995 (C there was oldC).
#
#   W2 the commit holding this file (github.sha): C plus only this workflow.
#   C  candidate_sha: oldC plus exactly the two-file test correction (checked); checked out, its own action runs.
#   oldC original_candidate_sha: 148ec97175d5cf828838712e0dff1ca4fa56f5ea, used only in the cold control.
#   B  base_sha: the official base, as a detached worktree.
#
# One manual Linux job, as W's: shipped Python with C's locked non-editable dependencies, C's pinned Node 24.22.3
# prepared and first on PATH. Then, per module, B and C each run the module alone in a fresh process:
#   <venv>/bin/python -I -S scripts/safe_test.py --temp-parent /tmp --evidence-dir <dir>/safe-test --timeout 1800 --
#     <venv>/bin/python <equipment>/diag_pytest.py --observe <dir>/observe.jsonl -- tests/<module>.py
#       -p no:cacheprovider -rA --junitxml=<dir>/junit.xml
# each tree's own safe_test.py. diag_pytest.py is pytest.main plus a read-only observer: every setup/call/teardown
# report and failed collection, and around each test the process registry, the restart flag and the Node generations in
# the data root; it changes no test. A module missing on B is recorded absent, never a B pass. The cold control runs the
# one cold case on oldC and on C with the session's shared data root first prepared by the product's own
# reviewed_node(allow_install=True) (Linux only): oldC must fail in the test's body, C must pass.
# After each run, pack_evidence.py tars exactly the scratch its safe_test result declares retained (raw byte names);
# teardown records each tree's source state. The equipment's exact bytes are embedded below, their sha256 recorded.
# Nothing retries, kills or removes processes or scratch. summarize.py keeps execution (exits), evidence (records,
# capture, JUnit, snapshot exit, source after) and observation apart and fails the job when evidence or observation is
# INCOMPLETE, the cold control is not confirmed, or no Node cancellation call ran on C. Test outcomes are data: a pass in
# isolation leaves a historical failure UNKNOWN; a failure on both trees is one cause only once the messages agree.

name: CI

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'C: exact 40-hex corrected product commit (oldC plus the two-file test correction)'
        required: true
        type: string
      original_candidate_sha:
        description: 'oldC: exact 40-hex product commit of run 43768940995, for the cold control'
        required: true
        type: string
      base_sha:
        description: 'B: exact 40-hex official base commit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: node-diag-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

env:
  # Qualification facts, not inputs: C must pin exactly this Node and its Brotli must be at least this.
  EXPECTED_NODE: '24.22.3'
  MIN_BROTLI: '1.2.1'

jobs:
  node-failure-pair-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      # As in ci.yml's test jobs: this job provisions the plugins and a Node, so the gate's
      # real-spawn tests must run instead of skipping.
      OUROBOROS_PREFLIGHT_REQUIRE_PLUGINS: "1"
      OUROBOROS_PREFLIGHT_REQUIRE_NODE: "1"
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      ORIGINAL_SHA: ${{ inputs.original_candidate_sha }}
      # scripts/safe_test.py's temp parent on Linux (ouroboros/test_environment.default_temp_parent).
      SAFE_TEST_TEMP_PARENT: /tmp
    steps:
      # Before checkout: the evidence root exists even when an input is rejected.
      - name: Bind W2, C, oldC and B
        id: bind
        run: |
          QA="$RUNNER_TEMP/qa-evidence"
          mkdir -p "$QA/binding" "$QA/source" "$QA/runtime" "$QA/phases" "$QA/runs" "$QA/control" "$QA/teardown"
          echo "QA=$QA" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/qa-lib.sh" <<'LIB'
          # run_logged PREFIX CMD...: CMD's stdout/stderr go to the log AND, in full, to PREFIX.stdout.log /
          # PREFIX.stderr.log; argv, start, end and exit are recorded. Returns CMD's exit (125: capture could
          # not start, CMD not run). A record it cannot write is named in PREFIX.capture-problems or the log.
          run_logged() {
            local prefix=$1; shift
            local pipes rc=0 t_out t_err
            printf '%q ' "$@" > "$prefix.argv.txt" && echo >> "$prefix.argv.txt" || qa_note "$prefix" "argv not recorded"
            pipes=$(mktemp -d "$RUNNER_TEMP/qa-pipes.XXXXXX") || { qa_note "$prefix" "no capture directory"; return 125; }
            mkfifo "$pipes/out" "$pipes/err" || { qa_note "$prefix" "no capture pipes"; return 125; }
            date -u +%Y-%m-%dT%H:%M:%SZ > "$prefix.started" || qa_note "$prefix" "start not recorded"
            tee "$prefix.stdout.log" < "$pipes/out" & t_out=$!
            tee "$prefix.stderr.log" < "$pipes/err" >&2 & t_err=$!
            "$@" > "$pipes/out" 2> "$pipes/err" || rc=$?
            wait "$t_out" || qa_note "$prefix" "stdout capture exited $?"
            wait "$t_err" || qa_note "$prefix" "stderr capture exited $?"
            echo "$rc" > "$prefix.exit" || qa_note "$prefix" "exit $rc not recorded"
            date -u +%Y-%m-%dT%H:%M:%SZ > "$prefix.ended" || qa_note "$prefix" "end not recorded"
            rm -rf "$pipes" || qa_note "$prefix" "capture pipes not removed"
            return "$rc"
          }
          qa_note() { echo "$2" >> "$1.capture-problems" || echo "::error title=Evidence not recorded::$1: $2" >&2; }
          # qa_source_is_c FILE: records HEAD and `git status` (ignored files excluded) in FILE; fails unless HEAD is C
          # and the index and worktree hold C exactly: no tracked change, no non-ignored untracked file. Resets nothing.
          qa_source_is_c() {
            { echo "HEAD $(git rev-parse HEAD)"; git status --porcelain=v1 --untracked-files=all; } > "$1" \
              || { echo "::error title=Source state unknown::$1 not recorded"; return 1; }
            if [[ "$(head -n 1 "$1")" != "HEAD $CANDIDATE_SHA" || $(wc -l < "$1") -ne 1 ]]; then
              echo "::error title=Source drift::the checkout no longer holds exactly C; see $1"; cat "$1"; return 1
            fi
          }
          sha256() { if command -v sha256sum >/dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          LIB
          python3 -I - "$QA/binding/binding.json" <<'PY'
          import json, os, sys, time
          keys = ("GITHUB_REPOSITORY", "GITHUB_SHA", "GITHUB_REF", "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA",
                  "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_ACTOR", "RUNNER_OS", "RUNNER_ARCH", "ImageOS",
                  "ImageVersion", "EXPECTED_NODE", "MIN_BROTLI")
          record = {key: os.environ.get(key, "") for key in keys}
          record.update({"workflow_commit_W": os.environ.get("GITHUB_SHA", ""),
                         "tested_product_commit_C": os.environ.get("CANDIDATE_SHA", ""),
                         "base_B": os.environ.get("BASE_SHA", ""),
                         "original_candidate_oldC": os.environ.get("ORIGINAL_SHA", ""),
                         "note": "W2 holds only this diagnostic workflow; C is the corrected product, oldC the tested-before one.",
                         "bound_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())})
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(record, stream, indent=2)
              stream.write("\n")
          PY
          for name in CANDIDATE_SHA BASE_SHA ORIGINAL_SHA; do
            value=${!name}
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=Invalid input::$name must be exactly 40 lowercase hex characters"
              echo "rejected: $name is not a 40-hex SHA" >> "$QA/binding/rejected.txt"
              exit 2
            fi
          done
          if [[ "$CANDIDATE_SHA" == "$GITHUB_SHA" ]]; then
            echo "::warning title=W equals C::the tested commit is the workflow commit itself"
          fi
          echo "W2 (workflow) $GITHUB_SHA; C (corrected) $CANDIDATE_SHA; oldC $ORIGINAL_SHA; B (base) $BASE_SHA"

      # Even after a rejected input: the summary and the byte-exact pack then still run and name what is missing.
      - name: Write the diagnostic equipment
        id: equipment
        if: always()
        run: |
          source "$RUNNER_TEMP/qa-lib.sh"
          EQ="$RUNNER_TEMP/qa-equipment"
          mkdir -p "$EQ"
          echo "EQ=$EQ" >> "$GITHUB_ENV"
          cat > "$EQ/diag_pytest.py" <<'EOF_QA_EQUIPMENT'
          """One fresh per-file pytest run for the temporary Node failure-pair diagnostic. QA equipment, not product.

          usage: diag_pytest.py --observe OUT.jsonl [--prepare-shared-node NODEID] -- PYTEST_ARGS...

          pytest.main(PYTEST_ARGS), as `python -m pytest` from the tree under test, plus a read-only observer appending JSON lines:
          every setup/call/teardown report and failed collection (nodeid, phase, outcome, '<file>:<line>: <first line>'); around
          each test, when changed, the process registry (from each entry's own __dict__: a Mock gains no children), the restart
          flag and the Node generations in config.DATA_DIR, read only from modules the tests imported; collected/session_end/
          exitstatus brackets, exitstatus counting unwritten lines. A failed read is an 'observer_error' line; nothing is raised
          into pytest. --prepare-shared-node (the cold control, Linux only): before that test's call the product's own
          reviewed_node(allow_install=True) prepares the pinned Node in the session's shared data root, where prepared_node()
          must find it; otherwise pytest exits 3: the control is unmet, never passed.
          """
          import json
          import os
          import sys
          import time

          import pytest

          _PRECONDITION_EXIT = 3
          _LINUX = sys.platform.startswith("linux")


          def _entry(proc):
              fields = getattr(proc, "__dict__", {}) or {}
              args = fields.get("args")
              if isinstance(args, (list, tuple)):
                  args = [str(item) for item in args[:4]]
              elif args is not None:
                  args = str(args)[:200]
              return {"type": type(proc).__name__, "pid": fields.get("pid"), "args": args}


          def _snapshot():
              modules, out = sys.modules, {}
              shell = modules.get("ouroboros.tools.shell_process")
              if shell is None:
                  out["registry"] = "not imported"
              elif shell._subprocess_lock.acquire(timeout=2):
                  try:
                      procs = list(shell._active_subprocesses)
                  finally:
                      shell._subprocess_lock.release()
                  out["registry"] = sorted((_entry(proc) for proc in procs), key=lambda row: json.dumps(row, default=str))
              else:
                  out["registry"] = "unobserved: lock busy"
              restart = modules.get("ouroboros.server_restart")
              out["owner_stop_began"] = "not imported" if restart is None else restart._OWNER_STOP_BEGAN.is_set()
              config = modules.get("ouroboros.config")
              if config is None:
                  out["node_generations"] = "not imported"
              else:
                  out["data_dir"] = str(config.DATA_DIR)
                  try:
                      out["node_generations"] = sorted(os.listdir(os.path.join(str(config.DATA_DIR), "state", "cx", "node")))
                  except FileNotFoundError:
                      out["node_generations"] = []
                  except OSError as exc:
                      out["node_generations"] = f"unreadable: {exc}"
              return out


          def _message(report):
              """'<file>:<line>: <first line>' of a report that did not pass, at most 300 characters; '' when it passed."""
              if report.passed:
                  return ""
              longrepr, where = report.longrepr, ""
              if isinstance(longrepr, tuple) and len(longrepr) == 3:  # a skip: (path, lineno, reason)
                  where, text = f"{os.path.basename(str(longrepr[0]))}:{longrepr[1]}", longrepr[2]
              else:
                  crash = getattr(longrepr, "reprcrash", None)
                  if crash is not None:
                      where, text = f"{os.path.basename(str(crash.path))}:{crash.lineno}", crash.message
                  else:
                      text = str(longrepr or "")
              first = next((line.strip() for line in str(text).splitlines() if line.strip()), "")
              return (f"{where}: {first}" if where else first)[:300]


          class Observer:
              def __init__(self, path, prepare):
                  self.stream = open(path, "a", encoding="ascii")
                  self.prepare, self.last, self.failed_writes = prepare, None, 0

              def line(self, record):
                  try:
                      self.stream.write(json.dumps({"t": time.time(), **record}, ensure_ascii=True, default=str) + "\n")
                      self.stream.flush()
                  except Exception:  # never raised into pytest; counted, and a missing bracket line shows the rest
                      self.failed_writes += 1

              def observe(self, when, nodeid, force=False):
                  try:
                      snap = _snapshot()
                  except Exception as exc:
                      snap = {"observer_error": f"{type(exc).__name__}: {exc}"}
                  if force or snap != self.last:
                      self.line({"when": when, "nodeid": nodeid, **snap})
                  self.last = snap

              def report(self, report, phase):
                  try:
                      record = {"when": "report", "nodeid": report.nodeid, "phase": phase, "outcome": report.outcome,
                                "message": _message(report)}
                  except Exception as exc:
                      record = {"when": "report", "nodeid": str(getattr(report, "nodeid", "")), "phase": phase,
                                "observer_error": f"report unreadable: {type(exc).__name__}: {exc}"}
                  self.line(record)

              def pytest_collection_finish(self, session):
                  self.observe("collected", "", force=True)

              def pytest_collectreport(self, report):
                  if getattr(report, "outcome", "") != "passed":
                      self.report(report, "collect")

              def pytest_runtest_logreport(self, report):
                  self.report(report, getattr(report, "when", "") or "unknown")

              @pytest.hookimpl(tryfirst=True)
              def pytest_runtest_setup(self, item):
                  self.observe("before", item.nodeid)

              @pytest.hookimpl(hookwrapper=True)
              def pytest_runtest_teardown(self, item, nextitem):
                  yield
                  self.observe("after", item.nodeid)

              @pytest.hookimpl(tryfirst=True)
              def pytest_runtest_call(self, item):
                  if not self.prepare or item.nodeid != self.prepare:
                      return
                  record = {"when": "control_prepared", "nodeid": item.nodeid, "ok": False}
                  try:
                      if not _LINUX:
                          raise RuntimeError("the cold-control preparation runs only on the Linux runner")
                      from ouroboros import config
                      from ouroboros.claudexor_runtime import get_runtime_manager

                      manager = get_runtime_manager()
                      record["data_dir"] = str(config.DATA_DIR)
                      record["reviewed"] = manager.reviewed_node(allow_install=True)
                      record["prepared"] = manager.prepared_node(str(config.DATA_DIR))
                      store = os.path.join(str(config.DATA_DIR), "state", "cx", "node") + os.sep
                      record["ok"] = bool(record["prepared"]) and record["prepared"].startswith(store)
                  except Exception as exc:
                      record["error"] = f"{type(exc).__name__}: {exc}"
                  self.line(record)
                  if not record["ok"]:
                      pytest.exit(f"COLD_CONTROL_PRECONDITION_UNMET {record}", returncode=_PRECONDITION_EXIT)

              def pytest_sessionfinish(self, session, exitstatus):
                  self.observe("session_end", "", force=True)
                  self.line({"when": "exitstatus", "nodeid": "", "exitstatus": int(exitstatus),
                             "failed_writes": self.failed_writes})


          def main(argv):
              if "--" not in argv:
                  print(__doc__, file=sys.stderr)
                  return 2
              own, rest = argv[:argv.index("--")], argv[argv.index("--") + 1:]
              options = dict(zip(own[::2], own[1::2]))
              if len(own) % 2 or set(options) - {"--observe", "--prepare-shared-node"} or "--observe" not in options:
                  print(__doc__, file=sys.stderr)
                  return 2
              sys.path[0] = os.getcwd()  # as `python -m pytest`: the tree under test, not this equipment's directory
              return int(pytest.main(rest, plugins=[Observer(options["--observe"], options.get("--prepare-shared-node", ""))]))


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          EOF_QA_EQUIPMENT
          cat > "$EQ/pack_evidence.py" <<'EOF_QA_EQUIPMENT'
          """Pack evidence into a tar that keeps POSIX names byte-exact, with a manifest that never assumes UTF-8 names.
          Temporary QA equipment for the Node failure-pair diagnostic, not product. Stdlib only; reads, never removes.

            pack_evidence.py retained RESULT_JSON TEMP_PARENT OUT_PREFIX [MAX_BYTES]
                Exactly the paths one safe_test result declares retained (cleanup.retained and kept[].path), each inside that
                result's scratch, the scratch inside TEMP_PARENT. Nothing undeclared is read, nothing is searched for.
            pack_evidence.py tree ROOT OUT_PREFIX [MAX_BYTES]
                Everything under ROOT (this job's own evidence directory).

          Writes OUT_PREFIX.tar (GNU format: names are the raw bytes) and OUT_PREFIX.manifest.json (ASCII only). Each entry names
          its path twice: 'path' readable (invalid UTF-8 shown as \\xNN) and 'path_b64' exact. Symlinks are archived as links;
          sockets and other special files are listed, not archived. Exit 0: status complete or nothing_declared; 1: refused or
          partial (problems listed); 2: usage, or the manifest itself could not be written.
          """
          import base64
          import hashlib
          import json
          import os
          import stat
          import sys
          import tarfile

          DEFAULT_MAX_BYTES = 2 << 30


          def text(value):
              """Any str or bytes as printable ASCII-safe text: undecodable bytes or lone surrogates become \\xNN."""
              raw = value if isinstance(value, bytes) else str(value).encode("utf-8", "surrogateescape")
              return raw.decode("utf-8", "backslashreplace")


          def named(raw):
              try:
                  raw.decode("utf-8")
                  utf8 = True
              except UnicodeDecodeError:
                  utf8 = False
              return {"path": text(raw), "path_b64": base64.b64encode(raw).decode("ascii"), "utf8": utf8}


          def walk(root, problems):
              yield root
              if os.path.isdir(root) and not os.path.islink(root):
                  for dirpath, dirnames, filenames in os.walk(root, onerror=lambda exc: problems.append(
                          f"unreadable directory {text(os.fsencode(exc.filename or b''))}: {exc.strerror}")):
                      dirnames.sort()
                      for name in sorted(dirnames + filenames):
                          yield os.path.join(dirpath, name)


          def kind(mode):
              for test, label in ((stat.S_ISREG, "file"), (stat.S_ISDIR, "dir"), (stat.S_ISLNK, "symlink"),
                                  (stat.S_ISFIFO, "fifo"), (stat.S_ISSOCK, "socket")):
                  if test(mode):
                      return label
              return "other"


          def pack(roots, base, out_prefix, max_bytes, problems):
              """Archive every path under the byte ``roots`` with names relative to ``base``; returns the manifest entries."""
              entries, total = [], 0
              with tarfile.open(out_prefix + ".tar", "w", format=tarfile.GNU_FORMAT,
                                encoding="utf-8", errors="surrogateescape") as tar:
                  for root in roots:
                      for path in walk(root, problems):
                          entry = named(path)
                          entries.append(entry)
                          try:
                              info = os.lstat(path)
                          except OSError as exc:
                              entry["archived"] = False
                              problems.append(f"unreadable {entry['path']}: {exc.strerror}")
                              continue
                          entry.update(type=kind(info.st_mode), mode=oct(stat.S_IMODE(info.st_mode)))
                          if entry["type"] in ("socket", "other"):
                              entry["archived"] = False  # listed so its absence from the tar is explicit, not a gap
                              continue
                          arcname = os.fsdecode(os.path.relpath(path, base))
                          try:
                              if entry["type"] == "file":
                                  entry["size"] = info.st_size
                                  if total + info.st_size > max_bytes:
                                      entry["archived"] = False
                                      problems.append(f"size cap {max_bytes} reached at {entry['path']}")
                                      continue
                                  digest = hashlib.sha256()
                                  with open(path, "rb") as stream:
                                      for block in iter(lambda: stream.read(1 << 20), b""):
                                          digest.update(block)
                                  entry["sha256"] = digest.hexdigest()
                                  member = tar.gettarinfo(os.fsdecode(path), arcname=arcname)
                                  with open(path, "rb") as stream:
                                      tar.addfile(member, stream)
                                  total += info.st_size
                              else:
                                  if entry["type"] == "symlink":
                                      entry["target"] = named(os.readlink(path))
                                  tar.addfile(tar.gettarinfo(os.fsdecode(path), arcname=arcname))
                              entry["archived"] = True
                          except OSError as exc:
                              entry["archived"] = False
                              problems.append(f"not archived {entry['path']}: {exc.strerror or exc}")
              return entries


          def inside(path, root):
              return os.path.commonpath([path, root]) == root


          def declared_roots(result_path, temp_parent, problems):
              """The retained paths a safe_test result declares, as bytes, after checking each lies in its scratch."""
              try:
                  with open(result_path, encoding="utf-8") as stream:
                      result = json.load(stream)
              except (OSError, ValueError) as exc:
                  problems.append(f"result unreadable: {text(str(exc))}")
                  return None, []
              scratch = result.get("scratch") if isinstance(result, dict) else None
              if not isinstance(scratch, str) or not os.path.isabs(scratch):
                  problems.append(f"result names no absolute scratch: {text(repr(scratch))}")
                  return None, []
              parent = os.path.realpath(os.fsencode(temp_parent))
              scratch_real = os.path.realpath(os.fsencode(scratch))
              if not inside(scratch_real, parent) or scratch_real == parent:
                  problems.append(f"scratch {text(scratch)} is not inside the temp parent {text(temp_parent)}")
                  return scratch_real, []
              cleanup = result.get("cleanup")
              if not isinstance(cleanup, dict) or not all(isinstance(cleanup.get(key), list) for key in ("released", "retained")):
                  problems.append("cleanup is not a final producer record; retained scratch is unknown")
                  return scratch_real, []
              declared = list(cleanup["retained"])
              declared += [row.get("path") for row in result.get("kept") or [] if isinstance(row, dict)]
              roots = []
              for value in declared:
                  if not isinstance(value, str) or not os.path.isabs(value):
                      problems.append(f"declared path is not an absolute path: {text(repr(value))}")
                      continue
                  real = os.path.realpath(os.fsencode(value))
                  if not inside(real, scratch_real):
                      problems.append(f"declared path {text(value)} is outside the scratch {text(scratch)}: refused")
                  elif not os.path.lexists(real):
                      problems.append(f"declared retained path is missing: {text(value)}")
                  else:
                      roots.append(real)
              roots = sorted(set(roots))
              return scratch_real, [root for root in roots if not any(other != root and inside(root, other) for other in roots)]


          def main(argv):
              if len(argv) < 3 or argv[0] not in ("retained", "tree") or len(argv) > (5 if argv[0] == "retained" else 4):
                  print(__doc__, file=sys.stderr)
                  return 2
              problems, manifest = [], {"mode": argv[0], "format": "tar/gnu, raw byte names"}
              if argv[0] == "retained":
                  result_path, temp_parent, out_prefix = argv[1:4]
                  max_bytes = int(argv[4]) if len(argv) > 4 else DEFAULT_MAX_BYTES
                  manifest["result"] = text(result_path)
                  scratch, roots = declared_roots(result_path, temp_parent, problems)
                  base = os.path.dirname(scratch) if scratch else b"/"
              else:
                  root, out_prefix = argv[1:3]
                  max_bytes = int(argv[3]) if len(argv) > 3 else DEFAULT_MAX_BYTES
                  roots = [os.path.realpath(os.fsencode(root))]
                  base = os.path.dirname(roots[0])
                  if not os.path.isdir(roots[0]):
                      problems.append(f"root is not a directory: {text(root)}")
                      roots = []
              manifest["roots"] = [named(root) for root in roots]
              try:
                  manifest["entries"] = pack(roots, base, out_prefix, max_bytes, problems)
              except Exception as exc:
                  problems.append(f"packing stopped: {type(exc).__name__}: {text(str(exc))}")
                  manifest["entries"] = None
              manifest["problems"] = [text(problem) for problem in problems]
              manifest["status"] = ("partial" if problems else "nothing_declared" if not roots else "complete")
              try:
                  with open(out_prefix + ".manifest.json", "wb") as stream:
                      stream.write(json.dumps(manifest, ensure_ascii=True, indent=1).encode("ascii") + b"\n")
              except (OSError, ValueError) as exc:
                  print(f"manifest not written: {text(str(exc))}", file=sys.stderr)
                  return 2
              print(f"{manifest['status']}: {len(manifest['entries'] or [])} entries, {len(problems)} problems", file=sys.stderr)
              return 1 if problems else 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          EOF_QA_EQUIPMENT
          cat > "$EQ/summarize.py" <<'EOF_QA_EQUIPMENT'
          """Read the Node failure-pair diagnostic's records and say what they show. Temporary QA equipment, not product.

          usage: summarize.py QA_DIR   (writes QA_DIR/summary.json and summary.md; stdlib only, imports no product)

          Per run (runs/{B,C}/<module>/, control/{oldC,C}/cold/), on separate axes: execution (command exit, safe_test returncode,
          pytest exit status; never a gate); evidence (status, cmd argv/started/ended/exit, both raw streams, no capture problem,
          one executed safe_test result without errors, a JUnit testcase, retained snapshot exit 0 and manifest); observation
          (bracket lines, a phase report, no observer_error, unobserved read or unwritten line). Outcomes come from the phase
          reports, setup/call/teardown apart; JUnit is raw evidence only. source/after-{B,C,oldC}.txt must hold the bound commit
          and no change. Exit 1: anything INCOMPLETE, cold control not confirmed, or no Node cancellation call on C (a setup
          error, collection failure, skip or absence is not a run). Exit 0 says only that; test outcomes are data. A pass in
          isolation does not show the historical failure was on B; a failure on both is one cause only once the messages agree.
          """
          import glob
          import json
          import os
          import sys
          import xml.etree.ElementTree as ET

          MODULES = ("test_task_scope_lifetime", "test_launch_stop_contract", "test_body_restart_boundaries",
                     "test_skill_runtime_lifetime", "test_claudexor_admission_wait", "test_browser_session_lifecycle",
                     "test_cost_live_set", "test_stand_counts", "test_body_executor_environment")
          COLD = "tests/test_body_executor_environment.py::test_only_a_local_candidate_process_gets_the_host_driver_node[cold-]"
          NODE_CANCEL = "tests/test_skill_runtime_lifetime.py::test_owned_running_skill_process_can_be_cancelled_without_survivors[node-"
          _TSL = "tests/test_task_scope_lifetime.py::"
          # Run 43768940995, Linux parallel pass, failed reports (nodeid, phase), as linux-assessment.json lists them.
          HISTORICAL = [
              ("tests/test_cost_live_set.py::test_a_pass_over_the_unchanged_largest_set_rests[custody-maintenance]", "call"),
              ("tests/test_stand_counts.py::test_e2_a_pass_over_the_unchanged_largest_set_rests[wal-reduced-custody-maintenance]", "call"),
              ("tests/test_stand_counts.py::test_e2_a_pass_over_the_unchanged_largest_set_rests[persist-reduced-custody-maintenance]", "call"),
              ("tests/test_browser_session_lifecycle.py::test_closing_settles_a_hung_command_and_a_concurrent_close_reports_the_first", "call"),
              ("tests/test_launch_stop_contract.py::test_a_stop_writing_ahead_after_the_other_stop_of_its_launch_finished_still_leaves_no_record", "call"),
              *((_TSL + name, "teardown") for name in (
                  "test_a_commands_background_child_lives_until_the_task_ends_then_is_ended_by_its_group[t-end]",
                  "test_a_commands_background_child_lives_until_the_task_ends_then_is_ended_by_its_group[manual]",
                  "test_a_non_platform_child_carries_the_task_marker_and_a_setsid_escape_is_still_ended",
                  "test_pause_retention_and_a_reopenable_placeholder_are_not_terminal",
                  "test_concurrent_turns_are_isolated",
                  "test_the_sweep_ends_a_dead_tasks_members_and_spares_live_paused_and_unknown_owners",
                  "test_the_server_sweeps_outstanding_obligations_at_startup",
                  "test_a_keep_service_sheds_the_task_marker_survives_the_task_end_and_dies_on_panic[t-keep]",
                  "test_a_keep_service_sheds_the_task_marker_survives_the_task_end_and_dies_on_panic[manual]",
                  "test_an_executor_foreground_command_carries_the_marker_and_records_its_group[t-exec]",
                  "test_an_executor_foreground_command_carries_the_marker_and_records_its_group[manual]",
                  "test_cleanup_threads_are_named_and_bounded",
                  "test_an_unverified_member_keeps_the_record_and_the_sweep_settles_it_later_writing_the_result_once",
                  "test_a_denied_signal_is_final_disclosed_on_the_result_and_retires_the_record",
                  "test_a_denied_member_beside_an_unverified_one_keeps_the_record_with_both_known",
                  "test_a_known_member_is_carried_into_the_next_pass_and_ended_once_its_identity_reads",
                  "test_known_identities_survive_a_failed_census_and_the_next_readable_pass_ends_them",
                  "test_a_known_member_whose_birth_changed_is_spared_and_discharged")),
              (COLD, "call"),
              ("tests/test_claudexor_admission_wait.py::test_initial_handshake_is_read_bounded_by_the_admission_window", "call"),
              ("tests/test_skill_runtime_lifetime.py::test_owned_running_skill_process_can_be_cancelled_without_survivors"
               "[python3-import time\\nwhile True: time.sleep(1)\\n]", "call"),
              ("tests/test_body_restart_boundaries.py::test_cached_stop_after_late_registration_cannot_arm_adoption", "call"),
              ("tests/test_skill_runtime_lifetime.py::test_owned_running_skill_process_can_be_cancelled_without_survivors"
               "[go-package main\\nfunc main(){for {}}\\n]", "call"),
          ]
          SAFE_TEST_ERRORS = ("containment_error", "launch_error", "source_gap", "evidence_error", "stopped",
                              "interrupt_escalation")
          REQUIRED = ("cmd.argv.txt", "cmd.started", "cmd.ended", "cmd.exit", "cmd.stdout.log", "cmd.stderr.log")
          BOUND = {"B": "base_B", "C": "tested_product_commit_C", "oldC": "original_candidate_oldC"}


          def read(path):
              try:
                  with open(path, encoding="utf-8", errors="backslashreplace") as stream:
                      return stream.read()
              except OSError:
                  return None


          def notable(row):
              return (row.get("when") in ("before", "after", "session_end") and "observer_error" not in row
                      and not str(row.get("registry", "")).startswith("unobserved")
                      and (row.get("registry") not in ([], "not imported") or row.get("owner_stop_began") is True
                           or row.get("node_generations") not in ([], "not imported")))


          def observe(path):
              """(facts {nodeid: {phase: [[outcome, message], ...]}}, rows, gaps) of one observe.jsonl."""
              text, rows, gaps, facts = read(path), [], [], {}
              if text is None:
                  return facts, rows, ["observe.jsonl missing"]
              for number, line in enumerate(text.splitlines(), 1):
                  try:
                      rows.append(json.loads(line))
                  except ValueError:
                      gaps.append(f"observe.jsonl line {number} unreadable")
              whens = [row.get("when") for row in rows]
              gaps += [f"no {need} line" for need in ("collected", "session_end", "exitstatus") if need not in whens]
              for row in rows:
                  if "observer_error" in row:
                      gaps.append(f"observer_error at {row.get('when')} {row.get('nodeid')}: {row['observer_error']}"[:300])
                  elif str(row.get("registry", "")).startswith("unobserved"):
                      gaps.append(f"registry unobserved at {row.get('when')} {row.get('nodeid')}")
                  elif row.get("when") == "report":
                      facts.setdefault(row.get("nodeid"), {}).setdefault(row.get("phase"), []).append(
                          [row.get("outcome"), row.get("message", "")])
                  elif row.get("when") == "exitstatus" and row.get("failed_writes"):
                      gaps.append(f"{row['failed_writes']} observer line(s) not written")
              if not facts:
                  gaps.append("no phase report")
              return facts, rows, gaps


          def testcases(path):
              try:
                  return sum(1 for _ in ET.parse(path).getroot().iter("testcase"))
              except (OSError, ET.ParseError):
                  return 0


          def run_record(directory):
              record = {"dir": directory, "status": (read(os.path.join(directory, "status")) or "missing").strip()}
              if record["status"].startswith("absent"):
                  return record
              if record["status"] == "missing":
                  record["evidence_missing"] = ["no run record"]
                  return record
              files = {name: read(os.path.join(directory, name)) for name in
                       (*REQUIRED, "cmd.capture-problems", "retained.pack.exit", "retained.manifest.json")}
              missing = [] if record["status"] == "ran" else [f"status {record['status']!r}"]
              missing += [f"{name} missing" for name in REQUIRED if files[name] is None]
              exit_text = (files["cmd.exit"] or "").strip()
              if files["cmd.exit"] is not None and not exit_text.lstrip("-").isdigit():
                  missing.append(f"cmd.exit unreadable: {exit_text[:40]!r}")
              if files["cmd.capture-problems"] is not None:
                  missing.append(f"capture problems: {files['cmd.capture-problems'].strip()[:200]}")
              results = sorted(glob.glob(os.path.join(directory, "safe-test", "run-*", "result.json")))
              try:
                  result = json.loads(read(results[0]) or "") if len(results) == 1 else None
              except ValueError:
                  result = None
              if not isinstance(result, dict):
                  missing.append(f"no single readable safe_test result.json ({len(results)} found)")
                  result = {}
              elif result.get("execution") != "executed":
                  missing.append(f"safe_test execution {result.get('execution')!r}")
              missing += [f"safe_test {key}: {str(result[key])[:200]}" for key in SAFE_TEST_ERRORS if result.get(key)]
              if not testcases(os.path.join(directory, "junit.xml")):
                  missing.append("JUnit missing, unreadable or without a testcase")
              if (files["retained.pack.exit"] or "").strip() != "0":
                  missing.append(f"retained snapshot exit {(files['retained.pack.exit'] or 'missing').strip()!r}")
              try:
                  snapshot = json.loads(files["retained.manifest.json"] or "")["status"]
              except (ValueError, KeyError, TypeError):
                  snapshot = "missing"
              if snapshot not in ("complete", "nothing_declared"):
                  missing.append(f"retained snapshot manifest {snapshot}")
              facts, rows, gaps = observe(os.path.join(directory, "observe.jsonl"))
              shown = [row for row in rows if notable(row)]
              record.update(
                  execution={"command_exit": int(exit_text) if exit_text.lstrip("-").isdigit() else None,
                             "safe_test_returncode": result.get("returncode"),
                             "pytest_exitstatus": next((r.get("exitstatus") for r in rows if r.get("when") == "exitstatus"), None)},
                  evidence_missing=missing, observation="INCOMPLETE" if gaps else "COMPLETE", observation_gaps=gaps, facts=facts,
                  prepared=[row for row in rows if row.get("when") == "control_prepared"], notable=shown[:30],
                  notable_count=len(shown))
              return record


          def facts_of(record, nodeid):
              """One nodeid's phase facts in a run, or why there are none."""
              if record is None or record["status"] == "missing":
                  return "no run"
              if record["status"].startswith("absent"):
                  return "module absent"
              facts = record.get("facts") or {}
              if nodeid in facts:
                  return facts[nodeid]
              collect = next((value for key, value in facts.items() if "collect" in value and nodeid.startswith(key)), None)
              return {"collect": collect["collect"]} if collect else "not collected"


          def text(value):
              return value if isinstance(value, str) else " ".join(
                  f"{phase}={'+'.join(str(outcome) for outcome, _ in rows)}" for phase, rows in value.items())


          def outcomes(value, phase):
              return [outcome for outcome, _ in value.get(phase, [])] if isinstance(value, dict) else []


          def messages(value, phase):
              return [message for outcome, message in value.get(phase, []) if outcome == "failed"] if isinstance(value, dict) else []


          def clean(value):
              return all(outcomes(value, phase) and set(outcomes(value, phase)) == {"passed"}
                         for phase in ("setup", "call", "teardown"))


          def reading(b, c, phase):
              b_failed, c_failed = "failed" in outcomes(b, phase), "failed" in outcomes(c, phase)
              if b_failed and c_failed:
                  return f"fails at {phase} on B and C in isolation; one cause is not shown until the messages are compared"
              if isinstance(b, str):
                  return f"no B counterpart ({b}): not a B pass; C {text(c)}"
              if c_failed:
                  return f"fails at {phase} on C only in isolation (B {text(b)})"
              if b_failed:
                  return f"fails at {phase} on B only in isolation (C {text(c)})"
              if clean(b) and clean(c):
                  return "passes in isolation on B and C: the historical failure stays UNKNOWN (isolation shows no baseline)"
              return f"B {text(b)}, C {text(c)}: UNKNOWN"


          def node_reading(value):
              calls = [outcome for outcome in outcomes(value, "call") if outcome in ("passed", "failed")]
              if not calls:
                  return "no call ran (a setup error, collection failure, skip or absence is not a run)"
              if "failed" in calls:
                  return "a call ran and FAILED: not a pass"
              return "a call ran; setup, call and teardown passed" if clean(value) else f"a call ran; {text(value)}: not a clean pass"


          def source_after(qa, tree, expected):
              lines = (read(os.path.join(qa, "source", f"after-{tree}.txt")) or "").splitlines()
              if not expected:
                  return "no bound commit"
              if not lines:
                  return "missing"
              if lines[0] != f"HEAD {expected}":
                  return f"drift: {lines[0][:60]}"
              return "clean" if len(lines) == 1 else f"drift: {len(lines) - 1} changed path(s): {lines[1:4]}"


          def main(argv):
              if len(argv) != 1:
                  print(__doc__, file=sys.stderr)
                  return 2
              qa = argv[0]
              summary = {"kind": "Node failure-pair diagnostic, NOT a qualification", "incomplete": [], "runs": {}}
              runs = summary["runs"]

              def take(key, record):
                  summary["incomplete"] += [f"{key}: {item}" for item in record.get("evidence_missing", [])]
                  summary["incomplete"] += [f"{key}: observation: {item}" for item in record.get("observation_gaps", [])]
                  return record

              for tree in ("B", "C"):
                  for module in MODULES:
                      runs[f"{tree}/{module}"] = take(f"{tree}/{module}", run_record(os.path.join(qa, "runs", tree, module)))
              summary["incomplete"] += [f"{key}: absent on C" for key, record in runs.items()
                                        if key.startswith("C/") and record["status"].startswith("absent")]
              if all(runs[f"B/{module}"]["status"].startswith("absent") for module in MODULES):
                  summary["incomplete"].append("B: no module ran")
              try:
                  binding = json.loads(read(os.path.join(qa, "binding", "binding.json")) or "")
              except ValueError:
                  binding = None
              binding = binding if isinstance(binding, dict) else {}
              summary["source_after"] = {tree: source_after(qa, tree, binding.get(key, "")) for tree, key in BOUND.items()}
              summary["incomplete"] += [f"source after {tree}: {state}" for tree, state in summary["source_after"].items()
                                        if state != "clean"]
              summary["historical"] = []
              for nodeid, phase in HISTORICAL:
                  module = nodeid.split("::")[0].split("/")[-1][:-3]
                  b, c = (facts_of(runs.get(f"{tree}/{module}"), nodeid) for tree in ("B", "C"))
                  summary["historical"].append({"nodeid": nodeid, "ci_phase": phase, "B": text(b), "C": text(c),
                                                "B_messages": messages(b, phase), "C_messages": messages(c, phase),
                                                "reading": reading(b, c, phase)})
              cases = {nodeid: value for nodeid, value in (runs["C/test_skill_runtime_lifetime"].get("facts") or {}).items()
                       if nodeid.startswith(NODE_CANCEL)}
              node = summary["node_cancellation_on_C"] = {
                  "ran": any(node_reading(value).startswith("a call ran") for value in cases.values()),
                  "cases": {nodeid: {"phases": text(value), "reading": node_reading(value)} for nodeid, value in cases.items()}}
              control = {}
              for tree in ("oldC", "C"):
                  record = take(f"control/{tree}", run_record(os.path.join(qa, "control", tree, "cold")))
                  record["precondition"] = bool(record.get("prepared")) and all(r.get("ok") is True for r in record["prepared"])
                  record["cold"] = facts_of(record, COLD)
                  control[tree] = record
              old, new = control["oldC"]["cold"], control["C"]["cold"]
              in_body = (outcomes(old, "setup") == ["passed"] and "failed" in outcomes(old, "call")
                         and any(m.startswith("test_body_executor_environment.py:") for m in messages(old, "call")))
              if not (control["oldC"]["precondition"] and control["C"]["precondition"]):
                  verdict = "INCOMPLETE: the shared data root was not shown prepared before the cold test"
              elif in_body and clean(new):
                  verdict = "CONFIRMED: with the shared root prepared the old test fails in its own body, the corrected one passes"
              else:
                  verdict = f"UNEXPECTED: oldC {text(old)}, C {text(new)}"
              summary["cold_control"] = {"verdict": verdict, "oldC_call_messages": messages(old, "call"),
                                         "oldC": control["oldC"], "C": control["C"]}
              summary["evidence"] = "INCOMPLETE" if summary["incomplete"] else "COMPLETE"
              lines = [f"# {summary['kind']}", "",
                       "Exit 0 means only: evidence COMPLETE, cold control CONFIRMED, a Node cancellation call ran on C. "
                       "Test outcomes are data; no row is a qualification.", "",
                       f"Evidence: **{summary['evidence']}**", f"Cold control: {verdict} {summary['cold_control']['oldC_call_messages']}",
                       f"Node cancellation on C: ran={node['ran']} {node['cases'] or 'no node case reported'}",
                       f"Source after the runs: {summary['source_after']}", "",
                       "| historical nodeid (run 43768940995) | CI phase | B | C | reading |", "|---|---|---|---|---|"]
              lines += [f"| `{row['nodeid']}` | {row['ci_phase']} | {row['B']} | {row['C']} | {row['reading']} |"
                        for row in summary["historical"]]
              lines += ["", "Messages at the CI phase (compare them before calling a cause shared):"]
              lines += [f"- `{row['nodeid']}`: B {row['B_messages']} / C {row['C_messages']}"
                        for row in summary["historical"] if row["B_messages"] or row["C_messages"]]
              lines += ["", "Per run: execution (never a gate), observation, notable observer states:"]
              lines += [f"- {key}: {record['execution']}, observation {record['observation']}, notable {record['notable_count']}"
                        + (f", first {json.dumps(record['notable'][0], ensure_ascii=True)}" if record["notable"] else "")
                        for key, record in [*runs.items(), *(("control/" + k, v) for k, v in control.items())]
                        if "execution" in record]
              lines += ["", "Missing or incomplete:"] + [f"- {item}" for item in summary["incomplete"]]
              report = "\n".join(lines).encode("utf-8", "backslashreplace") + b"\n"
              with open(os.path.join(qa, "summary.json"), "wb") as stream:
                  stream.write(json.dumps(summary, ensure_ascii=True, indent=1, default=str).encode("ascii") + b"\n")
              with open(os.path.join(qa, "summary.md"), "wb") as stream:
                  stream.write(report)
              sys.stdout.buffer.write(report)
              return 1 if summary["incomplete"] or not verdict.startswith("CONFIRMED") or not node["ran"] else 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          EOF_QA_EQUIPMENT
          (cd "$EQ" && sha256 diag_pytest.py pack_evidence.py summarize.py) | tee "$QA/binding/equipment.sha256"
          for name in diag_pytest.py pack_evidence.py summarize.py; do python3 -I -m py_compile "$EQ/$name"; done
          mkdir -p "$RUNNER_TEMP/qa-pack"
          # Self-check on this Linux filesystem: a non-UTF-8 name survives the pack byte-exact (APFS cannot hold one).
          check="$RUNNER_TEMP/qa-selfcheck"
          mkdir -p "$check/root"
          printf 'payload\n' > "$check/root/$(printf 'fixture_\xff.dat')"
          python3 -I "$EQ/pack_evidence.py" tree "$check/root" "$check/pack" > "$QA/binding/equipment-selfcheck.log" 2>&1
          cp "$check/pack.manifest.json" "$QA/binding/equipment-selfcheck.manifest.json"
          python3 -I -c 'import sys, tarfile; names = [n.encode("utf-8", "surrogateescape") for n in tarfile.open(sys.argv[1], encoding="utf-8", errors="surrogateescape").getnames()]; sys.exit(0 if b"root/fixture_\xff.dat" in names else 1)' "$check/pack.tar"
          cat > "$RUNNER_TEMP/qa-run.sh" <<'RUN'
          # one_run DIR TREE_ROOT [diag_pytest options...] -- PYTEST_ARGS...: one fresh safe_test process in TREE_ROOT,
          # then the snapshot of exactly the scratch its result declares retained. Exits are recorded, never returned.
          one_run() {
            local dir=$1 root=$2; shift 2
            local py="$GITHUB_WORKSPACE/.venv/bin/python" results
            mkdir -p "$dir/safe-test"
            echo ran > "$dir/status"
            (cd "$root" && run_logged "$dir/cmd" "$py" -I -S scripts/safe_test.py --temp-parent "$SAFE_TEST_TEMP_PARENT" \
              --evidence-dir "$dir/safe-test" --timeout 1800 -- "$py" "$EQ/diag_pytest.py" --observe "$dir/observe.jsonl" "$@" \
              -p no:cacheprovider -rA "--junitxml=$dir/junit.xml") || true
            results=("$dir"/safe-test/run-*/result.json)
            if [[ ${#results[@]} -eq 1 && -f "${results[0]}" ]]; then
              local rc=0
              python3 -I "$EQ/pack_evidence.py" retained "${results[0]}" "$SAFE_TEST_TEMP_PARENT" "$dir/retained" > "$dir/retained.pack.log" 2>&1 || rc=$?
              echo "$rc" > "$dir/retained.pack.exit"
            else
              echo "no single safe_test result.json: ${results[*]}" > "$dir/retained.pack.log"
            fi
          }
          RUN

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0  # B and the selection's diff need the history
          persist-credentials: false

      - name: Prove the checkout is C and record its source
        id: source
        run: |
          source "$RUNNER_TEMP/qa-lib.sh"
          S="$QA/source"
          head=$(git rev-parse HEAD)
          echo "$head" > "$S/head.txt"
          if [[ "$head" != "$CANDIDATE_SHA" ]]; then
            echo "::error title=Wrong checkout::HEAD is $head, not C $CANDIDATE_SHA"; exit 1
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "::error title=Base missing::B $BASE_SHA is not in the fetched history"; exit 1
          fi
          git rev-parse "HEAD^{tree}" > "$S/tree.txt"
          git log -1 --format=fuller HEAD > "$S/commit-C.txt"
          git log -1 --format=fuller "$BASE_SHA" > "$S/commit-B.txt"
          git merge-base "$BASE_SHA" HEAD > "$S/merge-base.txt" || echo "none" > "$S/merge-base.txt"
          if git merge-base --is-ancestor "$BASE_SHA" HEAD; then echo yes > "$S/base-is-ancestor.txt"
          else echo no > "$S/base-is-ancestor.txt"; echo "::error title=B not an ancestor::B $BASE_SHA is not an ancestor of C"; exit 1; fi
          git diff --name-status "$BASE_SHA" HEAD > "$S/changed-B-to-C.txt"
          # oldC is the run-43768940995 product; C must be oldC plus exactly the two-file test correction.
          if ! git cat-file -e "$ORIGINAL_SHA^{commit}" 2>/dev/null; then
            echo "::error title=oldC missing::$ORIGINAL_SHA is not in the fetched history"; exit 1
          fi
          git rev-parse "$ORIGINAL_SHA^{tree}" > "$S/tree-oldC.txt"
          git rev-parse "$BASE_SHA^{tree}" > "$S/tree-B.txt"
          git diff --name-only "$ORIGINAL_SHA" HEAD > "$S/changed-oldC-to-C.txt"
          git diff "$ORIGINAL_SHA" HEAD > "$S/oldC-to-C.diff"
          printf '%s\n' tests/test_body_executor_environment.py tests/test_skill_runtime_lifetime.py > "$S/expected-oldC-to-C.txt"
          if ! cmp -s "$S/changed-oldC-to-C.txt" "$S/expected-oldC-to-C.txt"; then
            echo "::error title=Unexpected correction::oldC..C must change exactly the two test files"; cat "$S/changed-oldC-to-C.txt"; exit 1
          fi
          if ! git merge-base --is-ancestor "$BASE_SHA" "$ORIGINAL_SHA"; then
            echo "::error title=B not an ancestor of oldC::$BASE_SHA"; exit 1
          fi
          git diff --name-status "$BASE_SHA" HEAD -- uv.lock requirements-runtime.lock pyproject.toml > "$S/lock-diff-B-to-C.txt"
          if [[ -s "$S/lock-diff-B-to-C.txt" ]]; then echo "::warning title=B lock differs::B runs with C's locked environment; see source/lock-diff-B-to-C.txt"; fi
          git status --porcelain=v1 --untracked-files=all > "$S/status-before.txt"
          if [[ -s "$S/status-before.txt" ]]; then echo "::warning title=Dirty checkout::see source/status-before.txt"; fi
          sha256 ouroboros/claudexor_runtime_pin.json uv.lock requirements-runtime.lock pyproject.toml \
            scripts/run_tests.py scripts/safe_test.py scripts/download_node_standalone.py \
            .github/actions/setup-python-env/action.yml > "$S/sha256.txt"
          python3 -I - ouroboros/claudexor_runtime_pin.json "$S/node-pin.json" <<'PY'
          import json, os, sys
          release = json.load(open(sys.argv[1], encoding="utf-8"))["release"]
          pinned = release["node_version"]
          record = {"node_version": pinned, "linux-x64": release["node_artifacts"].get("linux-x64")}
          with open(sys.argv[2], "w", encoding="utf-8") as stream:
              json.dump(record, stream, indent=2)
              stream.write("\n")
          if pinned != os.environ["EXPECTED_NODE"]:
              print(f"::error title=Unexpected Node pin::C pins Node {pinned}, not {os.environ['EXPECTED_NODE']}")
              sys.exit(1)
          PY

      # C's own action: shipped python-build-standalone, uv 0.12.1, `uv sync --locked` of the browser
      # extra and dev group WITHOUT installing the project, then the runtime lock export comparison.
      # Its output is in the run log only; the next step records the resulting environment.
      - uses: ./.github/actions/setup-python-env
        id: setup_python
        with:
          interpreter: shipped
          install-project: 'false'

      - name: Record the locked non-editable Python
        id: python_runtime
        run: |
          source "$RUNNER_TEMP/qa-lib.sh"
          qa_source_is_c "$QA/source/state-after-setup.txt"
          R="$QA/runtime"
          PY=.venv/bin/python
          test -x "$PY"
          {
            echo "lexical: $PY"
            echo "resolved: $(readlink -f "$PY")"
            echo "OUROBOROS_CI_INTERPRETER: ${OUROBOROS_CI_INTERPRETER:-}"
            "$PY" -c 'import sqlite3, sys; print("python", sys.version.replace("\n", " ")); print("sqlite", sqlite3.sqlite_version)'
            uv --version
          } > "$R/python.txt"
          sha256 "$(readlink -f "$PY")" > "$R/python-binary.sha256"
          uv pip freeze --python "$PY" > "$R/pip-freeze.txt"
          if grep -E '^-e |ouroboros @ file:' "$R/pip-freeze.txt"; then
            echo "::error title=Project installed::the environment installs the checkout; expected locked dependencies only"; exit 1
          fi
          # Under -I the working directory is not importable: only an installed project would be found.
          if ! "$PY" -I -c 'import importlib.util, sys; sys.exit(importlib.util.find_spec("ouroboros") is not None)'; then
            echo "::error title=Project installed::ouroboros is importable outside the checkout"; exit 1
          fi
          cat "$R/python.txt"

      - name: Prepare and assert the candidate's pinned Node
        id: node
        run: |
          source "$RUNNER_TEMP/qa-lib.sh"
          R="$QA/runtime"
          NODE_ROOT="$RUNNER_TEMP/node-standalone"
          NODE="$NODE_ROOT/bin/node"
          # C's script: pinned URL, exact size and SHA-256 before anything runs, then `node --version`.
          run_logged "$QA/phases/node-prepare" .venv/bin/python scripts/download_node_standalone.py --destination "$NODE_ROOT"
          test -x "$NODE"
          sha256 "$NODE" > "$R/node-binary.sha256"
          env -u NODE_OPTIONS "$NODE" -p 'JSON.stringify({execPath: process.execPath, platform: process.platform, arch: process.arch, release: process.release, versions: process.versions}, null, 2)' > "$R/node-process.json"
          actual=$(env -u NODE_OPTIONS "$NODE" -p 'process.versions.node')
          brotli=$(env -u NODE_OPTIONS "$NODE" -p 'process.versions.brotli')
          echo "node $actual, brotli $brotli ($NODE)" | tee "$R/node.txt"
          python3 -I - "$QA/phases/node-prepare.stdout.log" "$R/node-binary.sha256" "$QA/source/node-pin.json" "$actual" "$brotli" <<'PY'
          import json, os, re, sys
          log, binary, pin, actual, brotli = sys.argv[1:6]
          def version(text):
              parts = re.findall(r"\d+", text)[:3]
              if len(parts) < 3:
                  raise SystemExit(f"::error title=Unparseable version::{text!r}")
              return tuple(int(part) for part in parts)
          problems = []
          if actual != os.environ["EXPECTED_NODE"]:
              problems.append(f"the prepared binary runs Node {actual}, not {os.environ['EXPECTED_NODE']}")
          if version(brotli) < version(os.environ["MIN_BROTLI"]):
              problems.append(f"Brotli {brotli} is older than {os.environ['MIN_BROTLI']}")
          lines = [line for line in open(log, encoding="utf-8").read().splitlines() if line.strip()]
          report = json.loads(lines[-1]) if lines else {}
          measured = open(binary, encoding="utf-8").read().split()[0]
          if report.get("binary_sha256") != measured:
              problems.append(f"binary hash {measured} differs from the script's report {report.get('binary_sha256')}")
          expected_archive = (json.load(open(pin, encoding="utf-8")).get("linux-x64") or {}).get("sha256")
          if report.get("archive_sha256") != expected_archive:
              problems.append(f"archive {report.get('archive_sha256')} is not the pin's {expected_archive}")
          for problem in problems:
              print(f"::error title=Node qualification::{problem}")
          sys.exit(1 if problems else 0)
          PY
          echo "$NODE_ROOT/bin" >> "$GITHUB_PATH"  # first on PATH for every later step

      # The last step before the runs: it also proves the checkout still holds exactly C.
      - name: Prove PATH selects the prepared Node and the source is still C
        id: path_node
        if: steps.node.outcome == 'success'
        run: |
          source "$RUNNER_TEMP/qa-lib.sh"
          qa_source_is_c "$QA/source/state-before-cli.txt"
          mkdir -p "$QA/runs" "$QA/control"
          found=$(command -v node) || found=""
          version=$(node -p process.versions.node 2>&1) || version="node -p failed: $version"
          echo "node on PATH: ${found:-none} ($version)" | tee "$QA/runtime/path-node.txt"
          if [[ "$found" != "$RUNNER_TEMP/node-standalone/bin/node" ]]; then
            echo "::error title=Node selection::PATH resolves node to $found, not the prepared binary"; exit 1
          fi

      - name: Lay out B and oldC as detached worktrees
        id: worktrees
        if: steps.path_node.outcome == 'success' && steps.equipment.outcome == 'success'
        run: |
          git worktree add --detach "$RUNNER_TEMP/tree-B" "$BASE_SHA" > "$QA/phases/worktree-B.log" 2>&1
          git worktree add --detach "$RUNNER_TEMP/tree-oldC" "$ORIGINAL_SHA" > "$QA/phases/worktree-oldC.log" 2>&1
          for tree in B oldC; do
            echo "HEAD $(git -C "$RUNNER_TEMP/tree-$tree" rev-parse HEAD) tree $(git -C "$RUNNER_TEMP/tree-$tree" rev-parse 'HEAD^{tree}')" > "$QA/source/worktree-$tree.txt"
          done

      # B then C per module, each alone in its own fresh process; nothing here turns the job red but missing records.
      - name: Pair B and C on the nine modules
        id: pairs
        if: steps.worktrees.outcome == 'success'
        timeout-minutes: 240
        run: |
          source "$RUNNER_TEMP/qa-lib.sh"
          source "$RUNNER_TEMP/qa-run.sh"
          for module in test_task_scope_lifetime test_launch_stop_contract test_body_restart_boundaries \
                        test_skill_runtime_lifetime test_claudexor_admission_wait test_browser_session_lifecycle \
                        test_cost_live_set test_stand_counts test_body_executor_environment; do
            for tree in B C; do
              if [[ $tree == B ]]; then root="$RUNNER_TEMP/tree-B"; else root="$GITHUB_WORKSPACE"; fi
              dir="$QA/runs/$tree/$module"
              if [[ ! -f "$root/tests/$module.py" ]]; then
                mkdir -p "$dir"; echo "absent: tests/$module.py is not in $tree" > "$dir/status"; continue
              fi
              one_run "$dir" "$root" -- "tests/$module.py"
              echo "$tree $module exit $(cat "$dir/cmd.exit" 2>/dev/null || echo unrecorded)"
            done
          done

      # The cold case with the shared data root really prepared: the negative (oldC) and positive (C) control.
      - name: Cold control on oldC and C with a prepared shared data root
        id: control
        if: steps.worktrees.outcome == 'success'
        timeout-minutes: 30
        env:
          COLD: 'tests/test_body_executor_environment.py::test_only_a_local_candidate_process_gets_the_host_driver_node[cold-]'
        run: |
          source "$RUNNER_TEMP/qa-lib.sh"
          source "$RUNNER_TEMP/qa-run.sh"
          for tree in oldC C; do
            if [[ $tree == oldC ]]; then root="$RUNNER_TEMP/tree-oldC"; else root="$GITHUB_WORKSPACE"; fi
            one_run "$QA/control/$tree/cold" "$root" --prepare-shared-node "$COLD" -- "$COLD"
            echo "$tree cold control exit $(cat "$QA/control/$tree/cold/cmd.exit" 2>/dev/null || echo unrecorded)"
          done

      # Read-only records. Each tree's state after the runs (HEAD, then every tracked change or non-ignored untracked
      # file) goes to source/after-<tree>.txt; summarize.py requires the bound commit and nothing else there.
      - name: Record teardown and each tree's source state
        id: teardown
        if: always()
        run: |
          T="$QA/teardown"
          mkdir -p "$T" "$QA/source"
          note() { echo "$*" >> "$T/problems.txt"; }
          date -u +%Y-%m-%dT%H:%M:%SZ > "$T/at.txt"
          for spec in "C=$GITHUB_WORKSPACE" "B=$RUNNER_TEMP/tree-B" "oldC=$RUNNER_TEMP/tree-oldC"; do
            tree=${spec%%=*} root=${spec#*=}
            if [[ ! -d "$root" ]]; then note "tree $tree absent at teardown"; continue; fi
            { echo "HEAD $(git -C "$root" rev-parse HEAD)"; git -C "$root" status --porcelain=v1 --untracked-files=all; } \
              > "$QA/source/after-$tree.txt" || note "source state of $tree not recorded"
          done
          ps -eo pid,ppid,pgid,etime,stat,args > "$T/processes.txt" 2>&1 || note "ps exited $?"
          df -h > "$T/disk.txt" 2>&1 || note "df exited $?"
          if command -v free >/dev/null; then free -m > "$T/memory.txt" 2>&1 || note "free exited $?"; else note "free not available"; fi

      - name: Summarize (a diagnostic, not a qualification)
        id: summary
        if: always()
        run: |
          python3 -I "$RUNNER_TEMP/qa-equipment/summarize.py" "$QA" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # One tar of the whole evidence tree: the uploader never sees a non-UTF-8 name, the tar keeps it byte-exact.
      - name: Pack the evidence with byte-exact names
        id: pack
        if: always()
        run: |
          rc=0
          python3 -I "$RUNNER_TEMP/qa-equipment/pack_evidence.py" tree "$QA" "$RUNNER_TEMP/qa-pack/qa-evidence" || rc=$?
          echo "$rc" > "$RUNNER_TEMP/qa-pack/pack.exit"
          cp "$QA/summary.md" "$QA/summary.json" "$RUNNER_TEMP/qa-pack/" || echo "summary not copied" >> "$RUNNER_TEMP/qa-pack/pack.problems"
          exit "$rc"

      - name: Upload the evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-diag-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-pack/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
