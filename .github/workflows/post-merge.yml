# Post-merge check: after merges land on `ouroboros`, the tests they affect run here.
#
# Owner decision 3A (2026-10-21): nobody waits before a merge. After merged changes a small check
# of the affected tests starts by itself, and several merges in a row are checked by one run: the
# concurrency group keeps one run going and one pending, every newer push replaces the pending
# one. The next push advances past a window once one attempt measured it on both systems, handed
# off their remaining persistent failures and had no failed cost test. A later rerun behind that
# qualified point keeps its own result; it is not evidence about the intervening commits.
# Owner decision 3A (2026-10-28): the same tests also run on Windows, on setup-python's interpreter,
# whose SQLite keeps the stores in PERSIST as an install updated in place does (the Linux leg runs
# the shipped interpreter and WAL, as fresh installs do). The Linux leg alone runs what does not
# depend on the system: the release's lint gate (`ruff check --select F`, owner decision 2A,
# 2026-10-22), its size check (`pytest -m size_ratchet` against the base) and the cost contract.
# A lint finding or a red size test is red without a retry. A red test runs once more (passing
# then = flaky: reported, never handed over); a red again is bisected over the first-parent merges
# to the merge that broke it and handed to that pull request's author (one comment) and to
# Ouroboros (an issue labelled `post-merge-red` for that leg's system, which a later run of the
# same leg closes once the tests pass and the findings are gone). The check blocks nothing,
# reverts nothing, runs on no schedule and uses no secret: only this workflow's own GITHUB_TOKEN
# with the permissions below. scripts/post_merge_check.py documents each step.
# A window that touches the interface also starts .github/workflows/post-merge-browser.yml (owner choice 1,
# 2026-11-25, a pilot until PILOT_UNTIL or the first release after PILOT_RELEASE): a run of its own, which nothing
# here waits for or reads. Only the `browser-dispatch` job, which checks out and runs no repository code, holds
# `actions: write`, and its failure changes no verdict.

name: Post-merge check
run-name: Post-merge range check

on:
  push:
    branches:
      - ouroboros
  workflow_dispatch:
    inputs:
      base:
        description: First-parent commit to start the first measured window (full SHA)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: post-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  window:
    if: github.repository == 'razzant/ouroboros' && github.ref == 'refs/heads/ouroboros'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      window: ${{ steps.base.outputs.window }}
      browser: ${{ steps.browser_scope.outputs.applicable }}
      browser_base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Choose the selection window for both systems
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          INITIAL_BASE: ${{ inputs.base }}
        run: python3 scripts/post_merge_check.py base --evidence-dir "$RUNNER_TEMP/post-merge-window"
      - name: Upload the full replay input
        if: steps.base.outputs.handoff_file == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-merge-handoff-window-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/post-merge-window/handoff.json
          retention-days: 30
          if-no-files-found: error
      - name: Post-merge replay input ${{ steps.base.outputs.replay }}
        run: echo "Recorded outstanding hand-overs for a run interrupted before its legs finish."
      # Whether the window touches the interface (scripts/post_merge_browser_select.py `scope`); the
      # `browser-dispatch` job starts post-merge-browser.yml over this frozen window. A selector that fails fails
      # this step visibly and starts nothing; it never stops a leg.
      - name: Decide whether the browser check applies
        id: browser_scope
        continue-on-error: true
        timeout-minutes: 3
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -o pipefail
          python3 -I -S scripts/post_merge_browser_select.py scope --base "$BASE" --head "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Post-merge ${{ fromJSON(steps.base.outputs.window).continuous && 'confirmed' || 'provisional' }} base ${{ steps.base.outputs.base }}
        run: echo "Recorded the shared starting point before either leg runs."

  post-merge:
    needs: window
    # Only the official repository hands reds to the authors of its merges.
    if: github.repository == 'razzant/ouroboros' && github.ref == 'refs/heads/ouroboros'
    name: post-merge (${{ matrix.leg }}) from ${{ fromJSON(needs.window.outputs.window).base }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, leg: linux, interpreter: shipped, journal: WAL, gates: --lint --size}
          - {os: windows-latest, leg: windows, interpreter: setup-python, journal: PERSIST, gates: ''}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 165
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE_NAME: post-merge-${{ github.run_id }}-${{ github.run_attempt }}
      BASE: ${{ fromJSON(needs.window.outputs.window).base }}
      # This job provisions pytest-xdist/pytest-timeout and node 22, so the gate's real-spawn
      # tests run here instead of skipping, as in ci.yml's test jobs.
      OUROBOROS_PREFLIGHT_REQUIRE_PLUGINS: "1"
      OUROBOROS_PREFLIGHT_REQUIRE_NODE: "1"
      # As in ci.yml's full-test-runs: Windows runners report two physical cores for four vCPUs,
      # and the workload waits on storage, not the CPU.
      OUROBOROS_PREFLIGHT_TEST_WORKERS: ${{ matrix.os == 'windows-latest' && '4' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # the base and every commit a bisection probes
      # Test temp on the runner's work disk (D:, beside the checkout), as in ci.yml's Windows legs.
      - name: Put Windows test temp on the work disk
        if: ${{ runner.os == 'Windows' }}
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      # Dependencies only, never the project: an installed checkout would let a probe's test
      # processes import the head's code instead of the probed commit's (scripts/post_merge_check.py).
      - uses: ./.github/actions/setup-python-env
        id: setup_python
        with:
          interpreter: ${{ matrix.interpreter }}
          install-project: 'false'
      # A drifted runner image is loud here (an annotation on the run) but no verdict on the code: the
      # update letter of every install reads this run's conclusion. The tests still check this system.
      - name: The stores run ${{ matrix.journal }} here
        continue-on-error: true
        run: python -c "import pathlib, sys, tempfile; from ouroboros import store; probe = pathlib.Path(tempfile.mkdtemp()) / 'probe.sqlite'; probe.touch(); mode = store._journal_mode(probe, store.TIER_ENFORCED); print('stores run', mode); mode == sys.argv[1] or print(f'::error title=Post-merge journal mode::this leg runs the stores in {mode}, not {sys.argv[1]}, so it no longer checks what it claims'); sys.exit(mode != sys.argv[1])" ${{ matrix.journal }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !cancelled() }}
        id: setup_node
        with:
          node-version: '22'
      # The POSIX utilities the Windows legs of ci.yml give the same tests (rsync among them).
      - name: Set up Windows POSIX test utilities
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        id: posix_tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MSYS
          release: false
          update: true
          install: rsync
      - name: Select Windows POSIX test utilities
        id: select_posix_tools
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.posix_tools.outcome == 'success' }}
        shell: pwsh
        run: '"${{ steps.posix_tools.outputs.msys2-location }}\usr\bin" >> $env:GITHUB_PATH'
      - name: Record the shared selection window
        id: base
        if: ${{ !cancelled() && steps.setup_python.outcome == 'success' }}
        env:
          WINDOW: ${{ needs.window.outputs.window }}
        run: |
          mkdir -p "$RUNNER_TEMP/$EVIDENCE_NAME"
          printf '%s\n' "$WINDOW" > "$RUNNER_TEMP/$EVIDENCE_NAME/base.json"
      # What the size check measures books with: the owner's `book-growth` label on a merged pull
      # request of this window, read for each merge as its own push would be (book_growth_mode.py).
      - name: Decide the reference-book growth mode of the merges
        id: growth
        if: ${{ !cancelled() && steps.base.outcome == 'success' && contains(matrix.gates, '--size') }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: python scripts/post_merge_check.py growth --evidence-dir "$RUNNER_TEMP/$EVIDENCE_NAME" --base "$BASE" --head "$GITHUB_SHA"
      # Red here is not the verdict: the retry below separates FAILED from FLAKY. One Windows runner
      # cannot finish a full escalation (ci.yml runs it in eight shards): it runs the contract floor
      # and what the changes that did not escalate select by themselves. Each first-parent commit of
      # the window selects (--each-commit): a held window still runs a module a later commit reverted.
      - name: Run the affected tests (contract floor + affected modules and the complete Node lane)
        id: selected
        if: >-
          ${{ !cancelled() && steps.base.outcome == 'success' && steps.setup_node.outcome == 'success'
          && (runner.os != 'Windows' || steps.select_posix_tools.outcome == 'success') }}
        timeout-minutes: 95
        continue-on-error: true
        env:
          DEFER_FULL: ${{ runner.os == 'Windows' && '--defer-full' || '' }}
        run: python scripts/run_tests.py --selected --base "$BASE" --each-commit --keep-going $DEFER_FULL --evidence-dir "$RUNNER_TEMP/$EVIDENCE_NAME"
      - name: Run each red once more (FAILED or FLAKY)
        id: classify
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        timeout-minutes: 15
        run: >-
          python scripts/post_merge_check.py classify --evidence-dir "$RUNNER_TEMP/$EVIDENCE_NAME"
          ${{ matrix.gates }} --base "$BASE" --selected-outcome "${{ steps.selected.outcome }}"
      - name: Find the merge that broke each FAILED test
        id: attribute
        if: ${{ !cancelled() && steps.classify.outcome == 'success' }}
        timeout-minutes: 20
        run: python scripts/post_merge_check.py attribute --evidence-dir "$RUNNER_TEMP/$EVIDENCE_NAME" --base "$BASE" --head "$GITHUB_SHA"
      # Also after a retry or bisection cut short by its timeout: what they recorded is handed over,
      # and only a finished bisection ever names a pull request.
      - name: Hand each red to its author and to Ouroboros; close this system's issues that are green again
        id: route
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: python scripts/post_merge_check.py route --evidence-dir "$RUNNER_TEMP/$EVIDENCE_NAME" --run-url "$RUN_URL" --attempt ${{ github.run_attempt }} --os ${{ matrix.leg }}
      # Independent of affected-module selection: every merge exercises the complete
      # k=30 cost contract, including rest, scale shapes and producer boundaries. Measured on Linux.
      - name: Cost contract (rest law, scale shapes and producer boundaries; k=30)
        id: cost_contract
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.setup_python.outcome == 'success' && steps.setup_node.outcome == 'success' }}
        timeout-minutes: 8
        run: python -m pytest -q -o addopts="" -m "scale and not integration" tests/test_cost_contract.py --ci-evidence-dir "$RUNNER_TEMP/$EVIDENCE_NAME/cost-contract"
      - name: Upload the evidence
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-merge-evidence-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Public diagnostic evidence only: the passes' exports and the stages' records leave the runner. The
          # raw selection payloads stay on it — selection.json (the record still holding the complete inventory)
          # and the copies run_tests.py parks with a `.previous-` suffix, the full inventory-*.jsonl, the probe
          # plugins that carry the scope and the warm's file list. No reader of this artifact consumes those; the
          # hand-off's own dedicated upload carries the validated handoff.json.
          path: |
            ${{ runner.temp }}/${{ env.EVIDENCE_NAME }}/
            !${{ runner.temp }}/${{ env.EVIDENCE_NAME }}/inventory-*.jsonl
            !${{ runner.temp }}/${{ env.EVIDENCE_NAME }}/probe/
            !${{ runner.temp }}/${{ env.EVIDENCE_NAME }}/selection.json
            !${{ runner.temp }}/${{ env.EVIDENCE_NAME }}/selection.previous-*.json
            !${{ runner.temp }}/${{ env.EVIDENCE_NAME }}/warm-files.txt
          retention-days: 14
          if-no-files-found: ignore
      # The leg is red when a selected test/check/stage fails or its evidence is incomplete.
      # The Linux cost export must match this job's GITHUB_SHA, GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT.
      - name: Publish the result
        id: publish
        if: ${{ !cancelled() }}
        env:
          COST_CONTRACT_OUTCOME: ${{ steps.cost_contract.outcome }}
          POST_MERGE_CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          POST_MERGE_ATTRIBUTE_OUTCOME: ${{ steps.attribute.outcome }}
          POST_MERGE_ROUTE_OUTCOME: ${{ steps.route.outcome }}
        run: python scripts/post_merge_check.py summary --evidence-dir "$RUNNER_TEMP/$EVIDENCE_NAME" --attempt ${{ github.run_attempt }} --os ${{ matrix.leg }}
      - name: Upload the full hand-over result
        if: ${{ !cancelled() && steps.publish.outputs.handoff_file == 'yes' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-merge-handoff-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ env.EVIDENCE_NAME }}/handoff.json
          retention-days: 30
          if-no-files-found: error
      - name: Post-merge untracked ${{ steps.publish.outputs.untracked }}
        if: ${{ !cancelled() && steps.publish.outputs.untracked != '' }}
        run: echo "Recorded this system's remaining hand-over obligations."
      - name: Post-merge range measured
        if: ${{ !cancelled() && steps.publish.outputs.window_scope == 'push' }}
        run: echo "Measured $BASE..$GITHUB_SHA on $RUNNER_OS."
      - name: Post-merge continuous range measured
        if: ${{ !cancelled() && steps.publish.outputs.window_scope == 'chain' }}
        run: echo "Measured $BASE..$GITHUB_SHA on $RUNNER_OS from the confirmed base."

  # The only job with `actions: write`: no checkout, no repository code, one `gh workflow run` with the window's frozen
  # base and head. Its failure fails neither the legs nor this run (continue-on-error). The pilot ends by itself after
  # PILOT_UNTIL or once a release tag (vX.Y.Z, no pre-release suffix) newer than PILOT_RELEASE exists: the job then
  # starts nothing and says so in one summary line; re-enabling it is a pull request. Tags that cannot be read start
  # nothing either, and its summary line says so.
  browser-dispatch:
    needs: window
    if: github.repository == 'razzant/ouroboros' && github.ref == 'refs/heads/ouroboros' && needs.window.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Start the browser check of this window
        id: browser_dispatch
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.window.outputs.browser_base }}
          PILOT_UNTIL: "2026-12-10"
          PILOT_RELEASE: v7.12.1
        run: |
          ended=""
          if [[ "$(date -u +%F)" > "$PILOT_UNTIL" ]]; then ended="date ($PILOT_UNTIL passed)"; fi
          if [[ -z "$ended" ]]; then
            tags="$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*')" || {
              status=$?
              echo "browser pilot skipped: release tags could not be read (exit $status)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            }
            newest="$({ printf '%s\n' "$tags" | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true
              echo "$PILOT_RELEASE"; } | sort -V | tail -n 1)"
            if [[ "$newest" != "$PILOT_RELEASE" ]]; then ended="release ($newest)"; fi
          fi
          if [[ -n "$ended" ]]; then
            echo "browser pilot ended: $ended; re-enable by PR." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run post-merge-browser.yml --repo "$GITHUB_REPOSITORY" --ref ouroboros \
            -f base="$BASE" -f head="$GITHUB_SHA"
