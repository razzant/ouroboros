# Branch-only qualification of the work portal's synthetic Continue records.
name: Work portal observed-time fixtures
on: workflow_dispatch
permissions:
  contents: read
jobs:
  portal:
    if: github.repository == 'razzant/ouroboros' && github.ref == 'refs/heads/qa/portal-observed-time-52eb'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PRODUCT: d68b232c60e1895b6b5aa7c18eb1e99d55f79325
      BASE: 18af9c0f67059645c901b4f90a62759f15a729b7
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/browsers
      PLAYWRIGHT_NODEJS_PATH: ${{ github.workspace }}/node-standalone/bin/node
      OUROBOROS_RUN_UI_SMOKE: '1'
      OUROBOROS_EXPECT_BROWSER_ENGINES: chromium,webkit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Check the three input trees
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRODUCT"
          test "$(git rev-parse HEAD^^)" = "$BASE"
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/ui-browser-push.yml
          test "$(git diff --name-only "$BASE" "$PRODUCT")" = tests/test_project_work_card_browser.py
          git checkout --detach "$BASE"
          mkdir -p "$RUNNER_TEMP/proof"
      - uses: ./.github/actions/setup-python-env
        with:
          interpreter: shipped
          install-project: 'false'
      - name: Prepare pinned Node and both browsers
        run: python -I -S scripts/ci_browser_install.py --pinned-node chromium webkit
      - name: Observe the old fixture on one real portal
        id: baseline
        run: |
          set -euo pipefail
          py=$(python -c 'import sys; print(sys.executable)')
          rc=0
          "$py" -I -S scripts/safe_test.py --evidence-dir "$RUNNER_TEMP/base-raw" -- "$py" -m pytest -o addopts='' -n0 -m ui_browser -q --tb=short tests/test_project_work_card_browser.py -k 'test_main_portal_follows_a_continue_made_in_the_project_room and same-snapshot and chromium-light-desktop' --ci-evidence-dir="$RUNNER_TEMP/proof/base" >"$RUNNER_TEMP/base.log" 2>&1 || rc=$?
          grep -F 'End time not recorded' "$RUNNER_TEMP/base.log" | head -c 3500 || true
          test "$rc" = 1
          grep -Fq 'End time not recorded' "$RUNNER_TEMP/base.log"
          grep -Fq '13:57–14:09' "$RUNNER_TEMP/base.log"
      - name: Check the same episode assertions on all four browser configurations
        if: ${{ !cancelled() && steps.baseline.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          git checkout --detach "$PRODUCT"
          py=$(python -c 'import sys; print(sys.executable)')
          "$py" -I -S scripts/safe_test.py --evidence-dir "$RUNNER_TEMP/fixture-raw" -- "$py" -m pytest -o addopts='' -n0 -m ui_browser -q --tb=short tests/test_project_work_card_browser.py -k 'continue_made_in_the_project_room or room_card_follows_a_continue or successor_that_already_finished or later_fast_continue or empty_output_recovery' --ci-evidence-dir="$RUNNER_TEMP/proof/fixed"
          "$GITHUB_WORKSPACE/node-standalone/bin/node" --test web/tests/task_episodes.test.js
          "$py" -m ruff check --select F tests/test_project_work_card_browser.py
          "$py" - <<'PY'
          import json,os,pathlib
          proof=pathlib.Path(os.environ['RUNNER_TEMP'])/'proof'
          base=json.loads((proof/'base/results.json').read_text()); fixed=json.loads((proof/'fixed/results.json').read_text())
          assert base['tests_collected']==1 and any(x['phase']=='call' and x['outcome']=='failed' for x in base['reports'])
          groups={}
          for x in fixed['reports']:
              if not x.get('is_subtest'): groups.setdefault(x['nodeid'],{})[x['phase']]=x['outcome']
          assert len(groups)==fixed['tests_collected']==36 and all(x=={'setup':'passed','call':'passed','teardown':'passed'} for x in groups.values())
          print('PORTAL_TIME_36_BROWSER_CASES_PASSED')
          PY
      - name: Save the synthetic test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portal-observed-time-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof/
          if-no-files-found: error
          retention-days: 14
