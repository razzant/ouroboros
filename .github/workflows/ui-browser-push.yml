# Manual, disposable branch qualification for the 3947 fix-forward
# (https://github.com/razzant/ouroboros/issues/3947). Only this workflow file
# differs from the product commit it qualifies; the job refuses to run anywhere
# but the QA branch, and the first step rejects a QA child commit that touches
# anything outside .github/workflows/.
name: QA task cards 3947 (disposable branch qualification)
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: qa-task-cards-3947-${{ github.ref }}
  cancel-in-progress: false
env:
  # The root replaces both once, before pushing the QA child commit:
  #   PRODUCT_SHA - the exact fix-forward commit the QA child commit sits on (its HEAD^);
  #   BASE_SHA    - the contribution base: size-ratchet target and diff base.
  PRODUCT_SHA: 9921b9a9a1f504afb0903d2c598437e275fbddfe
  BASE_SHA: b76f0a17ebf021a4b2d702bc9fd5baaa5ebaa5d5
jobs:
  qualify:
    if: github.repository == 'razzant/ouroboros' && github.ref == 'refs/heads/qa/task-cards-3947'
    name: qualify (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        # The post-merge legs' own split: Linux runs the shipped interpreter and WAL,
        # Windows setup-python's 3.10 and PERSIST, as an install updated in place does.
        include:
          - {os: ubuntu-latest, leg: linux, interpreter: shipped, journal: WAL}
          - {os: windows-latest, leg: windows, interpreter: setup-python, journal: PERSIST}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0            # BASE_SHA must resolve in-history
          persist-credentials: false
      - name: Put Windows test temp on the work disk
        if: ${{ runner.os == 'Windows' }}
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Select the product commit under the QA child
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/ui-browser-push.yml"
          git merge-base --is-ancestor "$BASE_SHA" "$PRODUCT_SHA"
          git checkout --detach HEAD^
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -z "$(git status --porcelain)"
          echo "OURO_SIZE_RATCHET_BASE_REF=$BASE_SHA" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/qualification/${{ matrix.leg }}"
          git show -s --format='%H %T %P' HEAD "$BASE_SHA" | tee "$RUNNER_TEMP/qualification/product.txt"
      - uses: ./.github/actions/setup-python-env
        id: setup_python
        with:
          interpreter: ${{ matrix.interpreter }}
          install-project: 'false'   # dependencies only; the tests import this checkout
      - name: The stores run ${{ matrix.journal }} here
        run: python -c "import pathlib, sys, tempfile; from ouroboros import store; probe = pathlib.Path(tempfile.mkdtemp()) / 'probe.sqlite'; probe.touch(); mode = store._journal_mode(probe, store.TIER_ENFORCED); print('stores run', mode); sys.exit(mode != sys.argv[1])" ${{ matrix.journal }}
      - name: Run the affected task and history modules
        id: core
        timeout-minutes: 60
        if: ${{ !cancelled() && steps.setup_python.outcome == 'success' }}
        run: |
          set -euo pipefail
          suite=(
            tests/test_chat_history_lineage_anchor.py
            tests/test_continue_memory_drive.py
            tests/test_continue_execution_budget.py
            tests/test_inline_execution_status.py
            tests/test_nested_coordination_acceptance.py
            tests/test_subagent_reliability.py
            tests/test_synthesis_ownership_recovery.py
            tests/test_copyback_terminal_files.py
            tests/test_terminal_projection_settlement.py
            tests/test_native_terminal_history.py
            tests/test_terminal_lifecycle_parity.py
          )
          for module in "${suite[@]}"; do
            test -f "$module" || { echo "Missing selected test module: $module"; exit 1; }
          done
          printf '%s\n' "${suite[@]}" > "$RUNNER_TEMP/qualification/${{ matrix.leg }}/selected-python.txt"
          python -I -S scripts/safe_test.py --evidence-dir "$RUNNER_TEMP/${{ matrix.leg }}-core-run" -- \
            python -m pytest -n0 -q --tb=short --timeout=300 "${suite[@]}" \
            --ci-evidence-dir="$RUNNER_TEMP/qualification/${{ matrix.leg }}/python"
      - name: The nine post-merge-red cases ran and passed (no skips, no subtest stand-ins)
        if: ${{ !cancelled() && steps.core.outcome != 'skipped' }}
        shell: python
        env:
          LEG: ${{ matrix.leg }}
        run: |
          import json
          import os
          import pathlib

          leg = os.environ["LEG"]
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "qualification" / leg / "python" / "results.json"
          if not path.exists():
              raise SystemExit(f"no results.json at {path}: the pytest session exported no evidence")
          data = json.loads(path.read_text(encoding="utf-8"))
          wanted = {
              "tests/test_chat_history_lineage_anchor.py::test_receipt_lands_on_final_when_progress_rows_unread",
              "tests/test_continue_memory_drive.py::test_a_continued_fork_reads_its_predecessors_memory_export_through_its_lineage",
              "tests/test_continue_memory_drive.py::test_late_owner_inputs_ride_every_hop_in_each_successors_own_store[forked]",
              "tests/test_inline_execution_status.py::test_canonical_new_attempt_stays_bound_beside_old_child[True]",
              "tests/test_nested_coordination_acceptance.py::test_depth3_control_plane_reaches_the_root_depth_summary",
              "tests/test_subagent_reliability.py::test_replay_learns_subagent_lineage_before_merging_card_rows",
              "tests/test_synthesis_ownership_recovery.py::test_child_pending_cannot_regress_canonical_phase_during_actual_copyback[completed]",
              "tests/test_synthesis_ownership_recovery.py::test_child_pending_cannot_regress_canonical_phase_during_actual_copyback[paused]",
              "tests/test_synthesis_ownership_recovery.py::test_child_pending_cannot_regress_canonical_phase_during_actual_copyback[running]",
          }
          clean = {"setup": "passed", "call": "passed", "teardown": "passed"}
          phases = {}
          subtest_standins = []
          for record in data["reports"]:
              if record["nodeid"] not in wanted:
                  continue
              entry = phases.setdefault(record["nodeid"], {})
              assert record["phase"] not in entry, record
              entry[record["phase"]] = record["outcome"]
              if record["nodeid"] in wanted and record.get("is_subtest"):
                  subtest_standins.append(record["nodeid"])
          missing = sorted(wanted - set(phases))
          bad = sorted(nodeid for nodeid in wanted & set(phases) if phases[nodeid] != clean)
          assert data["tests_collected"] >= len(wanted), data["tests_collected"]
          assert not missing, f"never ran on {leg}: {missing}"
          assert not bad, f"not clean passes on {leg}: {[phases[nodeid] for nodeid in bad]}"
          assert not subtest_standins, f"subtest rows stood in for real cases on {leg}: {subtest_standins}"
          print(f"{leg}: all {len(wanted)} post-merge-red node IDs ran and passed setup, call and teardown.")
      - name: Size lane on the contribution base
        id: size
        timeout-minutes: 20
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.setup_python.outcome == 'success' }}
        run: |
          python -I -S scripts/safe_test.py --evidence-dir "$RUNNER_TEMP/size-run" -- \
            python -m pytest -o addopts='' -n0 -m size_ratchet -q --tb=short \
              tests/test_reference_book_budgets.py tests/test_repo_health_smoke.py tests/test_smoke.py \
              --ci-evidence-dir="$RUNNER_TEMP/qualification/${{ matrix.leg }}/size"
      - name: Ruff F on the changed Python paths
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.setup_python.outcome == 'success' }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$PRODUCT_SHA" -- '*.py')"
          if [ -z "$changed" ]; then
            echo "No changed Python paths in $BASE_SHA..$PRODUCT_SHA"
            exit 0
          fi
          printf 'Changed Python paths:\n%s\n' "$changed"
          printf '%s\n' "$changed" | xargs python -m ruff check --select F
      - name: Node consumers of the changed web modules (Linux only, pinned engines)
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.setup_python.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          if [ -z "$(git diff --name-only "$BASE_SHA" "$PRODUCT_SHA" -- web/)" ]; then
            echo "No web/ paths in $BASE_SHA..$PRODUCT_SHA: the Node consumer lane is not applicable."
            exit 0
          fi
          node_suite=(
            tests/render_batch.test.js
            tests/chat_instance_dom.test.js
            tests/chat_continuity.test.js
            tests/chat_history_replay.test.js
            tests/chat_history_loading.test.js
            tests/chat_card_row_placement.test.js
            tests/subagent_queued_observation.test.js
            tests/task_result_reconciliation.test.js
            tests/terminal_delivery_card.test.js
            tests/terminal_time_line.test.js
          )
          for f in "${node_suite[@]}"; do
            test -f "web/$f" || { echo "Missing selected Node test: web/$f"; exit 1; }
          done
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/qa-node-browsers" \
            python -I -S scripts/ci_browser_install.py --pinned-node chromium
          cd web
          node_exit=0
          "$GITHUB_WORKSPACE/node-standalone/bin/node" --test --test-reporter=tap \
            --test-concurrency=2 --test-timeout=300000 "${node_suite[@]}" \
            > "$RUNNER_TEMP/web-node.tap" || node_exit=$?
          awk '/^[[:space:]]*not ok / || /^# (tests|pass|fail|cancelled|skipped|todo) /' \
            "$RUNNER_TEMP/web-node.tap" | tee "$RUNNER_TEMP/qualification/${{ matrix.leg }}/web-node-summary.txt"
          if [ "$node_exit" -ne 0 ]; then cat "$RUNNER_TEMP/web-node.tap"; fi
          exit "$node_exit"
      - name: Inspect the existing nested-card browser flows
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.setup_python.outcome == 'success' }}
        env:
          OUROBOROS_RUN_UI_SMOKE: '1'
          OUROBOROS_UI_BROWSER_ENGINE: chromium
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/qa-node-browsers
          PLAYWRIGHT_NODEJS_PATH: ${{ github.workspace }}/node-standalone/bin/node
        run: |
          set -euo pipefail
          python -I -S scripts/safe_test.py --evidence-dir "$RUNNER_TEMP/ui-run" -- \
            python -m pytest -n0 -m ui_browser -q --tb=short \
              'tests/test_ui_smoke_nested_cards.py::test_ui_smoke_nested_cards_are_one_identity_row_and_text_selects[chromium]' \
              'tests/test_room_work_browser.py::test_nested_cards_show_their_own_current_work[1240-warm]' \
              --ci-evidence-dir="$RUNNER_TEMP/qualification/linux/ui"
          python -m ouroboros.test_evidence export-diagnostics "$RUNNER_TEMP/ui-run" "$RUNNER_TEMP/ui-pictures"
          python - <<'PY'
          import json, os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          out = root / 'qualification' / 'linux'
          facts = json.loads((out/'ui/results.json').read_text())
          groups = {}
          for row in facts['reports']:
              groups.setdefault(row['nodeid'], {})[row['phase']] = row['outcome']
          assert facts['tests_collected'] == len(groups) == 2 and all(p == dict(setup='passed', call='passed', teardown='passed') for p in groups.values()), groups
          [picture] = list((root/'ui-pictures').rglob('nested-members-1240.png'))
          shutil.copyfile(picture, out/picture.name)
          print('Both named Chromium journeys passed; nested-card screenshot retained.')
          PY
      - name: Retain the qualification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-task-cards-3947-${{ matrix.leg }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification/
          if-no-files-found: error
          retention-days: 14
