# One-shot, secret-free qualification on disposable hosted runners. Not a product workflow.
name: Qualify test contracts on isolated runners
on:
  push:
    branches: [qualification/fixture-evidence-20261118]
permissions:
  contents: read
env:
  SUBJECT: '92d07e1daf4154e609a907517ed4ea55dda54855'
  SUBJECT_TREE: '31a69045ac79844b8076df19c0efb3f4fd7fc0fd'
  BASE: 'cba6276bc0626d1ae0bc599c31a33e9dcdb33e98'
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [fixture, pool, browser, size, cost, cost-k100, controls, order-forward, order-reverse]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the candidate separately from the verification driver
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -1 HEAD)" = "$GITHUB_SHA $SUBJECT"
          test "$(git rev-parse "$SUBJECT^{tree}")" = "$SUBJECT_TREE"
          test "$(git diff --name-only "$SUBJECT" "$GITHUB_SHA")" = '.github/workflows/qualify-test-contracts.yml'
          test "$(git rev-list --parents -1 "$SUBJECT")" = "$SUBJECT $BASE"
          git checkout --detach "$SUBJECT"
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          git log -1 --format='Testing %H tree %T'
      - uses: ./.github/actions/setup-python-env
        with:
          interpreter: shipped
          install-project: 'false'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the two browser engines
        if: matrix.lane == 'browser'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
        run: python -I -S scripts/ci_browser_install.py --pinned-node chromium webkit
      - name: Execute the selected lane
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase" "$RUNNER_TEMP/private" "$RUNNER_TEMP/public-proof"
          py="$(python -c 'import sys; print(sys.executable)')"
          proof() {
            python -I -S scripts/safe_test.py --evidence-dir "$RUNNER_TEMP/private/$LANE" -- \
              env "$@" "$py" -m pytest "${tests[@]}" -o addopts='' "${flags[@]}" -q --tb=short \
              --ci-evidence-dir="$RUNNER_TEMP/phase/$LANE" > "$RUNNER_TEMP/private/$LANE.log" 2>&1
          }
          case "$LANE" in
            fixture)
              tests=(tests/test_diagnostic_failure_boundaries.py tests/test_test_storage.py tests/test_verify_artifact_lifecycle.py
                     tests/test_delivery_contention.py tests/test_invocation_ownership.py tests/test_workspace_executor_docker.py
                     tests/test_direct_activity_registry.py tests/test_loop_transport_wait_interactive.py tests/test_telegram_token_change_failures.py
                     tests/test_context_local_density.py tests/test_cost_round.py tests/test_cost_meter.py)
              flags=(-n 2 --dist=loadgroup --max-worker-restart=0); proof ;;
            pool)
              tests=(tests/test_worker_demand_integration.py); flags=(); proof ;;
            browser)
              tests=(tests/test_task_card_b_browser.py tests/test_session_cost_coverage.py); flags=(-m ui_browser)
              proof OUROBOROS_RUN_UI_SMOKE=1 OUROBOROS_EXPECT_BROWSER_ENGINES=chromium,webkit \
                PLAYWRIGHT_NODEJS_PATH="$PWD/node-standalone/bin/node" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
                OUROBOROS_BROWSER_EVIDENCE_OUT="$RUNNER_TEMP/private/browser-scenes" ;;
            size)
              tests=(tests/); flags=(-m size_ratchet); proof -u GITHUB_EVENT_NAME OURO_SIZE_RATCHET_BASE_REF="$BASE" ;;
            cost)
              tests=(tests/test_cost_contract.py); flags=(-m 'scale and not integration'); proof ;;
            cost-k100)
              tests=(tests/test_cost_contract.py); flags=(-k 'k100 and reconcile-maintenance'); proof ;;
            order-forward|order-reverse)
              tests=('tests/test_execution_domain.py::test_unmanaged_task_executor_and_host_fallback_are_unchanged'
                     'tests/test_manual_restart_execution.py::test_restart_checks_out_first_then_stops_owned_work_in_order'
                     'tests/test_chat_model_choice.py::test_promotion_keeps_the_primary_and_only_owner_choices_enter_recents[live_call]'
                     'tests/test_task_settings_snapshot.py::test_two_overlapping_real_task_entries_keep_readers_and_behavior')
              if [[ "$LANE" = order-reverse ]]; then tests=("${tests[3]}" "${tests[2]}" "${tests[1]}" "${tests[0]}"); fi
              printf '%s\n' "${tests[@]}" > "$RUNNER_TEMP/private/order.txt"
              flags=(-n 0); proof ;;
            controls)
              tests=('tests/test_diagnostic_failure_boundaries.py::test_unconfirmed_retention_after_release_timeout[removed]'
                     tests/test_verify_artifact_lifecycle.py::test_observation_reconciles_on_all_paths_before_the_review_display_limit)
              flags=(); proof ;;

            *) exit 2 ;;
          esac
      - name: Run the same two regression cases against the comparison base
        if: matrix.lane == 'controls'
        shell: bash
        run: |
          set -euo pipefail
          py="$(python -c 'import sys; print(sys.executable)')"
          control="$RUNNER_TEMP/comparison-base"; out="$RUNNER_TEMP/private/control"
          mkdir -p "$out"
          git worktree add --detach "$control" "$BASE"
          cd "$control"
          test "$(git rev-parse HEAD)" = "$BASE"
          files=(tests/test_diagnostic_failure_boundaries.py tests/test_verify_artifact_lifecycle.py)
          git restore --source="$SUBJECT" --worktree -- "${files[@]}"
          for file in "${files[@]}"; do test "$(git hash-object "$file")" = "$(git rev-parse "$SUBJECT:$file")"; done
          tests=("${files[0]}::test_unconfirmed_retention_after_release_timeout[removed]"
                 "${files[1]}::test_observation_reconciles_on_all_paths_before_the_review_display_limit")
          rc=0
          python -I -S scripts/safe_test.py --evidence-dir "$out/evidence" -- "$py" -m pytest "${tests[@]}" \
            -o addopts='' -q --tb=short --junitxml="$out/base.xml" >"$out/run.log" 2>&1 || rc=$?
          test "$rc" = 1
          python -I - "$out/base.xml" <<'PY'
          import json, os, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          expected = {'test_unconfirmed_retention_after_release_timeout[removed]': 'subprocess.TimeoutExpired',
                      'test_observation_reconciles_on_all_paths_before_the_review_display_limit': 'assert receipts[0]["paths"] == paths'}
          cases = list(ET.parse(sys.argv[1]).iter('testcase'))
          assert len(cases) == len(expected) and {c.get('name') for c in cases} == expected.keys()
          for c in cases:
              failure = c.find('failure'); assert failure is not None and c.find('error') is None and c.find('skipped') is None
              assert expected[c.get('name')] in (failure.text or ''), f'Unexpected failure site for {c.get("name")}'
          fact = {'base': os.environ['BASE'], 'test_sources_from': os.environ['SUBJECT'], 'matched_failure_sites': sorted(expected),
                  'overlay_files': subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'public-proof/base-controls.json').write_text(json.dumps(fact, indent=2)+'\n')
          PY
      - name: Select only test phases and named synthetic screenshots for publication
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          python -I - <<'PY'
          import json, os, pathlib, shutil, subprocess
          r = pathlib.Path(os.environ['RUNNER_TEMP']); lane = os.environ['LANE']; out = r/'public-proof'; out.mkdir(exist_ok=True)
          subject = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert (subject, tree) == (os.environ['SUBJECT'], os.environ['SUBJECT_TREE'])
          meta = {'driver_sha': os.environ['GITHUB_SHA'], 'tested_sha': subject, 'tested_tree': tree, 'comparison_base': os.environ['BASE'], 'run': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'lane': lane}
          p = r/'phase'/lane/'results.json'; meta['results_present'] = p.is_file()
          if p.is_file():
              f = json.loads(p.read_text()); meta.update(session_exit_code=f['session_exit_code'], tests_collected=f['tests_collected'])
              meta['reports'] = [{k:x[k] for k in ('nodeid', 'phase', 'outcome', 'is_subtest', 'error_type')} | {'expected_failure': x.get('wasxfail') is not None} for x in f['reports']]
              meta['collection_failures'] = [x['nodeid'] for x in f['collection_failures']]; meta['collection_skips'] = f['collection_skips']
          (out/'phases.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n')
          if not p.is_file(): raise SystemExit('Missing phase evidence')
          calls = {row['nodeid'] for row in meta['reports'] if row['phase']=='call' and row['outcome']=='passed' and not row['is_subtest'] and not row['expected_failure']}
          if not calls: raise SystemExit('No passing primary calls recorded')
          if lane == 'fixture':
              check = ('test_real_sql_reader_wait_releases_control_locks_and_keeps_one_tail', 'test_git_remove_timeout_preserves_completed_gate_and_raw_evidence', 'test_unconfirmed_retention_after_release_timeout', 'test_duty_heartbeat_age_reaches_the_real_orphan_check')
              if any(sum('::'+case+'[' in n for n in calls) != 2 for case in check): raise SystemExit('Both journal and cleanup cases must actually pass')
              stop_case = 'tests/test_workspace_executor_docker.py::test_scripted_docker_process_never_reaches_host_stop'
              if not any(n == stop_case or n.startswith(stop_case+'@') for n in calls): raise SystemExit('Synthetic-process isolation test did not pass')
          if lane == 'controls' and calls != {'tests/test_diagnostic_failure_boundaries.py::test_unconfirmed_retention_after_release_timeout[removed]', 'tests/test_verify_artifact_lifecycle.py::test_observation_reconciles_on_all_paths_before_the_review_display_limit'}: raise SystemExit('Candidate control pair incomplete')
          if lane == 'pool' and not all(any(n.split('::')[-1] == f'test_project_workers_follow_demand_and_retire_between_bursts[{cap}]' for n in calls) for cap in (1,3,10)): raise SystemExit('Pool sweep incomplete')
          if lane.startswith('order-'):
              observed = [row['nodeid'] for row in meta['reports'] if row['phase'] == 'call' and row['outcome'] == 'passed' and not row['is_subtest'] and not row['expected_failure']]
              if observed != (r/'private/order.txt').read_text().splitlines(): raise SystemExit('Required same-process order was not observed')
          if lane == 'size' and (any(x['outcome'] == 'skipped' for x in meta['reports']) or meta['collection_skips']): raise SystemExit('Size comparison did not run completely')
          if lane in ('cost', 'cost-k100'):
              scale = 'k30' if lane == 'cost' else 'k100'
              relevant = {f'tests/test_cost_contract.py::test_b7_each_duty_rests_on_its_second_pass[{scale}-reconcile-maintenance]',
                          f'tests/test_cost_contract.py::test_b7_each_duty_works_again_when_its_input_changes[{scale}-reconcile-maintenance]',
                          *(f'tests/test_cost_contract.py::test_b7_each_duty_costs_the_same_after_unrelated_activity[{scale}-{phase}-reconcile-maintenance]' for phase in ('unrelated', 'money', 'drive'))}
              if not relevant <= calls: raise SystemExit('Missing passing primary calls for the reconcile duty at '+scale)
              # Other standing xfails/ordinary skips remain explicit in the complete phase report; never count them as passes.
          if lane == 'browser':
              scenes = r/'private/browser-scenes'
              for name in ['quiet-webkit-light-1100.png', 'quiet-webkit-light-1100-next-day.png', 'work-webkit-light-1100-next-day.png', 'work-webkit-dark-390.png']:
                  src = scenes/name
                  if not src.is_file() or src.is_symlink() or not src.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'): raise SystemExit(f'Missing synthetic scene: {name}')
                  shutil.copyfile(src, out/name)
              if len([n for n in calls if '::test_settled_money_reaches_the_rendered_card_and_survives_reload[' in n]) != 12: raise SystemExit('Clock-sharing consumer incomplete')
          PY
      - name: Retain selected public evidence only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phases-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-proof/
          if-no-files-found: error
          retention-days: 14
