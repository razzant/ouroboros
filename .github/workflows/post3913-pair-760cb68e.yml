    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Match the Windows full-test temp volume
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-python-env
        with:
          interpreter: shipped
          install-project: 'false'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Provision the same Windows POSIX utilities
        if: runner.os == 'Windows'
        id: posix
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: MSYS
          release: false
          update: true
          install: rsync
      - name: Select Windows POSIX test utilities
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"${{ steps.posix.outputs.msys2-location }}\usr\bin" >> $env:GITHUB_PATH'
      - name: Install the pinned browser engines
        if: matrix.lane == 'browser'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
        run: python -I -S scripts/ci_browser_install.py --pinned-node chromium webkit
      - name: Run the identical focused selection, with subject proof
        shell: bash
        env:
          SUBJECT: ${{ matrix.sha }}
          CASES: ${{ toJSON(matrix.cases) }}
          LANE: ${{ matrix.lane }}
          OUROBOROS_PREFLIGHT_REQUIRE_NODE: '1'
          OUROBOROS_PREFLIGHT_REQUIRE_PLUGINS: '1'
          OUROBOROS_PREFLIGHT_TEST_WORKERS: '4'
          EVIDENCE: ${{ runner.temp }}/pair-evidence
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          env = os.environ.copy()
          subject = env['SUBJECT']
          observed = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          if observed != subject:
              raise SystemExit(f'wrong tested SHA {observed}; expected {subject}')
          subprocess.run(['git','diff','--exit-code'],check=True)
          evidence = Path(env['EVIDENCE']); evidence.mkdir(exist_ok=True)
          cases = json.loads(env['CASES']); lane = env['LANE']
          controls = ['-n','4','--dist','loadgroup','--max-worker-restart=0']
          if lane == 'browser':
              env.update(OUROBOROS_RUN_UI_SMOKE='1',OUROBOROS_EXPECT_BROWSER_ENGINES='chromium,webkit',
                         PLAYWRIGHT_BROWSERS_PATH=str(Path(env['RUNNER_TEMP'])/'ui-browsers'),
                         PLAYWRIGHT_NODEJS_PATH=str(Path.cwd()/'node-standalone/bin/node'))
              controls = ['-m','ui_browser']
          (evidence/'subject.json').write_text(json.dumps({'controller':env['GITHUB_SHA'],'tested_sha':subject,
              'runner':env.get('RUNNER_OS'),'lane':lane,'nodes':cases,'python':sys.version,'controls':controls}))
          env['GITHUB_SHA'] = subject
          argv=[sys.executable,'-I','-S','scripts/safe_test.py','--timeout','1400','--',sys.executable,'-m','pytest',
                *controls,'--timeout=300','-q','--tb=short',f'--ci-evidence-dir={evidence}',*cases]
          print('TESTED_SHA',subject,'CASE_COUNT',len(cases),flush=True)
          done=subprocess.run(argv,env=env)
          (evidence/'exit.json').write_text(json.dumps({'exit':done.returncode}))
          sys.exit(done.returncode)
          PY
      - name: Retain only projected results and subject binding
        if: '!cancelled()'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post3913-pair-${{ matrix.label }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pair-evidence/
          retention-days: 7
          if-no-files-found: warn
