# One-off live qualification of the macOS input program of unix_computer_use (#63, input_events.js) on hosted Macs.
# It is pushed alone to its own service branch, tests the exact product revision named below (never the pushed
# commit), reads the repository and writes nothing. The runner images grant Accessibility, PostEvent and
# ScreenCapture to the runner (actions/runner-images configure-tccdb-macos.sh), so here a skipped live case is a
# failure: a skip proves nothing. A re-run and a later push to the branch run the matrix again (no first-push or
# first-attempt condition: a skipped job would show as a green check).
name: C04 Mac input once

on:
  push:
    branches:
      - qa/c04-mac-input-01

permissions:
  contents: read

env:
  # The head of the PR branch under test; replaced by the coordinator after the push of the product branch.
  PRODUCT_SHA: a0a8dbb8912ba09900fe69651d9a851d9073fa41

jobs:
  mac-input:
    if: github.repository == 'razzant/ouroboros'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel (x86_64): the CGPoint-as-two-doubles call runs under the other ABI here.
          - {os: macos-15-intel, optional: false}
          - {os: macos-15, optional: false}
          # macOS 26 (Tahoe, the owner's own system; the GA arm64 image, today's macos-latest): required like the
          # others, so its failure fails the run (fail-fast: false keeps one leg from stopping the rest).
          # macos-14 is retired from hosted runners (actions/runner-images#13518) and is not listed.
          - {os: macos-26, optional: false}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Refuse a product revision that was not filled in
        shell: bash
        run: |
          if ! printf '%s' "$PRODUCT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::PRODUCT_SHA is '$PRODUCT_SHA', not a 40-character commit: fill in the PR head before pushing"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The pushed commit carries this workflow only; test the exact product revision.
          ref: ${{ env.PRODUCT_SHA }}
          persist-credentials: false
      - name: Check the product revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test -f skills/unix_computer_use/input_events.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          enable-cache: false
      - name: Install the repository's locked runtime, desktop bridge and test dependencies
        id: dependencies
        shell: bash
        run: |
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/c04-venv"
          uv sync --locked --no-install-project --extra desktop --extra browser --group dev \
            --python "$pythonLocation/bin/python"
          mkdir -p "$RUNNER_TEMP/c04-private" "$RUNNER_TEMP/c04-reports" "$RUNNER_TEMP/c04-evidence"

      - name: Record the machine, its keyboard, its scrolling setting and the grants the skill reads
        id: machine
        if: ${{ steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          python="$RUNNER_TEMP/c04-venv/bin/python"
          out="$RUNNER_TEMP/c04-machine.json"
          # Read only: nothing here sets a preference or posts an event (capabilities runs prompt-free preflights).
          export C04_MACOS="$(sw_vers -productVersion) ($(sw_vers -buildVersion)), $(uname -m)"
          export C04_LAYOUT="$(defaults read com.apple.HIToolbox AppleSelectedInputSources 2>/dev/null | tr -s ' \n' ' ')"
          export C04_NATURAL="$(defaults read -g com.apple.swipescrolldirection 2>/dev/null || echo unset)"
          export C04_SWIFTC="$(xcrun --find swiftc 2>&1 || true)"
          "$python" - "$out" <<'PY'
          import importlib.util, json, os, pathlib, sys, tempfile
          skill = pathlib.Path("skills/unix_computer_use")
          spec = importlib.util.spec_from_file_location("c04_unix_cu", skill / "plugin.py", submodule_search_locations=[str(skill)])
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          state = pathlib.Path(tempfile.mkdtemp())
          class API:
              tools = {}
              def get_state_dir(self): return str(state)
              def skill_job_dir(self, job): return state / job
              def register_tool(self, name, handler, **_): self.tools[name] = handler
          api = API()
          module.register(api)
          caps = json.loads(api.tools["capabilities"]())
          facts = {"macos": os.environ["C04_MACOS"], "layout": os.environ["C04_LAYOUT"],
                   "natural_scrolling": os.environ["C04_NATURAL"], "swiftc": os.environ["C04_SWIFTC"],
                   "permissions": caps.get("permissions"), "verified": caps.get("permission_state_verified"),
                   "input_events": (caps.get("input") or {}).get("input_events")}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(facts, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(facts, ensure_ascii=False, indent=1))
          PY

      - name: Focused skill modules against doubles (no event is posted)
        id: units
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          umask 077
          python="$RUNNER_TEMP/c04-venv/bin/python"
          "$python" -I -S scripts/safe_test.py --temp-parent /tmp --evidence-dir "$RUNNER_TEMP/c04-private/units" --timeout 1200 -- \
            "$python" -m pytest -q -rs -p no:randomly --junitxml="$RUNNER_TEMP/c04-reports/c04-units.xml" \
            tests/test_unix_computer_use_input_events.py tests/test_unix_computer_use_targeting.py \
            tests/test_unix_computer_use_effects.py tests/test_unix_computer_use_skill.py \
            tests/test_unix_computer_use_call_snapshot.py tests/test_unix_computer_use_remote_targeting.py \
            tests/test_unix_computer_use_remote_backends.py \
            tests/test_unix_computer_use_paste_chord.py tests/test_unix_computer_use_key_stop.py \
            tests/test_macos_computer_use_native.py::test_the_fixture_builds

      - name: Live input cases (real events into the owned fixtures)
        id: live
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          umask 077
          python="$RUNNER_TEMP/c04-venv/bin/python"
          m=tests/test_macos_computer_use_native.py
          # Options go AFTER the safe-test boundary: exported before it they are discarded.
          "$python" -I -S scripts/safe_test.py --temp-parent /tmp --evidence-dir "$RUNNER_TEMP/c04-private/live" --timeout 2700 -- \
            env OUROBOROS_MACOS_DESKTOP_QA=1 OUROBOROS_TEST_EVIDENCE_ROOT="$RUNNER_TEMP/c04-evidence" \
            "$python" -m pytest -o addopts= -q -rs -s -p no:randomly --junitxml="$RUNNER_TEMP/c04-reports/c04-live.xml" \
            "$m::test_a_middle_click_arrives_as_the_other_button_number_two" \
            "$m::test_a_right_click_arrives_as_button_one" \
            "$m::test_double_and_triple_click_carry_their_click_count" \
            "$m::test_a_drag_goes_down_at_its_start_travels_and_comes_up_at_its_end" \
            "$m::test_a_press_a_move_and_a_release_in_three_calls_are_one_drag" \
            "$m::test_the_wheel_scrolls_the_document_under_the_pointer_each_way" \
            "$m::test_mixed_text_arrives_whole_as_unicode_events_without_the_clipboard" \
            "$m::test_a_long_text_arrives_whole_and_its_time_is_recorded" \
            "$m::test_a_held_key_goes_up_after_its_time_and_stays_up" \
            "$m::test_a_named_arrow_carries_its_class_flags" \
            "$m::test_a_system_key_arrives_as_a_system_defined_event" \
            "$m::test_the_pointer_reads_back_where_move_put_it" \
            "$m::test_command_a_arrives_as_command_a_however_its_letter_is_cased" \
            "$m::test_a_point_read_off_a_screenshot_clicks_the_button_drawn_there" \
            "$m::test_never_policy_leaves_the_front_with_the_app_that_took_it" \
            "$m::test_quiet_press_and_set_value_while_the_front_app_is_typed_into" \
            "$m::test_named_window_tree_keeps_nested_unicode_command_and_url" \
            "$m::test_press_and_fresh_tree_timing_block"

      - name: Live paste fallback (replaces this runner's clipboard)
        id: clipboard
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        shell: bash
        run: |
          umask 077
          python="$RUNNER_TEMP/c04-venv/bin/python"
          "$python" -I -S scripts/safe_test.py --temp-parent /tmp --evidence-dir "$RUNNER_TEMP/c04-private/clipboard" --timeout 900 -- \
            env OUROBOROS_MACOS_DESKTOP_QA=clipboard OUROBOROS_TEST_EVIDENCE_ROOT="$RUNNER_TEMP/c04-evidence" \
            "$python" -m pytest -o addopts= -q -rs -s -p no:randomly --junitxml="$RUNNER_TEMP/c04-reports/c04-clipboard.xml" \
            "tests/test_macos_computer_use_native.py::test_paste_arrives_as_the_active_layouts_command_v_and_pastes_through_the_edit_menu"

      - name: Report the machine and every case (a skipped live case fails the job)
        if: always()
        shell: bash
        run: |
          python3 -I -S - "$RUNNER_TEMP" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          import xml.etree.ElementTree as ET
          root = pathlib.Path(sys.argv[1])
          bad = []
          print(f"### Mac input on ${{ matrix.os }}\n")
          try:
              facts = json.loads((root / "c04-machine.json").read_text(encoding="utf-8"))
          except (OSError, ValueError):
              facts = {}
              bad.append("machine facts unread (see the step 'Record the machine')")
          for key in ("macos", "layout", "natural_scrolling", "swiftc", "verified", "input_events"):
              print(f"- {key}: `{facts.get(key)}`")
          perms = facts.get("permissions") or {}
          print(f"- grants: post_events `{perms.get('post_events')}`, screen_recording `{perms.get('screen_recording')}`, "
                f"accessibility `{perms.get('accessibility')}`\n")
          print("| step | case | outcome |\n|---|---|---|")
          details = []
          for step, live in (("units", False), ("live", True), ("clipboard", True)):
              path = root / "c04-reports" / f"c04-{step}.xml"
              if not path.is_file():
                  print(f"| {step} | (no report: see the step's own log) | NOT_RUN |")
                  bad.append(f"{step} did not report")
                  continue
              count, failed = 0, 0
              for case in ET.parse(path).getroot().iter("testcase"):
                  count += 1
                  name = case.get("name", "?")
                  outcome, node = "PASS", None
                  for tag in ("failure", "error", "skipped"):
                      if case.find(tag) is not None:
                          node, outcome = case.find(tag), {"failure": "FAIL", "error": "ERROR", "skipped": "SKIP"}[tag]
                  if outcome in ("FAIL", "ERROR") or (outcome == "SKIP" and live):
                      bad.append(f"{step}:{name} {outcome}")
                      failed += 1
                  reason = ((node.get("message") or "").splitlines() or [""])[0].replace("|", "/") if node is not None else ""
                  measured = " ".join(f"{p.get('name')}={p.get('value')}" for p in case.iter("property"))
                  if live or outcome != "PASS":  # a measured case (the long text's ms per character) shows its numbers
                      print(f"| {step} | `{name}` | {outcome} {reason[:300]} {measured} |")
                  if node is not None and outcome != "PASS":
                      details.append((f"{step} :: {name} ({outcome})", (node.get("message") or "") + "\n" + (node.text or "")))
              if count == 0:
                  bad.append(f"{step} ran no case")
              if not live:
                  print(f"| units | {count} cases, {failed} not passed | {'PASS' if not failed else 'FAIL'} |")
          print("\n" + ("**PASS**" if not bad else "**FAIL**: " + "; ".join(bad)))
          for title, text in details:  # the whole refusal or assertion, not a cut message
              print(f"\n<details><summary>{title}</summary>\n\n```text\n{text.strip()}\n```\n</details>")
          sys.exit(1 if bad else 0)
          PY

      - name: Keep the reports, the machine facts, the fixture logs and the safe-test records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c04-mac-input-${{ matrix.os }}
          # The fixtures log the clipboard's change count and a comparison with the test's own token, never what an
          # owner put there (a hosted runner has no owner); screenshots are the runner's desktop.
          path: |
            ${{ runner.temp }}/c04-reports
            ${{ runner.temp }}/c04-machine.json
            ${{ runner.temp }}/c04-evidence
            ${{ runner.temp }}/c04-private
          if-no-files-found: warn
          retention-days: 14
