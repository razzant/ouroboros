# One-off workflow for the QA branch only; never part of the product PR.
name: Helper first-attempt wording - targeted qualification
'on':
  push:
    branches: [qa/helper-first-attempt-only-2bfaddde]
permissions:
  contents: read
jobs:
  targeted:
    name: targeted (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, leg: linux, interpreter: shipped}
          - {os: windows-latest, leg: windows, interpreter: setup-python}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 3a25b58f83ae724b6646f788ed3cfa6ff50da2d9
          fetch-depth: 0
          persist-credentials: false
      - name: Put Windows test temp on the work disk
        if: ${{ runner.os == 'Windows' }}
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-python-env
        with:
          interpreter: ${{ matrix.interpreter }}
          install-project: 'false'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify the reviewed source after setup
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'candidate HEAD: %s\ncandidate tree: %s\n' "$actual_sha" "$actual_tree"
          test "$actual_sha" = '3a25b58f83ae724b6646f788ed3cfa6ff50da2d9'
          test "$actual_tree" = '0b39df343e942d24e2a71515fd9227b87f6bb4f8'
          git diff --quiet --
          git diff --cached --quiet --
      - name: Targeted Python tests
        timeout-minutes: 20
        run: >-
          python -m pytest -o addopts= -q --tb=short --timeout=300
          tests/test_work_order_source_coverage.py tests/test_configured_session_prestart.py tests/test_project_plain_rows.py tests/test_rail_cause_coverage.py tests/test_delegate_plural.py tests/test_consciousness_wake.py tests/test_execution_evidence.py tests/test_gateway_history.py tests/test_acceptance_author_stop.py tests/test_late_review_marks.py tests/test_domain_manifest.py tests/test_domain_report.py tests/test_generated_inventories.py tests/test_architecture_facts.py tests/test_docs_sync.py
      - name: Targeted browser-module tests (Node)
        timeout-minutes: 10
        run: node --test web/tests/reason_detail.test.js web/tests/child_report_label.test.js web/tests/room_away_full_output.test.js web/tests/task_presentation.test.js web/tests/owner_stop_card.test.js web/tests/chat_history_replay.test.js web/tests/review_truth.test.js web/tests/i18n_catalog.test.js web/tests/log_category.test.js web/tests/review_presentation.test.js web/tests/chat_instance_dom.test.js

      - name: Targeted size and book checks
        timeout-minutes: 10
        env:
          OURO_SIZE_RATCHET_BASE_REF: 'e6ef2688057bdea53f8e35f5953ac3cfa2c0e446'
        run: >-
          python -m pytest -o addopts= -q --tb=short -m size_ratchet
          tests/test_repo_health_smoke.py tests/test_reference_book_budgets.py tests/test_smoke.py
