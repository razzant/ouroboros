# Temporary: add only this file at .github/workflows/qa-3751-delivery-v4.yml
# in a single commit whose parent is the qualified product SHA below.
name: QA 3751 reply and notice delivery

on:
  push:
    branches: [qa/telegram-3751-delivery-v4]

permissions:
  contents: read

env:
  PRODUCT_SHA: 'b2bd21eb990d04ce962d22ca5bdcd0e54ce29214'
  MSYS_NO_PATHCONV: '1'
  PYTHONUTF8: '1'

jobs:
  focused:
    name: Notice and reply delivery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0  # the real earlier 1.4.18 payload is a test input
          persist-credentials: false
      - name: Require the exact product parent and a workflow-only addition
        run: |
          set -euo pipefail
          qa_file=.github/workflows/qa-3751-delivery-v4.yml
          [[ "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Set PRODUCT_SHA to the exact product commit' >&2; exit 1; }
          [[ "$(git rev-list --parents -n 1 HEAD)" == "$GITHUB_SHA $PRODUCT_SHA" ]] || {
            echo 'The QA commit must have exactly the pinned product parent' >&2; exit 1;
          }
          [[ "$(git diff --name-status --no-renames "$PRODUCT_SHA" HEAD --)" == $(printf 'A\t%s' "$qa_file") ]] || {
            echo "The only change must be the addition of $qa_file" >&2; exit 1;
          }
          product_tree="$(git rev-parse "$PRODUCT_SHA^{tree}")" || exit $?
          printf 'QA: %s\nProduct: %s (tree %s)\n' "$GITHUB_SHA" "$PRODUCT_SHA" "$product_tree"
      - uses: ./.github/actions/setup-python-env
        with:
          install-project: 'false'
      - name: Run and verify the exact focused cases (no skips)
        run: |
          set -euo pipefail
          py="$(python -c 'import pathlib, sys; print(pathlib.Path(sys.executable).as_posix(), end="")')"
          qa="$RUNNER_TEMP/qa-3751-delivery-v4"
          mkdir -p "$qa"
          main=tests/test_main_terminal_delivery.py
          watchdog=tests/test_ws3_wedge_resilience.py
          tg=tests/test_telegram_reply_references.py
          settings=tests/test_settings_addresses_static.py
          history=tests/test_history_physical_coverage.py
          seed=tests/test_builtin_skill_source.py
          nodes=(
            "$settings::test_written_settings_addresses_name_living_pages"
            "$history::test_a_frozen_segment_that_changed_before_its_import_is_a_disclosed_gap_never_other_rows"
            "tests/test_chat_references.py::test_a3_a4_paged_main_keeps_both_sides_of_physical_telegram_at_a_colliding_number"
            "$seed::test_bundled_telegram_reseed_delivers_the_current_version"
            "$seed::test_reseed_from_a_real_previous_seed[telegram-25cb4131511df8eded3d9762e23173ce9dcb8853-1.4.18]"
            "$tg::test_a_reply_to_ordinary_words_stays_this_chats_turn_with_its_usual_quote"{'[all]','[telegram_only]'}
            "$tg::test_a_reply_to_a_retired_project_card_is_refused_once_and_a_reply_to_that_refusal_is_ordinary"{'[all]','[telegram_only]'}
            "$tg::test_a_reply_to_an_old_card_or_its_notice_is_answered_on_what_the_maps_still_hold"{'[all-old_card-90]','[telegram_only-old_card-90]','[all-old_notice-90]','[telegram_only-old_notice-90]','[all-lonely_notice-66]','[telegram_only-lonely_notice-66]'}
            "$main::test_unbound_notice_requires_its_durable_row_without_a_delivery_receipt"{'[None-]','[receipt1-markdown]'}
            "$watchdog::test_watchdog_alerts_on_chat_turn_wedge"
            "$watchdog::test_wall_clock_jump_neither_fabricates_nor_masks_a_chat_turn_wedge"
            "$tg::test_a_reply_about_a_helper_runs_in_its_project_and_quotes_that_helpers_card"{'[all]','[telegram_only]'}
            "$tg::test_a_helpers_card_reaches_the_phone_beside_another_connectors_binding_of_its_room"{'[all]','[telegram_only]'}
            "$tg::test_an_exact_replys_progress_goes_where_its_answer_does_without_its_anchor"{'[all]','[telegram_only]'}
            "$tg::test_d8_helper_uses_its_project_reply_roots_telegram_destination"{'[all-live]','[all-saved]','[telegram_only-live]','[telegram_only-saved]'}
            tests/test_chat_zero_bench_neutrality.py::test_progress_notices_never_enter_the_answer_stream
            tests/test_contracts.py::test_chat_outbound_declares_progress_meta_keys_used_by_runtime
            tests/test_delivery_control_lineage.py::test_multi_improvement_explicit_selection_binds_exact_answer_before_single_delivery
            tests/test_legacy_memory_notice.py::test_a_failed_chat_write_leaves_the_notice_owed
            tests/test_legacy_memory_notice.py::test_a_pending_import_keeps_the_notice_owed
            tests/test_legacy_memory_notice.py::test_a_written_row_without_its_marker_is_recovered_without_a_second_row
            tests/test_legacy_memory_notice.py::test_an_install_with_old_memory_hears_once_how_much_and_how_to_fold_it
            tests/test_legacy_memory_notice.py::test_an_unbound_owner_chat_sends_marks_and_imports_nothing
            'tests/test_main_project_consistency.py::test_external_owner_main_dialogue_survives_registry_fault[external_owner-missing]'
            'tests/test_main_project_consistency.py::test_external_owner_main_dialogue_survives_registry_fault[external_owner-torn]'
            'tests/test_maintenance_receipt_interleavings.py::test_cancel_publication_and_replay_keep_one_episode[delivered-copy]'
            'tests/test_maintenance_receipt_interleavings.py::test_cancel_publication_and_replay_keep_one_episode[delivered-with-receipt-deferred]'
            'tests/test_maintenance_receipt_interleavings.py::test_cancel_publication_and_replay_keep_one_episode[queued-copy]'
            tests/test_maintenance_receipt_interleavings.py::test_pause_notice_ack_preserves_concurrent_cancel_cost_and_new_notice
            tests/test_maintenance_receipt_interleavings.py::test_replay_rechecks_owed_row_after_cancel_delivery
            'tests/test_maintenance_receipt_interleavings.py::test_terminal_delivery_without_stop_keeps_ordinary_final_identity[cancelled]'
            'tests/test_maintenance_receipt_interleavings.py::test_terminal_delivery_without_stop_keeps_ordinary_final_identity[completed]'
            tests/test_pause_notices.py::test_a_pass_reads_only_owing_tasks_among_completed_history
            tests/test_pause_notices.py::test_an_authority_pause_says_it_is_technical_and_never_a_budget_limit
            tests/test_pause_notices.py::test_chat_append_before_ack_is_recovered_without_a_second_send
            tests/test_pause_notices.py::test_closed_generation_does_not_publish_or_acknowledge
            tests/test_pause_notices.py::test_confirmed_pause_persists_system_row_and_repeated_confirmation_does_not_duplicate
            tests/test_pause_notices.py::test_each_pause_generation_keeps_the_author_its_own_fence_declared
            tests/test_pause_notices.py::test_failed_required_append_remains_owed_and_retries
            tests/test_pause_notices.py::test_first_dispatch_budget_pause_publishes_its_membership
            tests/test_pause_notices.py::test_membership_is_the_row_and_leaves_with_the_acknowledgement_or_the_row
            tests/test_pause_notices.py::test_owner_members_do_not_announce_tree_confirmation
            tests/test_pause_notices.py::test_resume_and_second_pause_preserve_both_owed_episodes
            tests/test_pause_notices.py::test_technical_repark_names_the_read_and_owes_one_notice_per_work
            'tests/test_progress_meta_scan.py::test_removing_the_receipt_field_from_either_contract_fails[js]'
            'tests/test_progress_meta_scan.py::test_removing_the_receipt_field_from_either_contract_fails[python]'
            'tests/test_quiz_display.py::test_send_quiz_broadcasts_publishes_and_persists_row[False]'
            'tests/test_quiz_display.py::test_send_quiz_broadcasts_publishes_and_persists_row[True]'
            tests/test_reviewer_delivery_defaults.py::test_notice_bookkeeping_preserves_recovered_control_uncertainty
            'tests/test_reviewer_delivery_defaults.py::test_notice_recovers_through_real_chat_and_state_writers[chat_append]'
            'tests/test_reviewer_delivery_defaults.py::test_notice_recovers_through_real_chat_and_state_writers[state_marker]'
            tests/test_task_room_rule.py::test_a_fixed_row_type_keeps_its_producers_address_and_borrows_no_lineage
            tests/test_task_room_rule.py::test_a_main_direct_task_with_a_project_id_stays_main
            'tests/test_task_room_rule.py::test_a_warm_frame_opens_no_store_and_a_cold_task_id_opens_at_most_once[event_queue_handler]'
            'tests/test_task_room_rule.py::test_a_warm_frame_opens_no_store_and_a_cold_task_id_opens_at_most_once[send_with_budget]'
            tests/test_task_room_rule.py::test_converting_a_middle_task_moves_its_subtrees_earlier_rows_out_of_the_old_room
            'tests/test_task_room_rule.py::test_the_bus_and_replay_put_a_project_tasks_bare_row_in_its_room[born-1-native]'
            'tests/test_task_room_rule.py::test_the_bus_and_replay_put_a_project_tasks_bare_row_in_its_room[grand-1-b]'
            'tests/test_task_room_rule.py::test_the_bus_and_replay_put_a_project_tasks_bare_row_in_its_room[kid-1-a]'
            tests/test_truthful_card_presentation.py::TestHostNoteVoice::test_an_omitted_voice_is_normalized_to_the_host_on_every_new_send
            tests/test_truthful_card_presentation.py::TestHostNoteVoice::test_nonprogress_host_voice_survives_real_history_replay
            tests/test_progress_meta_scan.py::test_closed_helper_keywords_are_collected_including_new_keys
            'tests/test_progress_meta_scan.py::test_unproven_compositions_fail_closed[, **marks})-, **unknown})]'
            'tests/test_progress_meta_scan.py::test_unproven_compositions_fail_closed[terminal_receipt="retained_work"-**dynamic]'
            'tests/test_progress_meta_scan.py::test_unproven_compositions_fail_closed[key: value-key + "_renamed": value]'
            tests/test_progress_meta_scan.py::test_sibling_function_cannot_certify_a_helper_call
            tests/test_promote_chat_flow.py::test_d5_promotion_refusal_keeps_admitted_telegram_destination_without_readable_quote
            tests/test_promote_chat_flow.py::test_host_initiated_workspace_refusal_sends_one_typed_row_to_the_owner_chat
          )
          "$py" -I -S scripts/safe_test.py --temp-parent "$RUNNER_TEMP" --evidence-dir "$qa/evidence" --timeout 180 -- \
            "$py" -m pytest -o addopts= -o xfail_strict=true -q --tb=short -rA --junitxml="$qa/junit.xml" "${nodes[@]}" || exit $?
          "$py" - "$qa/junit.xml" "${nodes[@]}" <<'PY'
          import sys
          from collections import Counter
          from xml.etree import ElementTree as ET

          suites = ET.parse(sys.argv[1]).getroot()
          def identity(node):
              path, *qualname = node.split('::')
              return '.'.join([path.removesuffix('.py').replace('/', '.'), *qualname[:-1]]), qualname[-1]

          requested = sys.argv[2:]
          expected = Counter(map(identity, requested))
          if len(set(requested)) != len(requested) or any(n != 1 for n in expected.values()):
              raise SystemExit('Duplicate named cases in this selection')
          cases = list(suites.iter('testcase'))
          observed = Counter((case.get('classname'), case.get('name')) for case in cases)
          unsettled = [case.get('name') for case in cases
                       if any(child.tag in {'error', 'failure', 'skipped'} for child in case)]
          if not expected or observed != expected or unsettled:
              raise SystemExit(f'Missing: {expected - observed}; extra/duplicate: {observed - expected}; not passed: {unsettled}')
          print(f'All {len(cases)} named cases passed; none skipped.')
          PY
