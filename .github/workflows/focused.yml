    tests/test_successor_start_choice.py::test_the_waiting_continue_offers_resume_as_a_check_and_only_the_confirmed_press_records_the_choice,
    tests/test_successor_start_choice.py::test_without_positive_no_write_proof_the_predecessor_refusal_stays,
    tests/test_successor_start_choice.py::test_the_choice_meets_the_grants_money_refusal,
