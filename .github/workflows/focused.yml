name: Focused successor-start Resume verification (A + B + C) — TEMPORARY BRANCH TOOLING

# What this is.
# A one-off GitHub overlay for the three-part lifecycle repair under test:
#   A — a fresh ordinary delegated Continue whose start was refused BEFORE admission must be
#       recorded as a definite sent-but-rejected START_FAILED, never START_UNSENT; the
#       job↔canonical-run alias needs positive same-store proof (otherwise UNKNOWN stays), and
#       the proven continuation version pin (6.3.0) drift-checks against the runtime pin.
#   B — an OWNER-CHOSEN, ADDRESSED Resume of a never-started Continue successor: the census
#       must positively prove read-only starts; a list-shaped Resume must not take the
#       addressed decision; the old request is never re-sent (lookup-only); late activity
#       re-holds the successor; Stop/Panic/expired-deadline and history keep priority.
#   C — the card and menu truth: a waiting Continue over unconfirmed starts gets exactly one
#       addressed Resume as a CHECK (never pause), the answered episode lays the card while the
#       earlier root keeps its Stop, and the dialog says the choice in the singular for one
#       start. Web: task_control_menu.js one/plural wording + work_status projection tests.
#
# Division of proof:
#   * A and B are proven by their WHOLE modules and named witnesses below (parameters
#     included). The former separate "existing guards" and "grant seam" pytest steps are gone:
#     the same cases run inside those modules, and the bind gate names them.
#   * C is proven by whole modules tests/test_work_status.py +
#     tests/test_work_projection_pause_producers.py, the new B-module choice-recording case,
#     and the Node suites task_control_menu, work_status, activity_work_truth and room_work.
#   * The browser job runs THREE real-Chromium cases: the synthetic addressed-Resume scenario
#     (synthetic_resume_choice_ui.py, imports B's own _held_continue with
#     before=_own_earlier_choice and drives the REAL projected card and REAL gateway owner
#     Resume — bare press 409, cancel sends nothing, recheck asks again with the same choice
#     and the read-only wording survives the changed historical risk record, confirm 200
#     releases the SAME successor exactly once and queues that same id, repeat refused, no
#     engine dispatch, no money inference) plus the merged product-owned
#     tests/test_held_continue_browser.py::test_held_continue_toast_activity_reason_and_resume_check,
#     which supplies the geometry witness, plus the real Project room card over a fixture transport.
#
# How to bind (the parent packages this; nothing runs until then):
#   1. Final product commit P = composed A+B+C (exact reviewed bytes), on top of Development
#      base D. 2. Make ONE CI-only commit over P adding exactly these two files at
#      .github/workflows/focused.yml and ci/synthetic_resume_choice_ui.py. 3. Fill PRODUCT=P,
#      PRODUCT_PARENT=D below; push to a branch named ci/verify-successor-start-<unique>.
#      The workflow never triggers on ouroboros/ or any PR, has permissions contents:read
#      only, and the pin step detaches to PRODUCT so the tested tree never contains this
#      overlay. No write, no id-token, no secrets, no provider calls, no real state replay.
#   Honest-red: no continue-on-error; unbound sentinels FAIL naming what to fill; a missing
#   named node fails the bind gate; every check step re-reads the JUnit by classname+function.
#   The pinned product tree supplies the named cases; the bind step checks that they exist.
#
# Known deltas this run cannot yet close (reconcile at final composition):
#   * C-only names (test_the_waiting_continue_offers_resume_as_a_check…, the toast test, the
#     singular dialog wording) bind ONLY if C is inside P; if composition renames any of them,
#     update the env lists below — the logic is name-agnostic. Never edit a name to green.
#   * The browser scenario binds to production interfaces:
#     delegate_resume blocker {choice_id, read_only}, gateway passthrough of
#     error/blockers/acceptable_unknown/accepted_start_risks, task_control_menu dialog
#     title 'Resume without this result?'/'these results', confirmLabel 'Resume anyway',
#     api_client POST {accept_unknown, reason}. If any drifts, the scenario fails by name.
#   * Full-repo suites, other markers and any real account are out of scope by design.

on:
  push:
    branches:
      - 'ci/verify-successor-start-*'

permissions:
  contents: read

concurrency:
  group: successor-start-${{ github.ref }}
  cancel-in-progress: false

env:
  # ── pins: fill at packaging; sentinels fail loudly ──
  PRODUCT: "4fe7e9b79699172d30af1f1635d58342286ee666"
  PRODUCT_PARENT: "bf736865a85813ce67c85aad3ff90b7d3d8e9d2e"

  # ── A: whole modules + exact witnesses (names verified in the product source) ──
  A_MODULES: tests/test_delegate_continuation.py,tests/test_delegated_subagent_transport.py,tests/test_delegate_accepted_lookup.py,tests/test_delegate_documents.py,tests/test_delegate_input_files_admission.py,tests/test_delegate_plan.py,tests/test_delegate_documents_admission.py,tests/test_delegate_plan_edges.py,tests/test_start_refusal_fate.py
