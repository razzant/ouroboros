    tests/test_successor_start_choice.py::test_a_failed_release_reuses_its_recorded_choice_for_the_same_hold,
    tests/test_successor_start_choice.py::test_a_list_or_panic_resume_never_offers_records_or_reuses_the_successors_choice[shown_key],
    tests/test_successor_start_choice.py::test_a_list_or_panic_resume_never_offers_records_or_reuses_the_successors_choice[saved_choice],
    tests/test_successor_start_choice.py::test_the_resume_proof_has_the_same_member_bound_as_admission[at-limit],
    tests/test_successor_start_choice.py::test_the_resume_proof_has_the_same_member_bound_as_admission[too-long],
    tests/test_successor_start_choice.py::test_the_resume_proof_has_the_same_member_bound_as_admission[cycle],
