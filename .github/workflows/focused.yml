jobs:
  python:
    name: focused (${{ matrix.leg }}, ${{ matrix.journal }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: linux
            os: ubuntu-latest
            interpreter: shipped          # fresh installs: SQLite WAL
            journal: WAL
          - leg: windows
            os: windows-latest
            interpreter: setup-python     # in-place-updated installs keep PERSIST
            journal: PERSIST
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 3   # QA tip, product head, size-lane base

      - name: Test the pinned product head, not this branch's tip
        id: pin
        run: |
          set -euo pipefail
          case "$PRODUCT$PRODUCT_PARENT" in *'<<FILL'*) echo "PIN UNBOUND — set PRODUCT and PRODUCT_PARENT to the real candidate SHAs"; exit 1;; esac
          test "$(git rev-parse 'HEAD^1')" = "$PRODUCT" || { echo "the QA commit is not directly over the pinned product head"; exit 1; }
          git cat-file -e "$PRODUCT_PARENT^{commit}" || { echo "the size-lane base object is missing from the fetch"; exit 1; }
          git checkout --detach "$PRODUCT"
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          echo "tested tree: $(git rev-parse 'HEAD^{tree}')"

      - uses: ./.github/actions/setup-python-env
        id: setup
        with:
          interpreter: ${{ matrix.interpreter }}
          install-project: 'false'   # dependencies only; the tests import this checkout

      - name: The stores run ${{ matrix.journal }} here
        id: journal
        run: >-
          python -c "import pathlib, sys, tempfile; from ouroboros import store;
          probe = pathlib.Path(tempfile.mkdtemp()) / 'probe.sqlite'; probe.touch();
          mode = store._journal_mode(probe, store.TIER_ENFORCED); print('stores run', mode);
          sys.exit(mode != sys.argv[1])" ${{ matrix.journal }}

      - name: Bind gate — every named node and module exists in the pinned tree
        id: bind
        run: |
          set -euo pipefail
          split() { printf '%s' "$1" | tr ',' '\n' | sed '/^[[:space:]]*$/d'; }
          fail=0
          for name in A_NAMED_NODES A_EXACT_NODES B_REQUIRED_NODES B_COMPANION_NODES C_REQUIRED_NODES; do
            if split "${!name}" | grep -q '<<FILL'; then
              echo "UNBOUND: $name still carries a fill sentinel — the run would prove nothing"; fail=1
            fi
          done
          for list in A_NAMED_NODES A_EXACT_NODES B_REQUIRED_NODES B_COMPANION_NODES C_REQUIRED_NODES; do
            for node in $(split "${!list}" | sed 's/[[:space:]]*$//'); do
              file="${node%%::*}"; fn="${node##*::}"; fn="${fn%%\[*}"
              git cat-file -e "HEAD:$file" 2>/dev/null || { echo "absent in product tree: $file"; fail=1; continue; }
              git grep -q -E "^(async )?def ${fn}([(:]|$)" -- "$file" || { echo "no such test in product tree: $node"; fail=1; }
            done
          done
          for m in "$B_MODULE" $(split "$A_MODULES") $(split "$B_COMPANION_MODULES") $(split "$C_MODULES"); do
            git cat-file -e "HEAD:$m" || { echo "module absent at this product head: $m"; fail=1; }
          done
          test "$fail" = 0 || { echo "BIND INCOMPLETE — name the exact final nodes; this job must stay red until then"; exit 1; }
          echo "all named nodes resolve in $PRODUCT"

      - name: Write the report checker (counts and names only, never report bodies)
        id: checker
        run: |
          mkdir -p "$RUNNER_TEMP/ci-private"
          cat > "$RUNNER_TEMP/focused_check.py" <<'PY'
          """One pytest xunit2 report: what ran, by classname + function, plus per-group totals.

          Writes one line per group into "$RUNNER_TEMP/ci-private/total.env" as KEY=case-count.
          A module is recognised by its classname; a node by classname plus the function name
          before its parameter part. No log bodies, no scratch tree.
          """
          import argparse, os, re, sys
          import xml.etree.ElementTree as ET

          def status_of(case):
              for child in case:
                  if child.tag in ("failure", "error"):
                      return "failed"
                  if child.tag == "skipped":
                      return "skipped"
              return "passed"

          def module_of(path):
              return path[:-3].replace("/", ".").replace("\\", ".") if path.endswith(".py") else path

          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument("junit")
              ap.add_argument("--key", default="")
              ap.add_argument("--min", type=int, default=1)
              ap.add_argument("--modules", default="")
              ap.add_argument("--nodes", default="")
              a = ap.parse_args()
              split = lambda text: [p.strip() for p in re.split(r",\s*", text) if p.strip()]
              label = os.path.basename(a.junit)
              if not os.path.exists(a.junit):
                  print(f"CHECK {label}: MISSING — the pytest step produced no report")
                  return 1
              try:
                  cases = list(ET.parse(a.junit).getroot().iter("testcase"))
              except ET.ParseError as exc:
                  print(f"CHECK {label}: UNREADABLE report ({type(exc).__name__})")
                  return 1
              rows = [(c.get("classname") or "", c.get("name") or "", status_of(c)) for c in cases]
              counts = {k: sum(1 for _, _, s in rows if s == k) for k in ("passed", "skipped", "failed")}
              problems = [] if rows else ["collected nothing"]
              if len(rows) < a.min:
                  problems.append(f"expected at least {a.min} cases, saw {len(rows)}")
              for klass, name, status in rows:
                  if status == "failed":
                      problems.append(f"failed {klass}::{name}")
                  elif status == "skipped":
                      problems.append(f"skipped {klass}::{name}")   # a focused overlay skips nothing
              for path in split(a.modules):
                  if not any(klass == module_of(path) for klass, _, _ in rows):
                      problems.append(f"no case ran from {path}")
              for node in split(a.nodes):
                  path, _, func = node.partition("::")
                  module = module_of(path)
                  if not any(k == module and (n == func or ("[" not in func and n.startswith(func + "["))) for k, n, _ in rows):
                      problems.append(f"required node absent: {node}")
              print(f"CHECK {label}: {len(rows)} cases, {counts['passed']} passed, "
                    f"{counts['skipped']} skipped, {counts['failed']} failed")
              for problem in problems:
                  print("  " + problem)
              if a.key:
                  with open(os.path.join(os.environ["RUNNER_TEMP"], "ci-private", "total.env"), "a") as fh:
                      fh.write(f"{a.key}={len(rows)}\n")
              return 1 if problems else 0

          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Preparation is complete
        id: ready
        if: ${{ always() && steps.pin.outcome == 'success' && steps.setup.outcome == 'success' && steps.journal.outcome == 'success' && steps.bind.outcome == 'success' && steps.checker.outcome == 'success' }}
        run: echo "ready to test $PRODUCT on the ${{ matrix.leg }} leg (${{ matrix.journal }})"

      # ── 1. A: source and normal-start consumers + the exact owned-daemon node ──
      - name: A definite rejection, alias proof, transport pin and accepted lookup
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 45
        run: |
          set -euo pipefail
          selection=$(printf '%s,%s' "$A_MODULES" "$A_EXACT_NODES" | tr ',' '\n' | sed '/^[[:space:]]*$/d')
          count=$(printf '%s\n' "$selection" | grep -c . || true)
          test "$count" -eq 10 || { echo "the A selection has $count targets; expected nine modules + one node"; exit 1; }
          # shellcheck disable=SC2086
          python -m pytest $selection --junitxml="$RUNNER_TEMP/ci-private/a.xml" -q --tb=short
      - name: Check A ran every witness
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          KEY: A_TOTAL
        run: >-
          python "$RUNNER_TEMP/focused_check.py" "$RUNNER_TEMP/ci-private/a.xml"
          --key "$KEY" --modules "$A_MODULES" --nodes "$A_NAMED_NODES,$A_EXACT_NODES"

      # ── 2. B: the WHOLE module (parameters and C's new case included) ──
      - name: B successor-start choice, whole module
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 45
        run: >-
          python -m pytest "$B_MODULE"
          --junitxml="$RUNNER_TEMP/ci-private/b.xml" -q --tb=short
      - name: Check B ran every required case
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          KEY: B_TOTAL
        run: >-
          python "$RUNNER_TEMP/focused_check.py" "$RUNNER_TEMP/ci-private/b.xml"
          --key "$KEY" --min "$B_MIN_CASES" --modules "$B_MODULE" --nodes "$B_REQUIRED_NODES"

      # ── 3. B companions + the focused regressions the composition must not break ──
      - name: B companion and focused regression modules
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 45
        run: >-
          python -m pytest $(printf '%s' "$B_COMPANION_MODULES" | tr ',' '\n' | sed '/^[[:space:]]*$/d')
          --junitxml="$RUNNER_TEMP/ci-private/b-companions.xml" -q --tb=short
      - name: Check the companions ran, grant seam included
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          KEY: B_COMPANIONS
        run: >-
          python "$RUNNER_TEMP/focused_check.py" "$RUNNER_TEMP/ci-private/b-companions.xml"
          --key "$KEY" --modules "$B_COMPANION_MODULES" --nodes "$B_COMPANION_NODES"

      # ── 4. C: card and menu truth, whole modules with named functions ──
      - name: C work status and pause-producer projection, whole modules
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        timeout-minutes: 45
        run: >-
          python -m pytest $(printf '%s' "$C_MODULES" | tr ',' '\n' | sed '/^[[:space:]]*$/d')
          --junitxml="$RUNNER_TEMP/ci-private/c.xml" -q --tb=short
      - name: Check C ran every announced case
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          KEY: C_TOTAL
        run: >-
          python "$RUNNER_TEMP/focused_check.py" "$RUNNER_TEMP/ci-private/c.xml"
          --key "$KEY" --modules "$C_MODULES" --nodes "$C_REQUIRED_NODES"

      # ── 5. cross-group total: no vacuous green; floor = the bind-gate names ──
      - name: Cross-group total check
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/ci-private/total.env"
          count() { printf '%s' "$(printf '%s' "$1" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | grep -c .)"; }
          floor=$(( $(count "$A_NAMED_NODES") + $(count "$A_EXACT_NODES") + $(count "$B_REQUIRED_NODES") + $(count "$B_COMPANION_NODES") + $(count "$C_REQUIRED_NODES") ))
          echo "floor=$floor  groups: A=${A_TOTAL:-?} B=${B_TOTAL:-?} B_COMPANIONS=${B_COMPANIONS:-?} C=${C_TOTAL:-?}"
          for k in A_TOTAL B_TOTAL B_COMPANIONS C_TOTAL; do
            v="${!k:-0}"; test "$v" -ge 1 || { echo "group $k ran no cases"; exit 1; }
          done
          total=$(( ${A_TOTAL:-0} + ${B_TOTAL:-0} + ${B_COMPANIONS:-0} + ${C_TOTAL:-0} ))
          test "$total" -ge "$floor" || { echo "only $total named-node cases ran, expected at least $floor"; exit 1; }

      # ── 6. Linux only: the price the composed diff must pay in the same pass ──
      - name: Size-ratchet lane against the product parent
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && matrix.leg == 'linux' }}
        timeout-minutes: 20
        env:
          OURO_SIZE_RATCHET_BASE_REF: ${{ env.PRODUCT_PARENT }}
        run: python -m pytest tests/ -m size_ratchet -q --tb=short
      - name: Domain manifest gate
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && matrix.leg == 'linux' }}
        timeout-minutes: 10
        run: python scripts/check_domains.py
      - name: Generated inventories and docs sync
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && matrix.leg == 'linux' }}
        timeout-minutes: 20
        run: >-
          python -m pytest tests/test_domain_manifest.py tests/test_domain_report.py
          tests/test_architecture_facts.py tests/test_generated_inventories.py tests/test_docs_sync.py
          --junitxml="$RUNNER_TEMP/ci-private/inventories.xml" -q --tb=short
      - name: Check every inventory module ran
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && matrix.leg == 'linux' }}
        run: >-
          python "$RUNNER_TEMP/focused_check.py" "$RUNNER_TEMP/ci-private/inventories.xml"
          --modules tests/test_domain_manifest.py,tests/test_domain_report.py,tests/test_architecture_facts.py,tests/test_generated_inventories.py,tests/test_docs_sync.py

  browser:
    name: real Chromium — addressed Resume, Activity and Project room, plus C Node suites
    # The repo's own UI lane (.github/workflows/ui-browser.yml, #2735) records that the pinned
    # Chrome for Testing cannot start its sandbox on Ubuntu 23.10+ runners without a host
    # sysctl change. This job does NOT touch runner protections: it selects ubuntu-22.04,
    # where the pinned Chromium starts sandboxed as-is. If that image or the pinned browser
    # stops serving, this job goes honestly red — no --no-sandbox, no sysctl fallback, by design.
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Take the fixture, then test the pinned product head
        id: pin
        run: |
          set -euo pipefail
          case "$PRODUCT" in *'<<FILL'*) echo "PIN UNBOUND — set PRODUCT to the real candidate SHA"; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/ci-private" "$RUNNER_TEMP/ci-raw/browser/ui" "$RUNNER_TEMP/upload"
          test "$(git rev-parse 'HEAD^1')" = "$PRODUCT" || { echo "the QA commit is not directly over the pinned product head"; exit 1; }
          git show "$GITHUB_SHA:ci/synthetic_resume_choice_ui.py" > "$RUNNER_TEMP/synthetic_resume_choice_ui.py"
          test -s "$RUNNER_TEMP/synthetic_resume_choice_ui.py"
          git checkout --detach "$PRODUCT"
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          echo "tested tree: $(git rev-parse 'HEAD^{tree}')"
          git cat-file -e "HEAD:tests/test_held_continue_browser.py"
          git grep -q 'def test_held_continue_toast_activity_reason_and_resume_check' -- tests/test_held_continue_browser.py || {
            echo "the merged product toast/resume browser case is absent — C is not in this product head"; exit 1; }

      - uses: ./.github/actions/setup-python-env
        with:
          interpreter: shipped
          install-project: 'false'

      - name: Install the pinned Chromium and the reviewed Node
        id: install_browsers
        timeout-minutes: 45
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
        run: python -I -S scripts/ci_browser_install.py --pinned-node --pinned-chromium chromium

      # The Node suites C touched, on the SAME reviewed Node the UI lane stages
      # (narrow form of scripts/run_tests.py _node_lane: node --test, cwd web/).
      - name: Node lane, narrowed to the touched suites
        id: node_test
        if: ${{ !cancelled() && steps.install_browsers.outcome == 'success' }}
        timeout-minutes: 15
        env:
          NODE: ${{ github.workspace }}/node-standalone/bin/node
        run: |
          set -euo pipefail
          test -x "$NODE" || { echo "the reviewed Node is missing"; exit 1; }
          for f in web/tests/task_control_menu.test.js web/tests/work_status.test.js web/tests/activity_work_truth.test.js web/tests/room_work.test.js; do
            git cat-file -e "HEAD:$f" || { echo "$f absent at the product head"; exit 1; }
          done
          cd web && "$NODE" --test tests/task_control_menu.test.js tests/work_status.test.js tests/activity_work_truth.test.js tests/room_work.test.js

      # The synthetic scenario enters the product tree only for this run; the QA commit is
      # never part of the tested checkout, and no other UI file is collected here.
      - name: Place the synthetic scenario
        if: ${{ !cancelled() && steps.install_browsers.outcome == 'success' }}
        run: cp "$RUNNER_TEMP/synthetic_resume_choice_ui.py" tests/test_ci_synthetic_successor_resume_ui.py

      - name: Run the three sandboxed Chromium cases under safe_test
        id: browser
        if: ${{ !cancelled() && steps.install_browsers.outcome == 'success' }}
        timeout-minutes: 30
        env:
          OUROBOROS_RUN_UI_SMOKE: "1"
          OUROBOROS_EXPECT_BROWSER_ENGINES: chromium
          OUROBOROS_UI_EVIDENCE_DIR: ${{ runner.temp }}/ci-raw/browser/ui
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
          PLAYWRIGHT_NODEJS_PATH: ${{ github.workspace }}/node-standalone/bin/node
        run: >-
          python -I -S scripts/safe_test.py --temp-parent "$RUNNER_TEMP"
          --evidence-dir "$RUNNER_TEMP/ci-raw/browser" --
          python -m pytest -p tests.test_ci_synthetic_successor_resume_ui
          tests/test_ci_synthetic_successor_resume_ui.py
          'tests/test_held_continue_browser.py::test_held_continue_toast_activity_reason_and_resume_check[chromium]'
          'tests/test_held_continue_room_browser.py::test_a_continue_waiting_over_one_unconfirmed_start_offers_its_card_a_resume_whose_choice_asks_first[chromium]'
          -m ui_browser -q --tb=short --timeout=900
          --junitxml="$RUNNER_TEMP/ci-private/browser.xml"

      - name: Prove the addresses, the one-shot release, the lookup-only retention and the screen
        if: ${{ !cancelled() && steps.browser.outcome != 'skipped' }}
        env:
          JUNIT: ${{ runner.temp }}/ci-private/browser.xml
          EVIDENCE_DIR: ${{ runner.temp }}/ci-raw/browser/ui
          UPLOAD: ${{ runner.temp }}/upload
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, sys
          import xml.etree.ElementTree as ET

          junit = pathlib.Path(os.environ["JUNIT"])
          if not junit.is_file():
              print("CHECK browser.xml: MISSING — the pytest step produced no report"); raise SystemExit(1)
          cases = list(ET.parse(junit).getroot().iter("testcase"))
          bad = [f"{c.get('classname')}::{c.get('name')} {child.tag}"
                 for c in cases for child in c if child.tag in ("failure", "error", "skipped")]
          names = {(c.get("classname") or "") + "::" + (c.get("name") or "").split("[", 1)[0] for c in cases}
          need = {"tests.test_ci_synthetic_successor_resume_ui::test_addressed_resume_of_a_never_started_successor",
                  "tests.test_held_continue_browser::test_held_continue_toast_activity_reason_and_resume_check",
                  "tests.test_held_continue_room_browser::test_a_continue_waiting_over_one_unconfirmed_start_offers_its_card_a_resume_whose_choice_asks_first"}
          missing = need - names
          print(f"CHECK browser.xml: {len(cases)} case(s) ran; missing={sorted(missing)}")
          for note in bad:
              print("  " + note)
          if len(cases) != 3 or bad or missing:
              raise SystemExit(1)

          parent = pathlib.Path(os.environ["EVIDENCE_DIR"])
          png = parent / "successor-resume-confirmed.png"
          ask = parent / "successor-resume-ask.png"
          if not png.is_file() or png.stat().st_size == 0 or not ask.is_file() or ask.stat().st_size == 0:
              print("the scenario left no screenshot pair (ask + confirmed)"); raise SystemExit(1)
          facts = parent / "successor-resume-facts.json"
          if not facts.is_file():
              print("the scenario facts are missing from the evidence directory"); raise SystemExit(1)
          row = json.loads(facts.read_text(encoding="utf-8"))

          # Synthetic fixture addresses only (B's own _held_continue with before=_own_earlier_choice).
          # The claims that matter (list refusal, pre-admission rejection and Stop/Close/limits
          # are proven by the Python job, not by a press):
          #  * bare press 409; Cancel sent NOTHING else; recheck asks again with the same choice,
          #    still read_only with the earlier choice still in history; confirm 200 releases
          #    the SAME never-started successor exactly once and queues that same id;
          #  * repeat refused; old handshake row stays pending/lookup-only, never re-issued;
          #  * no engine starts/cancels; predecessor unchanged; no money amount inferred;
          #  * singular read-only dialog wording; page rendered clean (no errors).
          print("facts:", json.dumps({k: v for k, v in row.items() if k != 'rows'}, indent=None))
          checks = {
              "flow is predecessor→successor": row.get("flow") == \
                  "ended-predecessor -> held Continue -> addressed successor Resume",
              "same successor id": bool(row.get("expected_successor_id"))
                  and row.get("resumed_task_id") == row.get("expected_successor_id"),
              "released queue row is that successor": row.get("saved_row_released") is True,
              "same S still queued exactly once": row.get("same_id_queued_once") is True,
              "only three dialog POSTs with expected statuses": row.get("dialog_presses") == ["bare", "recheck", "confirm"]
                  and row.get("statuses") == [409, 409, 200],
              "cancel sent nothing further": row.get("posts_after_cancel") == 1,
              "recheck asked again, same choice": row.get("recheck_same_choice") is True,
              "recheck kept read_only": row.get("recheck_read_only") is True,
              "release happened exactly once": row.get("grant_uses") == 1,
              "choice targeted the lost read-only start": row.get("choice_targets_lost_start") is True,
              "singular read-only wording, no file-change claim": row.get("refusal_read_only_words") is True,
              "cancel left it held": row.get("cancel_left_it_held") is True,
              "addressed release named this successor": row.get("released_same_successor") is True,
              "acceptance recorded on the successor": row.get("acceptance_recorded_on_successor") is True,
              "old start kept UNKNOWN/lookup-only": row.get("unknown_start_kept_lookup_only") is True,
              "one repeat POST refused": row.get("repeat_status") in (409, 404)
                  and row.get("repeat_statuses") == [row.get("repeat_status")],
              "no engine dispatch": row.get("engine_starts_delta") == 0
                  and row.get("engine_cancels_delta") == 0,
              "money not inferred": row.get("money_amount_claimed") is False,
              "predecessor unchanged": row.get("predecessor_unchanged") is True,
              "no page errors": not row.get("page_errors"),
          }
          for name, ok in checks.items():
              print(("  ok   " if ok else "  FAIL ") + name)
          if not all(checks.values()):
              raise SystemExit(1)
          out = pathlib.Path(os.environ["UPLOAD"]); out.mkdir(parents=True, exist_ok=True)
          room = parent / "room-work" / "chromium"
          room_frames = sorted(room.glob("*held-continue-resume-choice*.png"))
          geometry = parent / "held-continue"
          phone = geometry / "chromium-3-held-row-menu-390.png"
          states = [geometry / f"chromium-2-activity-page-{theme}-{width}.png"
                    for theme in ("dark", "light") for width in (390, 1440)]
          if len(room_frames) != 1:
              print("Project room Resume frame is missing or ambiguous", room_frames); raise SystemExit(1)
          for f in (png, ask, parent / "successor-resume-dialog.txt", facts, phone, *states, *room_frames):
              (out / f.name).write_bytes(f.read_bytes())
          PY

      - name: Upload only this scenario's visual evidence
        if: ${{ !cancelled() && steps.browser.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: successor-resume-visual-evidence
          path: ${{ runner.temp }}/upload/
          if-no-files-found: error
          retention-days: 14
