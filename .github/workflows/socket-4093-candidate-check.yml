# socket-4093 candidate check — pinned tests on a GitHub-hosted Ubuntu runner.
#
# WHAT THIS JOB IS: a verification-only observation of the CURRENT local in-place scratch
# lifecycle. The witness and named contract checks use the checkout on a
# GitHub-hosted ubuntu-latest runner, and refuses to call a skip a pass.
#
# EFFECT BOUNDARY (what this job may touch):
#   - contents: read. No write scope of any kind.
#   - the checkout is read; credentials are not persisted (persist-credentials: false).
#   - no secret is referenced anywhere in this file.
#   - no Actions cache is written (setup-uv runs with enable-cache: false; uv's own cache
#     stays in the runner's own disposable temp).
#   - the only network use is the repository's own known dependency setup: setup-python,
#     setup-uv and `uv sync --locked --extra browser --group dev` (the same profile
#     .github/actions/setup-python-env uses).
#   - no product file is modified: the branch adds exactly two files (this workflow and the
#     witness), and the FIRST step after the checkout proves that against the branch's real
#     parent tree — before any dependency is installed and before the test runs.
#   - no historical suite runs: only explicitly pinned test node ids.
#   - no other branch and no pull-request event starts this workflow.
#
# TRIGGER: a push to the single branch below. Nothing else starts this workflow.
name: socket-4093 candidate check

on:
  push:
    branches:
      - 'ci-check/socket-4093'

permissions:
  contents: read

concurrency:
  group: "socket-4093-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  witness:
    # A leading '#' would be a YAML comment and would leave the job name empty.
    name: "4093 candidate witness (Ubuntu)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Keep the earlier validation attempt and the unchanged product commit.
          fetch-depth: 3
      # The delta proof comes FIRST: it needs only git and the stdlib, so a branch that is
      # not exactly this two-file addition fails before dependencies are installed and
      # before a single test is collected.
      - name: This branch adds exactly the workflow and the witness
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import sys

          def git(*args):
              done = subprocess.run(["git", *args], capture_output=True, text=True)
              if done.returncode != 0:
                  sys.exit(f"git {' '.join(args)} failed: {done.stderr.strip()}")
              return done.stdout.strip()

          try:
              parent = git("rev-parse", "HEAD^^")
          except SystemExit:
              sys.exit("the checkout is missing the product commit (fetch-depth must be 3)")
          if parent != "d3d378cc24e518ee0a0f1d8e1a7fff89e3a79f1b":
              sys.exit("this check is bound to the unchanged product commit")
          head = git("rev-parse", "HEAD")
          tree = git("rev-parse", "HEAD^{tree}")
          delta = [line for line in git("diff", "--name-status", parent, "HEAD").splitlines() if line]
          expected = {"A\ttests/test_socket_4093_candidate_witness.py",
                      "A\t.github/workflows/socket-4093-candidate-check.yml"}
          print("HEAD   ", head)
          print("parent ", parent)
          print("tree   ", tree)
          for line in delta:
              print("delta  ", line)
          if set(delta) != expected:
              sys.exit("the branch delta is not exactly the two additions this job adds")
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          enable-cache: false
          activate-environment: true
      - name: Install the pinned test dependencies
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: uv sync --locked --extra browser --group dev
      - name: Record the runner account's stable home before safe_test replaces HOME
        run: |
          set -euo pipefail
          echo "SOCKET_4093_RUNNER_HOME=$HOME" >> "$GITHUB_ENV"
      - name: "Run the pinned #4093 witness"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-evidence/socket-4093" "$RUNNER_TEMP/ci-private"
          python -I -S scripts/safe_test.py --temp-parent /tmp -- \
            python -m pytest \
              tests/test_socket_4093_candidate_witness.py::test_a_full_in_place_run_gets_a_private_scratch_a_real_socket_binds_in_it_and_the_host_releases_exactly_it \
              -o addopts= -q -rs --tb=short \
              --ci-evidence-dir="$RUNNER_TEMP/ci-evidence/socket-4093" \
              --junitxml="$RUNNER_TEMP/ci-private/socket-4093.xml"
      - name: The witness ran (a skip is not a pass)
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/ci-private/socket-4093.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as E

          root = E.parse(sys.argv[1]).getroot()
          suites = list(root.iter("testsuite"))
          if not suites:
              print("the report holds no testsuite")
              sys.exit(1)
          ran = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          print(f"{ran} ran, {skipped} skipped, {failed} failed, {errors} errors")
          sys.exit(0 if (ran == 1 and skipped == 0 and failed == 0 and errors == 0) else 1)
          PY
      - name: Named ordinary I/O and platform contract checks
        run: |
          set -euo pipefail
          python -I -S scripts/safe_test.py --temp-parent /tmp --timeout 180 -- \
            python -m pytest -o addopts= -q -rs --tb=short \
            'tests/test_session_service_directories.py::test_a_private_choice_that_fails_before_the_record_removes_its_own_names_and_tries_the_shared_parent_once[unreadable-git-probe]' \
            'tests/test_session_service_directories.py::test_a_record_write_that_failed_after_publication_or_cannot_be_read_back_keeps_the_container' \
            'tests/test_session_service_directories.py::test_an_unreadable_record_stat_keeps_the_prior_durable_record_and_allocates_nothing' \
            'tests/test_session_service_directories.py::test_managed_discard_and_rollback_preserve_typed_work_domain_unsettled' \
            'tests/test_delegated_in_place.py::test_a_full_access_in_place_run_is_named_its_own_disposable_scratch_and_granted_nothing' \
            'tests/test_test_environment.py::test_the_home_must_leave_the_deepest_nested_socket_its_bytes' \
            'tests/test_test_environment.py::test_ephemeral_ancestor_catches_case_insensitive_aliases_by_identity_and_preserves_distinct_dirs_and_io_fallback' \
            'tests/test_test_environment.py::test_non_utf8_home_is_ineligible_for_new_private_scratch_and_falls_back_to_shared_parent' \
            --junitxml="$RUNNER_TEMP/ci-private/socket-4093-focused.xml"
      - name: All ten named regression cases ran
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/ci-private/socket-4093-focused.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as E

          suites = list(E.parse(sys.argv[1]).getroot().iter('testsuite'))
          totals = tuple(sum(int(s.get(k, 0)) for s in suites) for k in ('tests', 'skipped', 'failures', 'errors'))
          print(f'{totals[0]} ran, {totals[1]} skipped, {totals[2]} failed, {totals[3]} errors')
          sys.exit(0 if totals == (10, 0, 0, 0) else 1)
          PY
