# Temporary diagnostic for issue #3501 (Windows node lane memory overload since #3484); never merged.
name: diag-3501
on:
  push:
    branches: ['diag/3501-windows-node']
permissions:
  contents: read
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: The fixed portal file, eight runs as the lane runs it
        shell: bash
        working-directory: web
        run: |
          node --version
          set +e
          fails=0
          for i in 1 2 3 4 5 6 7 8; do
            node --max-old-space-size=1024 --test --test-reporter=tap tests/work_portal.test.js > ../p_$i.log 2>&1
            code=$?
            echo "run $i exit $code oks=$(grep -c '^ok ' ../p_$i.log) notok=$(grep -c '^not ok ' ../p_$i.log)"
            [ $code -ne 0 ] && fails=$((fails+1)) && grep -m5 -A3 '^not ok' ../p_$i.log
          done
          echo "portal fails=$fails"
      - name: Every node test file once, as the lane runs them
        shell: bash
        working-directory: web
        run: |
          set +e
          node --max-old-space-size=2048 --test --test-concurrency=4 --test-reporter=tap tests/*.test.js > ../all.log 2>&1
          echo "all exit $? oks=$(grep -c '^ok ' ../all.log) notok=$(grep -c '^not ok ' ../all.log)"
          grep -m10 '^not ok' ../all.log
