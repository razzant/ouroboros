name: Skill secret form checks
'on':
  push:
    branches: ['ci-check/skill-secret-form-*']
permissions:
  contents: read
jobs:
  form:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      NO_PROXY: '127.0.0.1,localhost'
      MSYS2_ARG_CONV_EXCL: '*'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 4
      - id: setup
        uses: ./.github/actions/setup-python-env
        with:
          profile: test
          interpreter: shipped
          install-project: 'false'
      - name: Named form and history journeys on a fictional profile
        shell: bash
        run: |
          set -euo pipefail
          nodes=(
            'tests/test_secret_hitl.py::test_an_older_client_save_without_an_allow_only_saves_on_this_server'
            'tests/test_secret_hitl.py::test_replace_while_readers_are_enabled_reports_them_and_grants_nothing'
            'tests/test_secret_hitl.py::test_save_and_allow_grants_only_the_shown_skill_its_keys_and_turns_it_on'
            'tests/test_secret_hitl.py::test_two_waiting_allows_report_only_the_fields_and_switch_each_press_named'
            'tests/test_secret_hitl.py::test_files_not_admitted_keep_the_consent_until_their_admission_then_grant_once'
            'tests/test_secret_hitl.py::test_an_off_the_owner_chose_stays_off_and_the_allow_only_grants[False]'
            'tests/test_secret_hitl.py::test_an_off_after_the_consent_cancels_its_turn_on_but_not_its_grant'
            'tests/test_secret_hitl.py::test_earlier_waiting_allows_survive_later_presses_and_keep_their_results'
            'tests/test_secret_hitl.py::test_a_deferred_grant_survives_a_failed_card_write[status]'
            'tests/test_quiz_history_evidence.py::test_an_answer_arriving_after_its_question_carries_its_delivery_as_it_is_now'
            'tests/test_secret_allow_settlement.py::test_early_allow_reply_names_a_bound_job_after_the_save'
            'tests/test_secret_allow_settlement.py::test_keys_only_the_form_granted_hold_for_that_installation_and_ordinary_grants_stay'
            'tests/test_secret_allow_settlement.py::test_a_rolled_back_update_ends_the_consent_that_waited_for_its_files[normal]'
            'tests/test_secret_allow_settlement.py::test_a_rolled_back_update_ends_the_consent_that_waited_for_its_files[retry]'
            'tests/test_workflow_skill_finality.py::test_current_terminal_reference_wins_over_prior_verdict'
            'tests/test_secret_allow_settlement.py::test_a_claim_a_restart_cut_is_unknown_at_startup_and_never_granted'
            'tests/test_secret_allow_settlement.py::test_admitted_other_files_end_a_consent_for_the_earlier_ones'
            'tests/test_secret_allow_settlement.py::test_a_late_result_is_one_host_row_that_updates_its_card_and_says_nothing'
            'tests/test_secret_allow_settlement.py::test_an_evicted_cancelled_secret_card_reads_back_closed_never_open'
            'tests/test_secret_allow_settlement.py::test_a_native_or_clawhub_folder_binds_the_form_only_with_the_record_that_lands_there[native-builtin-True]'
            'tests/test_secret_allow_settlement.py::test_a_native_or_clawhub_folder_binds_the_form_only_with_the_record_that_lands_there[clawhub-registry-True]'
            'tests/test_secret_hitl.py::test_an_off_the_owner_chose_stays_off_and_the_allow_only_grants[True]'
            'tests/test_secret_allow_settlement.py::test_successive_immediate_allows_accumulate_and_preserve_ordinary_decisions'
            'tests/test_secret_allow_settlement.py::test_startup_recovery_finishes_unclaimed_admitted_consent_once'
            'tests/test_secret_allow_settlement.py::test_settle_pending_update_refreshes_already_enabled_extension_once'
            'tests/test_secret_allow_settlement.py::test_unreadable_switch_stays_unknown_beside_grant_with_historical_receipt'
            'tests/test_secret_allow_settlement.py::test_orphan_recovery_serializes_behind_active_allow_reservation'
            'tests/test_secret_allow_settlement.py::test_form_only_repair_keeps_held_notify_owner_ungranted_and_reading_unblocked'
            'tests/test_secret_allow_settlement.py::test_orphan_recovery_does_not_fall_back_to_stale_block_when_absent'
            'tests/test_chat_history_paging.py::test_a_project_secret_result_catches_up_main_as_card_evidence'
            'tests/test_quiz_history_evidence.py::test_settled_cards_show_no_saved_delivery_once_their_blocks_are_evicted[main]'
            'tests/test_quiz_history_evidence.py::test_settled_cards_show_no_saved_delivery_once_their_blocks_are_evicted[project]'
            'tests/test_quiz_history_evidence.py::test_selected_garden_answer_and_its_comment_survive_a_competing_page_row'
            'tests/test_secret_allow_settlement.py::test_a_press_whose_consent_was_recorded_before_a_restart_reads_waiting_not_unknown'
            'tests/test_secret_allow_settlement.py::test_a_grant_step_a_busy_lane_never_started_reads_not_started_and_never_runs'
            'tests/test_secret_allow_settlement.py::test_cyber_pro_admits_files_by_the_authors_ordinary_acceptance_never_by_the_mode[ordinary-True]'
            'tests/test_secret_allow_settlement.py::test_cyber_pro_admits_files_by_the_authors_ordinary_acceptance_never_by_the_mode[strict-False]'
            'tests/test_secret_allow_settlement.py::test_an_ordinary_author_acceptance_in_cyber_pro_completes_the_waiting_allow_with_one_preparation'
            'tests/test_secret_allow_settlement.py::test_a_form_grant_then_an_ordinary_grant_of_another_field_keeps_both_and_names_each_readers_own_keys'
            'tests/test_secret_allow_settlement.py::test_a_rolled_back_update_restores_the_forms_key_and_its_retry_only_finishes_that'
            'tests/test_secret_hitl.py::test_save_writes_settings_only_and_delivers_metadata_only_secret_filled'
            'tests/test_secret_hitl.py::test_a_step_that_never_began_resumes_on_its_repeat_and_reads_not_started_after_a_restart'
            'tests/test_secret_save_outcomes.py::test_no_readers_and_an_unreadable_grant_stay_distinct_known_facts[grant_unknown]'
          )
          python -m pytest -o addopts= -vv --tb=short --timeout=180 --junitxml=form-cases.xml "${nodes[@]}"
          python - "${#nodes[@]}" <<'PY'
          import sys,xml.etree.ElementTree as E
          cases=E.parse('form-cases.xml').findall('.//testcase'); assert len(cases)==int(sys.argv[1]),[(c.get('name')) for c in cases]
          assert not [c.get('name') for c in cases if any(c.find(t) is not None for t in ('skipped','failure','error'))]
          PY
      - name: State of the two buttons and the recorded result
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap --test-name-pattern='^(a status naming the skill offers Save and allow beside Save|Save, allow and turn on sends the shown files and fields|an older server without skill facts|a known secret allow and its reader snapshot|files changed since the form read them:|a full read without a delivery fact drops an owed observation older than its start|same files after reinstall:|a refused, unknown or pending allow is never shown as access)' web/tests/secret_hitl.test.js web/tests/chat_decision.test.js | tee form-node.tap
          grep -E '^# pass 8$' form-node.tap
      - name: Contracts and size on the product's base
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        env:
          OURO_SIZE_RATCHET_BASE_REF: f3cb6aacb6a548bf1a21d2e886cca549d1bddcba
        run: |
          set -euo pipefail
          # Compare a single candidate with its stated base even on this disposable branch.
          git cat-file -e "${OURO_SIZE_RATCHET_BASE_REF}^{commit}"
          env -u GITHUB_EVENT_NAME OURO_BOOK_GROWTH_MODE=block python -m pytest -o addopts= -vv --tb=short --junitxml=form-structure.xml \
            tests/test_gateway_parity.py::test_gateway_contract_endpoint_index_matches_router_and_types \
            tests/test_domain_manifest.py::test_manifest_covers_the_tracked_population_exactly \
            tests/test_domain_manifest.py::test_strict_direction_matrix_matches_the_pinned_baseline \
            tests/test_domain_manifest.py::test_lazy_and_dynamic_classification_matches_the_pin \
            tests/test_smoke.py::test_no_oversized_modules tests/test_smoke.py::test_no_extremely_oversized_functions \
            tests/test_smoke.py::test_size_ratchet_manifest_matches_live_tree \
            tests/test_smoke.py::test_size_ratchet_transition_against_explicit_base \
            tests/test_reference_book_budgets.py::test_a_change_does_not_grow_a_reference_book \
            tests/test_reference_book_budgets.py::test_a_change_does_not_grow_bible_or_the_prompts \
            'tests/test_architecture_r1_contracts.py::test_skill_lifecycle_facts_match_the_current_contract[preflight]'
          python - <<'PY'
          import xml.etree.ElementTree as E
          cases = E.parse('form-structure.xml').findall('.//testcase')
          assert len(cases) == 11 and all(not list(c) for c in cases), [(c.get('name'), [x.tag for x in c]) for c in cases]
          PY
      - id: browser
        name: Install test browsers on the disposable runner
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/form-browsers
        run: python -I -S scripts/ci_browser_install.py --pinned-node --attempt-seconds 300 chromium webkit
      - name: Open the served form on a fictional installation
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/form-browsers
          PLAYWRIGHT_NODEJS_PATH: ${{ github.workspace }}/node-standalone/bin/node
          OUROBOROS_RUN_UI_SMOKE: '1'
          OUROBOROS_UI_EVIDENCE_DIR: ${{ runner.temp }}/form-views
        run: |
          set -euo pipefail
          python -m pytest -o addopts= -vv --tb=short --timeout=180 --junitxml=form-ui.xml \
            tests/test_secret_hitl_browser.py::test_save_and_allow_screens \
            tests/test_secret_hitl_browser.py::test_save_and_allow_for_files_not_reviewed_waits_for_their_review
          python - <<'PY'
          import xml.etree.ElementTree as E
          cases=E.parse('form-ui.xml').findall('.//testcase'); assert len(cases)==8
          assert not [c.get('name') for c in cases if any(c.find(t) is not None for t in ('skipped','failure','error'))]
          PY
      - name: Keep the case results and synthetic frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: form-${{ matrix.os }}
          path: |
            form-cases.xml
            form-node.tap
            form-structure.xml
            form-ui.xml
            ${{ runner.temp }}/form-views/**/*.png
          if-no-files-found: warn
