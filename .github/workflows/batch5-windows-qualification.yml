name: Batch 5 native Windows source Quit qualification

on:
  push:
    branches: [codex/batch5-windows-qualification-20261005]

permissions:
  contents: read

concurrency:
  group: batch5-native-windows-20261005
  cancel-in-progress: false

jobs:
  windows-quit:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      QUALIFICATION_SOURCE_SHA: 6e2aab6f12e677c55549d0044815ea4215417a87
      QUALIFICATION_SOURCE_TREE: 92b15aaebe16055db79c4ab487545d741dc8f2d5
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      # Applies only to this disposable runner's Git invocations and preserves source bytes.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout qualification controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false
      - name: Checkout exact candidate independently
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QUALIFICATION_SOURCE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Bind independent candidate before runtime bootstrap
        run: |
          $ErrorActionPreference = 'Stop'
          $head = git -C candidate rev-parse HEAD
          $tree = git -C candidate rev-parse 'HEAD^{tree}'
          if ($head -ne $env:QUALIFICATION_SOURCE_SHA -or $tree -ne $env:QUALIFICATION_SOURCE_TREE) {
            throw 'Candidate source identity does not match the pin'
          }
          git -C candidate remote remove origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C candidate checkout -B ouroboros $env:QUALIFICATION_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git -C candidate status --porcelain) { throw 'Candidate is dirty before qualification' }
          Write-Host "candidate=$head tree=$tree control=$env:GITHUB_SHA"
      - name: Set up base Python without a virtualenv PID redirector
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: candidate/requirements-runtime.lock
      - name: Install the candidate's locked runtime dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --disable-pip-version-check -r candidate/requirements-runtime.lock
          exit $LASTEXITCODE
      - name: Observe native runner and dependency readiness
        run: |
          python -c "import sys,platform,psutil,uvicorn,websockets; print(platform.platform()); print(sys.version); print(sys.executable); print({'cpu_count':psutil.cpu_count(),'memory':psutil.virtual_memory()._asdict()}); assert sys.platform=='win32'; assert sys.prefix==sys.base_prefix"
          exit $LASTEXITCODE
      - name: Qualify actual launcher Quit with 24 running tasks and 15 retained descendants
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path candidate).Path
          $probe = (Resolve-Path control/scripts/qualification/batch5/qualify_quit.py).Path
          $root = Join-Path $env:RUNNER_TEMP 'batch5-windows-quit'
          $log = "$root.log"
          python $probe --source $source --run-root $root --expected-sha $env:QUALIFICATION_SOURCE_SHA --require-windows --workers 24 --tasks 24 --extra-processes --daemon-descendants 15 *> $log
          $producer = $LASTEXITCODE
          Get-Content -Raw $log
          "producer_exit=$producer" | Out-File -FilePath "$root-producer.txt" -Encoding utf8
          exit $producer
      - name: Retain complete qualification receipts on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: batch5-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/batch5-windows-quit/
            ${{ runner.temp }}/batch5-windows-quit.log
            ${{ runner.temp }}/batch5-windows-quit-producer.txt
          if-no-files-found: error
          retention-days: 30
