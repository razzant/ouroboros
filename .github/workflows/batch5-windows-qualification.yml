name: Batch 5 native Windows source Quit qualification

on:
  push:
    branches: [codex/batch5-windows-qualification-20261005]

permissions:
  contents: read

concurrency:
  group: batch5-native-windows-20261005
  cancel-in-progress: false

jobs:
  windows-quit:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      QUALIFICATION_SOURCE_SHA: 83a6776d60c63e8900aa9f397baa41b717996b13
      QUALIFICATION_SOURCE_TREE: 070cf01469212eb22f5c8e292a2ea3caea1795b1
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      # Applies only to this disposable runner's Git invocations and preserves source bytes.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout qualification controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false
      - name: Checkout exact candidate independently
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.QUALIFICATION_SOURCE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Bind independent candidate before runtime bootstrap
        run: |
          $ErrorActionPreference = 'Stop'
          $head = git -C candidate rev-parse HEAD
          $tree = git -C candidate rev-parse 'HEAD^{tree}'
          if ($head -ne $env:QUALIFICATION_SOURCE_SHA -or $tree -ne $env:QUALIFICATION_SOURCE_TREE) {
            throw 'Candidate source identity does not match the pin'
          }
          git -C candidate remote remove origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C candidate checkout -B ouroboros $env:QUALIFICATION_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git -C candidate status --porcelain) { throw 'Candidate is dirty before qualification' }
          Write-Host "candidate=$head tree=$tree control=$env:GITHUB_SHA"
      - name: Set up base Python without a virtualenv PID redirector
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: candidate/requirements-runtime.lock
      - name: Install the candidate's locked runtime dependencies
        id: install_deps
        timeout-minutes: 15
        run: |
          python -m pip install --disable-pip-version-check -r candidate/requirements-runtime.lock
          exit $LASTEXITCODE
      - name: Observe native runner and dependency readiness
        run: |
          python -c "import sys,platform,psutil,uvicorn,websockets; print(platform.platform()); print(sys.version); print(sys.executable); print({'cpu_count':psutil.cpu_count(),'memory':psutil.virtual_memory()._asdict()}); assert sys.platform=='win32'; assert sys.prefix==sys.base_prefix"
          exit $LASTEXITCODE
      - name: Install opt-in diagnostics in this disposable Python only
        run: |
          $diagnostic = (Resolve-Path control/scripts/qualification/batch5/sitecustomize.py).Path
          python -c "import pathlib,sys,sysconfig; source=pathlib.Path(sys.argv[1]); target=pathlib.Path(sysconfig.get_path('purelib'))/'sitecustomize.py'; assert not target.exists(), 'Refusing to replace an existing sitecustomize'; target.write_bytes(source.read_bytes()); print('Diagnostic hook installed:',target)" $diagnostic
          exit $LASTEXITCODE
      - name: Prove private pipe isolation before the loaded Quit scenario
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $safe = (Resolve-Path candidate/scripts/safe_test.py).Path
          $log = Join-Path $env:RUNNER_TEMP 'batch5-windows-pipe-precheck-d.log'
          python -I -S $safe --temp-parent $env:RUNNER_TEMP -- python -m pytest -o addopts='' tests/test_shutdown_signal_1142.py -k 'launcher_pipe_only_an_explicit_quit or private_launcher_reader or direct_server' -q 2>&1 | Tee-Object -FilePath $log
          $producer = $LASTEXITCODE
          "producer_exit=$producer" | Out-File -FilePath "$log-producer.txt" -Encoding utf8
          exit $producer
      - name: Qualify actual launcher Quit with 24 running tasks and 15 retained descendants
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path candidate).Path
          $probe = (Resolve-Path control/scripts/qualification/batch5/qualify_quit.py).Path
          $root = Join-Path $env:RUNNER_TEMP 'batch5-windows-quit-d'
          $log = "$root.log"
          python -u $probe --source $source --run-root $root --expected-sha $env:QUALIFICATION_SOURCE_SHA --require-windows --workers 24 --tasks 24 --extra-processes --daemon-descendants 15 2>&1 | Tee-Object -FilePath $log
          # Tee-Object is a PowerShell cmdlet, so LASTEXITCODE still belongs to Python.
          $producer = $LASTEXITCODE
          "producer_exit=$producer" | Out-File -FilePath "$root-producer.txt" -Encoding utf8
          exit $producer
      - name: Focused native Windows recovery and process tests
        if: ${{ !cancelled() && steps.install_deps.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $safe = (Resolve-Path candidate/scripts/safe_test.py).Path
          $log = Join-Path $env:RUNNER_TEMP 'batch5-windows-focused-d.log'
          $xml = Join-Path $env:RUNNER_TEMP 'batch5-windows-focused-d.xml'
          $evidence = Join-Path $env:RUNNER_TEMP 'batch5-windows-focused-d-evidence'
          python -I -S $safe --temp-parent $env:RUNNER_TEMP -- python -m pytest -o addopts='' tests/test_update_dirty_stash.py tests/test_update_stash_recovery.py tests/test_shared_daemon_processes.py tests/test_shutdown_signal_1142.py tests/test_server_shutdown.py -q --junitxml=$xml --ci-evidence-dir=$evidence 2>&1 | Tee-Object -FilePath $log
          $producer = $LASTEXITCODE
          "producer_exit=$producer" | Out-File -FilePath "$log-producer.txt" -Encoding utf8
          exit $producer
      - name: Retain complete qualification receipts on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: batch5-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/batch5-windows-pipe-precheck-d.log
            ${{ runner.temp }}/batch5-windows-pipe-precheck-d.log-producer.txt
            ${{ runner.temp }}/batch5-windows-quit-d/
            ${{ runner.temp }}/batch5-windows-quit-d.log
            ${{ runner.temp }}/batch5-windows-quit-d-producer.txt
            ${{ runner.temp }}/batch5-windows-focused-d.log
            ${{ runner.temp }}/batch5-windows-focused-d.log-producer.txt
            ${{ runner.temp }}/batch5-windows-focused-d.xml
            ${{ runner.temp }}/batch5-windows-focused-d-evidence/
          if-no-files-found: error
          retention-days: 30
