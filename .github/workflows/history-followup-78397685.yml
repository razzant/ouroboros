name: Main history — focused follow-up
'on':
  push:
    branches: [qa/history-followup-78397685]
permissions: {contents: read}
env:
  PRODUCT: '1479dd189e046dfb9e7c9ef7b9a15737e6cdb91b'
  OUROBOROS_PREFLIGHT_REQUIRE_PLUGINS: '1'
  OUROBOROS_PREFLIGHT_REQUIRE_NODE: '1'
jobs:
  observe:
    name: ${{ matrix.suite }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        suite: [python, node]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind overlay, then switch to product
        id: bind
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = razzant/ouroboros
          test "$GITHUB_REF" = refs/heads/qa/history-followup-78397685
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%P HEAD)" = "$PRODUCT"
          test "$(git diff --name-status --no-renames "$PRODUCT" HEAD --)" = $'A\t.github/workflows/history-followup-78397685.yml'
          git checkout --detach "$PRODUCT"
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test -z "$(git status --porcelain)"
          printf 'Product %s; tree %s; QA overlay %s\n' "$PRODUCT" "$(git rev-parse 'HEAD^{tree}')" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Put Windows scratch on the work disk
        if: runner.os == 'Windows'
        run: printf 'TEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-python-env
        with: {interpreter: shipped, install-project: 'false'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Verify the toolchain
        run: |
          python -I - <<'PY'
          import platform, re, shutil, sqlite3, subprocess, sys
          from pathlib import Path
          pin = re.search(r'^PY_VERSION="([\d.]+)"', Path('scripts/download_python_standalone.sh').read_text(encoding='utf-8'), re.M)
          if sys.prefix == sys.base_prefix or not pin or platform.python_version() != pin[1]:
              raise SystemExit(f'Expected the shipped Python {pin and pin[1]} in a dependency-only venv; got {sys.version}')
          node = shutil.which('node')
          version = subprocess.check_output([node, '--version'], text=True).strip() if node else ''
          if not version.startswith('v22.'):
              raise SystemExit(f'Expected Node 22, got {version!r}')
          print(f'{sys.platform}: Python {platform.python_version()}, SQLite {sqlite3.sqlite_version}, Node {version}', flush=True)
          PY
      - name: Run the pytest cases (one safe_test)
        if: ${{ matrix.suite == 'python' }}
        run: |
          python -I - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          from xml.etree import ElementTree as ET

          sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          PY_CASES = json.loads(r'''["tests/test_boot_readiness.py::test_an_owner_message_is_accepted_durably_while_recovery_still_runs_and_a_task_start_still_waits","tests/test_call_open_ingress.py::test_call_open_rendering_never_attributes_host_text_to_the_owner[False-history]","tests/test_chat_attachments.py::test_a_failed_web_write_keeps_its_uploads_and_one_retry_hands_a_proven_undispatched_row_over","tests/test_chat_attachments.py::test_a_placeholder_is_marked_only_when_the_host_wrote_it","tests/test_chat_attachments.py::test_every_attachment_is_recorded_echoed_and_replayed_past_the_text_tail","tests/test_chat_attachments.py::test_live_echoes_carry_the_rows_placeholder_mark","tests/test_chat_attachments.py::test_replay_shows_an_upload_deleted_or_rewritten_since_as_unavailable","tests/test_chat_attachments.py::test_transport_inline_photo_is_parked_once_and_still_reaches_vision","tests/test_chat_attachments.py::test_web_acceptance_records_refs_and_echo_equals_history","tests/test_chat_history_lineage_anchor.py::test_a_folded_review_represents_the_task_it_is_shown_under","tests/test_chat_history_lineage_anchor.py::test_a_grandchild_is_kept_with_the_swarm_it_belongs_to","tests/test_chat_history_lineage_anchor.py::test_a_media_delivery_row_does_not_represent_its_parent","tests/test_chat_history_quotas.py::test_default_quotas_keep_recent_history","tests/test_chat_history_quotas.py::test_history_projects_terminal_review_truth_only_on_existing_summary","tests/test_chat_history_quotas.py::test_legacy_limit_governs_human_quota_when_n_human_absent","tests/test_chat_history_quotas.py::test_legacy_skill_refs_fold_only_with_safe_root_and_skill","tests/test_chat_history_quotas.py::test_panel_chat_zero_stays_hidden_and_request_zero_still_means_main","tests/test_chat_history_quotas.py::test_progress_flood_does_not_evict_human_messages","tests/test_chat_history_quotas.py::test_skill_review_group_dedupes_only_nonempty_job_ids_latest_wins","tests/test_chat_history_quotas.py::test_