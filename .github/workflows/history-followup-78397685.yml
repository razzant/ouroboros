::test_an_empty_ts_census_anchor_with_zero_tools_gets_no_carrier","tests/test_history_tool_carriers.py::test_answered_root_with_open_late_work_is_not_readdressed_at_the_page_end[completed]","tests/test_history_tool_carriers.py::test_answered_root_with_open_late_work_is_not_readdressed_at_the_page_end[failed]","tests/test_history_tool_carriers.py::test_current_root_narration_outside_page_keeps_evidence_without_fake_cursor","tests/test_history_tool_carriers.py::test_empty_known_missing_replay_is_carried_as_incomplete[summary]","tests/test_history_tool_carriers.py::test_empty_reader_gap_still_has_an_inert_carrier","tests/test_history_tool_carriers.py::test_known_unfinished_speech_does_not_claim_completion","tests/test_history_tool_carriers.py::test_one_history_request_lists_the_archive_directory_once","tests/test_history_tool_carriers.py::test_rotated_out_calls_reach_the_card_as_host_totals_on_reload_and_reconnect","tests/test_history_tool_carriers.py::test_unreadable_archive_directory_reports_the_same_gap_on_every_carrier","tests/test_history_tool_carriers.py::test_unrelated_archive_bound_does_not_invent_tool_work[0]","tests/test_history_tool_carriers.py::test_unrelated_archive_bound_does_not_invent_tool_work[12]","tests/test_history_tool_carriers.py::test_unrelated_archive_bound_does_not_invent_tool_work[3]","tests/test_ingress_undispatched_boundary.py::test_a_changed_message_under_an_owed_id_is_refused_and_the_obligation_waits","tests/test_ingress_undispatched_boundary.py::test_a_landed_row_whose_handoff_was_lost_is_dispatched_once_by_the_first_retry","tests/test_ingress_undispatched_boundary.py::test_a_web_dispatch_that_was_entered_then_raised_is_unknown","tests/test_ingress_undispatched_boundary.py::test_deferred_dispatch_echo_does_not_claim_future_call","tests/test_ingress_undispatched_boundary.py::test_history_during_append_does_not_claim_dispatch","tests/test_ingress_undispatched_boundary.py::test_only_the_process_that_took_a_dispatch_says_it_was_entered","tests/test_installation_stop.py::test_restart_flag_names_exist_only_in_the_boot_compatibility_reader","tests/test_legacy_advisory_refusal_reading.py::test_stamp_sources_keep_raw_objective_while_compact_history_interprets_it[change0-Done with warnings]","tests/test_legacy_advisory_refusal_reading.py::test_stamp_sources_keep_raw_objective_while_compact_history_interprets_it[change1-Failed]","tests/test_legacy_advisory_refusal_reading.py::test_stamp_sources_keep_raw_objective_while_compact_history_interprets_it[change2-Failed]","tests/test_legacy_advisory_refusal_reading.py::test_task_detail_and_history_read_it_the_same_way_and_the_published_main_row_keeps_its_words","tests/test_main_durable_edges.py::test_native_project_nonclean_final_history_reaches_actual_consumer_once","tests/test_memory_capture_reads.py::test_main_view_reads_its_open_rows_a_page_at_a_time_and_reads_as_before","tests/test_message_bus.py::test_project_completion_summary_keeps_event_time_label_live_and_on_reload","tests/test_message_bus.py::test_saved_web_ingress_replays_from_canonical_history","tests/test_message_bus.py::test_terminal_incident_persists_and_replays_as_system_without_raw_salvage","tests/test_native_terminal_history.py::test_legacy_transient_history_does_not_invent_execution_facts[chat]","tests/test_owner_input_saved.py::test_owner_send_confirmation_journeys","tests/test_owner_stop_terminal_command.py::test_history_task_detail_and_terminal_row_say_the_same_word","tests/test_panic_scope_census.py::test_launcher_completion_and_known_only_startup_keep_their_admission_and_exit_order","tests/test_place_memory.py::test_gateway_keeps_full_place_id_and_its_terminal_summary","tests/test_presence_delivery.py::test_http_records_exact_facts_with_nonterminal_history_type[delivered-out]","tests/test_presence_delivery.py::test_http_records_exact_facts_with_nonterminal_history_type[failed-system]","tests/test_presence_delivery.py::test_http_records_exact_facts_with_nonterminal_history_type[uncertain-system]","tests/test_presence_history.py::test_a_time_ordered_page_costs_its_own_rows_newest_and_deep[distinct-times]","tests/test_presence_history.py::test_a_time_ordered_page_costs_its_own_rows_newest_and_deep[one-shared-time]","tests/test_presence_history.py::test_main_keeps_its_own_newest_page_after_a_bulk_import_into_a_place_room","tests/test_presence_send_receipts.py::test_room_label_cache_keeps_source_failure_and_ambiguous_names_unknown","tests/test_process_custody.py::test_every_process_kind_names_who_stops_it_at_each_door","tests/test_project_child_words_placement.py::test_a_routing_notice_for_a_child_stands_alone_and_the_childs_words_stay_in_its_card","tests/test_project_completion_mirror.py::test_a_row_without_the_key_replays_without_it","tests/test_project_completion_mirror.py::test_the_roots_closing_sentence_rides_its_row_live_durable_and_replayed[Empty tables now export as a header-only CSV.\\n\\n42 rows at /tmp/export.csv. The owner checks next.]","tests/test_project_completion_mirror.py::test_the_roots_closing_sentence_rides_its_row_live_durable_and_replayed[Empty tables now export as a header-only CSV.]","tests/test_project_plain_rows.py::test_history_normalizes_old_project_rows_on_read_without_rewriting_log","tests/test_project_work_card_payload.py::test_legacy_work_name_uses_cached_structured_result_and_preserves_recorded_name[fields0-Current \\u203a title]","tests/test_project_work_card_payload.py::test_legacy_work_name_uses_cached_structured_result_and_preserves_recorded_name[fields1-Suggested \\u203a title]","tests/test_project_work_card_payload.py::test_legacy_work_name_uses_cached_structured_result_and_preserves_recorded_name[fields2-Project]","tests/test_quiz_history_evidence.py::test_a_late_answer_keeps_its_evidence_row_and_also_enters_dialogue","tests/test_quiz_history_evidence.py::test_competing_answers_preserve_only_the_recorded_winner[False]","tests/test_quiz_history_evidence.py::test_competing_answers_preserve_only_the_recorded_winner[True]","tests/test_quiz_history_evidence.py::test_history_recovers_evicted_answer_without_an_extra_bubble","tests/test_review_overrides.py::test_a_page_load_shows_a_works_field_from_the_history_endpoint[finished]","tests/test_review_overrides.py::test_a_page_load_shows_a_works_field_from_the_history_endpoint[running]","tests/test_room_appearance_recovery.py::test_an_archive_this_body_imports_itself_needs_no_second_pass","tests/test_room_appearance_recovery.py::test_an_archive_this_body_planned_but_another_body_imported_is_a_gap_until_exactly_those_rows_are_derived","tests/test_store_activation.py::test_the_task_reading_gets_answer_503_migrating_instead_of_importing","tests/test_store_migrating.py::test_migrating_client_consumers","tests/test_subagents_mode_messages.py::test_unannotated_legacy_history_is_readable_and_has_no_inferred_label","tests/test_truthful_card_presentation.py::test_settled_early_speech_keeps_canonical_warning_axes","tests/test_ui_fixture_lifecycle.py::test_a_real_signal_timeout_in_the_fixtures_readiness_wait_keeps_its_log_past_the_release[interrupt-2]","tests/test_ui_fixture_lifecycle.py::test_a_real_signal_timeout_in_the_fixtures_readiness_wait_keeps_its_log_past_the_release[signal-timeout-1]","tests/test_ui_fixture_lifecycle.py::test_cases_boot_from_the_owners_one_copy_with_their_own_roots_and_overlay","tests/test_ui_fixture_lifecycle.py::test_owner_restart_wait_keeps_the_servers_log_past_its_case","tests/test_ui_fixture_lifecycle.py::test_ui_fixture_preserves_reap_diagnostic_when_parent_survives[clean]","tests/test_ui_fixture_lifecycle.py::test_ui_fixture_preserves_reap_diagnostic_when_parent_survives[raised-error]","tests/test_ui_fixture_lifecycle.py::test_ui_fixture_preserves_reap_diagnostic_when_parent_survives[returned-error]","tests/test_ui_fixture_lifecycle.py::test_ui_fixture_reaps_after_readiness_failure[health]","tests/test_ui_fixture_lifecycle.py::test_ui_fixture_reaps_after_readiness_failure[supervisor]","tests/test_ui_fixture_lifecycle.py::test_ui_fixture_reaps_descendants_after_parent_exit_or_normal_stop[alive]","tests/test_ui_fixture_lifecycle.py::test_ui_fixture_reaps_descendants_after_parent_exit_or_normal_stop[exited]","tests/test_ui_fixture_lifecycle.py::test_ui_fixture_restart_retires_one_container_before_spawning_another","tests/test_ui_fixture_lifecycle.py::test_ui_fixture_surfaces_reap_failure_and_still_closes[restart-raised-error]","tests/test_ui_fixture_lifecycle.py::test_ui_fixture_surfaces_reap_failure_and_still_closes[teardown-returned-error]","tests/test_history_ordinary_room.py::test_mains_unreadable_newest_read_names_main_under_the_profile","tests/test_history_ordinary_room.py::test_an_active_project_rooms_unreadable_newest_read_names_that_room","tests/test_history_ordinary_room.py::test_a_room_the_core_stops_counting_is_named_no_more","tests/test_gateway_client_contract.py::test_every_client_envelope_has_a_field_identical_browser_twin","tests/test_history_ordinary_room.py::test_a_send_again_stands_only_on_this_rooms_word_under_this_connections_own_profile[1-0123456789abcdef-]","tests/test_history_ordinary_room.py::test_a_send_again_stands_only_on_this_rooms_word_under_this_connections_own_profile[1--0123456789abcdef]","tests/test_history_ordinary_room.py::test_a_send_again_stands_only_on_this_rooms_word_under_this_connections_own_profile[2-0123456789abcdef-0123456789abcdef]","tests/test_history_ordinary_room.py::test_the_acceptance_asks_the_rooms_word_again_before_a_send_again_is_saved"]''')
          if not isinstance(PY_CASES, list) or not PY_CASES or len(set(PY_CASES)) != len(PY_CASES):
              raise SystemExit('Expected a non-empty JSON array of distinct pytest node ids')
          want = {}
          for node_id in PY_CASES:
              m = isinstance(node_id, str) and re.fullmatch(
                  r'(tests/(?:[\w-]+/)*test_[\w-]+)\.py((?:::[A-Za-z_]\w*)*)::(test_\w+)(\[[ -~]*\])?', node_id, re.A)
              if not m:
                  raise SystemExit(f'Expected one exact pytest case, got {node_id!r}')
              module, classes, name, params = m.groups()
              dotted = '.'.join([module.replace('/', '.'), *filter(None, classes.split('::'))])
              want[(dotted, name + (params or ''))] = node_id

          work = Path(os.environ['RUNNER_TEMP']) / 'observe'
          work.mkdir(parents=True, exist_ok=True)
          report, listing = work / 'pytest.xml', work / 'pytest-ids.txt'
          report.unlink(missing_ok=True)
          listing.write_bytes(('\n'.join(PY_CASES) + '\n').encode('ascii'))
          py = sys.executable
          print(f'pytest: {len(PY_CASES)} exact cases, read from @{listing}', flush=True)
          code = subprocess.run([py, '-I', '-S', 'scripts/safe_test.py', '--timeout', '2400', '--',
                                 py, '-B', '-m', 'pytest', '-o', 'addopts=', '-v', '--tb=short', '--timeout=300',
                                 f'--junitxml={report}', f'@{listing}']).returncode
          code = code if code >= 0 else 128 - code
          RANK = {'error': 0, 'failed': 1, 'xfailed': 2, 'skipped': 3, 'passed': 4}
          seen, problems = {}, []
          try:
              for el in ET.parse(report).getroot().iter('testcase'):
                  key, outcome, why = (el.get('classname', ''), el.get('name', '')), 'passed', ''
                  for child in el:
                      label = {'failure': 'failed', 'error': 'error', 'skipped': 'skipped'}.get(child.tag)
                      if label == 'skipped' and child.get('type') == 'pytest.xfail':
                          label = 'xfailed'
                      if label and RANK[label] < RANK[outcome]:
                          outcome = label
                          why = ' '.join((child.get('message') or '').split())[:120] if label in ('xfailed', 'skipped') else ''
                  if key not in seen or RANK[outcome] < RANK[seen[key][0]]:
                      seen[key] = (outcome, why)
          except (OSError, ET.ParseError) as exc:
              problems.append(f'no readable JUnit report ({type(exc).__name__})')
          total = dict.fromkeys(RANK, 0)
          for key in sorted(seen):
              outcome, why = seen[key]
              total[outcome] += 1
              print(f'PYTEST {outcome:<7} {key[0]}::{key[1]}' + (f'  # {why}' if why else ''))
          absent = [want[key] for key in sorted(want) if key not in seen]
          extra = [f'{cls}::{name}' for cls, name in sorted(seen) if (cls, name) not in want]
          for node_id in absent:
              print(f'PYTEST absent  {node_id}')
          for name in extra:
              print(f'PYTEST extra   {name}')
          tally = ', '.join(f'{k} {v}' for k, v in total.items())
          line = f'pytest {sys.platform}: selected {len(PY_CASES)}, reported {len(seen)} ({tally}); absent {len(absent)}, extra {len(extra)}; exit {code}'
          print(line, flush=True)
          if absent:
              problems.append(f'{len(absent)} intended cases are absent from the report')
          if total['failed'] or total['error']:
              problems.append('the report holds failed or error cases')
          if not total['passed']:
              problems.append('no intended case passed')
          if total['skipped'] or total['xfailed']:
              print(f"::warning title=pytest skips::{total['skipped']} skipped and {total['xfailed']} xfailed intended cases did not pass on {sys.platform}; they prove nothing there")
          for problem in problems:
              print(f'::error title=pytest observation::{problem}')
          flagged = [f'{o:<7} {k[0]}::{k[1]}' for k, (o, _) in sorted(seen.items()) if o != 'passed'] + [f'absent  {n}' for n in absent]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(f'### pytest on {sys.platform}\n{line}\n')
              if problems or flagged:
                  out.write('```\n' + '\n'.join([*problems, *flagged][:80]) + '\n```\n')
          raise SystemExit(code or (1 if problems else 0))
          PY
      - name: Run the Node files (one safe_test)
        if: ${{ matrix.suite == 'node' }}
        run: |
          python -I - <<'PY'
          import json, os, re, shutil, subprocess, sys
          from pathlib import Path

          sys.stdout.reconfigure(encoding='utf-8', errors='replace')
          JS_FILES = json.loads(r'''["web/tests/chat_addressing_card.test.js","web/tests/chat_card_row_placement.test.js","web/tests/chat_composer_enter.test.js","web/tests/chat_headline_reconciliation.test.js","web/tests/chat_history_arrivals.test.js","web/tests/chat_history_continuity.test.js","web/tests/chat_history_loading.test.js","web/tests/chat_history_perf.test.js","web/tests/chat_instance_dom.test.js","web/tests/chat_plain_system_rows.test.js","web/tests/chat_reply_send.test.js","web/tests/child_report_label.test.js","web/tests/composer.test.js","web/tests/consciousness_chat_replay.test.js","web/tests/consciousness_label.test.js","web/tests/continue_requester.test.js","web/tests/history_retention.test.js","web/tests/host_message_voice.test.js","web/tests/host_notice_presentation.test.js","web/tests/host_notice_text.test.js","web/tests/main_durable_edges.test.js","web/tests/older_ending_live_card.test.js","web/tests/owner_input_saved.test.js","web/tests/owner_stop_card.test.js","web/tests/progress_narration_voice.test.js","web/tests/project_read_state.test.js","web/tests/project_read_state_race.test.js","web/tests/quiet_run_cards.test.js","web/tests/reason_detail.test.js","web/tests/render_batch.test.js","web/tests/review_gate_card.test.js","web/tests/room_away_custody.test.js","web/tests/room_away_full_output.test.js","web/tests/root_full_text.test.js","web/tests/subagent_queued_observation.test.js","web/tests/swarm_presentation.test.js","web/tests/task_card_recovery.test.js","web/tests/task_origin.test.js","web/tests/task_pause_notice_i18n.test.js","web/tests/task_presentation.test.js","web/tests/verification_check_row.test.js"]''')
          if (not isinstance(JS_FILES, list) or not JS_FILES or len(set(JS_FILES)) != len(JS_FILES)
                  or not all(isinstance(f, str) and re.fullmatch(r'web/tests/[\w.-]+\.test\.js', f, re.A) for f in JS_FILES)):
              raise SystemExit('Expected a non-empty JSON array of distinct literal web/tests/*.test.js paths')
          present = [f for f in JS_FILES if Path(f).is_file()]
          problems = [f'missing file {f}' for f in JS_FILES if f not in present]
          work = Path(os.environ['RUNNER_TEMP']) / 'observe'
          work.mkdir(parents=True, exist_ok=True)
          tap = work / 'node.tap'
          tap.unlink(missing_ok=True)
          code = 1
          if present:
              print(f'node: {len(present)} of {len(JS_FILES)} files, two at a time', flush=True)
              code = subprocess.run([sys.executable, '-I', '-S', 'scripts/safe_test.py', '--timeout', '1200', '--',
                                     shutil.which('node'), '--test', '--test-timeout=300000', '--test-concurrency=2',
                                     '--test-reporter=tap', '--test-reporter-destination=stdout',
                                     '--test-reporter=tap', f'--test-reporter-destination={tap}', *present]).returncode
              code = code if code >= 0 else 128 - code
          text = tap.read_text(encoding='utf-8', errors='replace') if tap.is_file() else ''
          count = {}
          if not text:
              problems.append('no TAP report was written')
          for key in ('tests', 'suites', 'pass', 'fail', 'cancelled', 'skipped', 'todo') if text else ():
              found = re.findall(rf'^# {key} (\d+)[ \t]*$', text, re.M)
              if len(found) == 1:
                  count[key] = int(found[0])
              else:
                  problems.append(f'TAP summary "# {key}" found {len(found)} times')
          flagged = []
          for indent, status, rest in re.findall(r'^( *)(ok|not ok) \d+ - (.*)$', text, re.M):
              flag = 'SKIP' if ' # SKIP' in rest else 'TODO' if ' # TODO' in rest else 'FAIL' if status == 'not ok' else ''
              if flag:
                  flagged.append(f'NODE {flag} depth {len(indent) // 4}: {rest}')
          if flagged:
              print('\n'.join(flagged))
          tally = ', '.join(f'{k} {v}' for k, v in count.items())
          line = f'node {sys.platform}: {tally}; files {len(present)} of {len(JS_FILES)}; exit {code}'
          print(line, flush=True)
          if count.get('fail') or count.get('cancelled'):
              problems.append('TAP reports failed or cancelled tests')
          if text and not count.get('pass'):
              problems.append('no intended Node test passed')
          if count.get('skipped') or count.get('todo'):
              print(f"::warning title=node skips::{count.get('skipped', 0)} skipped and {count.get('todo', 0)} todo tests did not pass on {sys.platform}; they prove nothing there")
          for problem in problems:
              print(f'::error title=node observation::{problem}')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(f'### Node on {sys.platform}\n{line}\n')
              if problems or flagged:
                  out.write('```\n' + '\n'.join([*problems, *flagged][:80]) + '\n```\n')
          raise SystemExit(code or (1 if problems else 0))
          PY
      - name: Recheck product identity
        if: ${{ !cancelled() && steps.bind.outcome == 'success' }}
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          git diff --exit-code HEAD --
