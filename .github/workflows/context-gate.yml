      - 'tests/fixtures/llm_golden/**'
      - 'tests/system_e2e/harness.py'
      - 'tests/conftest.py'
      - 'tests/ci_evidence.py'
      - 'scripts/context_gate.py'
      - 'scripts/nano_reference_capacity.py'
      - 'scripts/nano_reference_requirements.txt'
      - 'tests/test_nano_reference_capacity.py'
      - 'tests/test_nano_publication_admission.py'
      - 'scripts/safe_test.py'
      - 'scripts/ci_retry.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/actions/setup-python-env/**'
      - '.github/workflows/context-gate.yml'
      - 'supervisor/inline_carrier.py'
      - 'ouroboros/realtime_setup.py'
      - 'ouroboros/live_*.py'
      - 'ouroboros/host_notice.py'
      - 'skills/live_conversation/**'
      - 'skills/openai_realtime/**'
      - 'skills/gemini_live/**'
      - 'skills/grok_realtime/**'
      - 'tests/test_live_works_line_form.py'
      - 'tests/test_installed_skills_manifest_syntax.py'
      - 'tests/test_memory_resident_facts.py'
      - 'tests/test_memory_scale_fit.py'
      - 'tests/test_live_preparation_fit_refusal.py'
      - 'tests/test_live_tool_catalog_transaction.py'
      - 'tests/test_memory_view_forms.py'
      - 'tests/test_memory_view_room.py'
      - 'tests/_memory_scale_fixture.py'
      - 'tests/_live_works_fixture.py'
      - 'tests/_memory_view_synthetic.py'
      - 'tests/_memory_inventory_shared.py'
      - 'tests/_live_world.py'
      - 'tests/_live_stack.py'
      - 'tests/conversation_carrier_support.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        id: environment
      - name: Nano 80k reference counts (Qwen and Gemma, no generation)
        shell: bash
        run: |
          python -m pip --isolated --disable-pip-version-check install --no-deps --require-hashes \
            --target "$RUNNER_TEMP/nano-reference-wheels" -r scripts/nano_reference_requirements.txt
          TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$RUNNER_TEMP/nano-reference-wheels" \
            python scripts/nano_reference_capacity.py --cache "$RUNNER_TEMP/nano-reference-assets" --fetch
      - name: Refusals, serving windows, reply budgets and first contact
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        shell: bash
        run: TMPDIR="$RUNNER_TEMP" PYTHONDONTWRITEBYTECODE=1 python scripts/context_gate.py --workers 2 --evidence-dir "$RUNNER_TEMP/context-gate"
