      - 'ouroboros/tools/**'
      - 'ouroboros/code_intelligence_architecture.py'
      - 'scripts/regenerate_inventories.py'
      - 'prompts/**'
      - 'BIBLE.md'
      - 'docs/*.md'
      - 'docs/architecture/**'
      - 'docs/development/**'
      - 'docs/inventories/**'
