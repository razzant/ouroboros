      - 'tests/test_local_tool_parsing.py'
      - 'tests/test_nano*.py'
      - 'tests/test_send_clock.py'
      - 'tests/test_cold_return.py'
      - 'tests/_budget_pause_exact_helpers.py'
      - 'tests/_window_history.py'
      - 'tests/test_required_development_book.py'
      - 'tests/_first_contact.py'
      - 'tests/_first_contact_server.py'
      - 'tests/_size_refusal.py'
      - 'tests/test_first_contact_local_server.py'
      - 'tests/test_owner_continue.py'
      - 'tests/test_completion_hold_observation.py'
