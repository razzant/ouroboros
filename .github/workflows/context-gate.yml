      - 'tests/test_*window*.py'
      # The browser return scenario runs in separate QA, not in this keyless lane.
      - '!tests/test_cold_return_window_park_browser.py'
      - 'tests/test_size_refusal*.py'
      - 'tests/test_capability_route.py'
