name: Nano Ollama targeted rerun (one freeze)
'on':
  push:
    branches:
    - qa/nano-ollama-rerun-140e1c9fbc16
    paths:
    - .github/workflows/nano-ollama-qualification-once.yml
permissions:
  contents: read
jobs:
  targeted:
    if: ${{ github.repository == 'razzant/ouroboros' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      FROZEN_HEAD: 140e1c9fbc16bf1e42f3faefa4cdb35b0ad4fd28
      FROZEN_HEAD_TREE: 6b93bb93d8b6d0249b6fdb83cd20299ad49cba2d
      FROZEN_BASE: 3d606cbb0adb0b2409d0551fae8b563b9203bd6a
      FROZEN_BASE_TREE: 1ca619ffe17052964d4880be32ebe4360c74a0c5
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      id: checkout
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Verify and retain the four-file QA overlay recipe
      id: recipe
      env:
        QA_PLAN_SHA256: 516cfcce886f3b92f1c7a83ce81bfefcf8e5cc04207150797e974261da96a47a
        QA_EVIDENCE_SHA256: c45169530c43294120a1724e4cfc09510824b58b03df69343416dd28792d053a
        QA_OBSERVATION_SHA256: 921926650d25cc507bd0875ba5be930719471f52b43460c24f44387877e8c9ff
      run: |
        test "$RUNNER_OS" = Linux
        test "$GITHUB_REF" = 'refs/heads/qa/nano-ollama-rerun-140e1c9fbc16'
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git show -s --format=%P "$GITHUB_SHA")" = "$FROZEN_HEAD"
        test "$(git diff --name-status --no-renames "$FROZEN_HEAD" "$GITHUB_SHA" | LC_ALL=C sort)" = $'A\t.github/nano-qualification/evidence.py\nA\t.github/nano-qualification/observation_test.py\nA\t.github/nano-qualification/plan.json\nA\t.github/workflows/nano-ollama-qualification-once.yml'
        for file in .github/nano-qualification/evidence.py .github/nano-qualification/observation_test.py .github/nano-qualification/plan.json .github/workflows/nano-ollama-qualification-once.yml; do
          test "$(git ls-tree --format='%(objectmode)' "$GITHUB_SHA" -- "$file")" = 100644
        done
        ready="$RUNNER_TEMP/nano-qualification"
        test ! -e "$ready"
        test ! -L "$ready"
        staged=$(mktemp -d "$RUNNER_TEMP/nano-qualification-input.XXXXXX")
        for file in evidence.py observation_test.py plan.json; do
          git cat-file blob "$GITHUB_SHA:.github/nano-qualification/$file" > "$staged/$file"
        done
        printf '%s  %s\n' "$QA_PLAN_SHA256" "$staged/plan.json" "$QA_EVIDENCE_SHA256" "$staged/evidence.py" "$QA_OBSERVATION_SHA256" "$staged/observation_test.py" |
          sha256sum --check --strict --status
        mv -T -- "$staged" "$ready"
        [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,19}$ ]]
    - name: Bind overlay and tested head
      id: bind
      run: |
        test "$(git rev-parse "$FROZEN_HEAD^{tree}")" = "$FROZEN_HEAD_TREE"
        test "$(git rev-parse "$FROZEN_BASE^{tree}")" = "$FROZEN_BASE_TREE"
        test "$(git show -s --format=%P "$FROZEN_HEAD")" = "$FROZEN_BASE"
        git diff --quiet "$FROZEN_BASE" "$FROZEN_HEAD" -- pyproject.toml uv.lock requirements-runtime.lock
        git switch --detach "$FROZEN_HEAD" >/dev/null 2>&1
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
        printf 'QA_PYTHON=%s/nano-venv/bin/python\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      id: python
      with:
        python-version: '3.10'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      id: uv
      with:
        version: 0.12.1
        enable-cache: false
        activate-environment: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      id: node
      with:
        node-version: '22'
    - name: Locked dependencies only
      id: dependencies
      timeout-minutes: 8
      env:
        UV_NO_CACHE: '1'
      run: |
        test "$(git rev-parse HEAD)" = "$FROZEN_HEAD"
        UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/nano-venv" uv sync --locked --extra browser --group dev --no-install-project --python "$(command -v python)" > "$RUNNER_TEMP/nano-qualification/dependencies.log" 2>&1
        "$QA_PYTHON" -c 'import platform, sys, pytest, playwright; print(platform.system(), sys.version.split()[0], pytest.__version__)'
        node --version
    - name: Official size-ratchet lane against the exact base
      id: size
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      timeout-minutes: 5
      run: '"$QA_PYTHON" -I -B -S "$RUNNER_TEMP/nano-qualification/evidence.py" size'
    - name: 'Seams of the joined revisions: refusal and window, native and compatible send, books'
      id: seams
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      timeout-minutes: 22
      run: '"$QA_PYTHON" -I -B -S "$RUNNER_TEMP/nano-qualification/evidence.py" seams'
    - name: Check generated inventories without writing
      id: inventory
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      timeout-minutes: 3
      run: '"$QA_PYTHON" -I -B -S "$RUNNER_TEMP/nano-qualification/evidence.py" inventory'
    - name: Stage pinned Node and Chromium as the runner user
      id: install_browsers
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      timeout-minutes: 12
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
      run: |
        "$QA_PYTHON" -B scripts/download_node_standalone.py > "$RUNNER_TEMP/nano-qualification/browsers.log" 2>&1
        export PLAYWRIGHT_NODEJS_PATH="$GITHUB_WORKSPACE/node-standalone/bin/node"
        "$QA_PYTHON" -B -m playwright install chromium >> "$RUNNER_TEMP/nano-qualification/browsers.log" 2>&1
        "$QA_PYTHON" -B -m ouroboros.chromium_runtime install >> "$RUNNER_TEMP/nano-qualification/browsers.log" 2>&1
    - name: Settings browser-module unit tests (node --test)
      id: jsunit
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      timeout-minutes: 5
      run: '"$QA_PYTHON" -I -B -S "$RUNNER_TEMP/nano-qualification/evidence.py" jsunit'
    - name: Settings states of an unidentified compatible server in Chromium (synthetic data)
      id: browser
      if: ${{ !cancelled() && steps.install_browsers.outcome == 'success' }}
      timeout-minutes: 20
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
        PLAYWRIGHT_NODEJS_PATH: ${{ github.workspace }}/node-standalone/bin/node
      run: xvfb-run -a "$QA_PYTHON" -I -B -S "$RUNNER_TEMP/nano-qualification/evidence.py" browser
    - name: Verify the tested checkout remained the frozen subject
      id: final_checkout
      if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      run: |
        test "$(git rev-parse HEAD 'HEAD^{tree}')" = "$(printf '%s\n%s' "$FROZEN_HEAD" "$FROZEN_HEAD_TREE")"
        test -z "$(git status --porcelain=v1 --untracked-files=all)"
    - name: Project bounded evidence (including failed or interrupted phases)
      id: project
      if: ${{ always() }}
      timeout-minutes: 2
      env:
        OUT_RECIPE: ${{ steps.recipe.outcome }}
        OUT_CHECKOUT: ${{ steps.checkout.outcome }}
        OUT_BIND: ${{ steps.bind.outcome }}
        OUT_PYTHON: ${{ steps.python.outcome }}
        OUT_UV: ${{ steps.uv.outcome }}
        OUT_NODE: ${{ steps.node.outcome }}
        OUT_DEPENDENCIES: ${{ steps.dependencies.outcome }}
        OUT_SIZE: ${{ steps.size.outcome }}
        OUT_SEAMS: ${{ steps.seams.outcome }}
        OUT_INVENTORY: ${{ steps.inventory.outcome }}
        OUT_INSTALL_BROWSERS: ${{ steps.install_browsers.outcome }}
        OUT_JSUNIT: ${{ steps.jsunit.outcome }}
        OUT_BROWSER: ${{ steps.browser.outcome }}
        OUT_FINAL_CHECKOUT: ${{ steps.final_checkout.outcome }}
      run: |
        if [ "$OUT_RECIPE" = success ]; then
          python3 -I -B -S "$RUNNER_TEMP/nano-qualification/evidence.py" report --scope targeted
        else
          # No verified overlay program exists. Publish only bounded host-step facts.
          python3 -I -B -S - <<'NANO_BOOTSTRAP_REPORT'
        import json, os, re
        from pathlib import Path
        names = 'recipe checkout bind python uv node dependencies size seams inventory install_browsers jsunit browser final_checkout'.split()
        valid = {'success', 'failure', 'cancelled', 'skipped'}
        def fact(name, pattern):
            value = os.environ.get('GITHUB_' + name.upper(), '')
            return value if re.fullmatch(pattern, value) else None
        steps = {name: os.environ.get('OUT_' + name.upper(), '') for name in names}
        steps = {name: raw if raw in valid else 'unknown' for name, raw in steps.items()}
        report = {'format': 2, 'outcome': 'recipe_unverified', 'scope': 'targeted_linux_rerun_not_release_proof',
                  'sha': fact('sha', r'[0-9a-f]{40}'), 'run_id': fact('run_id', r'[0-9]{1,20}'),
                  'run_attempt': fact('run_attempt', r'[0-9]{1,20}'), 'platform': None,
                  'steps': steps, 'phases': {}, 'report_gap': 'verified_overlay_recipe_not_available'}
        shelf = Path(os.environ['RUNNER_TEMP']) / 'nano-qualification-public'
        shelf.mkdir()
        with (shelf / 'nano-qualification-targeted.json').open('x', encoding='utf-8') as f:
            json.dump(report, f, indent=2, sort_keys=True)
            f.write('\n')
        NANO_BOOTSTRAP_REPORT
        fi
    - name: Retain the projected report and the allowlisted screenshots
      if: ${{ always() }}
      timeout-minutes: 3
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: nano-ollama-targeted-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/nano-qualification-public
        if-no-files-found: error
        retention-days: 14
