# One-shot verification of the CI reader and producer. Only the testing branch carries this file.
name: Qualify post-merge range tracking (pinned selection, real receipts)

on:
  push:
    branches: [qualification/post-merge-range-r16]

permissions:
  contents: read

concurrency:
  group: qualify-post-merge-range-${{ github.ref }}
  cancel-in-progress: false

env:
  PATCH_BASE: 495190dfa81a7d677eed2e67cd2cb5d38283e328
  REVIEWED_PARENT: 495190dfa81a7d677eed2e67cd2cb5d38283e328
  SUBJECT_COMMIT: 706dd8a0e95a6b19f1572dc18a150f3bbf724585
  SUBJECT_TREE: 42311ec53dff5035d6ba638090ba543bf7b37a3b
  HISTORIC_BASE: f888570639882e9059dc532a6bb67fb837c4d46d
  HISTORIC_TIP: 95a00d89e10e686932b46568d32dec9df0156e19

jobs:
  window:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      window: ${{ steps.base.outputs.window }}
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - id: base
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD~1)" = "$SUBJECT_COMMIT"
          test "$(git rev-parse 'HEAD~1^{tree}')" = "$SUBJECT_TREE"
          test "$(git rev-parse HEAD~2)" = "$REVIEWED_PARENT"
          test "$PATCH_BASE" = "$REVIEWED_PARENT"
          test "$(git diff --diff-filter=A --name-only HEAD~1 HEAD)" = ".github/workflows/qualify-post-merge-range.yml"
          test "$(git diff --name-only HEAD~1 HEAD)" = ".github/workflows/qualify-post-merge-range.yml"
          echo "base=$PATCH_BASE" >> "$GITHUB_OUTPUT"
          echo "replay={\"awaiting_handoff\": {}, \"history_gaps\": [], \"history_read\": false}" >> "$GITHUB_OUTPUT"
          echo "window={\"format\": 1, \"base\": \"$PATCH_BASE\", \"head\": \"$GITHUB_SHA\", \"why\": \"qualification pin\", \"continuous\": true, \"replay\": {\"awaiting_handoff\": {}, \"history_gaps\": [], \"history_read\": false}}" >> "$GITHUB_OUTPUT"
      - name: The window producer starts on the runner's bare interpreter
        run: python3 -I -S scripts/post_merge_check.py base --help
      - id: cases
        name: Synthetic hand-over records for the two legs (fixtures, no issue is written)
        shell: python3 {0}
        run: |
          import json
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          from scripts.post_merge_check import _compact_json
          from scripts.post_merge_window import records

          source = {'head': os.environ['GITHUB_SHA'], 'run': int(os.environ['GITHUB_RUN_ID']),
                    'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'base': os.environ['PATCH_BASE']}
          stem = 'tests/qualification_fixture.py::test_synthetic_'

          def chars(ids):
              return len(_compact_json([{**source, 'ids': ids}]))

          # Linux carries the longest id list that still fits the product's inline ceiling of 800 characters, its last id
          # padded to exactly that length; Windows carries a few kilobytes, which the product moves into an artifact.
          near, over = [], []
          while chars(near + [f'{stem}near_{len(near):04d}']) <= 800:
              near.append(f'{stem}near_{len(near):04d}')
          near[-1] += 'x' * (800 - chars(near))
          while chars(over) <= 4000:
              over.append(f'{stem}over_{len(over):04d}')
          cases = {'linux': records([{**source, 'ids': near}]), 'windows': records([{**source, 'ids': over}])}
          if cases['linux'] != [{**source, 'ids': near}] or cases['windows'] != [{**source, 'ids': over}]:
              sys.exit('the product normalization changed the synthetic records')
          sizes = {leg: len(_compact_json(rows)) for leg, rows in cases.items()}
          if sizes['linux'] != 800 or sizes['windows'] <= 800:
              sys.exit(f'unexpected compact receipt sizes {sizes}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('cases=' + _compact_json(cases) + chr(10))
          print('synthetic receipts, compact characters:', sizes)
      - name: Post-merge replay input ${{ steps.base.outputs.replay }}
        run: |
          echo "Pinned qualification checkpoint: no outstanding hand-overs, history not scanned."
      - name: Post-merge ${{ fromJSON(steps.base.outputs.window).continuous && 'confirmed' || 'provisional' }} base ${{ steps.base.outputs.base }}
        run: echo "Recorded the shared starting point before either leg runs."
      - id: red
        continue-on-error: true
        run: |
          echo "window_scope=chain" >> "$GITHUB_OUTPUT"
          exit 1
      - name: Output of a failed step reached a later condition
        if: ${{ !cancelled() && steps.red.outcome == 'failure' && steps.red.conclusion == 'success' && steps.red.outputs.window_scope == 'chain' }}
        run: echo "Observed a failed producer (continued deliberately) and read its output."

  range:
    needs: window
    name: post-merge (${{ matrix.leg }}) from ${{ fromJSON(needs.window.outputs.window).base }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, leg: linux, interpreter: shipped, journal: WAL, scope: chain}
          - {os: windows-latest, leg: windows, interpreter: setup-python, journal: PERSIST, scope: push}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 165
    defaults:
      run:
        shell: bash
    env:
      BASE: ${{ fromJSON(needs.window.outputs.window).base }}
      QUALIFY_LEG: ${{ matrix.leg }}
      OUROBOROS_PREFLIGHT_REQUIRE_PLUGINS: "1"
      OUROBOROS_PREFLIGHT_REQUIRE_NODE: "1"
      OUROBOROS_PREFLIGHT_TEST_WORKERS: ${{ matrix.os == 'windows-latest' && '4' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the run to the exact reviewed tree (this commit adds only this workflow)
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = "$SUBJECT_COMMIT"
          test "$(git rev-parse 'HEAD~1^{tree}')" = "$SUBJECT_TREE"
          test "$(git rev-parse HEAD~2)" = "$REVIEWED_PARENT"
          git merge-base --is-ancestor "$PATCH_BASE" "$SUBJECT_COMMIT"
          test "$(git diff --name-only HEAD~1 HEAD)" = ".github/workflows/qualify-post-merge-range.yml"
      - name: Put Windows test temp on the work disk
        if: ${{ runner.os == 'Windows' }}
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-python-env
        id: setup_python
        with:
          interpreter: ${{ matrix.interpreter }}
          install-project: 'false'
      - name: The stores run ${{ matrix.journal }} here
        id: journal_mode
        run: python -c "import pathlib, sys, tempfile; from ouroboros import store; probe = pathlib.Path(tempfile.mkdtemp()) / 'probe.sqlite'; probe.touch(); mode = store._journal_mode(probe, store.TIER_ENFORCED); print('stores run', mode); sys.exit(mode != sys.argv[1])" ${{ matrix.journal }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ !cancelled() }}
        id: setup_node
        with:
          node-version: '22'
      - name: Set up Windows POSIX test utilities
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        id: posix_tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MSYS
          release: false
          update: true
          install: rsync
      - name: Select Windows POSIX test utilities
        id: select_posix_tools
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.posix_tools.outcome == 'success' }}
        shell: pwsh
        run: '"${{ steps.posix_tools.outputs.msys2-location }}\usr\bin" >> $env:GITHUB_PATH'
      - name: Home tests of the changed producers and readers (exact pinned selection)
        id: home
        if: >-
          ${{ !cancelled() && steps.setup_python.outcome == 'success'
          && steps.journal_mode.outcome == 'success' && steps.setup_node.outcome == 'success'
          && (runner.os != 'Windows' || steps.select_posix_tools.outcome == 'success') }}
        timeout-minutes: 100
        run: >-
          python scripts/run_tests.py --evidence-dir "$RUNNER_TEMP/qualify/home" -q -ra
          tests/test_post_merge_check.py tests/test_post_merge_window.py tests/test_post_merge_routing.py tests/test_post_merge_workflow.py
          tests/test_run_tests_script.py tests/test_selected_test_cli.py tests/test_test_selection.py
          tests/test_ci_evidence.py tests/test_ci_retry.py tests/test_update_qualification.py
          tests/test_update_letter.py tests/test_update_letter_merge_range.py tests/test_update_letter_refresh.py
          tests/test_update_letter_runtime.py tests/test_update_description.py tests/test_preflight_selection.py
          tests/test_context_nano_producers.py tests/test_query_data.py
          tests/test_reference_book_validation.py tests/test_update_status_index.py tests/test_update_status_cache.py
      - name: Compare the whole docs-sync module on the pinned parent and subject (raw pytest exits retained)
        id: docs_pair
        if: ${{ !cancelled() && steps.setup_python.outcome == 'success' }}
        timeout-minutes: 15
        shell: python
        run: |
          import json
          import os
          import platform
          import subprocess
          import sys
          import tempfile
          from collections import defaultdict
          from pathlib import Path

          sys.path.insert(0, os.getcwd())
          from tests.ci_verdicts import final

          parent, subject = os.environ['REVIEWED_PARENT'], os.environ['SUBJECT_COMMIT']
          module = 'tests/test_docs_sync.py'
          subprocess.run(['git', 'diff', '--quiet', parent, subject, '--', module, 'uv.lock', 'pyproject.toml'], check=True)
          out = Path(os.environ['RUNNER_TEMP'], 'qualify')
          out.mkdir(parents=True, exist_ok=True)
          root = Path(tempfile.mkdtemp(prefix='docs-', dir=out))
          github = {key: os.environ['GITHUB_' + key.upper()] for key in ('sha', 'run_id', 'run_attempt')}
          raw = {}
          nodes = {}
          expected_phases = {'setup', 'call', 'teardown'}
          # The map assertion names the live modules that have no owner. Each revision's own traceback line carries that
          # list: the pinned parent's list is the baseline, and nothing here pins a literal one.
          import hashlib

          maps = {}

          def mapped_modules(log):
              prefix = 'AssertionError: docs/ARCHITECTURE.md names no owner for these live modules: '
              found = {line.split(prefix, 1)[1].strip() for line in log.splitlines()
                       if line.startswith('E ') and prefix in line}
              if len(found) != 1:
                  return None
              listed, quote = found.pop(), chr(39)
              if not (listed.startswith('[' + quote) and listed.endswith(quote + ']')):
                  return None
              names = listed[2:-2].split(quote + ', ' + quote)
              clean = all(name and all(char.isalnum() or char in '_./-' for char in name) for name in names)
              return names if clean and names == sorted(set(names)) else None

          # Inventory witness. Neither exporter is trusted to say which tests the module has: selected_nodeids, collection_skips
          # and a session id are not known to exist in the pinned parent's release shape. One bounded `pytest --collect-only -q`
          # session in each exact tree lists the node IDs it selects, and the module's own source (ast) names the tests it
          # defines, so a subset that both revisions share cannot stand for the whole module.
          import ast
          import re

          diagnostics, inventories = [], {}

          def fingerprint(items):
              return hashlib.sha256(chr(10).join(items).encode()).hexdigest()

          def state(done, name):
              return name + ' ' + ' '.join(phase + '=' + done.get(name, {}).get(phase, '-') for phase in ('setup', 'call', 'teardown'))

          def inventory_witness(tree):
              command = [sys.executable, '-m', 'pytest', '-o', 'addopts=', '-q', '--color=no', '--collect-only', module]
              try:
                  done = subprocess.run(command, cwd=tree, capture_output=True, timeout=120)
              except (OSError, subprocess.SubprocessError) as error:
                  return None, ['collection witness did not run: ' + type(error).__name__]
              lines = done.stdout[:400000].decode('utf-8', 'replace').splitlines()
              cut = lines.index('') if '' in lines else len(lines)
              names, tail = lines[:cut], [line.strip() for line in lines[cut:] if line.strip()]
              summary = tail and re.fullmatch(r'([0-9]+) tests? collected(?:, [0-9]+ warnings?)? in [0-9.]+s(?: [(][0-9:]+[)])?', tail[-1])
              problems = []
              if done.returncode != 0:
                  problems.append('collection witness exit status ' + str(done.returncode))
              if not names or not all(name.startswith(module + '::') and name == name.strip() for name in names):
                  problems.append('collection witness listed no node IDs, or lines that are not tests of the module')
              if len(set(names)) != len(names):
                  problems.append('collection witness listed a node ID twice')
              if not summary or int(summary[1]) != len(names):
                  problems.append('collection witness summary is missing, differs from its list, or reports an error or a deselection')
              return (None if problems else names), problems

          def defined_tests(tree):
              try:
                  body = ast.parse((tree / module).read_text(encoding='utf-8')).body
              except (OSError, SyntaxError, ValueError):
                  return None
              return {node.name for node in body
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith('test')}

          known = (module + '::test_architecture_component_map_covers_every_live_runtime_module', 'call', 'AssertionError')
          for label, commit in (('parent', parent), ('subject', subject)):
              tree = root / label
              subprocess.run(['git', 'worktree', 'add', '--detach', '--quiet', str(tree), commit], check=True)
              checked = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=tree, text=True).strip()
              results, owner_root = root / (label + '-results'), root / (label + '-owner')
              with (root / (label + '.log')).open('wb') as log:
                  code = subprocess.run([
                      sys.executable, '-I', '-S', 'scripts/safe_test.py', '--timeout', '240',
                      '--evidence-dir', str(owner_root), '--', sys.executable, '-m', 'pytest',
                      '-o', 'addopts=', '-q', '--tb=short', '--color=no', '--ci-evidence-dir', str(results), module,
                  ], cwd=tree, stdout=log, stderr=subprocess.STDOUT).returncode
              data, error = final(results)
              owner_files = list(owner_root.glob('*/result.json'))
              try:
                  owner = json.loads(owner_files[0].read_text(encoding='utf-8')) if len(owner_files) == 1 else {}
              except (OSError, ValueError):
                  owner = {}
              owner_ok = (isinstance(owner, dict) and owner.get('returncode') == code
                          and isinstance(owner.get('cleanup'), dict)
                          and not any(owner.get(k) for k in ('stopped', 'launch_error', 'containment_error', 'evidence_error', 'retention_reason')))
              phases, failures, unexpected = defaultdict(dict), [], False
              for row in data.get('reports', []):
                  node, phase, outcome = row['nodeid'], row['phase'], row['outcome']
                  if (row.get('is_subtest') or not node.startswith(module + '::') or phase not in expected_phases
                          or phase in phases[node] or outcome not in ('passed', 'failed') or row.get('wasxfail')):
                      unexpected = True
                      continue
                  phases[node][phase] = outcome
                  if outcome == 'failed':
                      failures.append((node, phase, row.get('error_type') or 'unknown'))
              # Read this revision's actual pytest diagnostic (its raw stream is not published) and keep the list it names.
              listed = mapped_modules((root / (label + '.log')).read_bytes().decode('utf-8', 'replace'))
              maps[label] = listed
              exact_failure = not failures or (failures == [known] and bool(listed))
              collected = data.get('tests_collected')
              # Whole-module agreement of this exact revision: the witness list, the module's own definitions, the exporter's
              # count and every raw per-node phase report must name the same tests, each reported once per phase as passed or
              # failed. A subset that both revisions share, a missing report and an absent or partial inventory are all red.
              inventory, problems = inventory_witness(tree)
              defined, selected = defined_tests(tree), data.get('selected_nodeids')
              if inventory is not None:
                  if defined is None or {name.split('::', 1)[1].split('[', 1)[0] for name in inventory} != defined:
                      problems.append('the collected tests differ from the tests the module defines')
                  if known[0] not in inventory:
                      problems.append('the known map test is not among the collected tests')
                  if set(phases) != set(inventory) or any(set(seen) != expected_phases for seen in phases.values()):
                      problems.append('the reported nodes differ from the inventory, or one lacks a setup, call or teardown report')
                  if collected != len(inventory):
                      problems.append('the exporter counts ' + str(collected) + ' collected tests, the inventory lists ' + str(len(inventory)))
              if selected is not None and (not isinstance(selected, list) or sorted(map(str, selected)) != sorted(inventory or ())):
                  problems.append('the exporter lists selected tests that differ from the inventory (corroboration only)')
              inventory_ok = inventory is not None and not problems
              inventories[label] = sorted(inventory) if inventory_ok else None
              if failures and not (failures == [known] and listed):
                  problems.append('the red is not exactly the known map case with one parsed missing-module list')
              if unexpected:
                  problems.append('an unexpected report row: a subtest, another module, an unknown or repeated phase, a skip or an xfail')
              if data.get('session_exit_code') != code or code != int(bool(failures)):
                  problems.append('exit statuses disagree: runner ' + str(code) + ', pytest ' + str(data.get('session_exit_code'))
                                  + ', failures ' + str(len(failures)))
              rows = sorted('|'.join(str(row.get(key)) for key in ('nodeid', 'phase', 'outcome')) for row in data.get('reports') or [])
              states = sorted(state(phases, name) for name in inventory or ())
              diagnostics.extend(label + ': ' + text for text in problems)
              complete = (exact_failure and checked == commit and owner_ok and not error and not unexpected
                          and data.get('github') == github
                          and (data.get('environment') or {}).get('platform') == platform.system()
                          and data.get('collection_failures') == data.get('collection_skips') == []
                          and (label == 'parent' or (isinstance(data.get('session'), str) and bool(data['session'])))
                          and inventory_ok
                          and all(set(seen) == expected_phases for seen in phases.values())
                          and data.get('session_exit_code') == code == int(bool(failures)))
              nodes[label] = set(phases)
              raw[label] = {'commit': checked, 'runner_exit': code, 'pytest_exit': data.get('session_exit_code'),
                            'collected': collected, 'complete': complete, 'owner_ok': owner_ok,
                            'failure_signatures_observed': sorted(failures), 'exact_map_diagnostic': exact_failure if failures else None,
                            'map_modules': {'count': len(listed or ()), 'names': (listed or [])[:12],
                                            'sha256': hashlib.sha256(chr(10).join(listed or ()).encode()).hexdigest()},
                            'platform': platform.system(), 'exporter_platform': (data.get('environment') or {}).get('platform'),
                            'exporter_names_this_run': data.get('github') == github,
                            'exporter_fields': {key: key in data for key in ('selected_nodeids', 'collection_failures', 'collection_skips',
                                                                            'session', 'environment', 'github', 'tests_collected',
                                                                            'session_exit_code')},
                            'inventory': {'witness': 'pytest --collect-only -q in this exact tree, after the real session',
                                          'count': len(inventory or ()), 'sha256': fingerprint(sorted(inventory or ())),
                                          'names': sorted(inventory or ())[:24], 'defined_by_the_module': len(defined or ()),
                                          'exporter_selected_nodeids': 'absent' if selected is None else 'listed'},
                            'phases': {'raw_rows': len(rows), 'raw_rows_sha256': fingerprint(rows),
                                       'states_sha256': fingerprint(states), 'unexpected_rows': unexpected,
                                       'nodes_not_passed': [line for line in states if line.count('=passed') != 3][:12]},
                            'diagnostics': [text[:300] for text in problems[:12]],
                            'result_error': error or None}

          before, after = (raw[k]['failure_signatures_observed'] for k in ('parent', 'subject'))
          same_nodes = (nodes['parent'] == nodes['subject'] and bool(inventories['parent'])
                        and inventories['parent'] == inventories['subject'])
          # Exact comparison. The candidate keeps the parent's red only with the very same nonempty missing-module list; any
          # other list is red, as no documented cause is assumed. Green on both revisions and a complete green candidate over
          # the parent's known red stay distinct outcomes. An absent, partial or unparsed result is already incomplete above.
          parent_names, subject_names = (set(maps[k] or ()) for k in ('parent', 'subject'))
          removed, added = sorted(parent_names - subject_names), sorted(subject_names - parent_names)
          same_list = bool(parent_names) and maps['parent'] == maps['subject']
          ok = (all(row['complete'] for row in raw.values()) and same_nodes
                and before in ([], [known]) and all(failure in before for failure in after) and (not after or same_list))
          comparison = ('known_failure_preserved' if ok and after
                        else 'known_failure_fixed' if ok and before
                        else 'both_passed' if ok else 'unqualified')
          if not same_nodes:
              diagnostics.append('the parent and the subject do not list the same tests')
          if after and not same_list:
              diagnostics.append('the missing-module lists differ: only on the parent ' + str(removed[:12])
                                 + ', only on the subject ' + str(added[:12]))
          if before not in ([], [known]) or not all(failure in before for failure in after):
              diagnostics.append('the observed failure signatures are not the known map case: parent ' + str(before[:4])
                                 + ', subject ' + str(after[:4]))
          evidence = {'github': github, 'leg': os.environ['QUALIFY_LEG'], 'comparison': comparison,
                      'same_nodes': same_nodes, 'comparison_passed': ok, 'os': platform.system(),
                      'scope': 'whole module once per revision in this attempt plus one collection-only witness; no retry, no rerun of failed jobs, no historical run',
                      'diagnostics': [text[:300] for text in diagnostics[:24]],
                      'map_modules_removed': {'count': len(removed), 'names': removed[:12]},
                      'map_modules_added': {'count': len(added), 'names': added[:12]}, **raw}
          (out / f"docs-sync-evidence-{evidence['leg']}.json").write_text(json.dumps(evidence, indent=2), encoding='utf-8')
          print(json.dumps(evidence))
          sys.exit(0 if ok else 'Docs sync: missing or incomplete evidence, unexpected baseline red, or new failure. '
                   + '; '.join(text[:300] for text in diagnostics[:12]))
      - name: Size lane against PATCH_BASE, books measured strictly
        id: size
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.setup_python.outcome == 'success' }}
        timeout-minutes: 30
        env:
          OURO_SIZE_RATCHET_BASE_REF: ${{ env.PATCH_BASE }}
          OURO_BOOK_GROWTH_MODE: block
        run: >-
          env -u GITHUB_EVENT_NAME -u GITHUB_REF
          python scripts/run_tests.py --evidence-dir "$RUNNER_TEMP/qualify/size"
          -o addopts= -q -ra -m size_ratchet tests/
      - name: Release lint gate (ruff F)
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.setup_python.outcome == 'success' }}
        run: python -m ruff check --select F --output-format concise .
      - name: Witnesses — real receipts, observed step outcomes, derived facts
        if: ${{ !cancelled() && steps.setup_python.outcome == 'success' }}
        env:
          HOME_OUTCOME: ${{ steps.home.outcome }}
          SIZE_OUTCOME: ${{ steps.size.outcome }}
          DOCS_OUTCOME: ${{ steps.docs_pair.outcome }}
        shell: python
        run: |
          import json
          import os
          import sys
          from collections import defaultdict
          from pathlib import Path

          sys.path.insert(0, os.getcwd())
          from tests.ci_verdicts import final

          leg = os.environ["QUALIFY_LEG"]
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          problems = []

          # Scenario pins: the parametrization IS the scenario, so the exact suffix set is pinned
          # (frozen-head facts). Everything else is a presence witness: ran whole at least once,
          # observed parameter count recorded, not pinned.
          EXACT = {
              # Both workers counts on each system: the 14 passes and the real red/flake pair are separate witnesses.
              "tests/test_run_tests_script.py::test_a_real_xdist_pass_runs_a_resources_tests_in_its_group_on_one_worker": {"[1]", "[2]"},
              "tests/test_run_tests_script.py::test_the_selected_xdist_retry_distinguishes_persistent_and_flaky_ids": {"[1]", "[2]"},
              # Test the issue boundary through summary, the next base and its selection, not a missing leg.
              "tests/test_post_merge_check.py::test_docs_only_push_selects_the_red_module_until_its_os_has_an_issue":
                  {"[tracked]", "[refused extension]", "[interrupted retry]"},
              # The two range examples: a qualified descendant closes the walk behind it; a cancelled one that only
              # chose its base leaves the late rerun's base and its unfiled red, with their source, to the next check.
              "tests/test_post_merge_window.py::test_only_a_qualified_descendant_closes_the_walk_behind_it":
                  {"[qualified]", "[cancelled]"},
              # A lost receipt is a labelled gap beside the known records; one unreadable for now confirms no range.
              "tests/test_post_merge_window.py::test_a_lost_receipt_is_a_labelled_gap_and_an_unreadable_one_confirms_nothing":
                  {"[expired-True-True]", "[left no record-True-True]", "[cannot say-True-True]",
                   "[not a receipt-True-True]", "[never ran-False-True]", "[unavailable-False-False]"},
              # a failed-jobs rerun replays its first attempt's base and certifies nothing, both outcomes
              "tests/test_post_merge_check.py::test_a_rerun_of_failed_jobs_replays_the_base_its_first_attempt_chose_and_certifies_nothing": {"[failure]", "[success]"},
              # contiguous provisional greens settle the older red, with and without a checkpoint
              "tests/test_post_merge_check.py::test_contiguous_provisional_greens_settle_the_older_red_without_certifying_earlier_history": {"[False]", "[True]"},
              # a budget-cut read stays partial on both cut points
              "tests/test_update_qualification.py::test_a_read_the_request_budget_cut_short_is_partial_never_observed_or_unavailable": {"[attempt]", "[sha query]"},
              # coverage needs reading through the range: exhausted listing, budget, outage
              "tests/test_update_qualification.py::test_coverage_requires_reading_through_the_range": {"[exhausted]", "[budget]", "[unavailable]"},
          }
          EXACT.update({
              'tests/test_post_merge_routing.py::test_a_newer_recorded_failure_survives_a_batch_that_files_another':
                  {'[False]', '[True]'},
              # Move both, lock results only, lock both results and journal: never read stale output as current.
