# Post-merge browser check (pilot): the browser tests a window that changes the interface affects.
#
# Owner choice 1 (2026-11-25): a narrow, non-blocking browser check of the post-merge windows that touch web/, a
# browser test, a file such a test names or the browser lane's own infrastructure; one Ubuntu runner, both engines;
# the full browser lane stays in the release run and the manual dispatch. post-merge.yml's `browser-dispatch` job
# starts this workflow with the window's frozen base and head; it is a run of its own, so it never holds the
# post-merge concurrency group, never becomes that run's conclusion or a leg's verdict, never moves the window's base,
# and ouroboros/update_qualification.py, which reads post-merge.yml's runs, never reads it. `check` first decides
# without a browser (a window outside the owner's scope ends NOT APPLICABLE before anything is installed, never
# green), then runs the plan with a read-only token, compares each red with the window's base and judges
# (scripts/post_merge_browser_select.py chooses, scripts/post_merge_browser.py judges and hands over); `route` hands the
# reds over and runs no test and no code of the window: from this workflow's own revision, on `ouroboros` with the only
# write permissions here, and only for a window whose base and head lie on `ouroboros`'s first-parent chain, base
# first; elsewhere (a trial dispatched on another branch) dry, with a read-only token. A red whose author's task has
# ended is Ouroboros's to take over: it reads the open post-merge-red issues (ouroboros/update_qualification.py
# `post_merge_reds`). A manual dispatch is supported only for a window whose head contains this pilot (its check
# scripts run from the head).
# The pilot lasts until 2026-12-10 or the first release after v7.12.1, whichever comes first: post-merge.yml's
# `browser-dispatch` then starts nothing (PILOT_UNTIL, PILOT_RELEASE; re-enabled by a pull request). It stops earlier if
# a release run waited because of it, if more than half of its reds are FLAKY or not attributed, or if post-merge
# windows grow noticeably longer. A push that changes this file only registers the workflow (a workflow_dispatch needs GitHub to
# know it before it reaches the default branch): it checks nothing.

name: Post-merge browser check
run-name: Post-merge browser check ${{ inputs.head || github.sha }}

on:
  workflow_dispatch:
    inputs:
      base:
        description: The window's base, its last measured commit (full SHA)
        required: true
        type: string
      head:
        description: The window's head (full SHA)
        required: true
        type: string
      budget:
        description: A trial only (a branch other than ouroboros) - the test budget in seconds
        required: false
        type: string
  push:
    branches:
      - ouroboros
    paths:
      - .github/workflows/post-merge-browser.yml

permissions: {}

# One runner: the windows of a branch run one at a time, in the order they started waiting (FIFO), and `queue: max`
# keeps up to 100 of them pending instead of replacing the pending one. A trial branch has its own line, and a push
# that only registers this file never waits behind, or displaces, a window.
concurrency:
  group: ${{ github.event_name == 'push' && format('post-merge-browser-register-{0}', github.sha) || format('post-merge-browser-{0}', github.ref_name) }}
  cancel-in-progress: false
  queue: max

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Registered; the window's own dispatch runs the check
        timeout-minutes: 1
        run: echo "post-merge-browser.yml is known to GitHub; a push checks no window."

  check:
    if: github.repository == 'razzant/ouroboros' && github.event_name == 'workflow_dispatch'
    name: post-merge browser check (pilot)
    runs-on: ubuntu-latest
    # Above the sum of its step ceilings plus ten minutes, so a step's own ceiling always ends first and the evidence
    # is uploaded; a typical run takes about 40 minutes.
    timeout-minutes: 186
    permissions:
      contents: read
      issues: read  # the open browser issues to recheck, the accepted failures
      actions: read  # the weights of earlier browser runs
    outputs:
      applicable: ${{ steps.scope.outputs.applicable }}
      base: ${{ steps.window.outputs.base }}
      head: ${{ steps.window.outputs.head }}
      outcome: ${{ steps.outcome.outputs.outcome }}
      routing: ${{ steps.outcome.outputs.routing }}
    env:
      BASE: ${{ inputs.base }}
      HEAD_SHA: ${{ inputs.head }}
    steps:
      - name: Name the window
        id: window
        timeout-minutes: 1
        run: |
          if [[ ! "$BASE" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::base and head must be full commit SHAs"
            exit 1
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          ref: ${{ steps.window.outputs.head }}
          fetch-depth: 0  # the window's commits and the base worktree
          persist-credentials: false
      # The owner's scope, decided before anything is installed. A selector that fails fails this step, never an empty
      # "not applicable"; an applicable window whose plan is empty ends CHECKED PARTIALLY below, still browserless.
      - name: Decide whether the browser check applies
        id: scope
        timeout-minutes: 3
        run: |
          set -o pipefail
          python3 -I -S scripts/post_merge_browser_select.py scope --base "$BASE" --head "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
      - name: Not applicable, so no browser test runs and nothing is green
        if: steps.scope.outputs.applicable == 'false'
        timeout-minutes: 1
        env:
          WHY: ${{ steps.scope.outputs.why }}
        run: 'echo "Not applicable: $WHY" | tee -a "$GITHUB_STEP_SUMMARY"'
      - uses: ./.github/actions/setup-python-env
        id: setup_python
        if: steps.scope.outputs.applicable == 'true'
        timeout-minutes: 10
        with:
          interpreter: shipped  # as the UI lane (ui-browser.yml)
          install-project: 'false'
      # The UI lane's own weights (each node's median over the last three tables) for the estimate; without them the
      # plan keeps its module cap and counts every candidate as unknown.
      - name: Read the weights of earlier browser runs
        id: weights
        if: steps.scope.outputs.applicable == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -S scripts/ci_shard_plan.py --out "$RUNNER_TEMP/browser-weights" --repo "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --sha "$HEAD_SHA"
      - name: Choose the browser tests of the window
        id: plan
        if: steps.scope.outputs.applicable == 'true'
        timeout-minutes: 3
        env:
          TRIAL_BUDGET: ${{ github.ref != 'refs/heads/ouroboros' && inputs.budget || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/post-merge-browser"
          python3 -I -S scripts/post_merge_browser_select.py plan --base "$BASE" --head "$HEAD_SHA" \
            --out "$RUNNER_TEMP/post-merge-browser/plan.json" --args-out "$RUNNER_TEMP/post-merge-browser/args.txt" \
            --durations "$RUNNER_TEMP/browser-weights/ci-durations.json" ${TRIAL_BUDGET:+--budget-seconds "$TRIAL_BUDGET"} \
            >> "$GITHUB_OUTPUT"
      # As the UI lane installs them (#2895), with three-minute download attempts: three bounded stages of two attempts
      # take at most 19.5 minutes and leave this ceiling eight more for dpkg's single run.
      - name: Install Chromium and WebKit
        id: install_browsers
        if: ${{ !cancelled() && steps.plan.outputs.runnable == 'true' }}
        timeout-minutes: 28
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
        run: python -I -S scripts/ci_browser_install.py --attempt-seconds 180 --pinned-node --pinned-chromium chromium webkit
      - name: Let Chromium's sandbox start on this runner
        id: sandbox
        if: ${{ !cancelled() && steps.install_browsers.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # The UI lane's invocation over the plan, in its order: one retry (FLAKY), the session stopped between tests at
      # its budget (`--session-timeout`); the plugin records the skips tests/browser_lane.py permits and runs the
      # sentinel cases first. The ceiling sits just above the session's (45.5 minutes): a retry it cuts is judged
      # CHECKED PARTIALLY, with its first failure shown.
      - name: Run the selected browser tests on their engines
        id: run
        if: ${{ !cancelled() && steps.install_browsers.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}  # read-only; only ci_retry's accepted-failure check reads it
          OUROBOROS_RUN_UI_SMOKE: "1"
          OUROBOROS_EXPECT_BROWSER_ENGINES: chromium,webkit
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
          PLAYWRIGHT_NODEJS_PATH: ${{ github.workspace }}/node-standalone/bin/node
          SESSION: ${{ steps.plan.outputs.session_seconds }}
        run: |
          evidence="$RUNNER_TEMP/post-merge-browser"
          mapfile -t TESTS < "$evidence/args.txt"
          if [ "${#TESTS[@]}" -eq 0 ]; then echo "::error::the plan names no test"; exit 1; fi  # never the whole lane
          xvfb-run -a python -I -S scripts/ci_retry.py --evidence-dir "$evidence/head" \
            --accepted tests/accepted_failures.json -- \
            python -I -S scripts/safe_test.py --evidence-dir "$RUNNER_TEMP/post-merge-browser-raw/head" -- \
            python -m pytest "${TESTS[@]}" -m ui_browser -p scripts.post_merge_browser -vv --tb=short --timeout=900 \
            --session-timeout="$SESSION" --ci-evidence-dir="$evidence/head"
      # A failure the session's time limit (or a killed run) left with one observation runs once more at the head.
      - name: Run once more each failure that got no retry
        id: confirm
        if: ${{ !cancelled() && steps.run.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          OUROBOROS_RUN_UI_SMOKE: "1"
          OUROBOROS_EXPECT_BROWSER_ENGINES: chromium,webkit
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
          PLAYWRIGHT_NODEJS_PATH: ${{ github.workspace }}/node-standalone/bin/node
        run: >-
          xvfb-run -a python3 scripts/post_merge_browser.py confirm --evidence-dir "$RUNNER_TEMP/post-merge-browser"
          --plan "$RUNNER_TEMP/post-merge-browser/plan.json"
      - name: Run each confirmed red at the window's base
        id: compare
        if: ${{ !cancelled() && steps.run.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 22
        env:
          OUROBOROS_RUN_UI_SMOKE: "1"
          OUROBOROS_EXPECT_BROWSER_ENGINES: chromium,webkit
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
          PLAYWRIGHT_NODEJS_PATH: ${{ github.workspace }}/node-standalone/bin/node
        run: >-
          xvfb-run -a python3 scripts/post_merge_browser.py compare --evidence-dir "$RUNNER_TEMP/post-merge-browser"
          --plan "$RUNNER_TEMP/post-merge-browser/plan.json"
      - name: Recheck the open browser issues at the head
        id: recheck
        if: ${{ !cancelled() && steps.run.outcome != 'skipped' }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}  # read-only: lists the open issues; the sessions run without it
          OUROBOROS_RUN_UI_SMOKE: "1"
          OUROBOROS_EXPECT_BROWSER_ENGINES: chromium,webkit
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ui-browsers
          PLAYWRIGHT_NODEJS_PATH: ${{ github.workspace }}/node-standalone/bin/node
        run: >-
          xvfb-run -a python3 scripts/post_merge_browser.py recheck --evidence-dir "$RUNNER_TEMP/post-merge-browser"
          --plan "$RUNNER_TEMP/post-merge-browser/plan.json"
      - name: Judge the browser check and prepare its hand-over
        id: outcome
        if: ${{ !cancelled() && steps.scope.outputs.applicable == 'true' }}
        timeout-minutes: 3
        env:
          BROWSER_INSTALL_OUTCOME: ${{ steps.install_browsers.outcome }}
          BROWSER_RUN_OUTCOME: ${{ steps.run.outcome }}
          BROWSER_CONFIRM_OUTCOME: ${{ steps.confirm.outcome }}
          BROWSER_COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          BROWSER_RECHECK_OUTCOME: ${{ steps.recheck.outcome }}
        run: >-
          python3 scripts/post_merge_browser.py outcome --evidence-dir "$RUNNER_TEMP/post-merge-browser"
          --plan "$RUNNER_TEMP/post-merge-browser/plan.json"
      - name: Upload the browser evidence
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-merge-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/post-merge-browser/
          retention-days: 14
          if-no-files-found: ignore
      # Green only for GREEN or FLAKY: red or checked partially fails this job, never a post-merge run.
      - name: Fail unless the browser check is green
        id: verdict
        if: ${{ !cancelled() && steps.scope.outputs.applicable == 'true' }}
        timeout-minutes: 2
        run: python3 scripts/post_merge_browser.py verdict --evidence-dir "$RUNNER_TEMP/post-merge-browser"

  # The hand-over runs no test and no code of the window. Only on `ouroboros` does it hold the write permissions, and
  # only for a window whose base and head both lie on `ouroboros`'s first-parent chain, base first; the workflow-level
  # group keeps one run, and so one writer, at a time (its writers still re-read an issue right before they write it).
  # It runs this workflow's own revision and reads the check job's hand-over as data. `route-trial` below is the same
  # job for a trial on another branch, with a read-only token and dry routing. Re-running this job alone offers a
  # refused hand-over again: the check job's outputs stay with the run.
  route:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.applicable == 'true' && github.ref == 'refs/heads/ouroboros' }}
    runs-on: ubuntu-latest
    timeout-minutes: 27
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          fetch-depth: 0  # origin/ouroboros's history; this workflow's own revision is checked out, never the head
          persist-credentials: false
      - name: Hand over only a window on ouroboros's first-parent chain
        id: trusted
        timeout-minutes: 3
        env:
          BASE: ${{ needs.check.outputs.base }}
          HEAD_SHA: ${{ needs.check.outputs.head }}
        run: |
          git rev-list --first-parent origin/ouroboros > "$RUNNER_TEMP/first-parent"
          head_at="$(grep -nFx -e "$HEAD_SHA" "$RUNNER_TEMP/first-parent" | cut -d: -f1 || true)"
          base_at="$(grep -nFx -e "$BASE" "$RUNNER_TEMP/first-parent" | cut -d: -f1 || true)"
          if [[ -n "$head_at" && -n "$base_at" && "$head_at" -lt "$base_at" ]]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          else
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            printf '## Post-merge browser hand-over\n\nNothing handed over: %s..%s is not a window on the first-parent chain of ouroboros (both on it, base first).\n' \
              "$BASE" "$HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Hand each red to its author and to Ouroboros as the browser system
        id: route
        if: steps.trusted.outputs.trusted == 'true'
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.check.outputs.base }}  # the trusted pair: the hand-over must name exactly this window
          HEAD_SHA: ${{ needs.check.outputs.head }}
          ROUTING: ${{ needs.check.outputs.routing }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: >-
          python3 -I -S scripts/post_merge_browser.py route --run-url "$RUN_URL"
          --out "$RUNNER_TEMP/post-merge-browser-route/routing.json"
      - name: Upload the hand-over record
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-merge-browser-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/post-merge-browser-route/
          retention-days: 14
          if-no-files-found: ignore

  route-trial:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.applicable == 'true' && github.ref != 'refs/heads/ouroboros' }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          fetch-depth: 0  # this workflow's own revision, as `route`
          persist-credentials: false
      - name: Record the hand-over a run on ouroboros would make
        id: route
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.check.outputs.base }}
          HEAD_SHA: ${{ needs.check.outputs.head }}
          ROUTING: ${{ needs.check.outputs.routing }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: >-
          python3 -I -S scripts/post_merge_browser.py route --dry-run --run-url "$RUN_URL"
          --out "$RUNNER_TEMP/post-merge-browser-route/routing.json"
      - name: Upload the hand-over record
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: post-merge-browser-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/post-merge-browser-route/
          retention-days: 14
          if-no-files-found: ignore
