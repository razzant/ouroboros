name: Extension Stop — Windows verification

on:
  push:
    branches:
      - qa/extension-step-stop-check

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'razzant/ouroboros'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MERGE_SHA: e0fb9542b828964dd792e202b7d5939c6c0140eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.MERGE_SHA }}
          persist-credentials: false

      - uses: ./.github/actions/setup-python-env
        with:
          interpreter: setup-python
          install-project: 'false'

      - name: Verify both test outcomes at the merge
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import xml.etree.ElementTree as ET

          sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          print(f"Checkout: {sha}; platform: {sys.platform}", flush=True)
          if sha != os.environ["MERGE_SHA"] or sys.platform != "win32":
              sys.exit("Unexpected checkout or platform")

          nodes = [
              "tests/test_async_invocation_lifetime.py::test_cancel_resistant_async_runner_retains_same_invocation_until_finally",
              "tests/test_connector_target_groups.py::test_an_older_host_refuses_a_2_5_connector_before_import_read_tools_included",
          ]
          expected = sorted(
              (Path(path).with_suffix("").as_posix().replace("/", "."), name)
              for path, name in (node.split("::") for node in nodes)
          )
          scratch = Path(tempfile.mkdtemp(
              prefix="extension-stop-", dir=os.environ["RUNNER_TEMP"]
          ))
          report = scratch / "pytest.xml"
          result = subprocess.run([
              sys.executable, "-I", "-S", "scripts/safe_test.py",
              "--temp-parent", str(scratch),
              "--evidence-dir", str(scratch / "evidence"),
              "--timeout", "300", "--",
              sys.executable, "-m", "pytest",
              "-o", "addopts=", "-o", "xfail_strict=true",
              "-n0", "-v", "--color=no", "--tb=short", "--show-capture=no",
              "--junitxml", str(report), *nodes,
          ])
          print(f"Safe test exit: {result.returncode}", flush=True)
          if result.returncode != 0 or not report.is_file():
              sys.exit("Test command failed or produced no JUnit report")

          cases = ET.parse(report).findall(".//testcase")
          actual = sorted((case.get("classname", ""), case.get("name", "")) for case in cases)
          if actual != expected or any(
              child.tag in {"skipped", "failure", "error"}
              for case in cases for child in case
          ):
              sys.exit("Expected exactly the two named tests, both passed")
          print(f"Verified: both named tests passed on Windows at {sha}", flush=True)
