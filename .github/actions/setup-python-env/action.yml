name: Set up locked Python environment
description: Install the pinned Python and uv toolchain, then sync the reviewed lock.

inputs:
  profile:
    description: Dependency profile to sync (test or build).
    required: false
    default: test

  install-project:
    description: Install the checkout as an editable package (false for exact candidate browser tests).
    required: false
    default: 'true'

  interpreter:
    description: >-
      The interpreter the environment is built on: setup-python, or shipped — the
      python-build-standalone release the desktop packages bundle, fetched by the same
      pinned and checksummed scripts/download_python_standalone.* the builds use. Test
      jobs take shipped, so they run the SQLite (and with it the store's journal mode, WAL)
      that fresh installs run; quick-test and journal-persist keep setup-python's, whose
      PERSIST is what an install updated in place keeps running.
    required: false
    default: setup-python

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.10'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.12.1'
        enable-cache: true
        cache-dependency-glob: uv.lock
        activate-environment: true
    - name: Fetch the shipped interpreter
      if: ${{ inputs.interpreter == 'shipped' && runner.os != 'Windows' }}
      shell: bash
      run: |
        PYTHON_STANDALONE_DEST="$RUNNER_TEMP/shipped-python" PYTHON_STANDALONE_INTERPRETER_ONLY=1 bash scripts/download_python_standalone.sh
        echo "OUROBOROS_CI_INTERPRETER=$RUNNER_TEMP/shipped-python/bin/python3" >> "$GITHUB_ENV"
    - name: Fetch the shipped interpreter (Windows)
      if: ${{ inputs.interpreter == 'shipped' && runner.os == 'Windows' }}
      shell: pwsh
      run: |
        & scripts/download_python_standalone.ps1 -Dest "$env:RUNNER_TEMP\shipped-python" -InterpreterOnly
        "OUROBOROS_CI_INTERPRETER=$env:RUNNER_TEMP\shipped-python\python.exe" >> $env:GITHUB_ENV
    - name: Sync locked dependencies
      shell: bash
      run: |
        PROJECT_ARGS=()
        if [[ "${{ inputs.install-project }}" == false ]]; then PROJECT_ARGS+=(--no-install-project); fi
        case "${{ inputs.interpreter }}" in
          setup-python) ;;
          shipped) PROJECT_ARGS+=(--python "$OUROBOROS_CI_INTERPRETER") ;;
          *) echo "Unknown interpreter: ${{ inputs.interpreter }}" >&2; exit 2 ;;
        esac
        case "${{ inputs.profile }}" in
          test) uv sync --locked --extra browser --group dev "${PROJECT_ARGS[@]}" ;;
          build) uv sync --locked --extra browser --extra desktop --extra build --group dev "${PROJECT_ARGS[@]}" ;;
          *) echo "Unknown Python dependency profile: ${{ inputs.profile }}" >&2; exit 2 ;;
        esac
        python -m pip --version
        python -c "import sqlite3, sys; print(f'interpreter {sys.executable}: Python {sys.version.split()[0]}, SQLite {sqlite3.sqlite_version}')"
    - name: Verify generated release dependency exports
      shell: bash
      run: |
        uv export --locked --no-dev --extra browser --no-emit-project --no-hashes --no-annotate --output-file requirements-runtime.lock
        git diff --exit-code -- requirements-runtime.lock
