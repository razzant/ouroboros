# Production domain manifest — module -> domain, 1:1, for every runtime module
# (plan §7.1, CPL-1). The Ф0 report-only stage lived at scripts/v7next_domains.toml;
# this file is its production successor and the SSOT the domain gates read.
#
# Structure:
#   - [domains] / [modules] / [classification] are HUMAN sections: the domain
#     vocabulary and the 1:1 assignment. Completeness against the live tree is
#     enforced by scripts/check_domains.py + tests/test_domain_manifest.py
#     (a tracked module without a row = red).
#   - [graph] and [duplicates] are GENERATED sections (regenerate with
#     `python scripts/check_domains.py --write`): today's factual dependency
#     matrix, cycle ceiling, lazy/dynamic classification and the literal-copy
#     baseline, pinned as data. Baseline = current reality; tightening any of
#     it is a separate owner decision (plan §7.1 discipline).
#   - docs/DOMAIN_MAP.md is generated from this manifest (same --write).
#
# Derivation of the assignment:
#   - domain vocabulary and the original 411-module assignment parsed from the
#     frozen reference worktree ouroboros_v7_wip @ 9f691656 docs/DOMAIN_MAP.md;
#   - upstream modules absent from the v7 map were classified by reading each
#     header/docstring/imports; those 80 placements rode in
#     [classification].proposed until the owner accepted them as the 7.0 base
#     (batch №9 №10=A, 2026-09-01), so every row here is now settled.
#
# The seven package __init__.py files go with their package (DOMAIN_MAP Method note);
# ouroboros/gateways/__init__.py is placed with D07 (its residents split D06/D07 —
# claude_code.py is D06 transport, claudexor.py is D07).

[meta]
reference_tree = "ouroboros_v7_wip @ 9f691656e7e756c483f72ef549418c0e7a1b8054 (frozen)"
population_rule = "git-tracked *.py under ouroboros/ and supervisor/, plus server.py and launcher.py"

